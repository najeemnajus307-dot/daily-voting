<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:300px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}
input,button{
  width:100%;
  padding:8px;
  margin-top:10px;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="box">
  <h3>Admin Login</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
/* 🔑 DEFAULT SUPER ADMIN (FIRST TIME AUTO CREATE) */
if(!localStorage.getItem("superAdmin")){
  localStorage.setItem("superAdmin", JSON.stringify({
    user: "admin",
    pass: "admin123"
  }));
}

/* 🔐 ADMIN LOGIN */
function login(){
  let u = user.value.trim();
  let p = pass.value.trim();

  let superAdmin = JSON.parse(localStorage.getItem("superAdmin"));
  let admins = JSON.parse(localStorage.getItem("admins") || "[]");

  // SUPER ADMIN LOGIN
  if(superAdmin.user === u && superAdmin.pass === p){
    localStorage.setItem("adminRole", "super");
    window.location.replace("admin.html");   // ✅ DIRECT TO ADMIN VOTING REPORT
    return;
  }

  // NORMAL ADMIN LOGIN
  let found = admins.find(a => a.user === u && a.pass === p);
  if(found){
    localStorage.setItem("adminRole", "admin");
    window.location.replace("admin.html");   // ✅ DIRECT TO ADMIN VOTING REPORT
    return;
  }

  alert("Invalid admin username or password");
}
</script>

</body>
</html>
