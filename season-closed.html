<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Season Closed - Faith & Fitness</title>
    <meta name="theme-color" content="#1b5c38">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/global.css">

    <style>
        :root {
            --primary: #1b5c38;
            --secondary: #e69d45;
            --bg-dark: #0e291b;
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, var(--primary) 0%, var(--bg-dark) 80%);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Background Elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(230, 157, 69, 0.05);
            filter: blur(60px);
            z-index: 0;
            animation: floatShape 10s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .content-container {
            z-index: 2;
            padding: 40px 20px;
            max-width: 500px;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(14, 41, 27, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin: 20px;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .trophy-container {
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .trophy-icon {
            font-size: 5rem;
            line-height: 1;
            background: linear-gradient(135deg, #ffc885 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 15px rgba(230, 157, 69, 0.3));
            animation: bounceTrophy 3s infinite ease-in-out;
        }

        @keyframes bounceTrophy {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #ffffff, #e69d45);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* Loading / Processing Animation */
        .processing-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--secondary);
            animation: pulseDot 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .footer-text {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .admin-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .admin-link:hover {
            color: var(--text-light);
            text-decoration: underline;
        }

        /* Decorative divider */
        .divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="content-container">
        <div class="trophy-container">
            <div class="trophy-icon">🏆</div>
        </div>
        
        <h1>Season 1 Has Ended</h1>
        <div class="subtitle">Thank you for being part of our first season.</div>
        
        <div class="divider"></div>

        <p class="message">
            Our admin team is currently verifying all results and selecting the winners.<br><br>
            Winner announcement will be published soon.<br>
            Thank you for your patience and support.
        </p>

        <div class="processing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="footer-text">
            Faith & Fitness – Wellness in Worship
        </div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="admin/admin.html" class="admin-link" style="margin-top:0;">Admin Access</a>
        <span style="color: rgba(255,255,255,0.2); margin: 0 10px;">|</span>
        <a href="#" onclick="logoutUser()" class="admin-link" style="margin-top:0; color: #ff9800;">Logout</a>
    </div>

    <script>
        function logoutUser() {
            localStorage.removeItem("userPhone");
            localStorage.removeItem("userName");
            window.location.replace("index.html");
        }
    </script>
    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        async function loadCustomContent() {
            try {
                const settingsRef = doc(db, "settings", "system");
                const docSnap = await getDoc(settingsRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.seasonClosedMessage) {
                        const messageEl = document.querySelector(".message");
                        if (messageEl) {
                            messageEl.innerText = data.seasonClosedMessage;
                        }
                    }

                    if (data.seasonClosedPoster) {
                        const container = document.querySelector(".content-container");
                        // Insert an image right after the trophy or replace it
                        const trophyEl = document.querySelector(".trophy-container");
                        
                        const img = document.createElement("img");
                        img.src = data.seasonClosedPoster;
                        img.style.maxWidth = "100%";
                        img.style.maxHeight = "300px";
                        img.style.borderRadius = "12px";
                        img.style.marginBottom = "20px";
                        img.style.objectFit = "contain";
                        img.alt = "Season Closed Poster";

                        // hide trophy if poster is there
                        if (trophyEl) trophyEl.style.display = "none";
                        
                        container.insertBefore(img, document.querySelector("h1"));
                    }
                }
            } catch (e) {
                console.error("Error loading custom season closed content:", e);
            }
        }
        
        loadCustomContent();
    </script>

</body>
</html>
