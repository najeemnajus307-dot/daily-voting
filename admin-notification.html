<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Notification Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:360px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;margin-bottom:15px}
label{font-size:14px;font-weight:bold}
input,textarea,button{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  font-size:14px;
}
textarea{resize:vertical}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
button:active{transform:scale(0.98)}
.note{
  font-size:12px;
  color:#555;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔔 Notification Settings</h2>

  <label>Title</label>
  <input id="title" placeholder="eg: Voting Started">

  <label>Message</label>
  <textarea id="body" rows="3"
    placeholder="eg: Today voting is open. Please vote."></textarea>

  <label>Send Date & Time</label>
  <input id="time" type="datetime-local">

  <label>Gap (minutes)</label>
  <input id="gap" type="number" placeholder="eg: 120 (2 hours)">

  <button onclick="saveNotification()">Save Notification</button>

  <div class="note">
    ℹ️ Note: Notification will be sent automatically at the given time.
  </div>
</div>

<script type="module">
/* 🔐 SIMPLE ADMIN PASSWORD */
if(prompt("Admin password") !== "5"){
  alert("Wrong password");
  location.href = "index.html";
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 💾 SAVE NOTIFICATION */
window.saveNotification = async ()=>{
  const t = title.value.trim();
  const b = body.value.trim();
  const timeVal = time.value;
  const gapVal  = Number(gap.value || 0);

  if(!t || !b || !timeVal){
    alert("Fill title, message and time");
    return;
  }

  await addDoc(collection(db,"notifications"),{
    title: t,
    body: b,
    sendAt: timeVal,
    gapMinutes: gapVal,
    active: true,
    createdAt: new Date().toISOString()
  });

  alert("Notification scheduled successfully ✅");

  title.value="";
  body.value="";
  time.value="";
  gap.value="";
};
</script>

</body>
</html>
