<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor</title>
<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#fff;
    padding:20px;
    width:360px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;}
input{
    width:100%;
    padding:8px;
    margin:6px 0;
}
button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
ul{padding-left:20px;}
li{margin:4px 0;}
</style>
</head>
<body>

<div class="box">
<h2>Task Editor</h2>

<input id="taskInput" placeholder="New task name">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("dailyTasks")) || [];

function render(){
    let ul = document.getElementById("taskList");
    ul.innerHTML="";
    tasks.forEach((t,i)=>{
        let li=document.createElement("li");
        li.innerHTML = t +
        ` <button onclick="del(${i})">❌</button>`;
        ul.appendChild(li);
    });
    localStorage.setItem("dailyTasks",JSON.stringify(tasks));
}
function addTask(){
    let v=document.getElementById("taskInput").value.trim();
    if(!v) return;
    tasks.push(v);
    document.getElementById("taskInput").value="";
    render();
}
function del(i){
    tasks.splice(i,1);
    render();
}
render();
</script>

</body>
</html>
