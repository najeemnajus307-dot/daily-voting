<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  max-width:420px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.15);
}
h2{text-align:center;}
.row{
  display:flex;
  gap:6px;
  margin:6px 0;
}
.row input{
  flex:1;
  padding:8px;
}
.row button{
  padding:8px;
}
.addBtn{
  width:100%;
  background:#2563eb;
  color:white;
  border:none;
  padding:8px;
  margin-top:10px;
}
.saveBtn{
  width:100%;
  background:#16a34a;
  color:white;
  border:none;
  padding:8px;
  margin-top:10px;
}
.delBtn{
  background:#ef4444;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor (Admin)</h2>

  <div class="row">
    <input id="newTask" placeholder="New task text">
    <button onclick="addTask()">Add</button>
  </div>

  <div id="taskList"></div>

  <button class="saveBtn" onclick="saveTasks()">Save Tasks</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN ONLY */
const ADMIN_PHONE = "7994302567";
const phone = sessionStorage.getItem("phone");
if(phone !== ADMIN_PHONE){
  alert("Access denied");
  location.href="vote.html";
}

/* FIREBASE */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const ref = doc(db,"settings","tasks");
let tasks = [];

const snap = await getDoc(ref);
if(snap.exists()) tasks = snap.data().list;

render();

function render(){
  taskList.innerHTML="";
  tasks.forEach((t,i)=>{
    taskList.innerHTML += `
      <div class="row">
        <input value="${t}" oninput="edit(${i},this.value)">
        <button class="delBtn" onclick="del(${i})">✖</button>
      </div>`;
  });
}

window.edit = (i,val)=>{ tasks[i]=val; };
window.del  = (i)=>{ tasks.splice(i,1); render(); };

window.addTask = ()=>{
  const v = newTask.value.trim();
  if(!v) return;
  tasks.push(v);
  newTask.value="";
  render();
};

window.saveTasks = async ()=>{
  await setDoc(ref,{ list: tasks });
  alert("Tasks saved successfully ✅");
};
</script>

</body>
</html>
