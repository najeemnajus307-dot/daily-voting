<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Task Editor</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:400px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
}
ul{list-style:none;padding:0;}
li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
  background:#f8fafc;
  padding:6px;
  border-radius:6px;
}
small{color:#555;}
.del{
  background:#dc2626;
  width:auto;
  padding:4px 8px;
}
.save{background:#16a34a;}
</style>
</head>

<body>

<div class="box">
  <h3>Task Editor (with Points)</h3>

  <input id="taskText" placeholder="Task text">
  <input id="taskPoints" type="number" placeholder="Points (eg: 5)">

  <button onclick="addTask()">Add Task</button>

  <ul id="taskList"></ul>

  <button class="save" onclick="saveTasks()">Save Tasks</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const textInp = document.getElementById("taskText");
const pointInp = document.getElementById("taskPoints");
const list = document.getElementById("taskList");

let tasks = [];

/* LOAD TASKS */
const snap = await getDoc(doc(db,"tasks","daily"));
if(snap.exists()){
  tasks = snap.data().list || [];
  render();
}

function render(){
  list.innerHTML="";
  tasks.forEach((t,i)=>{
    list.innerHTML += `
      <li>
        <span>${t.text} <small>(${t.points} pts)</small></span>
        <button class="del" onclick="delTask(${i})">❌</button>
      </li>
    `;
  });
}

window.addTask = function(){
  const text = textInp.value.trim();
  const pts  = Number(pointInp.value);

  if(!text || !pts){
    alert("Task & points enter ചെയ്യൂ");
    return;
  }

  tasks.push({ text:text, points:pts });
  textInp.value="";
  pointInp.value="";
  render();
};

window.delTask = function(i){
  if(confirm("Delete task?")){
    tasks.splice(i,1);
    render();
  }
};

window.saveTasks = async function(){
  await setDoc(doc(db,"tasks","daily"),{ list:tasks });
  alert("Tasks saved with points ✅");
};
</script>

</body>
</html>
