<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Task Editor</title>
<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#fff;
    padding:25px;
    width:360px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h2{text-align:center;}
input{
    width:100%;
    padding:8px;
    margin:6px 0;
}
button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:#fff;
    border:none;
    margin-top:10px;
    cursor:pointer;
}
ul{padding-left:18px;}
</style>
</head>

<body>

<div class="box">
<h2>Task Editor</h2>

<input id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

<button style="background:#16a34a" onclick="saveTasks()">Save Tasks</button>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("dailyTasks")) || [];
let list = document.getElementById("taskList");

function render(){
    list.innerHTML="";
    tasks.forEach((t,i)=>{
        let li=document.createElement("li");
        li.innerHTML = `${t} <button onclick="del(${i})">❌</button>`;
        list.appendChild(li);
    });
}
render();

function addTask(){
    let v=document.getElementById("taskInput").value.trim();
    if(v){
        tasks.push(v);
        document.getElementById("taskInput").value="";
        render();
    }
}

function del(i){
    tasks.splice(i,1);
    render();
}

function saveTasks(){
    localStorage.setItem("dailyTasks", JSON.stringify(tasks));
    alert("Tasks saved ✅");
}
</script>

</body>
</html>
