<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor – Faith & Fitness</title>

<!-- 🚫 Cache control (blink avoid) -->
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:none;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding-top:30px;
}
.box{
  background:#fff;
  padding:20px;
  width:420px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center}

input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

.task{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  background:#fafafa;
}
.small{
  font-size:12px;
  color:#555;
}

.row{
  display:flex;
  gap:6px;
}
.row button{
  flex:1;
}

.del{
  background:#dc2626;
}
.edit{
  background:#0284c7;
}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor</h2>

  <input id="taskText" placeholder="Task text (eg: No challenge completed)">
  <input id="taskPoints" type="number" placeholder="Points (0 allowed)">
  
  <label>Start Date & Time</label>
  <input id="startTime" type="datetime-local">

  <label>End Date & Time</label>
  <input id="endTime" type="datetime-local">

  <button onclick="saveTask()">Save Task</button>

  <hr>
  <h4>All Tasks</h4>
  <div id="taskList">Loading...</div>
</div>

<script type="module">
/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password") !== "1"){
  location.replace("index.html");
}else{
  document.body.style.display = "flex";
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  getDocs, deleteDoc, updateDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 🔁 EDIT MODE */
let editId = null;

/* 📥 LOAD TASKS */
async function loadTasks(){
  taskList.innerHTML = "";
  const snap = await getDocs(collection(db,"tasks"));

  if(snap.empty){
    taskList.innerHTML = "No tasks added yet";
    return;
  }

  snap.forEach(d=>{
    const t = d.data();

    taskList.innerHTML += `
      <div class="task">
        <b>${t.text}</b><br>
        <span class="small">
          Points: ${t.points}<br>
          Start: ${new Date(t.start).toLocaleString()}<br>
          End: ${new Date(t.end).toLocaleString()}
        </span>
        <div class="row">
          <button class="edit"
            onclick="editTask(
              '${d.id}',
              '${t.text.replace(/'/g,"\\'")}',
              ${t.points},
              '${t.start}',
              '${t.end}'
            )">Edit</button>
          <button class="del"
            onclick="deleteTask('${d.id}')">Delete</button>
        </div>
      </div>
    `;
  });
}
loadTasks();

/* ➕ ADD / ✏️ UPDATE TASK */
window.saveTask = async ()=>{
  const text = taskText.value.trim();
  const points = Number(taskPoints.value);
  const start = startTime.value;
  const end   = endTime.value;

  if(!text || points < 0 || !start || !end){
    alert("Fill all fields (points can be 0)");
    return;
  }

  if(editId){
    // ✏️ UPDATE
    await updateDoc(doc(db,"tasks",editId),{
      text, points, start, end
    });
    editId = null;
  }else{
    // ➕ ADD
    await addDoc(collection(db,"tasks"),{
      text, points, start, end,
      createdAt:new Date().toISOString()
    });
  }

  taskText.value="";
  taskPoints.value="";
  startTime.value="";
  endTime.value="";

  loadTasks();
};

/* ✏️ EDIT TASK */
window.editTask = (id,text,points,start,end)=>{
  editId = id;
  taskText.value = text;
  taskPoints.value = points;
  startTime.value = start;
  endTime.value = end;
};

/* ❌ DELETE TASK */
window.deleteTask = async(id)=>{
  if(!confirm("Delete this task?")) return;
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};
</script>

</body>
</html>
