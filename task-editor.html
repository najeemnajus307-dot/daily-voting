<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:380px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.task{
  border:1px solid #ddd;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
}
.del{
  background:#dc2626;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor</h2>

  <input id="taskText" placeholder="Task (eg: Sugar cut)">
  <input id="taskPoints" type="number" placeholder="Points">

  <label>Start Date & Time</label>
  <input id="startDT" type="datetime-local">

  <label>End Date & Time</label>
  <input id="endDT" type="datetime-local">

  <button onclick="addTask()">Add Task</button>

  <hr>
  <div id="taskList">Loading...</div>
</div>

<script type="module">
if(prompt("Admin password")!=="1"){
  location.href="index.html";
}

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  getDocs, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadTasks(){
  taskList.innerHTML="";
  const snap = await getDocs(collection(db,"tasks"));
  if(snap.empty){
    taskList.innerHTML="No tasks";
    return;
  }
  snap.forEach(d=>{
    const t=d.data();
    taskList.innerHTML+=`
      <div class="task">
        <b>${t.text}</b><br>
        ${t.start} → ${t.end}<br>
        Points: ${t.points}
        <button class="del" onclick="del('${d.id}')">Delete</button>
      </div>
    `;
  });
}
loadTasks();

window.addTask = async ()=>{
  if(!taskText.value || !taskPoints.value || !startDT.value || !endDT.value){
    alert("Fill all fields");
    return;
  }

  await addDoc(collection(db,"tasks"),{
    text: taskText.value,
    points: Number(taskPoints.value),
    start: startDT.value, // datetime-local string
    end: endDT.value
  });

  taskText.value="";
  taskPoints.value="";
  startDT.value="";
  endDT.value="";
  loadTasks();
};

window.del = async (id)=>{
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};
</script>

</body>
</html>
