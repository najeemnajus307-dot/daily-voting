<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:380px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;margin-bottom:10px}
input,textarea,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.task{
  border:1px solid #ddd;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
}
.del{
  background:#dc2626;
  margin-top:4px;
}
.small{font-size:12px;color:#555}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor</h2>

  <input id="taskText" placeholder="Task text (eg: sugar cut)">
  <input id="taskPoints" type="number" placeholder="Points">
  <button onclick="addTask()">Add Task</button>

  <div id="taskList"></div>
</div>

<script type="module">
/* 🔐 ADMIN PASSWORD CHECK */
const ADMIN_PASS = "1";
const p = prompt("Enter admin password");
if(p !== ADMIN_PASS){
  alert("Access denied");
  location.href="index.html";
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const today = new Date().toISOString().slice(0,10);
const ref = doc(db,"tasks",today);

/* LOAD TASKS */
async function loadTasks(){
  taskList.innerHTML="";
  const snap = await getDoc(ref);
  if(!snap.exists()) return;

  snap.data().list.forEach((t,i)=>{
    taskList.innerHTML+=`
      <div class="task">
        <b>${t.text}</b><br>
        <span class="small">${t.points} points</span>
        <button class="del" onclick="deleteTask(${i})">Delete</button>
      </div>`;
  });
}
loadTasks();

/* ADD TASK */
window.addTask = async ()=>{
  const text = taskText.value.trim();
  const points = Number(taskPoints.value);

  if(!text || points<=0){
    alert("Enter task & points");
    return;
  }

  const snap = await getDoc(ref);
  let list = [];

  if(snap.exists()) list = snap.data().list;

  list.push({ text, points });

  await setDoc(ref,{ list });
  taskText.value="";
  taskPoints.value="";
  loadTasks();
};

/* DELETE TASK */
window.deleteTask = async (i)=>{
  const snap = await getDoc(ref);
  if(!snap.exists()) return;

  const list = snap.data().list;
  list.splice(i,1);

  await updateDoc(ref,{ list });
  loadTasks();
};
</script>

</body>
</html>
