<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor – Faith & Fitness</title>

<!-- 🚫 Cache control -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
/* 🔥 Prevent blinking */
body{
  display:none;
  font-family: Arial;
  background:#f1f5f9;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding-top:30px;
}

.box{
  background:#fff;
  padding:20px;
  width:420px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{text-align:center;margin-bottom:10px}

input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}

button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}

.task{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  background:#fafafa;
}

.small{
  font-size:12px;
  color:#555;
}

.del{
  background:#dc2626;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor</h2>

  <!-- ADD TASK -->
  <input id="taskText" placeholder="Task name (eg: Drink Water)">
  <input id="taskPoints" type="number" placeholder="Points">

  <label>Start Date & Time</label>
  <input id="startTime" type="datetime-local">

  <label>End Date & Time</label>
  <input id="endTime" type="datetime-local">

  <button onclick="addTask()">Add Task</button>

  <hr>
  <h4>All Tasks</h4>
  <div id="taskList">Loading...</div>
</div>

<script type="module">
/* 🚫 Kill back-forward cache */
window.addEventListener("pageshow", e=>{
  if(e.persisted){
    location.reload();
  }
});

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password") !== "1"){
  location.replace("index.html");
}else{
  document.body.style.display = "flex"; // 👈 show only after auth
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD TASKS */
async function loadTasks(){
  taskList.innerHTML = "";
  const snap = await getDocs(collection(db,"tasks"));

  if(snap.empty){
    taskList.innerHTML = "No tasks added yet";
    return;
  }

  snap.forEach(d=>{
    const t = d.data();
    taskList.innerHTML += `
      <div class="task">
        <b>${t.text}</b><br>
        <span class="small">
          Points: ${t.points}<br>
          Start: ${new Date(t.start).toLocaleString()}<br>
          End: ${new Date(t.end).toLocaleString()}
        </span>
        <button class="del" onclick="deleteTask('${d.id}')">Delete</button>
      </div>
    `;
  });
}
loadTasks();

/* ADD TASK (UNLIMITED) */
window.addTask = async ()=>{
  const text = taskText.value.trim();
  const points = Number(taskPoints.value);
  const start = startTime.value;
  const end   = endTime.value;

  if(!text || points <= 0 || !start || !end){
    alert("Fill all fields");
    return;
  }

  await addDoc(collection(db,"tasks"),{
    text,
    points,
    start,
    end,
    createdAt: new Date().toISOString()
  });

  taskText.value="";
  taskPoints.value="";
  startTime.value="";
  endTime.value="";

  loadTasks();
};

/* DELETE TASK */
window.deleteTask = async (id)=>{
  if(!confirm("Delete this task?")) return;

  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};
</script>

</body>
</html>
