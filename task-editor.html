<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:white;
  max-width:500px;
  margin:auto;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center}
input,button{
  padding:8px;
  margin:4px;
}
button{cursor:pointer}
.task{
  border-bottom:1px solid #ddd;
  padding:6px 0;
}
.del{background:#dc2626;color:white;border:none}
.save{background:#16a34a;color:white;border:none}
</style>
</head>

<body>

<div class="box">
  <h2>Daily Task Editor</h2>

  <input id="taskText" placeholder="Task name">
  <input id="taskPoints" type="number" placeholder="Points">
  <button onclick="addTask()">Add Task</button>

  <div id="taskList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db,"tasks","daily");

let tasks=[];

/* LOAD */
async function load(){
  const snap = await getDoc(ref);
  tasks = snap.exists() ? snap.data().list || [] : [];
  render();
}
load();

/* RENDER */
function render(){
  taskList.innerHTML="";
  tasks.forEach((t,i)=>{
    taskList.innerHTML+=`
      <div class="task">
        <input value="${t.text}" id="t_${i}">
        <input type="number" value="${t.points}" id="p_${i}">
        <button class="save" onclick="save(${i})">Save</button>
        <button class="del" onclick="remove(${i})">Delete</button>
      </div>`;
  });
}

/* ADD */
window.addTask = async ()=>{
  if(!taskText.value || !taskPoints.value) return alert("Fill all");
  tasks.push({text:taskText.value,points:Number(taskPoints.value)});
  await updateDoc(ref,{list:tasks});
  taskText.value=""; taskPoints.value="";
  load();
};

/* SAVE */
window.save = async (i)=>{
  tasks[i].text = document.getElementById("t_"+i).value;
  tasks[i].points = Number(document.getElementById("p_"+i).value);
  await updateDoc(ref,{list:tasks});
  alert("Task updated ✅");
};

/* DELETE */
window.remove = async (i)=>{
  tasks.splice(i,1);
  await updateDoc(ref,{list:tasks});
  load();
};
</script>

</body>
</html>
