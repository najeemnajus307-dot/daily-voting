<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login / Signup</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;min-height:100vh;align-items:flex-start;padding-top:40px}
.box{background:#fff;padding:25px;width:340px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2)}
h3{text-align:center}
input,button{width:100%;padding:10px;margin:8px 0}
button{background:#16a34a;color:#fff;border:none;cursor:pointer}
.link{text-align:center;font-size:14px;color:#2563eb;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>

<div class="box">
  <div id="loginBox">
    <h3>Login</h3>
    <input id="loginPhone" placeholder="Phone number">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="link" onclick="showSignup()">New user? Signup</div>
  </div>

  <div id="signupBox" class="hide">
    <h3>Signup</h3>
    <input id="name" placeholder="Full name">
    <input id="phone" placeholder="Phone number">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="signup()">Create Account</button>
    <div class="link" onclick="showLogin()">Already user? Login</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

if(localStorage.getItem("userPhone")) location.replace("vote.html");

window.showSignup=()=>{loginBox.classList.add("hide");signupBox.classList.remove("hide")}
window.showLogin =()=>{signupBox.classList.add("hide");loginBox.classList.remove("hide")}

window.signup=async()=>{
  const n=document.getElementById("name").value.trim();
  const p=document.getElementById("phone").value.trim();
  const pw=document.getElementById("pass").value.trim();
  if(!n||!p||!pw) return alert("All fields required");
  const q=query(collection(db,"users"),where("phone","==",p));
  const s=await getDocs(q);
  if(!s.empty) return alert("User already exists");
  await addDoc(collection(db,"users"),{name:n,phone:p,password:pw,createdAt:new Date().toISOString()});
  alert("Signup successful");
  showLogin();
};

window.login=async()=>{
  const p=document.getElementById("loginPhone").value.trim();
  const pw=document.getElementById("loginPass").value.trim();
  if(!p||!pw) return alert("Enter details");
  const q=query(collection(db,"users"),where("phone","==",p),where("password","==",pw));
  const s=await getDocs(q);
  if(s.empty) return alert("Invalid login");
  localStorage.setItem("userPhone",p);
  location.replace("vote.html");
};
</script>
</body>
</html>
