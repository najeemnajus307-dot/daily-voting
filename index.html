<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:20px;width:300px;border-radius:10px}
input,button{width:100%;padding:8px;margin:6px 0}
button{background:#2563eb;color:#fff;border:none}
</style>
</head>
<body>

<div class="box">
<h3>Login</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
  if(!name.value || !phone.value){ alert("Fill all"); return;}
  sessionStorage.setItem("userName",name.value);
  sessionStorage.setItem("userPhone",phone.value);
  location.replace("vote.html");
}
</script>

</body>
</html>
