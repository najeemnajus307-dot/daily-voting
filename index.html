<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login / Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:340px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.15);
}
h3{text-align:center;margin-bottom:10px;}
input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:15px;
}
button{
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.link{
  text-align:center;
  margin-top:12px;
  font-size:15px;
  color:#2563eb;
  font-weight:bold;
  cursor:pointer;
}
.hide{display:none;}
</style>
</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="loginBox">
<h3>WELCOME<br>FAITH & FITNESS</h3>

<input id="loginPhone" placeholder="Phone number">
<input id="loginPass" type="password" placeholder="Password">

<p style="text-align:right;margin-top:6px">
<a href="#" onclick="showReset()">Forgot Password?</a>
</p>

<button onclick="login()">Login</button>

<!-- RESET PASSWORD BOX -->
<div id="resetBox" style="display:none;margin-top:10px">
<input id="resetPhone" placeholder="Enter Phone Number">
<input id="newPass" type="password" placeholder="New Password">
<button onclick="resetPassword()">Reset Password</button>
</div>

<div class="link" onclick="showSignup()">New user? Signup</div>
</div>


<!-- SIGNUP -->
<div id="signupBox" class="hide">
<h3>Create Account</h3>

<input id="name" placeholder="Full name">
<input id="phone" placeholder="Phone number">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Create Account</button>

<div class="link" onclick="showLogin()">Already user? Login</div>
</div>

</div>


<script type="module">

/* FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
getFirestore, collection, addDoc,
query, where, getDocs, updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
authDomain:"daily-voting-793ee.firebaseapp.com",
projectId:"daily-voting-793ee"
});

const db = getFirestore(app);


/* AUTO LOGIN */
if(localStorage.getItem("userPhone")){
location.replace("vote.html");
}


/* TOGGLE */
window.showSignup = ()=>{
loginBox.classList.add("hide");
signupBox.classList.remove("hide");
};

window.showLogin = ()=>{
signupBox.classList.add("hide");
loginBox.classList.remove("hide");
};

window.showReset = ()=>{
document.getElementById("resetBox").style.display="block";
};


/* SIGNUP */
window.signup = async ()=>{
const name  = nameInput("name");
const phone = nameInput("phone");
const pass  = nameInput("pass");

if(!name || !phone || !pass){
alert("All fields required");
return;
}

const snap = await getDocs(
query(collection(db,"users"), where("phone","==",phone))
);

if(!snap.empty){
alert("User already exists");
return;
}

await addDoc(collection(db,"users"),{
name,
phone,
password: pass,
createdAt:new Date().toISOString()
});

alert("Signup successful ✅");
showLogin();
};


/* LOGIN */
window.login = async ()=>{
const phone = nameInput("loginPhone");
const pass  = nameInput("loginPass");

if(!phone || !pass){
alert("Enter phone & password");
return;
}

const snap = await getDocs(
query(collection(db,"users"),
where("phone","==",phone),
where("password","==",pass))
);

if(snap.empty){
alert("Wrong phone or password ❌");
return;
}

localStorage.setItem("userPhone",phone);
location.replace("vote.html");
};


/* RESET PASSWORD */
window.resetPassword = async ()=>{
const phone = nameInput("resetPhone");
const newPass = nameInput("newPass");

if(!phone || !newPass){
alert("Enter phone & new password");
return;
}

const snap = await getDocs(
query(collection(db,"users"), where("phone","==",phone))
);

if(snap.empty){
alert("User not found ❌");
return;
}

await updateDoc(snap.docs[0].ref,{ password:newPass });

alert("Password reset successful ✅ Now login");
document.getElementById("resetBox").style.display="none";
};


/* HELPER */
function nameInput(id){
return document.getElementById(id).value.trim();
}

</script>

</body>
</html>
