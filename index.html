<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Login</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
}
button{
  background:#16a34a;
  color:#fff;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h3 style="text-align:center">Login</h3>
  <input id="phone" placeholder="Phone number">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
/* Already logged in */
if(sessionStorage.getItem("userPhone")){
  location.replace("vote.html");
}

function login(){
  const phone = document.getElementById("phone").value.trim();
  const pass  = document.getElementById("password").value.trim();

  if(!phone || !pass){
    alert("Enter phone & password");
    return;
  }

  /* demo password = 1 */
  if(pass !== "1"){
    alert("Wrong password");
    return;
  }

  sessionStorage.setItem("userPhone", phone);

  /* 🔥 IMPORTANT */
  location.replace("vote.html");
}
</script>

</body>
</html>
