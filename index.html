<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.2);
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:#fff;
  border:none;
  cursor:pointer;
}
.link{
  margin-top:10px;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="lPhone" placeholder="Phone">
  <input id="lPass" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div class="link" id="toSignup">New user? Signup</div>
</div>

<div class="box" id="signupBox" style="display:none">
  <h3>Signup</h3>
  <input id="sName" placeholder="Name">
  <input id="sPhone" placeholder="Phone">
  <input id="sPass" type="password" placeholder="Password">
  <button id="signupBtn">Signup</button>
  <div class="link" id="toLogin">Already user? Login</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG – 반드시 YOUR_API_KEY മാറ്റുക */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Auto redirect if logged */
if(sessionStorage.getItem("logged")==="yes"){
  location.replace("vote.html");
}

/* UI toggle */
const loginBox = document.getElementById("loginBox");
const signupBox = document.getElementById("signupBox");
document.getElementById("toSignup").onclick = ()=>{
  loginBox.style.display="none";
  signupBox.style.display="block";
};
document.getElementById("toLogin").onclick = ()=>{
  signupBox.style.display="none";
  loginBox.style.display="block";
};

/* SIGNUP */
document.getElementById("signupBtn").onclick = async ()=>{
  const name = document.getElementById("sName").value.trim();
  const phone = document.getElementById("sPhone").value.trim();
  const pass = document.getElementById("sPass").value.trim();

  if(!name || !phone || !pass){
    alert("All fields required");
    return;
  }

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      name, phone,
      password: pass,
      totalPoints: 0,
      createdAt: new Date().toISOString()
    });
  }

  sessionStorage.setItem("logged","yes");
  sessionStorage.setItem("userName",name);
  sessionStorage.setItem("userPhone",phone);
  location.replace("vote.html");
};

/* LOGIN */
document.getElementById("loginBtn").onclick = async ()=>{
  const phone = document.getElementById("lPhone").value.trim();
  const pass  = document.getElementById("lPass").value.trim();

  if(!phone || !pass){
    alert("Enter phone & password");
    return;
  }

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  if(snap.data().password !== pass){
    alert("Wrong password");
    return;
  }

  sessionStorage.setItem("logged","yes");
  sessionStorage.setItem("userName",snap.data().name);
  sessionStorage.setItem("userPhone",phone);
  location.replace("vote.html");
};
</script>

</body>
</html>
