<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:25px;width:300px;border-radius:10px}
input,button{width:100%;padding:10px;margin:6px 0}
button{background:#16a34a;color:#fff;border:none}
</style>
</head>
<body>

<div class="box">
  <h3>Login</h3>
  <input id="phone" placeholder="Phone">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const ADMIN_PHONE = "7994302567";

window.login = async ()=>{
  const phone = document.getElementById("phone").value.trim();
  const pass  = document.getElementById("pass").value.trim();

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists() || snap.data().password !== pass){
    alert("Invalid login");
    return;
  }

  sessionStorage.setItem("phone",phone);
  sessionStorage.setItem("name",snap.data().name);

  if(phone === ADMIN_PHONE){
    location.href="task-editor.html"; // admin
  }else{
    location.href="vote.html";        // user
  }
};
</script>
</body>
</html>
