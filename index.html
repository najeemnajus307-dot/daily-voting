<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness - Login</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.link{
  text-align:center;
  color:blue;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h3 id="title">Login</h3>

  <input id="name" placeholder="Name" style="display:none">
  <input id="phone" type="tel" maxlength="10" placeholder="Phone">
  <input id="pass" type="password" placeholder="Password">

  <button id="btn" onclick="submit()">Login</button>
  <div class="link" onclick="toggle()">Create account</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let signup = false;

window.toggle = ()=>{
  signup=!signup;
  title.innerText = signup?"Signup":"Login";
  btn.innerText = signup?"Signup":"Login";
  name.style.display = signup?"block":"none";
};

window.submit = async ()=>{
  const n=name.value.trim();
  const p=phone.value.trim();
  const pw=pass.value.trim();

  if(!p||!pw||(signup&&!n)){
    alert("Fill all fields"); return;
  }

  const ref=doc(db,"users",p);
  const snap=await getDoc(ref);

  if(signup){
    if(snap.exists()){
      alert("Account already exists"); return;
    }
    await setDoc(ref,{name:n,phone:p,password:pw});
    alert("Signup success. Login now");
    toggle();
  }else{
    if(!snap.exists() || snap.data().password!==pw){
      alert("Invalid login"); return;
    }
    sessionStorage.setItem("phone",p);
    sessionStorage.setItem("name",snap.data().name);
    location.href="vote.html";
  }
};
</script>
</body>
</html>
