<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Voting - Login</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:25px;width:320px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2)}
input,button{width:100%;padding:10px;margin:8px 0}
button{background:#2563eb;color:#fff;border:none;border-radius:6px}
</style>
</head>
<body>

<div class="box">
<h3>Login</h3>
<input id="phone" placeholder="Phone">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "YOUR_KEY",
 authDomain: "daily-voting-793ee.firebaseapp.com",
 projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = async ()=>{
  let phone = document.getElementById("phone").value;
  let pass  = document.getElementById("pass").value;

  let ref = doc(db,"users",phone);
  let snap = await getDoc(ref);

  if(!snap.exists() || snap.data().password !== pass){
    alert("Account not found");
    return;
  }

  sessionStorage.setItem("phone",phone);
  sessionStorage.setItem("name",snap.data().name);
  location.href="vote.html";
}
</script>
</body>
</html>
