<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login / Signup</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  min-height:100vh;
  align-items:flex-start;
  padding-top:40px;
}
.box{
  background:#fff;
  padding:25px;
  width:340px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h3{text-align:center}
input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.link{
  text-align:center;
  font-size:14px;
  color:#2563eb;
  cursor:pointer;
}
.hide{display:none}
</style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="loginBox">
    <h3>Login</h3>
    <input id="loginPhone" placeholder="Phone number">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="link" onclick="showSignup()">New user? Signup</div>
  </div>

  <!-- SIGNUP -->
  <div id="signupBox" class="hide">
    <h3>Signup</h3>
    <input id="name" placeholder="Full name">
    <input id="phone" placeholder="Phone number">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="signup()">Create Account</button>
    <div class="link" onclick="showLogin()">Already user? Login</div>
  </div>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, getDocs
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 YOUR REAL FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.appspot.com",
  messagingSenderId: "106583008376",
  appId: "1:106583008376:web:9d3858939d07056a5fa0ed",
  measurementId: "G-Z7Y9P84SKB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* AUTO LOGIN */
if(sessionStorage.getItem("userPhone")){
  location.replace("vote.html");
}

/* TOGGLE */
window.showSignup = ()=>{
  loginBox.classList.add("hide");
  signupBox.classList.remove("hide");
};
window.showLogin = ()=>{
  signupBox.classList.add("hide");
  loginBox.classList.remove("hide");
};

/* SIGNUP */
window.signup = async ()=>{
  try{
    const n = name.value.trim();
    const p = phone.value.trim();
    const pw = pass.value.trim();

    if(!n || !p || !pw){
      alert("All fields required");
      return;
    }

    // check existing user
    const q = query(collection(db,"users"), where("phone","==",p));
    const snap = await getDocs(q);
    if(!snap.empty){
      alert("User already exists");
      return;
    }

    // create user
    await addDoc(collection(db,"users"),{
      name: n,
      phone: p,
      password: pw,
      totalPoints: 0,
      createdAt: new Date().toISOString()
    });

    alert("Signup successful ✅");
    showLogin();

  }catch(err){
    console.error("SIGNUP ERROR:", err);
    alert("Signup error:\n" + err.message);
  }
};

/* LOGIN */
window.login = async ()=>{
  try{
    const p = loginPhone.value.trim();
    const pw = loginPass.value.trim();

    if(!p || !pw){
      alert("Enter phone & password");
      return;
    }

    const q = query(
      collection(db,"users"),
      where("phone","==",p),
      where("password","==",pw)
    );
    const snap = await getDocs(q);

    if(snap.empty){
      alert("Invalid login ❌");
      return;
    }

    sessionStorage.setItem("userPhone", p);
    location.replace("vote.html");

  }catch(err){
    console.error("LOGIN ERROR:", err);
    alert("Login error:\n" + err.message);
  }
};
</script>

</body>
</html>
