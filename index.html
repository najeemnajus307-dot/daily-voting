<!DOCTYPE html>
<html>
<head>
    <title>Login / Signup</title>
    <style>
        body{
            font-family:Arial;
            background:#f1f5f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            background:white;
            padding:25px;
            width:300px;
            border-radius:10px;
            text-align:center;
        }
        input{
            width:100%;
            padding:8px;
            margin:6px 0;
        }
        button{
            width:100%;
            padding:10px;
            margin-top:10px;
            background:#2563eb;
            color:white;
            border:none;
            cursor:pointer;
        }
        .link{
            margin-top:10px;
            color:blue;
            cursor:pointer;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="box">

    <!-- SIGNUP -->
    <div id="signupBox">
        <h3>Sign Up</h3>
        <input id="su_name" placeholder="Name">
        <input id="su_phone" placeholder="Phone">
        <input id="su_pass" type="password" placeholder="Password">
        <button onclick="signup()">Create Account</button>
        <div class="link" onclick="showLogin()">Already have account? Login</div>
    </div>

    <!-- LOGIN -->
    <div id="loginBox" style="display:none">
        <h3>Login</h3>
        <input id="li_phone" placeholder="Phone">
        <input id="li_pass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="link" onclick="showSignup()">New user? Sign up</div>
    </div>

</div>

<script>
function showLogin(){
    signupBox.style.display="none";
    loginBox.style.display="block";
}

function showSignup(){
    signupBox.style.display="block";
    loginBox.style.display="none";
}

function signup(){
    let name = su_name.value;
    let phone = su_phone.value;
    let pass = su_pass.value;

    if(name=="" || phone=="" || pass==""){
        alert("All fields required");
        return;
    }

    if(localStorage.getItem("user_"+phone)){
        alert("Account already exists");
        return;
    }

    let user = {name:name, phone:phone, pass:pass};
    localStorage.setItem("user_"+phone, JSON.stringify(user));

    alert("Account created. Login now.");
    showLogin();
}

function login(){
    let phone = li_phone.value;
    let pass = li_pass.value;

    let data = localStorage.getItem("user_"+phone);
    if(!data){
        alert("Account not found");
        return;
    }

    let user = JSON.parse(data);
    if(user.pass !== pass){
        alert("Wrong password");
        return;
    }

    localStorage.setItem("currentUser", user.name);
localStorage.setItem("currentPhone", user.phone);
window.location.href = "vote.html";
}
</script>

</body>
</html>
