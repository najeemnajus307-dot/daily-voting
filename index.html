<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness - Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.link{
  text-align:center;
  color:#2563eb;
  cursor:pointer;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="box">
  <h3 id="title">Login</h3>

  <input id="name" placeholder="Name" style="display:none">
  <input id="phone" placeholder="Phone">
  <input id="pass" type="password" placeholder="Password">

  <button id="mainBtn">Login</button>

  <div class="link" id="toggleBtn">Create account</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  getDocs, query, where
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (API KEY മാറ്റണം) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isSignup = false;

const title = document.getElementById("title");
const nameInp = document.getElementById("name");
const phoneInp = document.getElementById("phone");
const passInp = document.getElementById("pass");
const mainBtn = document.getElementById("mainBtn");
const toggleBtn = document.getElementById("toggleBtn");

/* TOGGLE LOGIN / SIGNUP */
toggleBtn.onclick = ()=>{
  isSignup = !isSignup;
  title.innerText = isSignup ? "Signup" : "Login";
  mainBtn.innerText = isSignup ? "Create Account" : "Login";
  toggleBtn.innerText = isSignup ? "Already have account?" : "Create account";
  nameInp.style.display = isSignup ? "block" : "none";
};

/* SUBMIT */
mainBtn.onclick = async ()=>{
  const name = nameInp.value.trim();
  const phone = phoneInp.value.trim();
  const pass = passInp.value.trim();

  if(!phone || !pass || (isSignup && !name)){
    alert("Fill all fields");
    return;
  }

  const q = query(collection(db,"users"), where("phone","==",phone));
  const snap = await getDocs(q);

  /* SIGNUP */
  if(isSignup){
    if(!snap.empty){
      alert("User already exists");
      return;
    }
    await addDoc(collection(db,"users"),{
      name,
      phone,
      password: pass,
      createdAt: new Date().toISOString()
    });
    alert("Signup success. Login now");
    toggleBtn.onclick(); // back to login
    return;
  }

  /* LOGIN */
  if(snap.empty){
    alert("Account not found");
    return;
  }

  let success = false;
  snap.forEach(d=>{
    const u = d.data();
    if(u.password === pass){
      success = true;
      sessionStorage.setItem("uid", d.id);
      sessionStorage.setItem("name", u.name);
      sessionStorage.setItem("phone", u.phone);
    }
  });

  if(!success){
    alert("Wrong password");
    return;
  }

  location.href = "vote.html";
};
</script>

</body>
</html>
