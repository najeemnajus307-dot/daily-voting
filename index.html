<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login / Signup</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  background:#fff;
  padding:25px;
  width:340px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.15);
}

h3{
  text-align:center;
  margin-bottom:10px;
}

input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:15px;
}

button{
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:active{
  transform:scale(0.98);
}

.link{
  text-align:center;
  margin-top:12px;
  font-size:15px;
  color:#2563eb;
  font-weight:bold;
  cursor:pointer;
}

.hide{
  display:none;
}
</style>
</head>

<body>

<div class="box">

  <!-- 🔐 LOGIN -->
  <div id="loginBox">
    <h3>WELCOME<br>FAITH & FITNESS</h3>

    <input id="loginPhone" placeholder="Phone number">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <!-- ✅ SIGNUP LINK (VISIBLE) -->
    <div class="link" onclick="showSignup()">New user? Signup</div>
  </div>

  <!-- 📝 SIGNUP -->
  <div id="signupBox" class="hide">
    <h3>Create Account</h3>

    <input id="name" placeholder="Full name">
    <input id="phone" placeholder="Phone number">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="signup()">Create Account</button>

    <div class="link" onclick="showLogin()">Already user? Login</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔁 AUTO REDIRECT IF LOGGED */
if(localStorage.getItem("userPhone")){
  location.replace("vote.html");
}

/* 🔄 TOGGLE */
window.showSignup = ()=>{
  document.getElementById("loginBox").classList.add("hide");
  document.getElementById("signupBox").classList.remove("hide");
};

window.showLogin = ()=>{
  document.getElementById("signupBox").classList.add("hide");
  document.getElementById("loginBox").classList.remove("hide");
};

/* 📝 SIGNUP */
window.signup = async ()=>{
  const name  = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const pass  = document.getElementById("pass").value.trim();

  if(!name || !phone || !pass){
    alert("All fields required");
    return;
  }

  const q = query(collection(db,"users"), where("phone","==",phone));
  const snap = await getDocs(q);

  if(!snap.empty){
    alert("User already exists");
    return;
  }

  await addDoc(collection(db,"users"),{
    name,
    phone,
    password: pass,
    createdAt: new Date().toISOString()
  });

  alert("Signup successful ✅");
  showLogin();
};

/* 🔐 LOGIN */
window.login = async ()=>{
  const phone = document.getElementById("loginPhone").value.trim();
  const pass  = document.getElementById("loginPass").value.trim();

  if(!phone || !pass){
    alert("Enter phone & password");
    return;
  }

  const q = query(
    collection(db,"users"),
    where("phone","==",phone),
    where("password","==",pass)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("Invalid login ❌");
    return;
  }

  localStorage.setItem("userPhone", phone);
  location.replace("vote.html");
};
</script>

</body>
</html>
