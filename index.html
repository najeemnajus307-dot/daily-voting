<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:320px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
h2{text-align:center;margin-bottom:15px}
input{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}
.login{background:#16a34a;color:white}
.signup{background:#2563eb;color:white}
.small{text-align:center;font-size:14px;margin-top:10px;cursor:pointer;color:#2563eb}
</style>
</head>

<body>

<div class="box">
  <h2 id="title">Login</h2>

  <input id="name" placeholder="Name" style="display:none">
  <input id="phone" placeholder="Phone number">
  <input id="pass" type="password" placeholder="Password">

  <button class="login" onclick="login()">Login</button>
  <button class="signup" onclick="signup()" style="display:none">Sign Up</button>

  <div class="small" onclick="toggle()">Create new account</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isLogin = true;

/* TOGGLE */
window.toggle = ()=>{
  isLogin = !isLogin;
  document.getElementById("name").style.display = isLogin ? "none" : "block";
  document.querySelector(".login").style.display = isLogin ? "block" : "none";
  document.querySelector(".signup").style.display = isLogin ? "none" : "block";
  document.getElementById("title").innerText = isLogin ? "Login" : "Sign Up";
  document.querySelector(".small").innerText =
    isLogin ? "Create new account" : "Already have account?";
};

/* SIGN UP */
window.signup = async ()=>{
  const name  = name.value.trim();
  const phone = phone.value.trim();
  const pass  = pass.value.trim();

  if(!name || !phone || !pass){
    alert("Fill all fields");
    return;
  }

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(snap.exists()){
    alert("Account already exists");
    return;
  }

  await setDoc(ref,{
    name,
    phone,
    password: pass,
    createdAt: new Date().toISOString()
  });

  alert("Account created. Login now.");
  toggle();
};

/* LOGIN */
window.login = async ()=>{
  const phone = phone.value.trim();
  const pass  = pass.value.trim();

  if(!phone || !pass){
    alert("Fill all fields");
    return;
  }

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    alert("Account not found");
    return;
  }

  const user = snap.data();
  if(user.password !== pass){
    alert("Wrong password");
    return;
  }

  sessionStorage.setItem("uid", phone);
  sessionStorage.setItem("name", user.name);

  window.location.replace("vote.html");
};
</script>

</body>
</html>
