<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#fff;
    padding:25px;
    width:300px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
input{
    width:100%;
    padding:8px;
    margin:6px 0;
}
button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h3>Login</h3>

<input id="phone" placeholder="Phone">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
/* Already logged in */
if(sessionStorage.getItem("userPhone")){
    window.location.replace("vote.html");
}

function login(){
    const phoneVal = document.getElementById("phone").value.trim();
    const passVal  = document.getElementById("pass").value.trim();

    if(phoneVal === "" || passVal === ""){
        alert("Fill all fields");
        return;
    }

    /* 🔴 TEMP SIMPLE LOGIN
       (No Firebase – direct access) */

    sessionStorage.setItem("userName", phoneVal);
    sessionStorage.setItem("userPhone", phoneVal);

    window.location.replace("vote.html");
}
</script>

</body>
</html>
