<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.box{
  background: #fff;
  padding: 25px;
  width: 360px;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,.2);
}
h2{text-align: center; margin-bottom: 10px;}
input{
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button{
  width: 100%;
  padding: 12px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:hover{background:#15803d;}
.link{
  text-align: center;
  margin-top: 10px;
  color: #2563eb;
  cursor: pointer;
}
.link:hover{text-decoration: underline;}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Login</h2>

<input id="name" placeholder="Name" style="display:none">
<input id="phone" placeholder="Phone Number">
<input id="pass" type="password" placeholder="Password">

<button onclick="submitForm()">Submit</button>

<div class="link" onclick="toggleMode()" id="toggleText">
New user? Sign up
</div>

</div>

<script>
let mode = "login"; // current mode: login or signup

function toggleMode(){
  if(mode === "login"){
    mode = "signup";
    title.innerText = "Sign Up";
    name.style.display = "block";
    toggleText.innerText = "Already have account? Login";
  } else {
    mode = "login";
    title.innerText = "Login";
    name.style.display = "none";
    toggleText.innerText = "New user? Sign up";
  }
}

function submitForm(){
  const phone = document.getElementById("phone").value.trim();
  const pass = document.getElementById("pass").value.trim();
  const nm = document.getElementById("name").value.trim();

  if(!phone || !pass){
    alert("Phone & Password required");
    return;
  }

  if(mode === "signup"){
    if(!nm){
      alert("Name required");
      return;
    }

    // check if user already exists
    if(localStorage.getItem("ff_user_" + phone)){
      alert("User already exists, please login.");
      toggleMode();
      return;
    }

    const user = { name: nm, phone: phone, pass: pass, points: 0 };
    localStorage.setItem("ff_user_" + phone, JSON.stringify(user));

    alert("Account created ✅ Login now");
    toggleMode();
    return;
  }

  // LOGIN section
  const data = localStorage.getItem("ff_user_" + phone);
  if(!data){
    alert("Account not found. Please sign up.");
    return;
  }

  const user = JSON.parse(data);
  if(user.pass !== pass){
    alert("Wrong password ❌");
    return;
  }

  // save current session
  sessionStorage.setItem("userName", user.name);
  sessionStorage.setItem("userPhone", user.phone);

  alert("Login successful ✅");
  window.location.replace("vote.html");
}
</script>

</body>
</html>
