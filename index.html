<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup / Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:350px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.link{
  text-align:center;
  color:#2563eb;
  cursor:pointer;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Signup</h2>

<!-- SIGNUP -->
<div id="signupBox">
  <input id="sname" placeholder="Name">
  <input id="sphone" placeholder="Phone Number">
  <input id="spass" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <div class="link" onclick="showLogin()">Already have account?</div>
</div>

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
  <input id="lphone" placeholder="Phone Number">
  <input id="lpass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="link" onclick="showForgot()">Forgot password?</div>
  <div class="link" onclick="showSignup()">New user? Signup</div>
</div>

<!-- FORGOT PASSWORD -->
<div id="forgotBox" style="display:none;">
  <input id="fphone" placeholder="Phone Number">
  <input id="newpass" type="password" placeholder="New Password">
  <button onclick="resetPassword()">Reset Password</button>
  <div class="link" onclick="showLogin()">Back to Login</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UI SWITCH */
window.showLogin = ()=>{
  signupBox.style.display="none";
  forgotBox.style.display="none";
  loginBox.style.display="block";
  title.innerText="Login";
};
window.showSignup = ()=>{
  signupBox.style.display="block";
  loginBox.style.display="none";
  forgotBox.style.display="none";
  title.innerText="Signup";
};
window.showForgot = ()=>{
  signupBox.style.display="none";
  loginBox.style.display="none";
  forgotBox.style.display="block";
  title.innerText="Forgot Password";
};

/* SIGNUP */
window.signup = async ()=>{
  const name  = sname.value.trim();
  const phone = sphone.value.trim();
  const pass  = spass.value.trim();

  if(!name || !phone || !pass){
    alert("Fill all fields");
    return;
  }

  const q = query(
    collection(db,"users"),
    where("phone","==",phone)
  );
  const snap = await getDocs(q);
  if(!snap.empty){
    alert("Phone already registered");
    return;
  }

  await addDoc(collection(db,"users"),{
    name:name,
    phone:phone,
    password:pass
  });

  alert("Signup successful ✅");
  showLogin();
};

/* LOGIN */
window.login = async ()=>{
  const phone = lphone.value.trim();
  const pass  = lpass.value.trim();

  const q = query(
    collection(db,"users"),
    where("phone","==",phone),
    where("password","==",pass)
  );
  const snap = await getDocs(q);

  if(snap.empty){
    alert("Invalid login");
    return;
  }

  localStorage.setItem("userPhone",phone);
  localStorage.setItem("userName",snap.docs[0].data().name);

  window.location.href="vote.html";
};

/* FORGOT PASSWORD */
window.resetPassword = async ()=>{
  const phone = fphone.value.trim();
  const newp  = newpass.value.trim();

  const q = query(
    collection(db,"users"),
    where("phone","==",phone)
  );
  const snap = await getDocs(q);

  if(snap.empty){
    alert("Phone not found");
    return;
  }

  await updateDoc(
    doc(db,"users",snap.docs[0].id),
    { password:newp }
  );

  alert("Password updated ✅");
  showLogin();
};
</script>

</body>
</html>
