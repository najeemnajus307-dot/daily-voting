<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:300px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  text-align:center;
}
input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{background:#16a34a;color:#fff;border:none;}
.link{color:#2563eb;cursor:pointer;margin-top:8px}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="lPhone" placeholder="Phone">
  <input id="lPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="link" onclick="showSignup()">Signup</div>
</div>

<div class="box" id="signupBox" style="display:none">
  <h3>Signup</h3>
  <input id="sName" placeholder="Name">
  <input id="sPhone" placeholder="Phone">
  <input id="sPass" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <div class="link" onclick="showLogin()">Login</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase config (REAL API KEY ഇടണം) */
const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* already logged */
if(sessionStorage.getItem("logged")==="yes"){
  location.replace("vote.html");
}

window.showSignup=()=>{
  loginBox.style.display="none";
  signupBox.style.display="block";
};
window.showLogin=()=>{
  signupBox.style.display="none";
  loginBox.style.display="block";
};

window.signup = async ()=>{
  const name=sName.value.trim();
  const phone=sPhone.value.trim();
  const pass=sPass.value.trim();
  if(!name||!phone||!pass){alert("Fill all");return;}

  const ref=doc(db,"users",phone);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{name,phone,password:pass});
  }

  sessionStorage.setItem("logged","yes");
  sessionStorage.setItem("userName",name);
  sessionStorage.setItem("userPhone",phone);
  location.replace("vote.html");
};

window.login = async ()=>{
  const phone=lPhone.value.trim();
  const pass=lPass.value.trim();
  if(!phone||!pass){alert("Fill all");return;}

  const ref=doc(db,"users",phone);
  const snap=await getDoc(ref);
  if(!snap.exists()){alert("No user");return;}
  if(snap.data().password!==pass){alert("Wrong password");return;}

  sessionStorage.setItem("logged","yes");
  sessionStorage.setItem("userName",snap.data().name);
  sessionStorage.setItem("userPhone",phone);
  location.replace("vote.html");
};
</script>

</body>
</html>
