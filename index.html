<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.2);
}
h2{text-align:center}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
}
button{
  width:100%;
  padding:12px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.link{
  text-align:center;
  margin-top:10px;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2 id="title">Login</h2>

  <input id="name" placeholder="Name" style="display:none">
  <input id="phone" placeholder="Phone Number">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="submit()">Submit</button>

  <div class="link" onclick="toggle()" id="toggleText">
    New user? Sign up
  </div>
</div>

<script>
let mode="login";

const nameInp  = document.getElementById("name");
const phoneInp = document.getElementById("phone");
const passInp  = document.getElementById("pass");

function toggle(){
  if(mode==="login"){
    mode="signup";
    title.innerText="Sign Up";
    nameInp.style.display="block";
    toggleText.innerText="Already have account? Login";
  }else{
    mode="login";
    title.innerText="Login";
    nameInp.style.display="none";
    toggleText.innerText="New user? Sign up";
  }
}

function submit(){
  const phone = phoneInp.value.trim();
  const pass  = passInp.value.trim();
  const name  = nameInp.value.trim();

  if(!phone || !pass){
    alert("Phone & Password required");
    return;
  }

  /* SIGNUP */
  if(mode==="signup"){
    if(!name){
      alert("Name required");
      return;
    }
    const user = { name, phone, pass };

    // ✅ NEW KEY
    localStorage.setItem("ff_user_"+phone, JSON.stringify(user));

    alert("Account created ✅ Login now");
    toggle();
    return;
  }

  /* LOGIN */
  let data =
    localStorage.getItem("ff_user_"+phone) ||     // new
    localStorage.getItem("user_"+phone);           // old support

  if(!data){
    alert("Account not found");
    return;
  }

  const user = JSON.parse(data);
  if(user.pass !== pass){
    alert("Wrong password");
    return;
  }

  sessionStorage.setItem("userName", user.name);
  sessionStorage.setItem("userPhone", user.phone);

  location.replace("vote.html");
}
</script>

</body>
</html>
