<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login System</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h2{text-align:center;}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
}
.link{
  text-align:center;
  color:blue;
  cursor:pointer;
  font-size:14px;
}
</style>
</head>
<body>

<div class="box">

<h2 id="title">Signup</h2>

<!-- SIGNUP -->
<div id="signupBox">
  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone Number">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <div class="link" onclick="showLogin()">Already have account?</div>
</div>

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
  <input id="lphone" placeholder="Phone Number">
  <input id="lpassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="link" onclick="showForgot()">Forgot password?</div>
  <div class="link" onclick="showSignup()">New user? Signup</div>
</div>

<!-- FORGOT PASSWORD -->
<div id="forgotBox" style="display:none;">
  <input id="fphone" placeholder="Phone Number">
  <input id="newpass" type="password" placeholder="New Password">
  <button onclick="resetPassword()">Reset Password</button>
  <div class="link" onclick="showLogin()">Back to Login</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  query, where, getDocs, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔴 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UI SWITCH */
window.showLogin=()=>{
  signupBox.style.display="none";
  forgotBox.style.display="none";
  loginBox.style.display="block";
  title.innerText="Login";
}
window.showSignup=()=>{
  signupBox.style.display="block";
  loginBox.style.display="none";
  forgotBox.style.display="none";
  title.innerText="Signup";
}
window.showForgot=()=>{
  signupBox.style.display="none";
  loginBox.style.display="none";
  forgotBox.style.display="block";
  title.innerText="Forgot Password";
}

/* SIGNUP */
window.signup = async ()=>{
  if(!name.value||!phone.value||!password.value)
    return alert("Fill all fields");

  const q=query(collection(db,"users"),where("phone","==",phone.value));
  if(!(await getDocs(q)).empty)
    return alert("Phone already registered");

  await addDoc(collection(db,"users"),{
    name:name.value,
    phone:phone.value,
    password:password.value
  });

  alert("Signup successful");
  showLogin();
}

/* LOGIN */
window.login = async ()=>{
  const q=query(collection(db,"users"),
    where("phone","==",lphone.value),
    where("password","==",lpassword.value)
  );
  const snap=await getDocs(q);

  if(snap.empty) return alert("Invalid login");

  localStorage.setItem("loginPhone",lphone.value);
  window.location.href="vote.html";
}

/* FORGOT PASSWORD */
window.resetPassword = async ()=>{
  if(!fphone.value||!newpass.value)
    return alert("Fill all fields");

  const q=query(collection(db,"users"),where("phone","==",fphone.value));
  const snap=await getDocs(q);

  if(snap.empty) return alert("Phone not found");

  const userDoc=snap.docs[0];
  await updateDoc(doc(db,"users",userDoc.id),{
    password:newpass.value
  });

  alert("Password updated successfully");
  showLogin();
}
</script>

</body>
</html>
