<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:360px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  text-align:center;
}
h2{
  margin:0;
}
h3{
  margin:6px 0 20px;
  color:#16a34a;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:16px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
small{
  color:#555;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <input id="phone" type="tel" placeholder="Phone number">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <small>Daily Challenge Voting</small>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN FUNCTION */
window.login = async ()=>{
  const p = phone.value.trim();
  const pass = password.value.trim();

  if(!p || !pass){
    alert("Enter phone & password");
    return;
  }

  const q = query(
    collection(db,"users"),
    where("phone","==",p),
    where("password","==",pass)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    alert("Invalid login ❌");
    return;
  }

  // save login
  localStorage.setItem("userPhone", p);

  // redirect to voting page
  window.location.href = "vote.html";
};
</script>

</body>
</html>
