<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Login</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.2);
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
}
.link{
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="lPhone" placeholder="Phone">
  <input id="lPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="link" onclick="showSignup()">New user? Signup</div>
</div>

<div class="box" id="signupBox" style="display:none">
  <h3>Signup</h3>
  <input id="sName" placeholder="Name">
  <input id="sPhone" placeholder="Phone">
  <input id="sPass" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <div class="link" onclick="showLogin()">Already user? Login</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (REAL KEY വേണം) */
const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UI */
window.showSignup = ()=>{ loginBox.style.display="none"; signupBox.style.display="block"; }
window.showLogin  = ()=>{ signupBox.style.display="none"; loginBox.style.display="block"; }

/* LOGIN */
window.login = async ()=>{
  const phone = lPhone.value.trim();
  const pass  = lPass.value.trim();
  if(!phone || !pass) return alert("Enter phone & password");

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists()) return alert("User not found");
  if(snap.data().password !== pass) return alert("Wrong password");

  sessionStorage.setItem("userPhone",phone);
  sessionStorage.setItem("userName",snap.data().name);

  location.href="vote.html";
};

/* SIGNUP */
window.signup = async ()=>{
  const name  = sName.value.trim();
  const phone = sPhone.value.trim();
  const pass  = sPass.value.trim();

  if(!name || !phone || !pass) return alert("Fill all fields");

  const ref = doc(db,"users",phone);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      name,
      phone,
      password: pass,
      totalPoints: 0,
      createdAt: new Date().toISOString()
    });
  }

  sessionStorage.setItem("userPhone",phone);
  sessionStorage.setItem("userName",name);

  location.href="vote.html";
};
</script>

</body>
</html>
