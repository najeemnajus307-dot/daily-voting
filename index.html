<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Login</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.2);
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button{
  background:#16a34a;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:disabled{
  background:#9ca3af;
}
.link{
  margin-top:10px;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="lPhone" placeholder="Phone">
  <input id="lPass" type="password" placeholder="Password">
  <button id="loginBtn" type="button">Login</button>
  <div class="link" id="toSignup">New user? Signup</div>
</div>

<div class="box" id="signupBox" style="display:none">
  <h3>Signup</h3>
  <input id="sName" placeholder="Name">
  <input id="sPhone" placeholder="Phone">
  <input id="sPass" type="password" placeholder="Password">
  <button id="signupBtn" type="button">Signup</button>
  <div class="link" id="toLogin">Already user? Login</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (API KEY MUST BE REAL) */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* AUTO REDIRECT IF LOGGED */
if(sessionStorage.getItem("logged")==="yes"){
  location.replace("vote.html");
}

/* UI TOGGLE */
const loginBox = document.getElementById("loginBox");
const signupBox = document.getElementById("signupBox");

document.getElementById("toSignup").onclick = ()=>{
  loginBox.style.display="none";
  signupBox.style.display="block";
};
document.getElementById("toLogin").onclick = ()=>{
  signupBox.style.display="none";
  loginBox.style.display="block";
};

/* 🔒 LOGIN LOCK (BLINK FIX) */
let loggingIn = false;
let signingUp = false;

/* LOGIN */
document.getElementById("loginBtn").onclick = async ()=>{
  if(loggingIn) return;          // 🚫 double click block
  loggingIn = true;

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerText = "Logging in...";

  const phone = lPhone.value.trim();
  const pass  = lPass.value.trim();

  if(!phone || !pass){
    alert("Phone & Password required");
    resetLogin();
    return;
  }

  try{
    const ref = doc(db,"users",phone);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      alert("User not found");
      resetLogin();
      return;
    }

    if(snap.data().password !== pass){
      alert("Wrong password");
      resetLogin();
      return;
    }

    // ✅ SUCCESS
    sessionStorage.setItem("logged","yes");
    sessionStorage.setItem("userName",snap.data().name);
    sessionStorage.setItem("userPhone",phone);

    location.replace("vote.html");

  }catch(e){
    alert("Login error");
    resetLogin();
  }
};

function resetLogin(){
  loggingIn = false;
  const btn = document.getElementById("loginBtn");
  btn.disabled = false;
  btn.innerText = "Login";
}

/* SIGNUP */
document.getElementById("signupBtn").onclick = async ()=>{
  if(signingUp) return;          // 🚫 double click block
  signingUp = true;

  const btn = document.getElementById("signupBtn");
  btn.disabled = true;
  btn.innerText = "Signing up...";

  const name  = sName.value.trim();
  const phone = sPhone.value.trim();
  const pass  = sPass.value.trim();

  if(!name || !phone || !pass){
    alert("All fields required");
    resetSignup();
    return;
  }

  try{
    const ref = doc(db,"users",phone);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      await setDoc(ref,{
        name,
        phone,
        password: pass,
        totalPoints: 0,
        createdAt: new Date().toISOString()
      });
    }

    // ✅ AUTO LOGIN
    sessionStorage.setItem("logged","yes");
    sessionStorage.setItem("userName",name);
    sessionStorage.setItem("userPhone",phone);

    location.replace("vote.html");

  }catch(e){
    alert("Signup error");
    resetSignup();
  }
};

function resetSignup(){
  signingUp = false;
  const btn = document.getElementById("signupBtn");
  btn.disabled = false;
  btn.innerText = "Signup";
}
</script>

</body>
</html>
