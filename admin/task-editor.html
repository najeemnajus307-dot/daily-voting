<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Editor | Faith & Fitness</title>
    <link rel="stylesheet" href="../assets/global.css">
    <style>
        .editor-container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .day-check { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        .task-list-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-light); }
        .task-actions { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="editor-container animate-fade-in">
        <a href="admin.html" style="color: var(--primary); text-decoration: none; font-weight: 600; display: block; margin-bottom: 20px;">← Back to Dashboard</a>
        
        <h1 class="font-serif" style="color: var(--primary); margin-bottom: 20px;">Task Editor</h1>
        
        <div class="panel" style="padding: 25px;">
            <div class="input-group">
                <label>Task Description</label>
                <input id="taskText" placeholder="e.g. Completed Daily Workout">
            </div>
            <div class="input-group">
                <label>Points Awarded</label>
                <input id="taskPoints" type="number" placeholder="10">
            </div>
            
            <label style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Active Days</label>
            <div class="days-grid" id="daysBox">
                <label class="day-check"><input type="checkbox" value="1"> Mon</label>
                <label class="day-check"><input type="checkbox" value="2"> Tue</label>
                <label class="day-check"><input type="checkbox" value="3"> Wed</label>
                <label class="day-check"><input type="checkbox" value="4"> Thu</label>
                <label class="day-check"><input type="checkbox" value="5"> Fri</label>
                <label class="day-check"><input type="checkbox" value="6"> Sat</label>
                <label class="day-check"><input type="checkbox" value="0"> Sun</label>
            </div>

            <div style="display:flex; gap:15px; margin-bottom: 20px;">
                <div class="input-group" style="flex:1;">
                    <label>Start Time</label>
                    <input id="startTime" type="time">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>End Time</label>
                    <input id="endTime" type="time">
                </div>
            </div>

            <label style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Special Task Dates (Optional)</label>
            <div style="display:flex; gap:15px; margin-top: 5px; margin-bottom: 20px;">
                <div class="input-group" style="flex:1;">
                    <label>Start Date</label>
                    <input id="startDate" type="date">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>End Date</label>
                    <input id="endDate" type="date">
                </div>
            </div>

            <button class="btn-primary" onclick="saveTask()">Save Task</button>
        </div>

        <div style="margin-top: 40px;">
            <h3 class="font-serif" style="margin-bottom: 15px;">Existing Tasks</h3>
            <div id="taskList">Loading tasks...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
            authDomain: "daily-voting-793ee.firebaseapp.com",
            projectId: "daily-voting-793ee"
        });
        const db = getFirestore(app);

        // Auth check with bypass and Firestore role authorization
        const phone = localStorage.getItem("userPhone");
        const bypass = localStorage.getItem("admin_bypass_auth") === "true";
        const adminNumbers = ["7904302567"]; // Default admin list

        let isAuthorized = false;
        let currentAdminPerms = {
            admin_view_only: false,
            admin_settings_only: false,
            admin_task_only: false
        };

        // 1. Check direct phone list
        if (phone && adminNumbers.includes(String(phone))) {
            isAuthorized = true;
        }

        // 2. If not in hardcoded list, check Firestore u.role and load permissions
        if (phone) {
            try {
                let snap = await getDocs(query(collection(db, "users"), where("phone", "==", String(phone))));
                if (snap.empty && !isNaN(phone)) {
                    snap = await getDocs(query(collection(db, "users"), where("phone", "==", Number(phone))));
                }
                if (!snap.empty) {
                    const data = snap.docs[0].data();
                    if (data.role === "admin") {
                        isAuthorized = true;
                    }
                    currentAdminPerms.admin_view_only = data.admin_view_only || false;
                    currentAdminPerms.admin_settings_only = data.admin_settings_only || false;
                    currentAdminPerms.admin_task_only = data.admin_task_only || false;
                }
            } catch (e) {
                console.error("Firestore admin check failed:", e);
            }
        }

        // 3. Fallback to password prompt if not authorized and no bypass
        if (!isAuthorized && !bypass) {
            if (prompt("Admin password") !== "5") {
                location.replace("../index.html");
            } else {
                localStorage.setItem("admin_bypass_auth", "true");
            }
        } else {
            localStorage.setItem("admin_bypass_auth", "true");
        }

        // Enforce settings-only redirection
        if (currentAdminPerms.admin_settings_only) {
            alert("Access Denied: Settings-only admins cannot access the Task Editor.");
            location.replace("admin.html");
        }

        let editId = null;

        async function loadTasks() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";
            const snap = await getDocs(collection(db, "tasks"));
            if (snap.empty) { list.innerHTML = "No tasks found."; return; }

            const isViewOnly = currentAdminPerms.admin_view_only;

            snap.forEach(d => {
                const t = d.data();
                const div = document.createElement("div");
                div.className = "task-list-item";
                div.innerHTML = `
                    <div style="font-weight:700; color:var(--primary);">${t.text}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">
                        Points: ${t.points} | Time: ${t.start} - ${t.end} ${t.startDate ? `| Dates: ${t.startDate} to ${t.endDate||' ongoing'}` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn-secondary btn-sm" onclick="editTask('${d.id}', '${t.text.replace(/'/g, "\\'")}', ${t.points}, '${t.start}', '${t.end}', ${JSON.stringify(t.days || [])}, '${t.startDate || ''}', '${t.endDate || ''}')" ${isViewOnly ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>Edit</button>
                        <button class="btn-secondary btn-sm" style="color:var(--error); border-color:var(--error); ${isViewOnly ? 'opacity:0.5; cursor:not-allowed;' : ''}" onclick="deleteTask('${d.id}')" ${isViewOnly ? 'disabled' : ''}>Delete</button>
                    </div>`;
                list.appendChild(div);
            });
        }

        window.saveTask = async () => {
            if (currentAdminPerms.admin_view_only) {
                alert("Permission Denied: You have View-Only access and cannot modify any tasks.");
                return;
            }

            const text = document.getElementById("taskText").value.trim();
            const points = Number(document.getElementById("taskPoints").value);
            const start = document.getElementById("startTime").value;
            const end = document.getElementById("endTime").value;
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const days = [...document.querySelectorAll("#daysBox input:checked")].map(d => Number(d.value));

            if (!text || points < 0 || (!startDate && days.length === 0)) return alert("Please provide task text, points, and either active days or a start date.");

            const data = { text, points, start, end, days, startDate: startDate || null, endDate: endDate || null };
            if (editId) {
                await updateDoc(doc(db, "tasks", editId), data);
                editId = null;
            } else {
                await addDoc(collection(db, "tasks"), { ...data, createdAt: new Date().toISOString() });
            }

            location.reload();
        };

        window.editTask = (id, text, points, start, end, days, startDate, endDate) => {
            if (currentAdminPerms.admin_view_only) return;
            editId = id;
            document.getElementById("taskText").value = text;
            document.getElementById("taskPoints").value = points;
            document.getElementById("startTime").value = start;
            document.getElementById("endTime").value = end;
            document.getElementById("startDate").value = startDate;
            document.getElementById("endDate").value = endDate;
            document.querySelectorAll("#daysBox input").forEach(c => c.checked = days.includes(Number(c.value)));
            window.scrollTo(0, 0);
        };

        window.deleteTask = async (id) => {
            if (currentAdminPerms.admin_view_only) {
                alert("Permission Denied: You have View-Only access and cannot delete tasks.");
                return;
            }
            if (confirm("Delete this task?")) {
                await deleteDoc(doc(db, "tasks", id));
                loadTasks();
            }
        };

        function applyViewOnlyUI() {
            if (currentAdminPerms.admin_view_only) {
                document.getElementById("taskText").disabled = true;
                document.getElementById("taskPoints").disabled = true;
                document.querySelectorAll("#daysBox input").forEach(el => el.disabled = true);
                document.getElementById("startTime").disabled = true;
                document.getElementById("endTime").disabled = true;
                document.getElementById("startDate").disabled = true;
                document.getElementById("endDate").disabled = true;
                
                const saveBtn = document.querySelector("button[onclick='saveTask()']");
                if (saveBtn) {
                    saveBtn.style.display = "none";
                }
            }
        }

        loadTasks();
        setTimeout(applyViewOnlyUI, 500);
    </script>
</body>
</html>
