<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
.hidden{display:none}
.main{padding:14px;padding-bottom:90px}
.card{
  background:#fff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12);
  margin-bottom:10px
}
.hrow{display:flex;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#2563eb;color:#fff}

.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:#16a34a;color:#fff}
.del{background:#dc2626;color:#fff}
.warn{background:#f59e0b;color:#fff}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;
  justify-content:space-around;padding:6px 0
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<main class="main">

<!-- ================= DASHBOARD ================= -->
<section id="page-home">
<h3>Dashboard</h3>

<div class="card hrow">
  From <input type="date" id="d_from">
  To <input type="date" id="d_to">
  <button type="button" class="btn" onclick="dashLoad()">Apply</button>

  <label>
    <input type="checkbox" id="d_hide0" onchange="dashLoad()">
    Hide 0 (only not voted)
  </label>
</div>

<div class="card">
Users: <b id="d_users">0</b> |
Shown: <b id="d_shown">0</b>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>SL</th><th>Rank</th><th>Name</th>
<th>Phone</th><th>Total</th><th>Add</th>
</tr>
</thead>
<tbody id="dashBody"></tbody>
</table>
</div>
</section>

<!-- ================= SIGNAL USER ================= -->
<section id="page-signal" class="hidden">
<h3>Signal User (Date Wise)</h3>

<div class="card">
User:
<select id="s_user"></select>
Date:
<input type="date" id="s_date">
<button type="button" class="btn" onclick="loadSignal()">View</button>
</div>

<div class="card">
<table>
<thead>
<tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr>
</thead>
<tbody id="s_body"></tbody>
</table>
</div>
</section>

<!-- ================= USERS ================= -->
<section id="page-users" class="hidden">
<h3>Users</h3>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th><th>Phone</th><th>Total</th>
<th>Ban</th><th>Reset</th><th>Delete</th>
</tr>
</thead>
<tbody id="userBody"></tbody>
</table>
</div>
</section>

</main>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
<button class="active" data-page="home">🏠<br>Home</button>
<button data-page="signal">🟢<br>Signal</button>
<button data-page="users">👤<br>Users</button>
<button onclick="location.href='task-editor.html'">🛠<br>Task</button>
</div>

<script type="module">
/* ===== ADMIN PASSWORD ===== */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* ===== FIREBASE ===== */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, doc, updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today=()=>new Date().toISOString().split("T")[0];

/* ================= DASHBOARD ================= */
async function dashLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));

  d_users.textContent=users.size;

  if(d_from.value && !d_to.value) d_to.value=d_from.value;
  const from=d_from.value;
  const to=d_to.value;
  const useDate=!!from;

  const totalMap={}, votedMap={};

  votes.forEach(v=>{
    const x=v.data();
    if(useDate){
      if(!x.date) return;
      if(x.date<from || x.date>to) return;
    }
    votedMap[x.phone]=true;
    totalMap[x.phone]=(totalMap[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    const p=u.data().phone;
    rows.push({
      name:u.data().name,
      phone:p,
      total:totalMap[p]||0,
      voted:!!votedMap[p]
    });
  });

  if(d_hide0.checked){
    rows=rows.filter(r=>r.voted || r.total>0);
  }

  rows.sort((a,b)=>b.total-a.total);

  dashBody.innerHTML="";
  let sl=0,rank=0,prev=null;
  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;

    let cls="";
    if(rank===1) cls="rank1";
    else if(rank===2) cls="rank2";
    else if(rank===3) cls="rank3";

    dashBody.innerHTML+=`
    <tr class="${cls}">
      <td>${sl}</td><td>${rank}</td>
      <td>${r.name}</td><td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input id="p_${r.phone}" type="number" style="width:60px">
        <button type="button"
        class="btn add"
        onclick="addPoint('${r.phone}')">+</button>
      </td>
    </tr>`;
  });
  d_shown.textContent=sl;
}
window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return;
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:today(),source:"admin"
  });
  dashLoad();
};

/* ================= SIGNAL USER ================= */
async function initSignal(){
  s_user.innerHTML="";
  (await getDocs(collection(db,"users"))).forEach(u=>{
    s_user.innerHTML+=`<option value="${u.data().phone}">
    ${u.data().name}</option>`;
  });
}
window.loadSignal=async()=>{
  const phone=s_user.value;
  const date=s_date.value;
  const votes=await getDocs(collection(db,"votes"));
  s_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone && (!date||x.date===date)){
      s_body.innerHTML+=`
      <tr>
        <td>${x.date}</td>
        <td>${x.points}</td>
        <td>${x.source||"-"}</td>
        <td>
          <button class="del"
          onclick="delVote('${v.id}')">X</button>
        </td>
      </tr>`;
    }
  });
};
window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  loadSignal();dashLoad();
};

/* ================= USERS ================= */
async function loadUsers(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const map={};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  userBody.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    userBody.innerHTML+=`
    <tr>
      <td>${u.data().name}</td>
      <td>${p}</td>
      <td>${map[p]||0}</td>
      <td>
        <button class="warn"
        onclick="toggleBan('${u.id}',${u.data().active!==false})">
        ${u.data().active===false?'Unban':'Ban'}
        </button>
      </td>
      <td>
        <button class="warn"
        onclick="resetPoints('${p}')">Reset</button>
      </td>
      <td>
        <button class="del"
        onclick="deleteUser('${u.id}')">Delete</button>
      </td>
    </tr>`;
  });
}
window.toggleBan=async(id,active)=>{
  await updateDoc(doc(db,"users",id),{active:!active});
  loadUsers();
};
window.resetPoints=async(phone)=>{
  const votes=await getDocs(collection(db,"votes"));
  votes.forEach(v=>{
    if(v.data().phone===phone){
      deleteDoc(doc(db,"votes",v.id));
    }
  });
  dashLoad();loadUsers();
};
window.deleteUser=async(id)=>{
  if(!confirm("Delete user?")) return;
  await deleteDoc(doc(db,"users",id));
  loadUsers();dashLoad();
};

/* ================= NAV ================= */
document.querySelectorAll(".bottom-nav button[data-page]")
.forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".bottom-nav button")
    .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");

    document.querySelectorAll("main section")
    .forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+b.dataset.page)
    .classList.remove("hidden");

    if(b.dataset.page==="signal") initSignal();
    if(b.dataset.page==="users") loadUsers();
  };
});

/* INIT */
dashLoad();
</script>
</body>
</html>
