<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faith & Fitness – Admin</title>

<style>
:root{
  --bg:#f1f5f9; --pri:#2563eb; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.main{padding:16px;padding-bottom:90px}

/* table */
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:var(--pri);color:#fff}

/* rank colors */
.rank-1{background:#fde047!important}
.rank-2{background:#e5e7eb!important}
.rank-3{background:#fecaca!important}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.controls input,.controls button{
  padding:6px 10px;border-radius:6px;border:1px solid #ccc
}
button{cursor:pointer}

/* add btn */
.add{background:#16a34a;color:#fff;border:none;padding:5px 10px}

/* bottom bar */
.bottom{
  position:fixed;bottom:0;left:0;right:0;
  background:#020617;color:#fff;
  display:flex;justify-content:space-around;
  padding:10px 0
}
.bottom span{cursor:pointer;opacity:.8}
.bottom span.active{opacity:1;border-bottom:2px solid #38bdf8}
</style>
</head>

<body>
<div class="main">

<h3>Dashboard</h3>

<div class="controls">
  <label>From <input type="date" id="from"></label>
  <label>To <input type="date" id="to"></label>
  <label>
    <input type="checkbox" id="hide0"> Hide 0 (only not voted)
  </label>
  <button onclick="loadDash()">View</button>
</div>

<table>
<thead>
<tr>
  <th>SL</th>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total</th>
  <th>Add</th>
</tr>
</thead>
<tbody id="dashBody"></tbody>
</table>

</div>

<!-- bottom menu -->
<div class="bottom">
  <span class="active">Dashboard</span>
  <span onclick="location.href='admin.html'">Task</span>
  <span onclick="location.href='admin.html#users'">Users</span>
  <span onclick="location.href='task-editor.html'">Task Editor</span>
</div>

<!-- firebase -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
 getFirestore, collection, getDocs,
 query, where, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 PUT YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey:"YOUR_KEY",
  authDomain:"YOUR_DOMAIN",
  projectId:"YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD DASHBOARD */
window.loadDash = async function(){
  const hide0 = hide0Box.checked;
  dashBody.innerHTML="";

  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  let totals = {};

  usersSnap.forEach(u=>{
    totals[u.data().phone]={
      name:u.data().name,
      phone:u.data().phone,
      total:0
    };
  });

  votesSnap.forEach(v=>{
    const d=v.data();
    if(totals[d.phone]) totals[d.phone].total+=Number(d.points);
  });

  let list = Object.values(totals);

  if(hide0) list=list.filter(x=>x.total>0);

  list.sort((a,b)=>b.total-a.total);

  /* rank calc */
  let last=null, rank=0, sl=0;

  list.forEach(r=>{
    sl++;
    if(r.total!==last){ rank=sl; last=r.total }

    let rc="";
    if(rank===1) rc="rank-1";
    else if(rank===2) rc="rank-2";
    else if(rank===3) rc="rank-3";

    dashBody.innerHTML+=`
    <tr class="${rc}">
      <td>${sl}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input id="p_${r.phone}" type="number" style="width:50px">
        <button class="add" onclick="addPoint('${r.phone}')">+</button>
      </td>
    </tr>`;
  });
};

/* ADD POINT */
window.addPoint = async function(phone){
  const val = document.getElementById("p_"+phone).value;
  if(!val) return alert("Enter points");

  await addDoc(collection(db,"votes"),{
    phone, points:Number(val),
    date:new Date().toISOString().slice(0,10)
  });

  loadDash();
};

loadDash();
</script>
</body>
</html>
