<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User-wise Report – Faith & Fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:15px;
}

h2{
  text-align:center;
  margin-bottom:10px;
}

.filters{
  background:#fff;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

.filters input{
  padding:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  border:1px solid #ddd;
  padding:7px;
  text-align:center;
  font-size:14px;
}

th{
  background:#2563eb;
  color:#fff;
}

.note{
  font-size:12px;
  color:#555;
  margin-bottom:8px;
}
</style>
</head>

<body>

<h2>User-wise Report</h2>

<div class="filters">
  <label>From:
    <input type="date" id="from">
  </label>

  <label>To:
    <input type="date" id="to">
  </label>

  <label>Search:
    <input type="text" id="search" placeholder="Name / Phone">
  </label>

  <button onclick="load()">Apply</button>
  <button onclick="clearAll()">Clear</button>
</div>

<div class="note">
ℹ️ Date select ചെയ്താൽ ആ date range-il vote ചെയ്ത points മാത്രം കാണിക്കും
</div>

<table>
<thead>
<tr>
  <th>SL</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

window.load = async()=>{
  tbody.innerHTML="";

  const from = document.getElementById("from").value;
  const to   = document.getElementById("to").value || from;
  const search = document.getElementById("search").value.toLowerCase();

  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  /* 🔢 BUILD VOTE MAP */
  const voteMap = {};

  votesSnap.forEach(v=>{
    const d = v.data();

    if(from){
      if(!d.date) return;
      if(d.date < from || d.date > to) return;
    }

    voteMap[d.phone] =
      (voteMap[d.phone] || 0) + Number(d.points || 0);
  });

  let sl = 1;

  usersSnap.forEach(u=>{
    const name  = u.data().name;
    const phone = u.data().phone;
    const total = voteMap[phone] || 0;

    if(search){
      if(
        !name.toLowerCase().includes(search) &&
        !phone.includes(search)
      ) return;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${sl++}</td>
      <td>${name}</td>
      <td>${phone}</td>
      <td>${total}</td>
    `;
    tbody.appendChild(tr);
  });

  if(sl===1){
    tbody.innerHTML =
      `<tr><td colspan="4">No data found</td></tr>`;
  }
};

window.clearAll = ()=>{
  from.value="";
  to.value="";
  search.value="";
  load();
};

load();
</script>

</body>
</html>
