<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.main{padding:16px;padding-bottom:80px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{
  background:var(--card);padding:12px;border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12)
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
th{background:var(--pri);color:#fff}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select{padding:6px}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;
  justify-content:space-around;padding:6px 0;z-index:1000;
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">

  <div class="hrow">
    <div class="card">
      From <input type="date" id="d_from">
      To <input type="date" id="d_to">
      <button class="btn" onclick="dashLoad()">View</button>
    </div>

    <div class="card">
      <label>
        <input type="checkbox" id="d_hide0" onchange="dashLoad()">
        Hide 0 (only not voted)
      </label>
    </div>

    <div class="card">Users: <b id="d_users">0</b></div>
    <div class="card">Shown: <b id="d_shown">0</b></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th>
          <th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">

  <div class="card" style="margin-bottom:10px">
    Task :
    <select id="t_task"></select>
    Date :
    <input type="date" id="t_date">
    <button class="btn" onclick="taskLoad()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Phone</th><th>Points</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="t_body"></tbody>
    </table>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    User :
    <select id="u_user"></select>
    <button class="btn" onclick="userLoad()">View</button>

    <table>
      <thead>
        <tr><th>Date</th><th>Points</th><th>Task</th><th>Delete</th></tr>
      </thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

</main>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" data-page="dash">🏠<br>Home</button>
  <button data-page="task">📋<br>Task</button>
  <button data-page="user">👤<br>User</button>
  <button onclick="location.href='task-editor.html'">⚙️<br>Task Editor</button>
</div>

<script type="module">
/* PASSWORD */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);
const today=()=>new Date().toISOString().split("T")[0];

/* DASHBOARD */
async function dashLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));

  d_users.textContent=users.size;

  const from=d_from.value;
  const to=d_to.value||from;
  const useDate=!!from;

  const map={}, votedMap={};

  votes.forEach(v=>{
    const x=v.data();
    if(useDate){
      if(!x.date) return;
      if(x.date<from||x.date>to) return;
    }
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
    votedMap[x.phone]=true;
  });

  let rows=[];
  users.forEach(u=>{
    const p=u.data().phone;
    rows.push({
      name:u.data().name,
      phone:p,
      total:map[p]||0,
      voted:!!votedMap[p]
    });
  });

  if(d_hide0.checked){
    rows=rows.filter(r=> r.voted || r.total>0);
  }

  rows.sort((a,b)=>b.total-a.total);
  dashBody.innerHTML="";
  let sl=0,rank=0,prev=null;

  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
      <tr class="${rank==1?'rank1':rank==2?'rank2':rank==3?'rank3':''}">
        <td>${sl}</td><td>${rank}</td>
        <td>${r.name}</td><td>${r.phone}</td>
        <td>${r.total}</td>
        <td>
          <input id="p_${r.phone}" type="number" style="width:60px">
          <button class="btn add" onclick="addPoint('${r.phone}')">+</button>
        </td>
      </tr>`;
  });
  d_shown.textContent=sl;
}
window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0)return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:today(),source:"admin"
  });
  dashLoad();
};

/* TASK INIT */
async function taskInit(){
  t_task.innerHTML="";
  (await getDocs(collection(db,"tasks"))).forEach(t=>{
    t_task.innerHTML+=`<option value="${t.id}">${t.data().text}</option>`;
  });
}

/* TASK LOAD */
async function taskLoad(){
  if(!t_date.value) return alert("Select date");

  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const map={};

  votes.forEach(v=>{
    const x=v.data();
    if(x.taskId===t_task.value && x.date===t_date.value){
      map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
    }
  });

  t_body.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    t_body.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${p}</td>
        <td>${map[p]||0}</td>
        <td>
          <input id="tp_${p}" type="number" style="width:60px">
          <button class="btn add" onclick="addTaskPoint('${p}')">+</button>
        </td>
      </tr>`;
  });
}
window.addTaskPoint=async(phone)=>{
  const v=Number(document.getElementById("tp_"+phone).value);
  if(v<=0)return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:t_date.value,
    taskId:t_task.value,source:"task-admin"
  });
  taskLoad(); dashLoad();
};

/* USER REPORT */
async function userInit(){
  u_user.innerHTML="";
  (await getDocs(collection(db,"users"))).forEach(u=>{
    u_user.innerHTML+=`<option value="${u.data().phone}">${u.data().name}</option>`;
  });
}
window.userLoad=async()=>{
  const votes=await getDocs(collection(db,"votes"));
  u_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===u_user.value){
      u_body.innerHTML+=`
        <tr>
          <td>${x.date}</td>
          <td>${x.points}</td>
          <td>${x.taskId||"-"}</td>
          <td><button class="btn del" onclick="delVote('${v.id}')">X</button></td>
        </tr>`;
    }
  });
};
window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  userLoad(); dashLoad();
};

/* BOTTOM NAV */
document.querySelectorAll(".bottom-nav button[data-page]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".bottom-nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll("section")
      .forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+b.dataset.page)
      .classList.remove("hidden");
    if(b.dataset.page==="task") taskLoad();
  };
});

/* INIT */
dashLoad(); taskInit(); userInit();
</script>
</body>
</html>
