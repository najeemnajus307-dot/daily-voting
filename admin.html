<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Weekly Bonus Report</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.container{background:#fff;padding:20px;border-radius:12px;max-width:1200px;margin:auto}
h2,h3{text-align:center}
.controls{text-align:center;margin-bottom:12px}
input,button{padding:6px 10px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f3f4f6}
.rank-1{background:#ffe066;font-weight:bold}
.rank-2{background:#dbeafe}
.rank-3{background:#fde68a}
.scroll{max-height:360px;overflow-y:auto;margin-top:8px}
.bonus{background:#16a34a;color:#fff;border:none;padding:4px 8px}
.remove{background:#b91c1c;color:#fff;border:none;padding:4px 8px}
.del{background:#dc2626;color:#fff;border:none;padding:4px 8px}
.total{text-align:right;font-weight:bold;margin-top:6px}
.note{font-size:13px;color:#374151;text-align:center;margin-top:6px}
</style>
</head>

<body>
<div class="container">

<h2>Admin Weekly Bonus Report</h2>

<div class="controls">
  From <input type="date" id="fromDate">
  To <input type="date" id="toDate">
  <button onclick="applyRange()">Apply</button>
  <button onclick="exportExcel()">Export Excel</button>
</div>

<div class="note">
  Bonus applies only for the selected date range (example: 01-01-2026 to 07-01-2026)
</div>

<h3>Summary (Ranking + Weekly Bonus)</h3>
<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Week Points</th>
  <th>Date Range</th>
  <th>Bonus</th>
  <th>Bonus Added On</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<div class="total" id="grandTotal"></div>

<h3>Detailed Votes (Selected Dates)</h3>
<div class="scroll">
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Tasks</th>
  <th>Date</th>
  <th>Delete Vote</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 DELETE PASSWORD (VOTE ONLY) */
const ADMIN_DELETE_PASSWORD = "admin@123";

/* ===== APPLY DATE RANGE ===== */
window.applyRange = async function(){
  const from = fromDate.value;
  const to   = toDate.value;
  if(!from || !to){ alert("Select From & To dates"); return; }

  const snap = await getDocs(collection(db,"votes"));
  let votes=[];
  snap.forEach(d=>{
    let v=d.data();
    if(v.date>=from && v.date<=to){
      votes.push({id:d.id,...v});
    }
  });

  renderDetails(votes);
  await renderSummary(votes, from, to);
};

/* ===== DETAILS ===== */
function renderDetails(votes){
  const body=document.getElementById("details");
  body.innerHTML="";
  votes.forEach(v=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${Object.values(v.tasks).filter(x=>x).length}</td>
      <td>${v.date}</td>
      <td><button class="del" onclick="deleteVote('${v.id}')">X</button></td>
    `;
    body.appendChild(tr);
  });
}

/* ===== SUMMARY + DENSE RANK ===== */
async function renderSummary(votes, from, to){
  let map={};
  votes.forEach(v=>{
    let pts=Object.values(v.tasks).filter(x=>x).length;
    if(!map[v.phone]) map[v.phone]={name:v.name, phone:v.phone, total:0};
    map[v.phone].total+=pts;
  });

  let users=Object.values(map).sort((a,b)=>b.total-a.total);

  // Dense ranking (1,1,2,2,3…)
  let rank=0, prev=null;
  users.forEach(u=>{
    if(prev===null || u.total<prev) rank++;
    u.rank=rank;
    prev=u.total;
  });

  // Fetch weekly bonuses
  const bSnap = await getDocs(collection(db,"weekly_bonus"));
  let bonusMap={};
  bSnap.forEach(b=>{
    let d=b.data();
    bonusMap[d.phone+"_"+d.fromDate+"_"+d.toDate]=d;
  });

  const body=document.getElementById("summary");
  body.innerHTML="";
  let topScore = users.length? users[0].total:0;
  let sum=0;

  users.forEach(u=>{
    sum+=u.total;
    let key = u.phone+"_"+from+"_"+to;
    let b = bonusMap[key];

    let tr=document.createElement("tr");
    tr.className = u.rank<=3?`rank-${u.rank}`:"";
    tr.innerHTML=`
      <td>${u.rank}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.total}</td>
      <td>${from} to ${to}</td>
      <td>
        ${
          u.total===topScore && !b
          ? `<button class="bonus" onclick="addWeeklyBonus('${u.phone}','${from}','${to}')">+10</button>`
          : b
            ? `<button class="remove" onclick="removeWeeklyBonus('${u.phone}','${from}','${to}')">Remove</button>`
            : ""
        }
      </td>
      <td>${b ? b.addedOn : "-"}</td>
    `;
    body.appendChild(tr);
  });

  grandTotal.innerText="TOTAL WEEK POINTS : "+sum;
}

/* ===== WEEKLY BONUS ===== */
window.addWeeklyBonus = async function(phone, from, to){
  const today = new Date().toISOString().slice(0,10);
  const id = phone+"_"+from+"_"+to;

  await setDoc(doc(db,"weekly_bonus",id),{
    phone,
    bonus:10,
    fromDate:from,
    toDate:to,
    addedOn:today
  });
  applyRange();
};

window.removeWeeklyBonus = async function(phone, from, to){
  const id = phone+"_"+from+"_"+to;
  await deleteDoc(doc(db,"weekly_bonus",id));
  applyRange();
};

/* ===== DELETE VOTE (SAFE) ===== */
window.deleteVote = async function(id){
  const pass = prompt("Enter admin password to delete this vote");
  if(pass!==ADMIN_DELETE_PASSWORD){ alert("Wrong password"); return; }
  await deleteDoc(doc(db,"votes",id));
  applyRange();
};

/* ===== EXCEL EXPORT ===== */
window.exportExcel = function(){
  let rows=[["Rank","Name","Phone","Week Points","Date Range","Bonus","Bonus Added On"]];
  document.querySelectorAll("#summary tr").forEach(tr=>{
    rows.push([...tr.children].map(td=>td.innerText));
  });
  let csv=rows.map(r=>r.join(",")).join("\n");
  let a=document.createElement("a");
  a.href="data:text/csv,"+encodeURIComponent(csv);
  a.download="weekly-bonus-report.csv";
  a.click();
};
</script>
</body>
</html>
