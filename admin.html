<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2,h3{text-align:center}
.box{background:#fff;padding:15px;border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:white}
button{padding:6px 10px;cursor:pointer}
.delBtn{background:#dc2626;color:white;border:none}
.exBtn{background:#16a34a;color:white;border:none}
.small{font-size:12px;color:#555}
.count{text-align:center;font-weight:bold;margin-bottom:10px}
</style>

</head>
<body>

<h2>Admin Voting Dashboard</h2>
<div class="count" id="totalCount">Loading...</div>

<!-- EXPORT -->
<div class="box" style="text-align:center">
  <button class="exBtn" onclick="exportExcel()">⬇ Export Excel</button>
</div>

<!-- USER VOTES -->
<div class="box">
<h3>User Voting Report</h3>
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Votes</th>
  <th>Date</th>
  <th>Points</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="reportBody"></tbody>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let votes = [];
let voteCount = {};

async function load(){
  votes=[];
  voteCount={};

  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    const v={id:d.id,...d.data()};
    votes.push(v);
    voteCount[v.phone]=(voteCount[v.phone]||0)+1;
  });

  totalCount.innerText = "Total Votes : " + votes.length;
  render();
}
load();

/* RENDER */
function render(){
  reportBody.innerHTML="";
  votes.forEach(v=>{
    reportBody.innerHTML+=`
      <tr>
        <td>${v.name}</td>
        <td>${v.phone}</td>
        <td>${voteCount[v.phone]}</td>
        <td>${v.date}</td>
        <td>${v.todayPoints||0}</td>
        <td>
          <button class="delBtn"
            onclick="deleteVote('${v.id}')">Delete</button>
        </td>
      </tr>`;
  });
}

/* DELETE VOTE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  load();
};

/* EXPORT EXCEL */
window.exportExcel = ()=>{
  const data = votes.map(v=>({
    Name:v.name,
    Phone:v.phone,
    Date:v.date,
    Points:v.todayPoints||0
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Votes");

  XLSX.writeFile(wb, "Voting_Report.xlsx");
};
</script>

</body>
</html>
