<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:15px;
}
h2{text-align:center}

.top{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}
.box{
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.15);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{
  background:#2563eb;
  color:#fff;
}

.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

input[type=number]{width:60px;padding:4px}
button{
  padding:5px 8px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.add{background:#16a34a;color:#fff}
.clear{background:#6b7280;color:#fff}
.export{background:#0284c7;color:#fff}

label{font-size:14px}
</style>
</head>

<body>

<h2>Admin Dashboard – Faith & Fitness</h2>

<div class="top">
  <div class="box">Total Users: <b id="totalUsers">0</b></div>
  <div class="box">Shown Users: <b id="shownUsers">0</b></div>
</div>

<div class="box">
  <b>Date Filter (Optional)</b><br><br>

  From:
  <input type="date" id="from" onchange="load()">
  To:
  <input type="date" id="to" onchange="load()">

  <button class="clear" onclick="clearFilter()">Clear</button>
  <button class="export" onclick="exportCSV()">Export CSV</button>

  <br><br>

  <label>
    <input type="checkbox" id="hideZero" onchange="load()">
    Hide users with 0 points
  </label>
</div>

<br>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
  <th>SL No</th>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Add</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN CHECK */
if(prompt("Admin password") !== "1"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

let CURRENT_ROWS = [];

/* 📊 LOAD DASHBOARD (JS DATE FILTER ONLY) */
window.load = async ()=>{
  tbody.innerHTML = "";
  CURRENT_ROWS = [];

  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  totalUsers.innerText = usersSnap.size;

  /* 🧮 Build vote map */
  const voteMap = {};

  votesSnap.forEach(d=>{
    const v = d.data();

    // JS date filter (SAFE)
    if(from.value){
      const toDate = to.value || from.value;
      if(v.date < from.value || v.date > toDate) return;
    }

    voteMap[v.phone] =
      (voteMap[v.phone] || 0) + Number(v.points || 0);
  });

  /* 👥 Build rows for ALL users */
  usersSnap.forEach(u=>{
    const data = u.data();
    CURRENT_ROWS.push({
      name: data.name,
      phone: data.phone,
      total: voteMap[data.phone] || 0
    });
  });

  /* 🚫 Hide zero points if checked */
  if(hideZero.checked){
    CURRENT_ROWS = CURRENT_ROWS.filter(r=>r.total>0);
  }

  /* 🔽 Sort by points (HIGH → LOW) */
  CURRENT_ROWS.sort((a,b)=>b.total - a.total);

  let rank = 0;
  let prev = null;
  let shown = 0;

  CURRENT_ROWS.forEach((r,i)=>{
    if(prev === null || r.total < prev) rank++;
    prev = r.total;
    shown++;

    const tr = document.createElement("tr");
    tr.className =
      rank===1 ? "rank1" :
      rank===2 ? "rank2" :
      rank===3 ? "rank3" : "";

    tr.innerHTML = `
      <td>${shown}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input type="number" id="p_${r.phone}">
        <button class="add" onclick="addPoint('${r.phone}')">+</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  shownUsers.innerText = shown;
};

load();

/* ➕ ADMIN ADD POINT */
window.addPoint = async(phone)=>{
  const val = Number(document.getElementById("p_"+phone).value);
  if(val <= 0){
    alert("Enter valid points");
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone,
    points: val,
    date: new Date().toISOString().split("T")[0],
    source: "admin"
  });

  load();
};

/* 🧹 CLEAR FILTER */
window.clearFilter = ()=>{
  from.value="";
  to.value="";
  load();
};

/* 📤 EXPORT CSV (FROM CURRENT_ROWS) */
window.exportCSV = ()=>{
  if(CURRENT_ROWS.length === 0){
    alert("No data to export");
    return;
  }

  let csv = "SL No,Rank,Name,Phone,Total Points\n";
  let rank = 0;
  let prev = null;

  CURRENT_ROWS.forEach((r,i)=>{
    if(prev === null || r.total < prev) rank++;
    prev = r.total;

    csv += `${i+1},${rank},"${r.name}","${r.phone}",${r.total}\n`;
  });

  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "faith_fitness_report.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>

</body>
</html>
