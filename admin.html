<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
h2{text-align:center;}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#16a34a;
  color:white;
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Tasks</th>
      <th>Date</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, getDocs, collection }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN ONLY */
const ADMIN_PHONE = "7994302567";
if(sessionStorage.getItem("phone") !== ADMIN_PHONE){
  alert("Access denied");
  location.href="vote.html";
}

/* FIREBASE */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* LOAD VOTES */
const snap = await getDocs(collection(db,"votes"));
snap.forEach(docu=>{
  const v = docu.data();
  data.innerHTML += `
    <tr>
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${v.tasks.join(", ")}</td>
      <td>${v.date}</td>
      <td><b>${v.points}</b></td>
    </tr>
  `;
});
</script>

</body>
</html>
