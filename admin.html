<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  padding-bottom:70px;
}
.main{padding:16px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{
  background:var(--card);
  padding:12px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12)
}
.hidden{display:none}

table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;font-size:14px;text-align:center}
th{background:var(--pri);color:#fff}

.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}

.admin-bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;
  display:flex;justify-content:space-around;
  padding:8px 0;
}
.admin-bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.admin-bottom-nav button.active{color:#fff}
</style>
</head>

<body>

<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="hrow">
    <div class="card">Users: <b id="d_users">0</b></div>
    <div class="card">Shown: <b id="d_shown">0</b></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th><th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">
  <div class="card">
    <h3>Task-wise Report</h3>
    <button class="btn" onclick="taskLoad()">View</button>
  </div>

  <div class="card">
    <h4>Voted Users</h4>
    <table>
      <thead><tr><th>Name</th><th>Phone</th></tr></thead>
      <tbody id="t_voted"></tbody>
    </table>
  </div>

  <div class="card">
    <h4>Not Voted</h4>
    <table>
      <thead><tr><th>Name</th><th>Phone</th></tr></thead>
      <tbody id="t_not"></tbody>
    </table>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    User:
    <select id="u_user"></select>
    <button class="btn" onclick="userLoad()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr>
      </thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

</main>

<!-- BOTTOM NAV -->
<div class="admin-bottom-nav">
  <button class="active" onclick="showPage('dash',this)">🏠<br>Dash</button>
  <button onclick="showPage('task',this)">📊<br>Tasks</button>
  <button onclick="showPage('user',this)">👤<br>User</button>
</div>

<script type="module">
if(prompt("Admin password")!=="5") location.replace("index.html");

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

window.showPage=(p,btn)=>{
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById("page-"+p).classList.remove("hidden");
  document.querySelectorAll(".admin-bottom-nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
};

const today=()=>new Date().toISOString().split("T")[0];

async function dashLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));

  d_users.innerText=users.size;
  const map={};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    const p=u.data().phone;
    rows.push({name:u.data().name,phone:p,total:map[p]||0});
  });

  rows.sort((a,b)=>b.total-a.total);
  dashBody.innerHTML="";
  let rank=0,prev=null,sl=0;

  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
      <tr>
        <td>${sl}</td>
        <td>${rank}</td>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.total}</td>
        <td>
          <input id="p_${r.phone}" type="number" style="width:50px">
          <button class="btn add" onclick="addPoint('${r.phone}')">+</button>
        </td>
      </tr>`;
  });
  d_shown.innerText=sl;
}
window.dashLoad=dashLoad;

window.addPoint=async(phone)=>{
  const v=+document.getElementById("p_"+phone).value;
  if(v<=0) return;
  await addDoc(collection(db,"votes"),{phone,points:v,date:today(),source:"admin"});
  dashLoad();
};

window.taskLoad=async()=>{
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const voted={};
  votes.forEach(v=>voted[v.data().phone]=true);

  t_voted.innerHTML=""; t_not.innerHTML="";
  users.forEach(u=>{
    if(voted[u.data().phone]){
      t_voted.innerHTML+=`<tr><td>${u.data().name}</td><td>${u.data().phone}</td></tr>`;
    }else{
      t_not.innerHTML+=`<tr><td>${u.data().name}</td><td>${u.data().phone}</td></tr>`;
    }
  });
};

window.userLoad=async()=>{
  const phone=u_user.value;
  const votes=await getDocs(collection(db,"votes"));
  u_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone){
      u_body.innerHTML+=`
        <tr>
          <td>${x.date}</td>
          <td>${x.points}</td>
          <td>${x.source||"user"}</td>
          <td><button class="btn del" onclick="delVote('${v.id}')">X</button></td>
        </tr>`;
    }
  });
};

window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  userLoad(); dashLoad();
};

(async ()=>{
  dashLoad();
  const users=await getDocs(collection(db,"users"));
  u_user.innerHTML="";
  users.forEach(d=>{
    u_user.innerHTML+=`<option value="${d.data().phone}">${d.data().name}</option>`;
  });
})();
</script>

</body>
</html>
