<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.wrap{display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{
  width:220px;background:#0f172a;color:#fff;padding:12px;
}
.brand{font-weight:bold;text-align:center;margin:8px 0 16px}
.nav a{
  display:block;color:#cbd5f5;text-decoration:none;
  padding:10px;border-radius:6px;margin:4px 0;cursor:pointer;
}
.nav a.active,.nav a:hover{background:#1e293b;color:#fff}

/* ===== MAIN ===== */
.main{flex:1;padding:16px;padding-bottom:80px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{
  background:var(--card);padding:12px;border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12)
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
th{background:var(--pri);color:#fff}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select{padding:6px}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;width:100%;
  background:#0f172a;
  display:flex;
  justify-content:space-around;
  padding:6px 0;
  z-index:1000;
}
.bottom-nav button{
  background:none;border:none;
  color:#cbd5f5;font-size:12px;cursor:pointer;
}
.bottom-nav button.active{
  color:#fff;font-weight:bold;
}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){
  .sidebar{display:none}
}
</style>
</head>

<body>
<div class="wrap">

<!-- SIDEBAR (Desktop) -->
<aside class="sidebar">
  <div class="brand">FAITH & FITNESS<br>ADMIN</div>
  <div class="nav">
    <a data-page="dash" class="active">Dashboard</a>
    <a data-page="task">Task Report</a>
    <a data-page="user">User Report</a>
    <a onclick="location.href='task-editor.html'">Task Editor</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="hrow">
    <div class="card">Users: <b id="d_users">0</b></div>
    <div class="card">Shown: <b id="d_shown">0</b></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th>
          <th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">
  <div class="card">
    <h3>Task-wise Report</h3>
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Points</th></tr></thead>
      <tbody id="t_body"></tbody>
    </table>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    <h3>User-wise Report</h3>
    <select id="u_user"></select>
    <button class="btn" onclick="userLoad()">View</button>
    <table>
      <thead><tr><th>Date</th><th>Points</th><th>Delete</th></tr></thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

</main>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" data-page="dash">🏠<br>Home</button>
  <button data-page="task">📋<br>Task</button>
  <button data-page="user">👤<br>User</button>
</div>

<script type="module">
/* ADMIN PASSWORD */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* DATE */
const today=()=>new Date().toISOString().split("T")[0];

/* DASHBOARD */
async function dashLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  d_users.textContent=users.size;

  const map={};
  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    rows.push({
      name:u.data().name,
      phone:u.data().phone,
      total:map[u.data().phone]||0
    });
  });

  rows.sort((a,b)=>b.total-a.total);
  dashBody.innerHTML="";
  let sl=0,rank=0,prev=null;

  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
      <tr class="${rank==1?'rank1':rank==2?'rank2':rank==3?'rank3':''}">
        <td>${sl}</td><td>${rank}</td>
        <td>${r.name}</td><td>${r.phone}</td>
        <td>${r.total}</td>
        <td>
          <input id="p_${r.phone}" type="number" style="width:60px">
          <button class="btn add" onclick="addPoint('${r.phone}')">+</button>
        </td>
      </tr>`;
  });
  d_shown.textContent=sl;
}
window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0)return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:today()
  });
  dashLoad();
};

/* TASK REPORT */
async function taskLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const map={};
  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });
  t_body.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    if(map[p]){
      t_body.innerHTML+=`
        <tr><td>${u.data().name}</td>
        <td>${p}</td><td>${map[p]}</td></tr>`;
    }
  });
}

/* USER REPORT */
async function userInit(){
  u_user.innerHTML="";
  (await getDocs(collection(db,"users"))).forEach(u=>{
    u_user.innerHTML+=`
      <option value="${u.data().phone}">
        ${u.data().name}
      </option>`;
  });
}
window.userLoad=async()=>{
  const phone=u_user.value;
  const votes=await getDocs(collection(db,"votes"));
  u_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone){
      u_body.innerHTML+=`
        <tr>
          <td>${x.date}</td>
          <td>${x.points}</td>
          <td><button class="btn del" onclick="delVote('${v.id}')">X</button></td>
        </tr>`;
    }
  });
};
window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  userLoad(); dashLoad();
};

/* BOTTOM NAV */
document.querySelectorAll(".bottom-nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".bottom-nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll("section")
      .forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+b.dataset.page)
      .classList.remove("hidden");
    if(b.dataset.page==="task") taskLoad();
  };
});

/* INIT */
dashLoad(); userInit();
</script>
</body>
</html>
