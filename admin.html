<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
h2,h3{text-align:center;}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  margin-bottom:20px;
}
.controls{
  text-align:center;
  margin-bottom:10px;
}
input,select,button{
  padding:6px;
  margin:3px;
}
button{cursor:pointer;}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047;}
.rank2{background:#e5e7eb;}
.rank3{background:#fcd34d;}
.delBtn{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
}
.saveBtn{
  background:#16a34a;
  color:white;
  border:none;
  padding:4px 8px;
}
.count{
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}
.summary{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.summary .card{
  background:#f8fafc;
  padding:10px 14px;
  border-radius:8px;
  min-width:160px;
  text-align:center;
  box-shadow:0 0 6px rgba(0,0,0,.1);
}
.editInp{
  width:95%;
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<div class="count" id="totalCount">Total Voters: Loading...</div>

<!-- DATE FILTER -->
<div class="box controls">
  From <input type="date" id="fromDate">
  To <input type="date" id="toDate">
  <button onclick="applyFilter()">Apply</button>
  <button onclick="resetFilter()">Reset</button>
</div>

<!-- SUMMARY -->
<div class="box">
  <h3>Summary</h3>
  <div class="controls">
    <select id="summaryType" onchange="renderSummary()">
      <option value="daily">Daily</option>
      <option value="monthly">Monthly</option>
    </select>
  </div>
  <div class="summary" id="summaryCards"></div>
</div>

<!-- TOP 3 RANK -->
<div class="box">
  <h3>Top 3 Ranking</h3>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- ALL VOTING REPORT -->
<div class="box">
  <h3>All Voting Report (High → Low)</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];
let filteredVotes = [];

/* LOAD VOTES */
async function loadVotes(){
  allVotes = [];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    allVotes.push({ id:d.id, ...d.data() });
  });

  document.getElementById("totalCount").innerText =
    "Total Voters : " + allVotes.length;

  filteredVotes = [...allVotes];
  renderAll(filteredVotes);
}
loadVotes();

/* DATE FILTER */
window.applyFilter = ()=>{
  const from = fromDate.value;
  const to = toDate.value;

  filteredVotes = allVotes.filter(v=>{
    if(from && v.date < from) return false;
    if(to && v.date > to) return false;
    return true;
  });

  renderAll(filteredVotes);
};
window.resetFilter = ()=>{
  fromDate.value="";
  toDate.value="";
  filteredVotes = [...allVotes];
  renderAll(filteredVotes);
};

/* RENDER ALL */
function renderAll(votes){
  rankBody.innerHTML="";
  reportBody.innerHTML="";
  summaryCards.innerHTML="";

  if(votes.length===0){
    summaryCards.innerHTML="<p>No votes</p>";
    return;
  }

  const sorted = [...votes].sort((a,b)=>b.totalPoints - a.totalPoints);
  renderRank(sorted);
  renderReport(sorted);
  renderSummary();
}

/* TOP 3 RANK */
function renderRank(votes){
  let rank=0,last=null;
  votes.forEach(v=>{
    if(v.totalPoints!==last){
      rank++;
      last=v.totalPoints;
    }
    if(rank>3) return;

    const cls=rank===1?"rank1":rank===2?"rank2":"rank3";
    rankBody.innerHTML+=`
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${v.name||"-"}</td>
        <td>${v.phone||"-"}</td>
        <td>${v.totalPoints}</td>
      </tr>`;
  });
}

/* FULL REPORT WITH EDIT */
function renderReport(votes){
  votes.forEach(v=>{
    reportBody.innerHTML+=`
      <tr>
        <td><input class="editInp" id="name_${v.id}" value="${v.name||""}"></td>
        <td><input class="editInp" id="phone_${v.id}" value="${v.phone||""}"></td>
        <td>${v.totalPoints}</td>
        <td>${v.date}</td>
        <td>
          <button class="saveBtn" onclick="updateUser('${v.id}')">Save</button>
          <button class="delBtn" onclick="deleteVote('${v.id}')">Delete</button>
        </td>
      </tr>`;
  });
}

/* UPDATE NAME & PHONE ONLY */
window.updateUser = async (id)=>{
  const name = document.getElementById("name_"+id).value.trim();
  const phone = document.getElementById("phone_"+id).value.trim();

  if(!name || !phone){
    alert("Name & Phone required");
    return;
  }

  await updateDoc(doc(db,"votes",id),{
    name:name,
    phone:phone
  });

  alert("User details updated ✅");
};

/* DELETE VOTE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  loadVotes();
};

/* SUMMARY (NO EMPTY DATES) */
window.renderSummary = ()=>{
  const type = summaryType.value;
  summaryCards.innerHTML="";
  const map={};

  filteredVotes.forEach(v=>{
    const key = type==="daily" ? v.date : v.date.slice(0,7);
    if(!map[key]) map[key]={voters:0,points:0};
    map[key].voters++;
    map[key].points+=v.totalPoints||0;
  });

  Object.keys(map).sort().forEach(k=>{
    if(map[k].voters===0) return;
    summaryCards.innerHTML+=`
      <div class="card">
        <b>${k}</b><br>
        Voters: ${map[k].voters}<br>
        Points: ${map[k].points}
      </div>`;
  });

  if(summaryCards.innerHTML===""){
    summaryCards.innerHTML="<p>No data</p>";
  }
};
</script>

</body>
</html>
