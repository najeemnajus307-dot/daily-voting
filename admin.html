<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  max-width:1100px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
h2{
  text-align:center;
}

/* controls */
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}
input,button{
  padding:6px 10px;
  font-size:14px;
}
button{
  cursor:pointer;
}

/* table */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f3f4f6;
}

.total{
  margin-top:10px;
  font-weight:bold;
  text-align:right;
}

.logout{
  background:#dc2626;
  color:white;
  border:none;
  padding:6px 12px;
  float:right;
}
</style>
</head>

<body>

<!-- 🔐 ADMIN LOGIN CHECK -->
<script>
let role = localStorage.getItem("adminRole");
if(!role){
  window.location.replace("admin-login.html");
}
</script>

<div class="box">
  <button class="logout" onclick="logout()">Logout</button>
  <h2>Admin Voting Report</h2>

  <!-- DATE FILTER -->
  <div class="controls">
    <input type="date" id="from">
    <input type="date" id="to">
    <button onclick="loadData()">Apply Filter</button>
    <button onclick="exportDateWise()">Date-wise Excel</button>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks Done</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="total" id="totalBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("tbody");
const totalBox = document.getElementById("totalBox");

/* LOAD TABLE DATA */
window.loadData = async function(){
  tbody.innerHTML="";
  totalBox.innerText="";

  let from = document.getElementById("from").value;
  let to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));

  let totalVotes = 0;

  snap.forEach(d=>{
    let v = d.data();
    let date = v.date;

    if(from && date < from) return;
    if(to && date > to) return;

    let taskCount = Object.values(v.tasks).filter(t=>t).length;
    totalVotes += taskCount;

    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${taskCount}</td>
      <td>${date}</td>
    `;
    tbody.appendChild(tr);
  });

  totalBox.innerText = "TOTAL VOTES : " + totalVotes;
};

/* DATE-WISE EXCEL (SAME FILTER) */
window.exportDateWise = async function(){
  let from = document.getElementById("from").value;
  let to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));

  let dateMap = {}; // date → total votes

  snap.forEach(d=>{
    let v = d.data();
    let date = v.date;

    if(from && date < from) return;
    if(to && date > to) return;

    let taskCount = Object.values(v.tasks).filter(t=>t).length;
    dateMap[date] = (dateMap[date] || 0) + taskCount;
  });

  let rows = [["Date","Total Votes"]];
  Object.keys(dateMap).sort().forEach(d=>{
    rows.push([d, dateMap[d]]);
  });

  let csv = rows.map(r=>r.join(",")).join("\n");
  let blob = new Blob([csv], {type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "date_wise_vote_report.csv";
  a.click();
};

/* LOGOUT */
window.logout = function(){
  localStorage.removeItem("adminRole");
  window.location.replace("admin-login.html");
};

/* AUTO LOAD ALL DATA */
loadData();
</script>

</body>
</html>
