<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9;
  --card:#fff;
  --pri:#2563eb;
  --ok:#16a34a;
  --bad:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
}
.wrap{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#0f172a;
  color:#fff;
  padding:12px;
}
.brand{
  font-weight:bold;
  text-align:center;
  margin:8px 0 16px;
}
.nav a{
  display:block;
  color:#cbd5f5;
  text-decoration:none;
  padding:10px;
  border-radius:6px;
  margin:4px 0;
  cursor:pointer;
}
.nav a.active,
.nav a:hover{
  background:#1e293b;
  color:#fff;
}

/* MAIN */
.main{
  flex:1;
  padding:16px;
}
.hrow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.card{
  background:var(--card);
  padding:12px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12);
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{
  background:var(--pri);
  color:#fff;
}
.btn{
  border:none;
  border-radius:6px;
  padding:6px 10px;
  cursor:pointer;
}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select,textarea{
  padding:6px;
  width:100%;
}

@media(max-width:700px){
  .wrap{flex-direction:column}
  .sidebar{width:100%}
}
</style>
</head>

<body>
<div class="wrap">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">FAITH & FITNESS<br>ADMIN</div>
  <div class="nav">
    <a data-page="dash" class="active">Dashboard</a>
    <a data-page="task">Task-wise Report</a>
    <a data-page="user">User-wise Report</a>
    <a data-page="notify">🔔 Notifications</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="hrow">
    <div class="card">Users: <b id="d_users">0</b></div>
    <div class="card">Shown: <b id="d_shown">0</b></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th>
          <th>Rank</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Total</th>
          <th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">
  <div class="card">
    <select id="t_task"></select>
    <button class="btn add" onclick="taskLoad()">View</button>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Points</th></tr>
      </thead>
      <tbody id="t_voted"></tbody>
    </table>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    <select id="u_user"></select>
    <button class="btn add" onclick="userLoad()">View</button>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr>
      </thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

<!-- NOTIFICATION -->
<section id="page-notify" class="hidden">
  <div class="card">
    <h3>🔔 Notification Settings</h3>

    <label>
      <input type="checkbox" id="n_enable"> Enable Reminder
    </label><br><br>

    <label>Message</label>
    <textarea id="n_message" rows="3">
You haven't voted yet. Please vote now 🙏
    </textarea><br><br>

    <label>Reminder Gap</label>
    <select id="n_gap">
      <option value="2">Every 2 Hours</option>
      <option value="4">Every 4 Hours</option>
      <option value="6">Every 6 Hours</option>
    </select><br><br>

    <button class="btn add" onclick="saveNotification()">Save</button>
    <div id="n_status"></div>
  </div>
</section>

</main>
</div>

<script type="module">
/* ADMIN PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc,
  deleteDoc, doc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* NAV */
document.querySelectorAll(".nav a").forEach(a=>{
  a.onclick=()=>{
    document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+a.dataset.page).classList.remove("hidden");
  }
});

/* NOTIFICATION SAVE */
window.saveNotification=async()=>{
  await setDoc(doc(db,"settings","notification"),{
    enabled:n_enable.checked,
    message:n_message.value,
    gap:Number(n_gap.value),
    updatedAt:new Date().toISOString()
  });
  n_status.innerHTML="✅ Saved successfully";
};
</script>

</body>
</html>
