<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Voting & Weekly Bonus</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{background:#fff;max-width:1200px;margin:auto;padding:20px;border-radius:10px}
h2{text-align:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f3f4f6}
.rank1{background:#fde68a}
.rank2{background:#dbeafe}
.rank3{background:#fef3c7}
button{padding:5px 10px;cursor:pointer;border:none;border-radius:4px}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<div class="box">

<h2>Admin – Voting & Weekly Bonus</h2>

From <input type="date" id="from">
To <input type="date" id="to">
<button onclick="applyFilter()">Apply</button>

<p class="small">
Bonus applies only to Rank-1 users (tie allowed).  
Ranking is based on <b>Week Points only</b>.
</p>

<h3>Summary (Dense Ranking + Weekly Bonus)</h3>
<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Phone</th>
<th>Week Points</th>
<th>Date Range</th>
<th>Total (with Bonus)</th>
<th>Bonus</th>
<th>Bonus Added On</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<h3>Detailed Votes</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Tasks</th>
<th>Date</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.firebasestorage.app",
  messagingSenderId: "1065830068376",
  appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];
const ADMIN_DELETE_PASS = "1234"; // 🔐 delete password

// LOAD ALL VOTES
const snap = await getDocs(collection(db,"votes"));
snap.forEach(d=> allVotes.push({id:d.id, ...d.data()}));

window.applyFilter = async function(){
  const f = from.value;
  const t = to.value;
  if(!f || !t) return alert("Select dates");

  let filtered = allVotes.filter(v=>v.date>=f && v.date<=t);

  renderDetails(filtered);
  await renderSummary(filtered, f, t);
};

// 🔹 SUMMARY
async function renderSummary(data, f, t){
  let map = {};

  data.forEach(v=>{
    if(!map[v.phone]){
      map[v.phone] = {name:v.name, phone:v.phone, total:0};
    }
    map[v.phone].total += Number(v.tasks);
  });

  let arr = Object.values(map).sort((a,b)=>b.total-a.total);

  // ✅ DENSE RANKING (NO BONUS)
  let rank=0, prev=null;
  arr.forEach(u=>{
    if(u.total!==prev){ rank++; prev=u.total; }
    u.rank = rank;
  });

  summary.innerHTML="";

  for(let u of arr){
    let bonusDoc = await getDoc(doc(db,"bonus",`${u.phone}_${f}_${t}`));
    let bonus = bonusDoc.exists() ? bonusDoc.data() : null;
    let bonusPts = bonus ? bonus.bonus : 0;
    let displayTotal = u.total + bonusPts;

    let tr=document.createElement("tr");
    if(u.rank===1) tr.className="rank1";
    if(u.rank===2) tr.className="rank2";
    if(u.rank===3) tr.className="rank3";

    tr.innerHTML=`
<td>${u.rank}</td>
<td>${u.name}</td>
<td>${u.phone}</td>
<td>${u.total}</td>
<td>${f} to ${t}</td>
<td>${displayTotal}</td>
<td>
${u.rank===1 && !bonus ? `<button class="green" onclick="addBonus('${u.phone}',${u.total},'${f}','${t}')">+10</button>` : ""}
${bonus ? `<button class="red" onclick="removeBonus('${u.phone}','${f}','${t}')">Remove</button>` : ""}
</td>
<td>${bonus ? bonus.date : "-"}</td>`;
    summary.appendChild(tr);
  }
}

// 🔹 DETAILS
function renderDetails(data){
  details.innerHTML="";
  data.forEach(v=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
<td>${v.name}</td>
<td>${v.phone}</td>
<td>${v.tasks}</td>
<td>${v.date}</td>
<td><button class="red" onclick="deleteVote('${v.id}')">X</button></td>`;
    details.appendChild(tr);
  });
}

// 🔐 DELETE VOTE
window.deleteVote = async function(id){
  let p = prompt("Enter delete password");
  if(p!==ADMIN_DELETE_PASS) return alert("Wrong password");
  await deleteDoc(doc(db,"votes",id));
  alert("Vote deleted. Reload page.");
};

// ➕ BONUS
window.addBonus = async function(phone,pts,f,t){
  await setDoc(doc(db,"bonus",`${phone}_${f}_${t}`),{
    phone, bonus:10, date:new Date().toISOString().split("T")[0]
  });
  applyFilter();
};

// ➖ REMOVE BONUS
window.removeBonus = async function(phone,f,t){
  await deleteDoc(doc(db,"bonus",`${phone}_${f}_${t}`));
  applyFilter();
};
</script>
</body>
</html>
