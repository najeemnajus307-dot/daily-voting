<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
h2,h3{text-align:center;}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  margin-bottom:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047;}
.rank2{background:#e5e7eb;}
.rank3{background:#fcd34d;}
.delBtn{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}
.count{
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<div class="count" id="totalCount">Total Voters: Loading...</div>

<!-- 📅 DATE FILTER -->
<div class="box">
  <h3>Date Filter</h3>
  From <input type="date" id="fromDate">
  To <input type="date" id="toDate">
  <button onclick="applyFilter()">Apply</button>
</div>

<!-- 🏆 TOP 3 RANK -->
<div class="box">
  <h3>Top 3 Ranking</h3>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- 📋 ALL VOTING REPORT -->
<div class="box">
  <h3>All Voting Report (High → Low Points)</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];

/* LOAD VOTES */
async function loadVotes(){
  allVotes = [];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    allVotes.push({ id:d.id, ...d.data() });
  });

  document.getElementById("totalCount").innerText =
    "Total Voters : " + allVotes.length;

  renderAll(allVotes);
}

loadVotes();

/* DATE FILTER */
window.applyFilter = ()=>{
  const from = document.getElementById("fromDate").value;
  const to   = document.getElementById("toDate").value;

  let filtered = allVotes;
  if(from) filtered = filtered.filter(v=>v.date >= from);
  if(to)   filtered = filtered.filter(v=>v.date <= to);

  renderAll(filtered);
};

/* RENDER BOTH SECTIONS */
function renderAll(votes){
  if(votes.length === 0){
    document.getElementById("rankBody").innerHTML="";
    document.getElementById("reportBody").innerHTML="";
    return;
  }

  // sort by points desc
  votes = [...votes].sort((a,b)=>b.totalPoints - a.totalPoints);

  renderRank(votes);
  renderReport(votes);
}

/* 🏆 TOP 3 RANK */
function renderRank(votes){
  const tbody = document.getElementById("rankBody");
  tbody.innerHTML="";

  let rank=0, lastPoints=null;

  for(const v of votes){
    if(v.totalPoints !== lastPoints){
      rank++;
      lastPoints = v.totalPoints;
    }
    if(rank>3) break;

    let cls = rank===1?"rank1":rank===2?"rank2":"rank3";

    tbody.innerHTML += `
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${v.name || "-"}</td>
        <td>${v.phone || "-"}</td>
        <td>${v.totalPoints}</td>
      </tr>
    `;
  }
}

/* 📋 FULL REPORT (WITH DELETE) */
function renderReport(votes){
  const tbody = document.getElementById("reportBody");
  tbody.innerHTML="";

  votes.forEach(v=>{
    tbody.innerHTML += `
      <tr>
        <td>${v.name || "-"}</td>
        <td>${v.phone || "-"}</td>
        <td>${v.totalPoints}</td>
        <td>${v.date}</td>
        <td>
          <button class="delBtn"
            onclick="deleteVote('${v.id}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* DELETE USER VOTE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete this user vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  alert("Vote deleted");
  loadVotes();
};
</script>

</body>
</html>
