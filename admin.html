<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin – Voting & Weekly Bonus</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:1200px;
  margin:auto;
}
h2,h3{text-align:center}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#f3f4f6}

.rank1{background:#fde68a}
.rank2{background:#dbeafe}
.rank3{background:#fde68a}

button{
  padding:5px 10px;
  border:none;
  cursor:pointer;
  border-radius:4px;
}
.bonus{background:#16a34a;color:#fff}
.remove{background:#dc2626;color:#fff}
.delete{background:#ef4444;color:#fff}

.controls{
  text-align:center;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>Admin – Voting & Weekly Bonus</h2>

<div class="controls">
  From <input type="date" id="from">
  To <input type="date" id="to">
  <button onclick="applyFilter()">Apply</button>
  <button onclick="exportExcel()">Export Excel</button>
</div>

<h3>Summary (Dense Ranking + Weekly Bonus)</h3>
<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Week Points</th>
  <th>Date Range</th>
  <th>Bonus</th>
  <th>Bonus Added On</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<h3>Detailed Votes</h3>
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Tasks</th>
  <th>Date</th>
  <th>Delete</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let votes = [];
let bonuses = {};

async function loadData(){
  votes=[];
  bonuses={};

  const vSnap = await getDocs(collection(db,"votes"));
  vSnap.forEach(d=>votes.push({id:d.id,...d.data()}));

  const bSnap = await getDocs(collection(db,"weekly_bonus"));
  bSnap.forEach(d=>bonuses[d.id]=d.data());
}
await loadData();

window.applyFilter = function(){
  let from = fromInput.value;
  let to = toInput.value;
  if(!from||!to){alert("Select dates");return;}
  render(from,to);
};

const fromInput=document.getElementById("from");
const toInput=document.getElementById("to");
const summary=document.getElementById("summary");
const details=document.getElementById("details");

function render(from,to){
  summary.innerHTML="";
  details.innerHTML="";

  let filtered = votes.filter(v=>v.date>=from && v.date<=to);

  // DETAILS
  filtered.forEach(v=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${Object.values(v.tasks).filter(x=>x).length}</td>
      <td>${v.date}</td>
      <td><button class="delete" onclick="deleteVote('${v.id}')">X</button></td>
    `;
    details.appendChild(tr);
  });

  // SUMMARY
  let map={};
  filtered.forEach(v=>{
    let pts=Object.values(v.tasks).filter(x=>x).length;
    if(!map[v.phone]){
      map[v.phone]={name:v.name,phone:v.phone,total:0};
    }
    map[v.phone].total+=pts;
  });

  let arr=Object.values(map).sort((a,b)=>b.total-a.total);

  // Dense ranking
  let rank=0,prev=null;
  arr.forEach((u,i)=>{
    if(u.total!==prev){rank=i+1;prev=u.total;}
    u.rank=rank;
  });

  let keyRange=`${from}_${to}`;
  let topScore=arr.length?arr[0].total:0;

  arr.forEach(u=>{
    let bKey=u.phone+"_"+keyRange;
    let b=bonuses[bKey];
    let bonusPts=b?b.bonus:0;
    let finalTotal=u.total+bonusPts;

    let tr=document.createElement("tr");
    tr.className=u.rank<=3?`rank${u.rank}`:"";
    tr.innerHTML=`
      <td>${u.rank}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${finalTotal}</td>
      <td>${from} to ${to}</td>
      <td>
        ${
          u.total===topScore && !b
          ? `<button class="bonus" onclick="addBonus('${u.phone}','${from}','${to}')">+10</button>`
          : b
            ? `<button class="remove" onclick="removeBonus('${u.phone}','${from}','${to}')">Remove</button>`
            : ""
        }
      </td>
      <td>${b?b.addedOn:"-"}</td>
    `;
    summary.appendChild(tr);
  });
}

window.addBonus = async function(phone,from,to){
  let id=phone+"_"+from+"_"+to;
  await setDoc(doc(db,"weekly_bonus",id),{
    phone,
    from,
    to,
    bonus:10,
    addedOn:new Date().toISOString().split("T")[0]
  });
  await loadData();
  render(from,to);
};

window.removeBonus = async function(phone,from,to){
  let id=phone+"_"+from+"_"+to;
  await deleteDoc(doc(db,"weekly_bonus",id));
  await loadData();
  render(from,to);
};

window.deleteVote = async function(id){
  if(!confirm("Delete this vote?"))return;
  await deleteDoc(doc(db,"votes",id));
  await loadData();
  applyFilter();
};

window.exportExcel = function(){
  let rows=[...document.querySelectorAll("table tr")].map(r=>
    [...r.children].map(td=>td.innerText).join(",")
  ).join("\n");
  let blob=new Blob([rows],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="report.csv";
  a.click();
};
</script>

</body>
</html>
