<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:1200px;
  margin:auto;
}
h2,h3{text-align:center}
input,button{
  padding:6px 10px;
  margin:5px;
}
button{cursor:pointer}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#f3f4f6}

.rank1{background:#fde68a;font-weight:bold}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}

.bonus{background:#16a34a;color:#fff;border:none}
.delBonus{background:#dc2626;color:#fff;border:none}
.delVote{background:#991b1b;color:#fff;border:none}

.total{
  text-align:right;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="box">

<h2>Admin Voting Report</h2>

<!-- DATE FILTER -->
From <input type="date" id="fromDate">
To <input type="date" id="toDate">
<button onclick="applyFilter()">Apply Filter</button>
<button onclick="exportExcel()">Export Excel</button>

<!-- SUMMARY -->
<h3>User Summary (Ranking + Bonus)</h3>
<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Bonus</th>
</tr>
</thead>
<tbody id="summaryBody"></tbody>
</table>
<div class="total" id="grandTotal"></div>

<!-- DETAILS -->
<h3>Detailed Votes</h3>
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Tasks</th>
  <th>Date</th>
  <th>Delete</th>
</tr>
</thead>
<tbody id="detailBody"></tbody>
</table>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, deleteDoc, setDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];

/* LOAD DATA */
loadData();
async function loadData(){
  allVotes=[];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>allVotes.push({id:d.id,...d.data()}));
  applyFilter();
}

/* APPLY FILTER */
window.applyFilter = function(){
  let f = fromDate.value;
  let t = toDate.value;

  let filtered = allVotes.filter(v=>{
    return (!f || v.date>=f) && (!t || v.date<=t);
  });

  buildSummary(filtered);
  buildDetails(filtered);
};

/* SUMMARY + BONUS */
async function buildSummary(data){
  let map={};

  data.forEach(v=>{
    let c = Object.values(v.tasks).filter(x=>x).length;
    if(!map[v.phone]){
      map[v.phone]={name:v.name, phone:v.phone, total:0};
    }
    map[v.phone].total += c;
  });

  /* FETCH BONUS */
  const bonusSnap = await getDocs(collection(db,"bonus"));
  let bonusMap={};
  bonusSnap.forEach(b=>{
    let d=b.data();
    bonusMap[d.phone]=b.id;
    if(map[d.phone]) map[d.phone].total += d.points;
  });

  let arr = Object.values(map).sort((a,b)=>b.total-a.total);
  let topScore = arr.length ? arr[0].total : 0;

  let tbody=document.getElementById("summaryBody");
  tbody.innerHTML="";

  let rank=0,last=null,totalAll=0;

  arr.forEach((u,i)=>{
    if(u.total!==last){rank=i+1;last=u.total}
    totalAll+=u.total;

    let tr=document.createElement("tr");
    if(rank===1) tr.className="rank1";
    else if(rank===2) tr.className="rank2";
    else if(rank===3) tr.className="rank3";

    tr.innerHTML=`
      <td>${rank}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.total}</td>
      <td>
        ${
          u.total===topScore && !bonusMap[u.phone]
            ? `<button class="bonus" onclick="addBonus('${u.phone}')">+10</button>`
            : bonusMap[u.phone]
              ? `<button class="delBonus" onclick="removeBonus('${u.phone}')">Remove</button>`
              : ""
        }
      </td>
    `;
    tbody.appendChild(tr);
  });

  grandTotal.innerText="TOTAL POINTS : "+totalAll;
}

/* DETAILS */
function buildDetails(data){
  let body=document.getElementById("detailBody");
  body.innerHTML="";

  data.forEach(v=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${Object.values(v.tasks).filter(x=>x).length}</td>
      <td>${v.date}</td>
      <td><button class="delVote" onclick="delVote('${v.id}')">X</button></td>
    `;
    body.appendChild(tr);
  });
}

/* DELETE VOTE */
window.delVote = async function(id){
  if(confirm("Delete vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

/* ADD BONUS */
window.addBonus = async function(phone){
  let week = getWeekKey(new Date());
  await setDoc(doc(db,"bonus",phone+"_"+week),{
    phone,week,points:10
  });
  alert("Bonus added");
  loadData();
};

/* REMOVE BONUS */
window.removeBonus = async function(phone){
  let week = getWeekKey(new Date());
  if(confirm("Remove bonus?")){
    await deleteDoc(doc(db,"bonus",phone+"_"+week));
    loadData();
  }
};

/* WEEK KEY */
function getWeekKey(d){
  let y=d.getFullYear();
  let w=Math.ceil((((d-new Date(y,0,1))/86400000)+1)/7);
  return y+"-W"+w;
}

/* EXCEL */
window.exportExcel=function(){
  let rows=[["Rank","Name","Phone","Total"]];
  document.querySelectorAll("#summaryBody tr").forEach(tr=>{
    rows.push([...tr.children].slice(0,4).map(td=>td.innerText));
  });
  let csv=rows.map(r=>r.join(",")).join("\n");
  let a=document.createElement("a");
  a.href="data:text/csv,"+encodeURIComponent(csv);
  a.download="admin-summary.csv";
  a.click();
};
</script>

</body>
</html>
