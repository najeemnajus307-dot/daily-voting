<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
h2{text-align:center;margin-bottom:10px}

.summary{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
.card{
  background:#fff;
  padding:12px 18px;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,.15);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}

input{
  width:70px;
  padding:4px;
}
button{
  padding:5px 10px;
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:4px;
}
</style>
</head>

<body>

<h2>Admin Dashboard – Faith & Fitness</h2>

<div class="summary">
  <div class="card">
    <b>Total Users</b><br>
    <span id="userCount">0</span>
  </div>
</div>

<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Add Points</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password") !== "1"){
  location.href="index.html";
}

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD DATA */
async function load(){
  body.innerHTML="";

  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));
  const bonusSnap = await getDocs(collection(db,"bonuses"));

  let users = {};

  usersSnap.forEach(d=>{
    const u = d.data();
    users[u.phone] = {
      name: u.name || "-",
      phone: u.phone,
      points: 0
    };
  });

  votesSnap.forEach(d=>{
    const v = d.data();
    if(users[v.phone]){
      users[v.phone].points += Number(v.points || 0);
    }
  });

  bonusSnap.forEach(d=>{
    const b = d.data();
    if(users[b.phone]){
      users[b.phone].points += Number(b.points || 0);
    }
  });

  const arr = Object.values(users).sort((a,b)=>b.points - a.points);

  userCount.innerText = arr.length;

  let rank = 0;
  let last = null;

  arr.forEach(u=>{
    if(u.points !== last){
      rank++;
      last = u.points;
    }
    if(rank > 3) return;

    const cls =
      rank===1 ? "rank1" :
      rank===2 ? "rank2" :
      "rank3";

    body.innerHTML += `
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.points}</td>
        <td>
          <input id="pt_${u.phone}" type="number" placeholder="+points">
          <button onclick="addPoints('${u.phone}')">Add</button>
        </td>
      </tr>
    `;
  });
}
load();

/* ➕ ADD POINTS BUTTON FUNCTION */
window.addPoints = async (phone)=>{
  const v = Number(document.getElementById("pt_"+phone).value);
  if(v <= 0){
    alert("Enter valid points");
    return;
  }

  if(prompt("Admin password") !== "1"){
    alert("Wrong password");
    return;
  }

  await addDoc(collection(db,"bonuses"),{
    phone: phone,
    points: v,
    createdAt: new Date().toISOString()
  });

  alert("Points added ✅");
  load();
};
</script>

</body>
</html>
