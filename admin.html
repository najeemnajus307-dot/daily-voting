<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2,h3{text-align:center}
.box{
  background:#fff;padding:15px;border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);margin-bottom:20px
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:#fff}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}
button{padding:6px 10px;cursor:pointer}
.save{background:#16a34a;color:#fff;border:none}
.del{background:#dc2626;color:#fff;border:none}
.editInp{width:90%}
.small{font-size:12px;color:#555}
.count{text-align:center;font-weight:bold;margin-bottom:10px}
.summary{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{
  background:#f8fafc;padding:10px;border-radius:8px;
  min-width:160px;text-align:center
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>
<div class="count" id="totalCount">Loading...</div>

<div class="box">
  <h3>Summary (Daily)</h3>
  <div class="summary" id="summaryCards"></div>
</div>

<div class="box">
  <h3>Top 3 Ranking (Life-time Points)</h3>
  <table>
    <thead>
      <tr><th>Rank</th><th>Name</th><th>Phone</th><th>Total Points</th></tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<div class="box">
  <h3>All Voting Report (ADD Points Only)</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Phone</th>
        <th>Add Points</th><th>Date</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  updateDoc, deleteDoc, doc,
  addDoc, query, where
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASS = "1";

let allVotes = [];
let userMap = {}; // phone → lifetime points

/* LOAD USERS (LIFETIME TOTALS) */
async function loadUsers(){
  userMap = {};
  const snap = await getDocs(collection(db,"users"));
  snap.forEach(d=>{
    const u = d.data();
    userMap[u.phone] = u.totalPoints || 0;
  });
}

/* LOAD VOTES */
async function loadVotes(){
  await loadUsers();

  allVotes = [];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>allVotes.push({id:d.id,...d.data()}));

  totalCount.innerText = "Total Voters : " + allVotes.length;
  renderAll();
}
loadVotes();

/* RENDER ALL */
function renderAll(){
  renderSummary();
  renderRank();
  renderReport();
}

/* SUMMARY (DAILY) */
function renderSummary(){
  summaryCards.innerHTML="";
  const map={};
  allVotes.forEach(v=>{
    if(!map[v.date]) map[v.date]={v:0,p:0};
    map[v.date].v++;
    map[v.date].p+=v.todayPoints||0;
  });
  Object.keys(map).sort().forEach(d=>{
    summaryCards.innerHTML+=`
      <div class="card">
        <b>${d}</b><br>
        Voters: ${map[d].v}<br>
        Points: ${map[d].p}
      </div>`;
  });
}

/* TOP 3 RANKING (USERS TOTAL POINTS) */
function renderRank(){
  rankBody.innerHTML="";
  const uniqPhones = {};
  allVotes.forEach(v=>{
    uniqPhones[v.phone]=v.name;
  });

  const arr = Object.keys(uniqPhones).map(p=>({
    phone:p,
    name:uniqPhones[p],
    points:userMap[p]||0
  }));

  arr.sort((a,b)=>b.points-a.points);

  let rank=0,last=null;
  arr.forEach(u=>{
    if(u.points!==last){rank++;last=u.points;}
    if(rank>3) return;
    const cls=rank===1?"rank1":rank===2?"rank2":"rank3";
    rankBody.innerHTML+=`
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.points}</td>
      </tr>`;
  });
}

/* REPORT (ADD POINTS ONLY) */
function renderReport(){
  reportBody.innerHTML="";
  allVotes.forEach(v=>{
    reportBody.innerHTML+=`
      <tr>
        <td><input class="editInp" id="n_${v.id}" value="${v.name}"></td>
        <td><input class="editInp" id="p_${v.id}" value="${v.phone}"></td>
        <td>
          <input class="editInp" id="pt_${v.id}" type="number" placeholder="+ points">
          <div class="small">Current: ${userMap[v.phone]||0}</div>
        </td>
        <td><input class="editInp" id="d_${v.id}" type="date" value="${v.date}"></td>
        <td>
          <button class="save" onclick="saveEdit('${v.id}')">Save</button>
          <button class="del" onclick="deleteVote('${v.id}')">Delete</button>
        </td>
      </tr>`;
  });
}

/* SAVE (AUTO ADD POINTS) */
window.saveEdit = async (id)=>{
  const name=document.getElementById("n_"+id).value.trim();
  const phone=document.getElementById("p_"+id).value.trim();
  const addPt=Number(document.getElementById("pt_"+id).value||0);
  const date=document.getElementById("d_"+id).value;

  if(!name||!phone||!date){alert("Fill all");return;}
  if(prompt("Admin password")!==ADMIN_PASS){alert("Wrong password");return;}

  const old=userMap[phone]||0;
  const newTotal=old+addPt;

  await updateDoc(doc(db,"votes",id),{
    name,phone,date
  });

  const q=query(collection(db,"users"),where("phone","==",phone));
  const snap=await getDocs(q);
  if(snap.empty){
    await addDoc(collection(db,"users"),{
      name,phone,totalPoints:newTotal,password:"1"
    });
  }else{
    snap.forEach(async u=>{
      await updateDoc(doc(db,"users",u.id),{
        name,phone,totalPoints:newTotal
      });
    });
  }

  alert("Points added. New total: "+newTotal);
  loadVotes();
};

/* DELETE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete vote?"))return;
  await deleteDoc(doc(db,"votes",id));
  loadVotes();
};
</script>

</body>
</html>
