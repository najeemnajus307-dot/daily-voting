<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:1200px;
  margin:auto;
}
h2{text-align:center}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#f3f4f6}
.rank1{background:#fff7cc;font-weight:bold}
button{cursor:pointer;padding:5px 10px}
.del{background:#dc2626;color:#fff;border:none}
.bonus{background:#16a34a;color:#fff;border:none}
.top{font-weight:bold;margin-top:10px}
.controls{text-align:center;margin-bottom:10px}
</style>
</head>

<body>
<div class="box">

<h2>Admin Voting Report</h2>

<div class="controls">
  From <input type="date" id="from">
  To <input type="date" id="to">
  <button onclick="applyFilter()">Apply Filter</button>
  <button onclick="exportExcel()">Date-wise Excel</button>
</div>

<h3>User Summary (Total Votes)</h3>
<table id="summary">
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Bonus</th>
</tr>
</table>

<h3>Detailed Votes</h3>
<table id="details">
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Tasks</th>
  <th>Date</th>
  <th>Delete</th>
</tr>
</table>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, deleteDoc, setDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];

/* LOAD */
loadData();

/* 📥 Load Firestore */
async function loadData(){
  allVotes=[];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>allVotes.push({id:d.id,...d.data()}));
  applyFilter();
}

/* 📅 Filter */
function applyFilter(){
  let f = from.value;
  let t = to.value;
  let filtered = allVotes.filter(v=>{
    return (!f || v.date>=f) && (!t || v.date<=t);
  });
  buildSummary(filtered);
  buildDetails(filtered);
}
window.applyFilter = applyFilter;

/* 📊 Summary + Ranking */
async function buildSummary(data){
  let map={};

  data.forEach(v=>{
    if(!map[v.phone]){
      map[v.phone]={name:v.name,phone:v.phone,total:0};
    }
    map[v.phone].total += Object.values(v.tasks).filter(x=>x).length;
  });

  /* BONUS */
  const bSnap = await getDocs(collection(db,"bonus"));
  bSnap.forEach(b=>{
    let d=b.data();
    if(map[d.phone]) map[d.phone].total+=d.points;
  });

  let users=Object.values(map).sort((a,b)=>b.total-a.total);

  let table=document.getElementById("summary");
  table.innerHTML=table.rows[0].outerHTML;

  let rank=0,prev=null;
  users.forEach((u,i)=>{
    if(prev!==u.total){rank=i+1;prev=u.total}
    let tr=document.createElement("tr");
    if(rank===1) tr.className="rank1";

    tr.innerHTML=`
      <td>${rank}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.total}</td>
      <td>${rank===1?
        `<button class="bonus" onclick="addBonus('${u.phone}')">+10</button>`
        :""}
      </td>`;
    table.appendChild(tr);
  });
}

/* 📋 Details */
function buildDetails(data){
  let table=document.getElementById("details");
  table.innerHTML=table.rows[0].outerHTML;

  data.forEach(v=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${Object.values(v.tasks).filter(x=>x).length}</td>
      <td>${v.date}</td>
      <td><button class="del" onclick="delVote('${v.id}')">X</button></td>`;
    table.appendChild(tr);
  });
}

/* ❌ Delete vote */
window.delVote = async function(id){
  if(confirm("Delete vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

/* 🎁 Bonus */
window.addBonus = async function(phone){
  let w = getWeekKey(new Date());
  await setDoc(doc(db,"bonus",phone+"_"+w),{
    phone,week:w,points:10
  });
  alert("Bonus added");
  loadData();
};

/* 📅 Week key */
function getWeekKey(d){
  let y=d.getFullYear();
  let w=Math.ceil((((d-new Date(y,0,1))/86400000)+1)/7);
  return y+"-W"+w;
}

/* 📤 Excel */
window.exportExcel=function(){
  let csv="Name,Phone,Tasks,Date\n";
  allVotes.forEach(v=>{
    csv+=`${v.name},${v.phone},${Object.values(v.tasks).filter(x=>x).length},${v.date}\n`;
  });
  let a=document.createElement("a");
  a.href="data:text/csv,"+encodeURIComponent(csv);
  a.download="report.csv";
  a.click();
};
</script>

</body>
</html>
