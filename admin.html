<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:15px;
}
h2{text-align:center}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  gap:10px;
  flex-wrap:wrap;
}
.box{
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.15);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{
  background:#2563eb;
  color:#fff;
}

.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

input{
  width:65px;
  padding:4px;
}
button{
  padding:5px 8px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.add{background:#16a34a;color:#fff}
.clear{background:#6b7280;color:#fff}
.export{background:#0284c7;color:#fff}

.note{
  font-size:12px;
  color:#b91c1c;
  margin-top:6px;
}
</style>
</head>

<body>

<h2>Admin Dashboard – Faith & Fitness</h2>

<div class="top">
  <div class="box">Total Users: <b id="totalUsers">0</b></div>
  <div class="box">Shown Users: <b id="shown">0</b></div>
</div>

<div class="box">
  <b>Date Filter (USER + ADMIN votes)</b><br><br>
  From:
  <input type="date" id="from" onchange="load()">
  To:
  <input type="date" id="to" onchange="load()">
  <button class="clear" onclick="clearFilter()">Clear</button>
  <button class="export" onclick="exportCSV()">Export CSV</button>

  <div class="note">
    ⚠️ Date filter ON ആണെങ്കിൽ admin add points disable ആയിരിക്കും
  </div>
</div>

<br>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
  <th>SL No</th>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Add Points</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore, collection, getDocs,
  query, where, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password")!=="1"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 🔢 TOTAL POINTS (DATE FILTER SAFE) */
async function getTotalPoints(phone){
  let total = 0;
  let q;

  if(from.value){
    const toDate = to.value || from.value;

    q = query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date",">=",from.value),
      where("date","<=",toDate)
    );
  } else {
    q = query(
      collection(db,"votes"),
      where("phone","==",phone)
    );
  }

  const snap = await getDocs(q);
  snap.forEach(d=>{
    total += Number(d.data().points || 0);
  });

  return total;
}

/* 📊 LOAD DASHBOARD */
window.load = async ()=>{
  tbody.innerHTML="";

  const usersSnap = await getDocs(collection(db,"users"));
  document.getElementById("totalUsers").innerText = usersSnap.size;

  let rows = [];

  for(const u of usersSnap.docs){
    const data = u.data();
    const total = await getTotalPoints(data.phone);

    rows.push({
      name:data.name,
      phone:data.phone,
      total: total || 0
    });
  }

  /* SORT HIGH → LOW */
  rows.sort((a,b)=>b.total - a.total);

  let rank = 0;
  let prevPoints = null;
  let shown = 0;

  rows.forEach((r,i)=>{
    const slno = i + 1;

    if(prevPoints === null || r.total < prevPoints){
      rank++;
    }
    prevPoints = r.total;
    shown++;

    const tr = document.createElement("tr");
    tr.className =
      rank===1 ? "rank1" :
      rank===2 ? "rank2" :
      rank===3 ? "rank3" : "";

    tr.innerHTML = `
      <td>${slno}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input type="number" id="p_${r.phone}" placeholder="+">
        <button class="add" onclick="addPoint('${r.phone}')">Add</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("shown").innerText = shown;
};
load();

/* ➕ ADMIN ADD POINTS */
window.addPoint = async(phone)=>{
  if(from.value || to.value){
    alert("Date filter ON. Clear filter first ❌");
    return;
  }

  const val = Number(document.getElementById("p_"+phone).value);
  if(val<=0) return alert("Enter valid points");

  await addDoc(collection(db,"votes"),{
    phone,
    points: val,
    date: new Date().toISOString().split("T")[0],
    source: "admin",
    createdAt: new Date().toISOString()
  });

  alert("Points added ✅");
  load();
};

/* 🧹 CLEAR FILTER */
window.clearFilter = ()=>{
  from.value="";
  to.value="";
  load();
};

/* 📤 EXPORT CSV (FILTERED DATA ONLY) */
window.exportCSV = ()=>{
  let csv="SL No,Rank,Name,Phone,Total Points\n";
  document.querySelectorAll("#tbody tr").forEach(tr=>{
    const t = tr.children;
    csv += `${t[0].innerText},${t[1].innerText},${t[2].innerText},${t[3].innerText},${t[4].innerText}\n`;
  });
  const blob = new Blob([csv]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "faith_fitness_report.csv";
  a.click();
};
</script>

</body>
</html>
