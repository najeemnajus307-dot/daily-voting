<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:30px;}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#333;color:#fff;}
button{padding:5px 10px;}
</style>
</head>

<body>
<h2>Admin Voting Report</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Date</th>
<th>Points</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const snap = await getDocs(collection(db,"votes"));
let rows = document.getElementById("rows");

snap.forEach(d=>{
  let v = d.data();
  rows.innerHTML += `
  <tr>
    <td>${v.name}</td>
    <td>${v.phone}</td>
    <td>${v.date}</td>
    <td>${v.totalPoints}</td>
    <td><button onclick="del('${d.id}')">❌</button></td>
  </tr>`;
});

window.del = async function(id){
  if(confirm("Delete vote?")){
    await deleteDoc(doc(db,"votes",id));
    location.reload();
  }
}
</script>
</body>
</html>
