<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  max-width:1000px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
h2,h3{
  text-align:center;
}
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}
input,button{
  padding:6px 10px;
  font-size:14px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f3f4f6;
}
.delete{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}
.total{
  margin-top:10px;
  font-weight:bold;
  text-align:right;
}
</style>
</head>

<body>

<div class="box">
  <h2>Admin Voting Report</h2>

  <div class="controls">
    <input type="date" id="from">
    <input type="date" id="to">
    <button onclick="loadData()">Filter</button>
    <button onclick="exportCSV()">Export Excel</button>
  </div>

  <!-- 🔹 SUMMARY TABLE -->
  <h3>User-wise Total Votes (Task Sum)</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Total Votes</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>

  <!-- 🔹 DETAIL TABLE -->
  <h3 style="margin-top:20px">Detailed Votes</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks Done</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="total" id="totalVotes"></div>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("tbody");
const summaryBody = document.getElementById("summaryBody");
const totalBox = document.getElementById("totalVotes");

/* 📊 LOAD DATA */
window.loadData = async function(){
  tbody.innerHTML = "";
  summaryBody.innerHTML = "";
  totalBox.innerText = "";

  let from = document.getElementById("from").value;
  let to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));

  let userMap = {}; // phone → {name, phone, totalVotes}

  snap.forEach(d=>{
    let v = d.data();
    let date = v.date;

    if(from && date < from) return;
    if(to && date > to) return;

    // 🔢 TASK COUNT (THIS IS THE KEY)
    let taskCount = Object.values(v.tasks).filter(t=>t).length;

    /* DETAIL TABLE */
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${taskCount}</td>
      <td>${date}</td>
      <td><button class="delete" onclick="deleteVote('${d.id}')">❌</button></td>
    `;
    tbody.appendChild(tr);

    /* USER TOTAL = SUM OF TASKS */
    if(!userMap[v.phone]){
      userMap[v.phone] = {
        name: v.name,
        phone: v.phone,
        totalVotes: 0
      };
    }
    userMap[v.phone].totalVotes += taskCount;
  });

  /* BUILD SUMMARY TABLE */
  Object.values(userMap).forEach(u=>{
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.totalVotes}</td>
    `;
    summaryBody.appendChild(tr);
  });

  totalBox.innerText =
    "TOTAL USERS : " + Object.keys(userMap).length;
};

/* ❌ DELETE VOTE */
window.deleteVote = async function(id){
  if(confirm("Delete this vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

/* 📥 EXPORT EXCEL (CSV) */
window.exportCSV = function(){
  let rows = [["Name","Phone","Total Votes"]];
  document.querySelectorAll("#summaryBody tr").forEach(tr=>{
    let tds = tr.querySelectorAll("td");
    rows.push([
      tds[0].innerText,
      tds[1].innerText,
      tds[2].innerText
    ]);
  });

  let csv = rows.map(r=>r.join(",")).join("\n");
  let blob = new Blob([csv],{type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "user_vote_summary.csv";
  a.click();
};

/* AUTO LOAD */
loadData();
</script>

</body>
</html>
