<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eee}
</style>
</head>
<body>

<h2>Admin Voting Report</h2>
<table>
<thead>
<tr><th>Name</th><th>Phone</th><th>Points</th><th>Date</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
 apiKey:"YOUR_KEY",
 authDomain:"daily-voting-793ee.firebaseapp.com",
 projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

let rows = document.getElementById("rows");
let snap = await getDocs(collection(db,"votes"));

snap.forEach(d=>{
 let v=d.data();
 rows.innerHTML+=`
 <tr>
  <td>${v.name}</td>
  <td>${v.phone}</td>
  <td>${v.totalPoints}</td>
  <td>${v.date}</td>
 </tr>`;
});
</script>
</body>
</html>
