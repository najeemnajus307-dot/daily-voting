<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  padding-bottom:70px;
}

/* MAIN */
.main{padding:16px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{
  background:var(--card);
  padding:12px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12)
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
th{background:var(--pri);color:#fff}

/* RANK COLORS */
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

/* BUTTONS */
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select{padding:6px}

/* BOTTOM NAV */
.admin-bottom-nav{
  position:fixed;
  bottom:0; left:0;
  width:100%;
  background:#0f172a;
  display:flex;
  justify-content:space-around;
  padding:8px 0;
}
.admin-bottom-nav button{
  background:none;
  border:none;
  color:#cbd5f5;
  font-size:12px;
  cursor:pointer;
}
.admin-bottom-nav button.active,
.admin-bottom-nav button:hover{
  color:#fff;
}
</style>
</head>

<body>

<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="hrow">
    <div class="card">Users: <b id="d_users">0</b></div>
    <div class="card">Shown: <b id="d_shown">0</b></div>
    <div class="card">
      Date:
      <input type="date" id="d_from">
      <input type="date" id="d_to">
      <button class="btn" onclick="dashLoad()">Apply</button>
      <button class="btn" onclick="dashClear()">Clear</button>
    </div>
    <div class="card">
      <label><input type="checkbox" id="d_hide0" onchange="dashLoad()"> Hide zero</label>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th><th>Phone</th>
          <th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">
  <div class="card">
    Task:
    <select id="t_task"></select>
    <button class="btn" onclick="taskLoad()">View</button>
  </div>

  <div class="card">
    <h3>Voted Users</h3>
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Points</th></tr></thead>
      <tbody id="t_voted"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Not Voted Users</h3>
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Add</th></tr></thead>
      <tbody id="t_not"></tbody>
    </table>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    User:
    <select id="u_user"></select>
    <button class="btn" onclick="userLoad()">View</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr></thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

</main>

<!-- BOTTOM NAV -->
<div class="admin-bottom-nav">
  <button class="active" onclick="showPage('dash')">🏠<br>Dashboard</button>
  <button onclick="showPage('task')">📊<br>Tasks</button>
  <button onclick="showPage('user')">👤<br>Users</button>
  <button onclick="location.href='task-editor.html'">✏️<br>Editor</button>
</div>

<script type="module">
if(prompt("Admin password")!=="5") location.replace("index.html");

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today=()=>new Date().toISOString().split("T")[0];

/* PAGE SWITCH */
window.showPage=(p)=>{
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById("page-"+p).classList.remove("hidden");
  document.querySelectorAll(".admin-bottom-nav button")
    .forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
};

/* DASHBOARD */
async function dashLoad(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));

  d_users.textContent=users.size;

  const map={};
  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    const p=u.data().phone;
    rows.push({name:u.data().name,phone:p,total:map[p]||0});
  });

  rows.sort((a,b)=>b.total-a.total);
  dashBody.innerHTML="";
  let rank=0,prev=null,sl=0;

  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;

    const tr=document.createElement("tr");
    tr.className=rank===1?"rank1":rank===2?"rank2":rank===3?"rank3":"";
    tr.innerHTML=`
      <td>${sl}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input id="p_${r.phone}" type="number" style="width:60px">
        <button class="btn add" onclick="addPoint('${r.phone}')">+</button>
      </td>`;
    dashBody.appendChild(tr);
  });
  d_shown.textContent=sl;
}
window.dashLoad=dashLoad;
window.dashClear=()=>{d_from.value="";d_to.value="";dashLoad();};

window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter points");
  await addDoc(collection(db,"votes"),{phone,points:v,date:today(),source:"admin"});
  dashLoad();
};

/* TASK + USER INIT */
async function taskInit(){
  (await getDocs(collection(db,"tasks"))).forEach(d=>{
    t_task.innerHTML+=`<option>${d.data().text}</option>`;
  });
}
async function userInit(){
  (await getDocs(collection(db,"users"))).forEach(d=>{
    u_user.innerHTML+=`<option value="${d.data().phone}">${d.data().name}</option>`;
  });
}
window.userLoad=async()=>{
  const phone=u_user.value;
  const votes=await getDocs(collection(db,"votes"));
  u_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone){
      u_body.innerHTML+=`
        <tr>
          <td>${x.date}</td>
          <td>${x.points}</td>
          <td>${x.source||"user"}</td>
          <td><button class="btn del" onclick="delVote('${v.id}')">X</button></td>
        </tr>`;
    }
  });
};
window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  userLoad(); dashLoad();
};

dashLoad(); taskInit(); userInit();
</script>

</body>
</html>
