<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.main{padding:14px;padding-bottom:90px}
.card{
  background:var(--card);padding:12px;border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12);margin-bottom:10px
}
.hrow{display:flex;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
th{background:var(--pri);color:#fff}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select{padding:6px}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;
  justify-content:space-around;padding:6px 0;z-index:1000
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;
  font-size:12px;cursor:pointer
}
.bottom-nav button.active{
  color:#fff;font-weight:bold
}
</style>
</head>

<body>
<main class="main">

<!-- ================= DASHBOARD ================= -->
<section id="page-dash">
  <h3>Dashboard</h3>

  <div class="card hrow">
    From <input type="date" id="d_from">
    To <input type="date" id="d_to">
    <button type="button" class="btn" onclick="dashLoad()">View</button>
    <label style="margin-left:10px">
      <input type="checkbox" id="d_hide0" onchange="dashLoad()"> Hide 0
    </label>
  </div>

  <div class="card">
    Users: <b id="d_users">0</b> |
    Shown: <b id="d_shown">0</b>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th>
          <th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- ================= USER SIGNAL ================= -->
<section id="page-signal" class="hidden">
  <h3>User Signal</h3>
  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Status</th></tr>
      </thead>
      <tbody id="signalBody"></tbody>
    </table>
  </div>
</section>

<!-- ================= USER VOTING REPORT ================= -->
<section id="page-vote" class="hidden">
  <h3>User Voting Report</h3>

  <div class="card">
    User:
    <select id="u_user"></select>
    <button type="button" class="btn" onclick="userLoad()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Date</th><th>Points</th><th>Source</th></tr>
      </thead>
      <tbody id="u_body"></tbody>
    </table>
  </div>
</section>

</main>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <button type="button" class="active" data-page="dash">🏠<br>Dashboard</button>
  <button type="button" data-page="signal">🟢<br>Signal</button>
  <button type="button" data-page="vote">🗳<br>Voting</button>
  <button type="button" onclick="location.href='task-editor.html'">🛠<br>Task</button>
</div>

<script type="module">
/* ===== ADMIN PASSWORD ===== */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* ===== FIREBASE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today = ()=> new Date().toISOString().split("T")[0];

/* ===== DASHBOARD ===== */
async function dashLoad(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  d_users.textContent = users.size;

  if(d_from.value && !d_to.value) d_to.value = d_from.value;
  const from = d_from.value;
  const to   = d_to.value;

  const map = {};

  votes.forEach(v=>{
    const x=v.data();
    if(!x.date) return;
    if(from && (x.date < from || x.date > to)) return;
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    rows.push({
      name:u.data().name,
      phone:u.data().phone,
      total:map[u.data().phone]||0
    });
  });

  if(d_hide0.checked) rows = rows.filter(r=>r.total>0);

  rows.sort((a,b)=>b.total-a.total);

  dashBody.innerHTML="";
  let sl=0,rank=0,prev=null;
  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
      <tr class="${rank==1?'rank1':rank==2?'rank2':rank==3?'rank3':''}">
        <td>${sl}</td><td>${rank}</td>
        <td>${r.name}</td><td>${r.phone}</td>
        <td>${r.total}</td>
        <td>
          <input id="p_${r.phone}" type="number" style="width:60px">
          <button type="button" class="btn add" onclick="addPoint('${r.phone}')">+</button>
        </td>
      </tr>`;
  });
  d_shown.textContent = sl;
}

window.addPoint = async(phone)=>{
  const v = Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone, points:v, date:today(), source:"admin"
  });
  dashLoad();
};

/* ===== USER SIGNAL ===== */
async function loadSignal(){
  const users = await getDocs(collection(db,"users"));
  signalBody.innerHTML="";
  users.forEach(u=>{
    signalBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${u.data().phone}</td>
        <td>🟢 Active</td>
      </tr>`;
  });
}

/* ===== USER VOTING REPORT ===== */
async function userInit(){
  const users = await getDocs(collection(db,"users"));
  u_user.innerHTML="";
  users.forEach(u=>{
    u_user.innerHTML+=`<option value="${u.data().phone}">${u.data().name}</option>`;
  });
}
window.userLoad = async()=>{
  const phone = u_user.value;
  const votes = await getDocs(collection(db,"votes"));
  u_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone){
      u_body.innerHTML+=`
        <tr>
          <td>${x.date||"-"}</td>
          <td>${x.points}</td>
          <td>${x.source||"-"}</td>
        </tr>`;
    }
  });
};

/* ===== BOTTOM NAV LOGIC ===== */
document.querySelectorAll(".bottom-nav button[data-page]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".bottom-nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");

    document.querySelectorAll("main section")
      .forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+b.dataset.page)
      .classList.remove("hidden");

    if(b.dataset.page==="signal") loadSignal();
  };
});

/* ===== INIT ===== */
dashLoad();
userInit();
</script>
</body>
</html>
