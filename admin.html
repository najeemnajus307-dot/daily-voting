<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
.hidden{display:none}
.card{background:#fff;margin:10px;padding:10px;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#2563eb;color:#fff}
button{padding:6px 10px;border:0;border-radius:6px;cursor:pointer}
.add{background:#16a34a;color:#fff}
.del{background:#dc2626;color:#fff}
.warn{background:#f59e0b;color:#fff}

.main{padding-bottom:80px}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;
  justify-content:space-around;padding:6px 0
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<main class="main">

<!-- ================= DASHBOARD ================= -->
<section id="page-home">
<h3>Dashboard</h3>
<div class="card">
<table>
<thead>
<tr>
<th>SL</th><th>Rank</th><th>Name</th><th>Phone</th><th>Total</th><th>Add</th>
</tr>
</thead>
<tbody id="dashBody"></tbody>
</table>
</div>
</section>

<!-- ================= SIGNAL USER ================= -->
<section id="page-signal" class="hidden">
<h3>Signal User (Date Wise)</h3>

<div class="card">
User:
<select id="s_user"></select>
Date:
<input type="date" id="s_date">
<button type="button" onclick="loadSignal()">View</button>
</div>

<div class="card">
<table>
<thead>
<tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr>
</thead>
<tbody id="s_body"></tbody>
</table>
</div>
</section>

<!-- ================= USERS ================= -->
<section id="page-users" class="hidden">
<h3>Users</h3>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th><th>Phone</th><th>Total</th>
<th>Ban</th><th>Reset</th><th>Delete</th>
</tr>
</thead>
<tbody id="userBody"></tbody>
</table>
</div>
</section>

</main>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
<button class="active" data-page="home">🏠<br>Home</button>
<button data-page="signal">🟢<br>Signal</button>
<button data-page="users">👤<br>Users</button>
<button onclick="location.href='task-editor.html'">🛠<br>Task</button>
</div>

<script type="module">
/* ===== PASSWORD ===== */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* ===== FIREBASE ===== */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, doc, updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today = ()=>new Date().toISOString().split("T")[0];

/* ================= DASHBOARD ================= */
async function loadDash(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));
  const map={};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    rows.push({
      name:u.data().name,
      phone:u.data().phone,
      total:map[u.data().phone]||0
    });
  });

  rows.sort((a,b)=>b.total-a.total);

  dashBody.innerHTML="";
  let sl=0,rank=0,prev=null;
  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
    <tr>
      <td>${sl}</td><td>${rank}</td>
      <td>${r.name}</td><td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input id="p_${r.phone}" type="number" style="width:60px">
        <button class="add" onclick="addPoint('${r.phone}')">+</button>
      </td>
    </tr>`;
  });
}
window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return;
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:today(),source:"admin"
  });
  loadDash();
};

/* ================= SIGNAL USER ================= */
async function initSignal(){
  s_user.innerHTML="";
  (await getDocs(collection(db,"users")))
  .forEach(u=>{
    s_user.innerHTML+=`<option value="${u.data().phone}">
      ${u.data().name}</option>`;
  });
}
window.loadSignal=async()=>{
  const phone=s_user.value;
  const date=s_date.value;
  const votes=await getDocs(collection(db,"votes"));
  s_body.innerHTML="";
  votes.forEach(v=>{
    const x=v.data();
    if(x.phone===phone && (!date || x.date===date)){
      s_body.innerHTML+=`
      <tr>
        <td>${x.date}</td>
        <td>${x.points}</td>
        <td>${x.source||"-"}</td>
        <td>
          <button class="del"
          onclick="delVote('${v.id}')">X</button>
        </td>
      </tr>`;
    }
  });
};
window.delVote=async(id)=>{
  await deleteDoc(doc(db,"votes",id));
  loadSignal();loadDash();
};

/* ================= USERS ================= */
async function loadUsers(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const map={};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  userBody.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    userBody.innerHTML+=`
    <tr>
      <td>${u.data().name}</td>
      <td>${p}</td>
      <td>${map[p]||0}</td>
      <td>
        <button class="warn"
        onclick="toggleBan('${u.id}',${u.data().active!==false})">
        ${u.data().active===false?'Unban':'Ban'}
        </button>
      </td>
      <td>
        <button class="warn"
        onclick="resetPoints('${p}')">Reset</button>
      </td>
      <td>
        <button class="del"
        onclick="deleteUser('${u.id}')">Delete</button>
      </td>
    </tr>`;
  });
}
window.toggleBan=async(id,active)=>{
  await updateDoc(doc(db,"users",id),{active:!active});
  loadUsers();
};
window.resetPoints=async(phone)=>{
  const votes=await getDocs(collection(db,"votes"));
  votes.forEach(v=>{
    if(v.data().phone===phone){
      deleteDoc(doc(db,"votes",v.id));
    }
  });
  loadDash();loadUsers();
};
window.deleteUser=async(id)=>{
  if(!confirm("Delete user?")) return;
  await deleteDoc(doc(db,"users",id));
  loadUsers();loadDash();
};

/* ================= NAV ================= */
document.querySelectorAll(".bottom-nav button[data-page]")
.forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".bottom-nav button")
    .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");

    document.querySelectorAll("main section")
    .forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+b.dataset.page)
    .classList.remove("hidden");

    if(b.dataset.page==="signal") initSignal();
    if(b.dataset.page==="users") loadUsers();
  };
});

/* INIT */
loadDash();
</script>
</body>
</html>
