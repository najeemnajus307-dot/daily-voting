<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2,h3{text-align:center}
.box{
  background:#fff;padding:15px;border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);margin-bottom:20px
}
input,button{padding:6px;margin:4px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:white}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}
.saveBtn{background:#16a34a;color:white;border:none;padding:4px 8px}
.small{font-size:12px;color:#555}
.count{text-align:center;font-weight:bold;margin-bottom:10px}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>
<div class="count" id="totalCount">Loading...</div>

<!-- ADD USER -->
<div class="box">
  <h3>Add New User</h3>
  <input id="uName" placeholder="Name">
  <input id="uPhone" placeholder="Phone">
  <input id="uPass" placeholder="Password" value="1">
  <button class="saveBtn" onclick="addUser()">Add User</button>
</div>

<!-- TOP 3 -->
<div class="box">
  <h3>Top 3 Ranking (Lifetime)</h3>
  <table>
    <thead>
      <tr><th>Rank</th><th>Name</th><th>Phone</th><th>Points</th></tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- POINT ADD -->
<div class="box">
  <h3>Add Points to Users</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Add Points</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, updateDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = "1";
let users = [];

/* LOAD USERS */
async function loadUsers(){
  users=[];
  const snap = await getDocs(collection(db,"users"));
  snap.forEach(d=>users.push({id:d.id,...d.data()}));
  totalCount.innerText = "Total Users : " + users.length;
  render(users);
}
loadUsers();

/* RENDER */
function render(list){
  rankBody.innerHTML="";
  userBody.innerHTML="";

  const sorted=[...list].sort((a,b)=>(b.totalPoints||0)-(a.totalPoints||0));

  let rank=0,last=null;
  sorted.forEach(u=>{
    if(u.totalPoints!==last){
      rank++; last=u.totalPoints;
    }
    if(rank<=3){
      const cls=rank===1?"rank1":rank===2?"rank2":"rank3";
      rankBody.innerHTML+=`
        <tr class="${cls}">
          <td>${rank}</td>
          <td>${u.name}</td>
          <td>${u.phone}</td>
          <td>${u.totalPoints||0}</td>
        </tr>`;
    }

    userBody.innerHTML+=`
      <tr>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>
          <input type="number" id="pt_${u.id}" placeholder="+ points">
          <div class="small">Current: ${u.totalPoints||0}</div>
        </td>
        <td>
          <button class="saveBtn"
            onclick="addPoint('${u.id}')">Add</button>
        </td>
      </tr>`;
  });
}

/* ADD POINTS (MAIN FIX) */
window.addPoint = async (id)=>{
  const addPt = Number(document.getElementById("pt_"+id).value||0);
  if(addPt<=0) return alert("Enter points");

  if(prompt("Admin password")!==ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }

  const u = users.find(x=>x.id===id);
  const monthKey = new Date().toISOString().slice(0,7);

  const total = (u.totalPoints||0) + addPt;
  const monthly = u.monthlyPoints || {};
  monthly[monthKey] = (monthly[monthKey]||0) + addPt;

  await updateDoc(doc(db,"users",id),{
    totalPoints: total,
    monthlyPoints: monthly
  });

  alert(`Points added ✅ (+${addPt})`);
  loadUsers();
};

/* ADD USER */
window.addUser = async ()=>{
  const name=uName.value.trim();
  const phone=uPhone.value.trim();
  const pass=uPass.value.trim();

  if(!name||!phone||!pass){
    alert("Fill all fields");
    return;
  }

  if(prompt("Admin password")!==ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }

  await addDoc(collection(db,"users"),{
    name,
    phone,
    password:pass,
    totalPoints:0,
    monthlyPoints:{},
    createdFrom:"admin",
    createdAt:new Date().toISOString()
  });

  alert("User added successfully ✅");
  uName.value=""; uPhone.value=""; uPass.value="1";
  loadUsers();
};
</script>

</body>
</html>
