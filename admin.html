<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  max-width:900px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
h2{
  text-align:center;
  margin-bottom:15px;
}
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:15px;
  flex-wrap:wrap;
}
input,button{
  padding:6px 10px;
  font-size:14px;
}
button{
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f3f4f6;
}
.total{
  margin-top:10px;
  font-weight:bold;
  text-align:right;
}
.delete{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Admin Voting Report</h2>

  <div class="controls">
    <input type="date" id="from">
    <input type="date" id="to">
    <button onclick="loadData()">Filter</button>
    <button onclick="exportCSV()">Export Excel</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks Done</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="total" id="totalVotes"></div>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("tbody");
const totalBox = document.getElementById("totalVotes");

/* 📊 LOAD + FILTER DATA */
window.loadData = async function(){
  tbody.innerHTML = "";
  totalBox.innerText = "";

  let from = document.getElementById("from").value;
  let to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));
  let total = 0;

  snap.forEach(d=>{
    let v = d.data();
    let date = v.date;

    if(from && date < from) return;
    if(to && date > to) return;

    total++;

    let taskCount = Object.values(v.tasks).filter(t=>t).length;

    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${taskCount}</td>
      <td>${date}</td>
      <td>
        <button class="delete" onclick="deleteVote('${d.id}')">❌</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  totalBox.innerText = "TOTAL VOTES : " + total;
};

/* ❌ DELETE VOTE */
window.deleteVote = async function(id){
  if(confirm("Delete this vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

/* 📥 EXPORT TO EXCEL (CSV) */
window.exportCSV = function(){
  let rows = [["Name","Phone","Tasks Done","Date"]];

  document.querySelectorAll("#tbody tr").forEach(tr=>{
    let tds = tr.querySelectorAll("td");
    rows.push([
      tds[0].innerText,
      tds[1].innerText,
      tds[2].innerText,
      tds[3].innerText
    ]);
  });

  let csv = rows.map(r=>r.join(",")).join("\n");
  let blob = new Blob([csv],{type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "voting_report.csv";
  a.click();
};

/* AUTO LOAD */
loadData();
</script>

</body>
</html>
