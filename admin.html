<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f1f5f9;--card:#fff;--pri:#2563eb;
  --ok:#16a34a;--bad:#dc2626;--warn:#facc15
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.hidden{display:none}

.main{padding:16px;padding-bottom:90px}
.card{
  background:var(--card);padding:12px;margin-bottom:12px;
  border-radius:10px;box-shadow:0 0 8px rgba(0,0,0,.1)
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
th{background:var(--pri);color:#fff}

.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.ban{background:var(--warn)}
.unban{background:#22c55e;color:#fff}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;color:#fff;
  display:flex;justify-content:space-around;
  padding:10px 0;z-index:999
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;
  font-size:12px;cursor:pointer
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<div class="main">

<!-- DASHBOARD -->
<section id="dash">
  <div class="card">
    From <input type="date" id="d_from">
    To <input type="date" id="d_to">
    <label>
      <input type="checkbox" id="hide0" onchange="loadDash()">
      Hide 0 (only not voted)
    </label>
    <button class="btn" onclick="loadDash()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK -->
<section id="task" class="hidden">
  <div class="card">
    Task <select id="t_task"></select>
    Date <input type="date" id="t_date">
    <button class="btn" onclick="loadTask()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Points</th><th>Add</th></tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
</section>

<!-- USERS -->
<section id="users" class="hidden">
  <div class="card">
    <table>
      <thead>
        <tr><th>User</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody id="userBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK EDITOR -->
<section id="editor" class="hidden">
  <div class="card">
    Task <input id="newTask">
    <button class="btn add" onclick="addTask()">Add</button>
  </div>
  <div class="card">
    <ul id="taskList"></ul>
  </div>
</section>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-nav">
  <button id="btn-dash" class="active" onclick="show('dash')">Dashboard</button>
  <button id="btn-task" onclick="show('task')">Task</button>
  <button id="btn-users" onclick="show('users')">Users</button>
  <button id="btn-editor" onclick="show('editor')">Task Editor</button>
</div>

<script type="module">
/* PASSWORD */
if(prompt("Admin password")!=="5") location.href="index.html";

/* FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, updateDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* NAVIGATION */
window.show = function(page){
  document.querySelectorAll("section")
    .forEach(s=>s.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");

  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+page).classList.add("active");

  if(page==="dash") loadDash();
  if(page==="task") loadTask();
  if(page==="users") loadUsers();
  if(page==="editor") loadTasks();
};

/* DASHBOARD */
window.loadDash = async ()=>{
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  const map={}, voted={};
  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
    voted[x.phone]=true;
  });

  dashBody.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    const total=map[p]||0;
    const hasVoted=voted[p]===true;

    if(hide0.checked && total===0 && !hasVoted) return;

    dashBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${p}</td>
        <td>${total}</td>
        <td>
          <input id="p_${p}" type="number" style="width:60px">
          <button class="btn add" onclick="addPoint('${p}')">+</button>
        </td>
      </tr>`;
  });
};

window.addPoint = async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone,points:v,
    date:new Date().toISOString().split("T")[0],
    source:"admin"
  });
  loadDash();
};

/* TASK */
window.loadTask = async ()=>{
  const users=await getDocs(collection(db,"users"));
  taskBody.innerHTML="";
  users.forEach(u=>{
    taskBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${u.data().phone}</td>
        <td>0</td>
        <td>-</td>
      </tr>`;
  });
};

/* USERS */
window.loadUsers = async ()=>{
  const users=await getDocs(collection(db,"users"));
  userBody.innerHTML="";
  users.forEach(u=>{
    const d=u.data();
    const active=d.active!==false;
    userBody.innerHTML+=`
      <tr>
        <td>${d.name}<br>${d.phone}</td>
        <td>${active?"Active":"Banned"}</td>
        <td>
          <button class="btn ${active?"ban":"unban"}"
            onclick="toggleUser('${u.id}',${active})">
            ${active?"Ban":"Unban"}
          </button>
          <button class="btn del"
            onclick="delUser('${u.id}')">Delete</button>
        </td>
      </tr>`;
  });
};

window.toggleUser = async(id,a)=>{
  await updateDoc(doc(db,"users",id),{active:!a});
  loadUsers();
};

window.delUser = async(id)=>{
  if(confirm("Delete user?")){
    await deleteDoc(doc(db,"users",id));
    loadUsers(); loadDash();
  }
};

/* TASK EDITOR */
window.loadTasks = async ()=>{
  const tasks=await getDocs(collection(db,"tasks"));
  taskList.innerHTML="";
  tasks.forEach(t=>{
    taskList.innerHTML+=`
      <li>${t.data().text}
      <button onclick="delTask('${t.id}')">X</button></li>`;
  });
};

window.addTask = async ()=>{
  if(!newTask.value) return;
  await addDoc(collection(db,"tasks"),{text:newTask.value});
  newTask.value="";
  loadTasks();
};

window.delTask = async(id)=>{
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};

/* INIT */
show("dash");
</script>

</body>
</html>
