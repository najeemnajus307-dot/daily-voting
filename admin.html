<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Total Points</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
h2{
  text-align:center;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#16a34a;
  color:white;
}
</style>
</head>

<body>

<h2>Admin Dashboard – Total Points</h2>

<table>
  <thead>
    <tr>
      <th>User Name</th>
      <th>Phone</th>
      <th>Total Points</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, getDocs, collection
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN ONLY */
const ADMIN_PHONE = "7994302567";
if(sessionStorage.getItem("phone") !== ADMIN_PHONE){
  alert("Access denied");
  location.href="vote.html";
}

/* FIREBASE */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 🔢 CALCULATE TOTAL POINTS */
const snap = await getDocs(collection(db,"votes"));

const users = {}; // phone → {name, points}

snap.forEach(d=>{
  const v = d.data();
  if(!users[v.phone]){
    users[v.phone] = {
      name: v.name,
      points: 0
    };
  }
  users[v.phone].points += v.points;
});

/* SHOW TABLE */
for(const phone in users){
  const u = users[phone];
  rows.innerHTML += `
    <tr>
      <td>${u.name}</td>
      <td>${phone}</td>
      <td><b>${u.points}</b></td>
    </tr>
  `;
}
</script>

</body>
</html>
