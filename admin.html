<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2,h3{text-align:center}
.box{
  background:#fff;padding:15px;border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);margin-bottom:20px
}
.controls{text-align:center;margin-bottom:10px}
input,button{padding:6px;margin:4px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:white}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}
.saveBtn{background:#16a34a;color:white;border:none;padding:4px 8px}
.delBtn{background:#dc2626;color:white;border:none;padding:4px 8px}
.small{font-size:12px;color:#555}
.count{text-align:center;font-weight:bold;margin-bottom:10px}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>
<div class="count" id="totalCount">Loading...</div>

<!-- ✅ ADD USER -->
<div class="box">
  <h3>Add New User</h3>
  <div class="controls">
    <input id="uName" placeholder="Name">
    <input id="uPhone" placeholder="Phone">
    <input id="uPass" placeholder="Password" value="1">
    <button class="saveBtn" onclick="addUser()">Add User</button>
  </div>
</div>

<!-- TOP 3 -->
<div class="box">
  <h3>Top 3 Ranking</h3>
  <table>
    <thead>
      <tr><th>Rank</th><th>Name</th><th>Phone</th><th>Points</th></tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- REPORT -->
<div class="box">
  <h3>All Voting Report</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Phone</th>
        <th>Add Points</th><th>Date</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  updateDoc, addDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = "1";
let votes = [];

/* LOAD VOTES */
async function load(){
  votes=[];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>votes.push({id:d.id,...d.data()}));
  totalCount.innerText = "Total Voters : " + votes.length;
  render(votes);
}
load();

/* RENDER */
function render(v){
  rankBody.innerHTML="";
  reportBody.innerHTML="";
  v.sort((a,b)=>b.totalPoints-a.totalPoints);

  let rank=0,last=null;
  v.forEach(x=>{
    if(x.totalPoints!==last){rank++;last=x.totalPoints}
    if(rank<=3){
      const cls=rank===1?"rank1":rank===2?"rank2":"rank3";
      rankBody.innerHTML+=`
        <tr class="${cls}">
          <td>${rank}</td>
          <td>${x.name}</td>
          <td>${x.phone}</td>
          <td>${x.totalPoints}</td>
        </tr>`;
    }

    reportBody.innerHTML+=`
      <tr>
        <td>${x.name}</td>
        <td>${x.phone}</td>
        <td>
          <input type="number" id="pt_${x.id}" placeholder="+ points">
          <div class="small">Current: ${x.totalPoints}</div>
        </td>
        <td>${x.date}</td>
        <td>
          <button class="saveBtn"
            onclick="addPoint('${x.id}')">Save</button>
        </td>
      </tr>`;
  });
}

/* ADD POINT */
window.addPoint = async (id)=>{
  const addPt = Number(document.getElementById("pt_"+id).value || 0);
  if(addPt<=0) return alert("Enter points");

  if(prompt("Admin password") !== ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }

  const v = votes.find(x=>x.id===id);
  const newTotal = v.totalPoints + addPt;

  await updateDoc(doc(db,"votes",id),{
    totalPoints:newTotal
  });

  alert("Points added ✅");
  load();
};

/* ✅ ADD USER */
window.addUser = async ()=>{
  const name = uName.value.trim();
  const phone = uPhone.value.trim();
  const pass = uPass.value.trim();

  if(!name || !phone || !pass){
    alert("Fill all fields");
    return;
  }

  if(prompt("Admin password") !== ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }

  await addDoc(collection(db,"users"),{
    name,
    phone,
    password: pass,
    totalPoints: 0,
    monthlyPoints: {},
    createdFrom: "admin",
    createdAt: new Date().toISOString()
  });

  alert("User added successfully ✅");
  uName.value=""; uPhone.value=""; uPass.value="1";
};
</script>

</body>
</html>
