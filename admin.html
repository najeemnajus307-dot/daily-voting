<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin – Voting & Weekly Bonus</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{background:#fff;padding:20px;border-radius:10px;max-width:1200px;margin:auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f3f4f6}
.rank1{background:#fde68a}
.rank2{background:#dbeafe}
.rank3{background:#fef3c7}
button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer}
.bonus{background:#16a34a;color:#fff}
.remove{background:#dc2626;color:#fff}
</style>
</head>

<body>

<div class="box">
<h2 style="text-align:center">Admin – Voting & Weekly Bonus</h2>

From <input type="date" id="from">
To <input type="date" id="to">
<button onclick="apply()">Apply</button>

<h3>Summary (Dense Ranking + Weekly Bonus)</h3>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Phone</th>
<th>Week Points</th>
<th>Date Range</th>
<th>Total (with Bonus)</th>
<th>Bonus</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<h3>Detailed Votes</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Tasks</th>
<th>Date</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>

</div>

<script>
// ---------------- SAMPLE DATA (Firebase replace cheyyan pattum later) ----------------
let votes = [
 {name:"55555",phone:"5555",tasks:5,date:"2026-01-03"},
 {name:"55555",phone:"5555",tasks:3,date:"2026-01-04"},
 {name:"ASSSS",phone:"8714943979",tasks:5,date:"2026-01-03"},
 {name:"ASSSS",phone:"8714943979",tasks:3,date:"2026-01-04"},
 {name:"Al ameen",phone:"989501265",tasks:5,date:"2026-01-03"},
 {name:"Mama",phone:"9497478001",tasks:5,date:"2026-01-03"},
 {name:"noushad",phone:"9995728698",tasks:5,date:"2026-01-04"},
 {name:"Abin",phone:"8289958063",tasks:4,date:"2026-01-03"},
];

// bonus storage (localStorage)
function getBonus(key){
 return Number(localStorage.getItem("bonus_"+key)||0);
}
function setBonus(key,val){
 localStorage.setItem("bonus_"+key,val);
}

// ---------------- APPLY FILTER ----------------
function apply(){
 const f = from.value;
 const t = to.value;
 if(!f || !t) return alert("Select date range");

 const rangeKey = f+"_"+t;

 const filtered = votes.filter(v=>v.date>=f && v.date<=t);

 // group by user
 let map = {};
 filtered.forEach(v=>{
  if(!map[v.phone]) map[v.phone]={name:v.name,phone:v.phone,points:0};
  map[v.phone].points += v.tasks;
 });

 // convert array
 let arr = Object.values(map);

 // sort desc
 arr.sort((a,b)=>b.points-a.points);

 // dense ranking
 let rank=0,last=-1;
 arr.forEach(u=>{
  if(u.points!==last){rank++;last=u.points}
  u.rank=rank;
 });

 // render summary
 summary.innerHTML="";
 arr.forEach(u=>{
  const bonus = getBonus(rangeKey+"_"+u.phone);
  const total = u.points + bonus;

  let cls = u.rank==1?"rank1":u.rank==2?"rank2":u.rank==3?"rank3":"";

  summary.innerHTML+=`
   <tr class="${cls}">
    <td>${u.rank}</td>
    <td>${u.name}</td>
    <td>${u.phone}</td>
    <td>${u.points}</td>
    <td>${f} to ${t}</td>
    <td>${total}</td>
    <td>
      ${u.rank==1 && bonus==0
        ? `<button class="bonus" onclick="addBonus('${rangeKey}','${u.phone}')">+10</button>`
        : bonus>0 ? "Added" : ""}
    </td>
   </tr>
  `;
 });

 // details
 details.innerHTML="";
 filtered.forEach((v,i)=>{
  details.innerHTML+=`
   <tr>
    <td>${v.name}</td>
    <td>${v.phone}</td>
    <td>${v.tasks}</td>
    <td>${v.date}</td>
    <td><button class="remove" onclick="del(${i})">X</button></td>
   </tr>
  `;
 });
}

// ---------------- BONUS ----------------
function addBonus(range,phone){
 setBonus(range+"_"+phone,10);
 apply();
}

// ---------------- DELETE VOTE ONLY ----------------
function del(i){
 if(confirm("Delete this vote?")){
  votes.splice(i,1);
  apply();
 }
}
</script>

</body>
</html>
