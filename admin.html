<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin – Weekly Voting & Bonus</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{background:#fff;padding:20px;border-radius:10px;max-width:1200px;margin:auto}
h2{text-align:center}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f3f4f6}
.rank1{background:#fde68a}
.rank2{background:#dbeafe}
.rank3{background:#fef3c7}
button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.small{font-size:13px;color:#555}
</style>
</head>

<body>
<div class="box">

<h2>Admin – Weekly Voting & Bonus</h2>

From <input type="date" id="from">
To <input type="date" id="to">
<button onclick="apply()">Apply</button>

<p class="small">
✔ Bonus = +10 (once per user per week) <br>
✔ Votes add anytime → Total auto updates
</p>

<h3>Summary</h3>
<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Phone</th>
<th>Week Points</th>
<th>Date Range</th>
<th>Total (with Bonus)</th>
<th>Bonus</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<h3>Detailed Votes</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Points</th>
<th>Date</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>

</div>

<script>
// ---------------- SAMPLE DATA (replace with Firebase later if needed) ----------------
let votes = [
 {name:"User A",phone:"111",points:40,date:"2026-01-02"},
 {name:"User A",phone:"111",points:5,date:"2026-01-04"},
 {name:"User B",phone:"222",points:30,date:"2026-01-03"},
 {name:"User C",phone:"333",points:25,date:"2026-01-04"},
];

// ---------------- BONUS STORAGE (STATIC) ----------------
function getBonus(key){
 return Number(localStorage.getItem("bonus_"+key) || 0);
}
function setBonus(key,val){
 localStorage.setItem("bonus_"+key, val);
}

// ---------------- APPLY FILTER ----------------
function apply(){
 const f = from.value;
 const t = to.value;
 if(!f || !t){ alert("Select date range"); return; }

 const rangeKey = f+"_"+t;

 // filter votes by date
 const filtered = votes.filter(v=>v.date>=f && v.date<=t);

 // group by user
 let map = {};
 filtered.forEach(v=>{
  if(!map[v.phone]){
    map[v.phone]={name:v.name,phone:v.phone,points:0};
  }
  map[v.phone].points += v.points; // dynamic
 });

 let users = Object.values(map);

 // sort by WEEK POINTS ONLY
 users.sort((a,b)=>b.points-a.points);

 // dense ranking
 let rank=0,last=null;
 users.forEach((u,i)=>{
  if(u.points!==last){rank++;last=u.points}
  u.rank=rank;
 });

 // render summary
 summary.innerHTML="";
 users.forEach(u=>{
  const bonus = getBonus(rangeKey+"_"+u.phone); // static
  const total = u.points + bonus;               // 🔥 dynamic total

  let cls = u.rank==1?"rank1":u.rank==2?"rank2":u.rank==3?"rank3":"";

  summary.innerHTML+=`
  <tr class="${cls}">
    <td>${u.rank}</td>
    <td>${u.name}</td>
    <td>${u.phone}</td>
    <td>${u.points}</td>
    <td>${f} to ${t}</td>
    <td>${total}</td>
    <td>
      ${u.rank==1 && bonus==0
        ? `<button class="green" onclick="addBonus('${rangeKey}','${u.phone}')">+10</button>`
        : bonus>0 ? "Added" : ""}
    </td>
  </tr>`;
 });

 // render details
 details.innerHTML="";
 filtered.forEach((v,i)=>{
  details.innerHTML+=`
  <tr>
    <td>${v.name}</td>
    <td>${v.phone}</td>
    <td>${v.points}</td>
    <td>${v.date}</td>
    <td><button class="red" onclick="delVote(${i})">X</button></td>
  </tr>`;
 });
}

// ---------------- BONUS ----------------
function addBonus(range,phone){
 setBonus(range+"_"+phone,10); // static bonus
 apply();                      // 🔥 recalc totals
}

// ---------------- DELETE VOTE ----------------
function delVote(i){
 if(confirm("Delete vote?")){
  votes.splice(i,1);
  apply(); // 🔥 totals update
 }
}
</script>

</body>
</html>
