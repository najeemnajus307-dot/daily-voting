<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.wrap{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:230px;background:#0f172a;color:#fff;padding:12px;
}
.brand{
  font-weight:bold;text-align:center;
  margin:10px 0 20px;font-size:15px
}
.nav a{
  display:block;color:#cbd5f5;text-decoration:none;
  padding:10px;border-radius:6px;margin:4px 0;cursor:pointer
}
.nav a.active,.nav a:hover{
  background:#1e293b;color:#fff
}

/* MAIN */
.main{flex:1;padding:16px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{
  background:var(--card);padding:14px;border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12)
}
table{width:100%;border-collapse:collapse}
th,td{
  border:1px solid #ddd;padding:6px;
  text-align:center;font-size:14px
}
th{background:var(--pri);color:#fff}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}
.btn{
  border:none;border-radius:6px;
  padding:6px 10px;cursor:pointer
}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.hidden{display:none}
input,select,textarea{
  padding:6px;width:100%;margin-top:4px
}
textarea{resize:vertical}

@media(max-width:800px){
  .wrap{flex-direction:column}
  .sidebar{width:100%}
}
</style>
</head>

<body>
<div class="wrap">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">FAITH & FITNESS<br>ADMIN</div>
  <div class="nav">
    <a data-page="dash" class="active">Dashboard</a>
    <a data-page="task">Task-wise Report</a>
    <a data-page="user">User-wise Report</a>
    <a data-page="notify">🔔 Notification</a>
    <a onclick="location.href='task-editor.html'">Task Editor</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="card">
    <h3>Dashboard</h3>
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th>
          <th>Phone</th><th>Total Points</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK REPORT -->
<section id="page-task" class="hidden">
  <div class="card">
    <h3>Task-wise Report</h3>
    <p>Existing logic intact</p>
  </div>
</section>

<!-- USER REPORT -->
<section id="page-user" class="hidden">
  <div class="card">
    <h3>User-wise Report</h3>
    <p>Existing logic intact</p>
  </div>
</section>

<!-- 🔔 NOTIFICATION PAGE -->
<section id="page-notify" class="hidden">
  <div class="card">
    <h2>🔔 Notification Settings</h2>

    <label>
      <input type="checkbox" id="n_enable">
      Enable notifications
    </label>

    <br><br>

    <label>Notification Title</label>
    <input id="n_title" placeholder="Eg: Voting Reminder">

    <br><br>

    <label>Notification Message</label>
    <textarea id="n_msg" rows="4"
      placeholder="Eg: Please complete today's voting"></textarea>

    <br><br>

    <label>Repeat gap (hours)</label>
    <input type="number" id="n_gap" min="1" value="2">

    <br><br>

    <button class="btn add" onclick="saveNotification()">Save</button>
    <span id="n_status" style="margin-left:10px"></span>
  </div>
</section>

</main>
</div>

<script type="module">
/* PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore, collection, getDocs,
  doc, setDoc, getDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* NAV LOGIC */
document.querySelectorAll(".nav a[data-page]").forEach(a=>{
  a.onclick=()=>{
    document.querySelectorAll(".nav a")
      .forEach(x=>x.classList.remove("active"));
    a.classList.add("active");

    document.querySelectorAll("section")
      .forEach(s=>s.classList.add("hidden"));

    document.getElementById("page-"+a.dataset.page)
      .classList.remove("hidden");

    if(a.dataset.page==="notify") loadNotification();
  };
});

/* DASHBOARD (SIMPLE VIEW) */
async function loadDashboard(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));
  const map = {};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    const d=u.data();
    rows.push({
      name:d.name, phone:d.phone,
      total:map[d.phone]||0
    });
  });

  rows.sort((a,b)=>b.total-a.total);
  dashBody.innerHTML="";
  let sl=1,rank=0,prev=null;

  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total;

    dashBody.innerHTML+=`
      <tr class="${rank===1?'rank1':rank===2?'rank2':rank===3?'rank3':''}">
        <td>${sl++}</td>
        <td>${rank}</td>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.total}</td>
      </tr>`;
  });
}

/* 🔔 LOAD NOTIFICATION */
async function loadNotification(){
  const ref = doc(db,"admin_notifications","config");
  const snap = await getDoc(ref);
  if(snap.exists()){
    const d = snap.data();
    n_enable.checked = d.enabled;
    n_title.value = d.title;
    n_msg.value = d.message;
    n_gap.value = d.gapHours;
  }
}

/* 🔔 SAVE NOTIFICATION */
window.saveNotification = async ()=>{
  await setDoc(doc(db,"admin_notifications","config"),{
    enabled: n_enable.checked,
    title: n_title.value,
    message: n_msg.value,
    gapHours: Number(n_gap.value),
    updatedAt: new Date().toISOString()
  });
  n_status.innerText="Saved ✅";
};

/* INIT */
loadDashboard();
</script>

</body>
</html>
