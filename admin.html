<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Voting Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
h2,h3{text-align:center;}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  margin-bottom:20px;
}
.controls{
  text-align:center;
  margin-bottom:10px;
}
input,select,button{
  padding:8px;
  margin:5px;
}
button{cursor:pointer;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047;}
.rank2{background:#e5e7eb;}
.rank3{background:#fcd34d;}
.delBtn{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
}
.count{
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}
.summary{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.summary .card{
  background:#f8fafc;
  padding:10px 14px;
  border-radius:8px;
  min-width:160px;
  text-align:center;
  box-shadow:0 0 6px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<div class="count" id="totalCount">Total Voters: Loading...</div>

<!-- 📅 DATE FILTER -->
<div class="box controls">
  From <input type="date" id="fromDate">
  To <input type="date" id="toDate">
  <button onclick="applyFilter()">Apply</button>
  <button onclick="resetFilter()">Reset</button>
</div>

<!-- 📊 DAILY / MONTHLY SUMMARY -->
<div class="box">
  <h3>Summary</h3>
  <div class="controls">
    <select id="summaryType" onchange="renderSummary()">
      <option value="daily">Daily</option>
      <option value="monthly">Monthly</option>
    </select>
  </div>
  <div class="summary" id="summaryCards"></div>
</div>

<!-- 🏆 TOP 3 RANK -->
<div class="box">
  <h3>Top 3 Ranking</h3>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- 📋 ALL VOTING REPORT -->
<div class="box">
  <h3>All Voting Report (High → Low)</h3>
  <div class="controls">
    <button onclick="exportExcel()">Export to Excel</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];
let filteredVotes = [];

/* LOAD ALL VOTES */
async function loadVotes(){
  allVotes = [];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    allVotes.push({ id:d.id, ...d.data() });
  });

  document.getElementById("totalCount").innerText =
    "Total Voters : " + allVotes.length;

  filteredVotes = [...allVotes];
  renderAll(filteredVotes);
}
loadVotes();

/* FILTER */
window.applyFilter = ()=>{
  const from = document.getElementById("fromDate").value;
  const to   = document.getElementById("toDate").value;

  filteredVotes = allVotes.filter(v=>{
    if(from && v.date < from) return false;
    if(to && v.date > to) return false;
    return true;
  });

  renderAll(filteredVotes);
};
window.resetFilter = ()=>{
  document.getElementById("fromDate").value="";
  document.getElementById("toDate").value="";
  filteredVotes = [...allVotes];
  renderAll(filteredVotes);
};

/* RENDER BOTH */
function renderAll(votes){
  if(votes.length===0){
    rankBody.innerHTML="";
    reportBody.innerHTML="";
    summaryCards.innerHTML="";
    return;
  }
  const sorted = [...votes].sort((a,b)=>b.totalPoints - a.totalPoints);
  renderRank(sorted);
  renderReport(sorted);
  renderSummary();
}

/* TOP 3 RANK (same points → same rank) */
function renderRank(votes){
  const tbody = document.getElementById("rankBody");
  tbody.innerHTML="";
  let rank=0, last=null;

  for(const v of votes){
    if(v.totalPoints !== last){
      rank++;
      last = v.totalPoints;
    }
    if(rank>3) break;

    const cls = rank===1?"rank1":rank===2?"rank2":"rank3";
    tbody.innerHTML += `
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${v.name || "-"}</td>
        <td>${v.phone || "-"}</td>
        <td>${v.totalPoints}</td>
      </tr>`;
  }
}

/* FULL REPORT (WITH DELETE) */
function renderReport(votes){
  const tbody = document.getElementById("reportBody");
  tbody.innerHTML="";
  votes.forEach(v=>{
    tbody.innerHTML += `
      <tr>
        <td>${v.name || "-"}</td>
        <td>${v.phone || "-"}</td>
        <td>${v.totalPoints}</td>
        <td>${v.date}</td>
        <td><button class="delBtn" onclick="deleteVote('${v.id}')">Delete</button></td>
      </tr>`;
  });
}

/* DELETE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  loadVotes();
};

/* SUMMARY (DAILY / MONTHLY) */
window.renderSummary = ()=>{
  const type = document.getElementById("summaryType").value;
  const cards = document.getElementById("summaryCards");
  cards.innerHTML="";

  const map = {};
  filteredVotes.forEach(v=>{
    const key = (type==="daily")
      ? v.date
      : v.date.slice(0,7); // YYYY-MM
    if(!map[key]) map[key] = { voters:0, points:0 };
    map[key].voters += 1;
    map[key].points += (v.totalPoints||0);
  });

  Object.keys(map).sort().forEach(k=>{
    cards.innerHTML += `
      <div class="card">
        <div><b>${k}</b></div>
        <div>Voters: ${map[k].voters}</div>
        <div>Points: ${map[k].points}</div>
      </div>`;
  });
};

/* EXPORT TO EXCEL (CSV) */
window.exportExcel = ()=>{
  if(filteredVotes.length===0){ alert("No data"); return; }
  const rows = [
    ["Name","Phone","Points","Date"],
    ...filteredVotes.map(v=>[
      v.name||"", v.phone||"", v.totalPoints||0, v.date||""
    ])
  ];
  const csv = rows.map(r=>r.join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "voting_report.csv";
  a.click();
};
</script>

</body>
</html>
