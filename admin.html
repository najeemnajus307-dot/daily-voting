<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  margin:0;
}
.sidebar{
  width:220px;
  background:#0f172a;
  color:#fff;
  height:100vh;
  position:fixed;
  padding:20px;
}
.sidebar h2{
  text-align:center;
  font-size:18px;
}
.sidebar a{
  display:block;
  padding:10px;
  color:#cbd5f5;
  text-decoration:none;
  border-radius:6px;
  margin-top:5px;
}
.sidebar a.active,
.sidebar a:hover{
  background:#1e293b;
  color:#fff;
}

.main{
  margin-left:240px;
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#2563eb;
  color:#fff;
}
.delete{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
}
select{
  padding:6px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>FAITH & FITNESS<br>ADMIN</h2>
  <a class="active">User-wise Report</a>
</div>

<div class="main">

<div class="card">
  <b>User:</b>
  <select id="userSelect"></select>
  <button onclick="loadUserVotes()">View</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Points</th>
        <th>Source</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 👤 LOAD USERS */
async function loadUsers(){
  const snap = await getDocs(collection(db,"users"));
  userSelect.innerHTML="";
  snap.forEach(d=>{
    const o=document.createElement("option");
    o.value=d.data().phone;
    o.textContent=d.data().name;
    userSelect.appendChild(o);
  });
}
loadUsers();

/* 📅 DATE FIX FUNCTION */
function getSafeDate(v){
  if(v.date) return v.date;
  if(v.createdAt) return v.createdAt.split("T")[0];
  return "Old Vote";
}

/* 📋 LOAD USER VOTES */
window.loadUserVotes = async()=>{
  tbody.innerHTML="";
  const phone = userSelect.value;

  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );

  if(snap.empty){
    tbody.innerHTML =
      `<tr><td colspan="4">No votes</td></tr>`;
    return;
  }

  snap.forEach(d=>{
    const v=d.data();
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${getSafeDate(v)}</td>
      <td>${v.points}</td>
      <td>${v.source||"-"}</td>
      <td>
        <button class="delete"
          onclick="deleteVote('${d.id}')">X</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
};

/* ❌ DELETE VOTE */
window.deleteVote = async(id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  loadUserVotes();
};
</script>

</body>
</html>
