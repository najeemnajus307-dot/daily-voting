<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
}

/* LAYOUT */
.wrapper{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:230px;
  background:#0f172a;
  color:#fff;
  padding:20px 12px;
}
.sidebar h2{
  text-align:center;
  margin-bottom:25px;
  font-size:18px;
}
.menu a{
  display:block;
  padding:10px 12px;
  margin-bottom:6px;
  color:#cbd5f5;
  text-decoration:none;
  border-radius:6px;
}
.menu a.active,
.menu a:hover{
  background:#1e293b;
  color:#fff;
}

/* CONTENT */
.content{
  flex:1;
  padding:18px;
}
.card{
  background:#fff;
  padding:16px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  margin-bottom:16px;
}

/* DASHBOARD BOXES */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}
.stat{
  background:#e5e7eb;
  padding:14px;
  border-radius:8px;
  text-align:center;
}
.stat b{font-size:22px}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
  text-align:center;
}
th{background:#2563eb;color:#fff}
button{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.danger{background:#dc2626;color:#fff}
</style>
</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FAITH & FITNESS<br>ADMIN</h2>
  <div class="menu">
    <a href="#" class="active" onclick="show('dash')">Dashboard</a>
    <a href="#" onclick="show('task')">Task-wise Report</a>
    <a href="#" onclick="show('user')">User-wise Report</a>
    <a href="#" onclick="show('editor')">Task Editor</a>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dash" class="card">
  <h3>Dashboard</h3>
  <div class="stats">
    <div class="stat">Users<br><b id="uCnt">0</b></div>
    <div class="stat">Total Votes<br><b id="vCnt">0</b></div>
    <div class="stat">Today Votes<br><b id="tCnt">0</b></div>
    <div class="stat">Total Points<br><b id="pCnt">0</b></div>
  </div>
</div>

<!-- TASK REPORT -->
<div id="task" class="card" style="display:none">
  <h3>Task-wise Report</h3>
  <select id="taskSel"></select>
  <button onclick="loadTask()">View</button>
  <div id="taskOut"></div>
</div>

<!-- USER REPORT -->
<div id="user" class="card" style="display:none">
  <h3>User-wise Report</h3>
  <select id="userSel"></select>
  <button onclick="loadUser()">View</button>
  <table>
    <thead>
      <tr><th>Date</th><th>Points</th><th>Source</th><th>Delete</th></tr>
    </thead>
    <tbody id="userOut"></tbody>
  </table>
</div>

<!-- TASK EDITOR -->
<div id="editor" class="card" style="display:none">
  <h3>Task Editor</h3>
  <input id="tText" placeholder="Task text">
  <input id="tPts" type="number" placeholder="Points">
  <button onclick="addTask()">Add Task</button>
  <ul id="taskList"></ul>
</div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* PASSWORD */
if(prompt("Admin password")!=="5"){
  location.href="index.html";
}

/* FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* NAV */
window.show = (id)=>{
  ["dash","task","user","editor"].forEach(s=>{
    document.getElementById(s).style.display =
      s===id?"block":"none";
  });
  document.querySelectorAll(".menu a")
    .forEach(a=>a.classList.remove("active"));
  event.target.classList.add("active");
};

/* DASHBOARD */
async function loadDash(){
  const u = await getDocs(collection(db,"users"));
  const v = await getDocs(collection(db,"votes"));
  let tp=0,today=0;
  const d=new Date().toISOString().split("T")[0];
  v.forEach(x=>{
    tp+=Number(x.data().points||0);
    if(x.data().date===d) today++;
  });
  uCnt.innerText=u.size;
  vCnt.innerText=v.size;
  pCnt.innerText=tp;
  tCnt.innerText=today;
}
loadDash();

/* TASK LIST */
async function loadTasks(){
  taskSel.innerHTML="";
  taskList.innerHTML="";
  const s=await getDocs(collection(db,"tasks"));
  s.forEach(d=>{
    taskSel.innerHTML+=`<option>${d.data().text}</option>`;
    taskList.innerHTML+=`<li>${d.data().text} (${d.data().points})</li>`;
  });
}
loadTasks();

/* TASK REPORT */
window.loadTask = async()=>{
  taskOut.innerHTML="";
  const name=taskSel.value;
  const v=await getDocs(collection(db,"votes"));
  v.forEach(d=>{
    if(d.data().task===name){
      taskOut.innerHTML+=`${d.data().phone} – ${d.data().points}<br>`;
    }
  });
};

/* USER LIST */
async function loadUsers(){
  const u=await getDocs(collection(db,"users"));
  userSel.innerHTML="";
  u.forEach(d=>{
    userSel.innerHTML+=
      `<option value="${d.data().phone}">
        ${d.data().name}
      </option>`;
  });
}
loadUsers();

/* USER REPORT */
window.loadUser = async()=>{
  userOut.innerHTML="";
  const phone=userSel.value;
  const v=await getDocs(collection(db,"votes"));
  v.forEach(d=>{
    if(d.data().phone===phone){
      userOut.innerHTML+=`
        <tr>
          <td>${d.data().date||"-"}</td>
          <td>${d.data().points}</td>
          <td>${d.data().source}</td>
          <td>
            <button class="danger"
              onclick="del('${d.id}')">X</button>
          </td>
        </tr>`;
    }
  });
};

/* DELETE */
window.del = async(id)=>{
  if(confirm("Delete vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadDash();
    loadUser();
  }
};

/* ADD TASK */
window.addTask = async()=>{
  await addDoc(collection(db,"tasks"),{
    text:tText.value,
    points:Number(tPts.value)
  });
  tText.value="";
  tPts.value="";
  loadTasks();
};
</script>

</body>
</html>
