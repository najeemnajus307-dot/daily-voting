<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    padding:20px;
}
.box{
    background:#fff;
    max-width:1100px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}
h2{text-align:center}

input,button{
    padding:6px 10px;
    margin:5px;
}
button{cursor:pointer}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{background:#f3f4f6}

.rank1{background:#fde68a;font-weight:bold}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}

.logout{
    float:right;
    background:#dc2626;
    color:white;
    border:none;
}
.hidden{display:none}
</style>
</head>
<body>

<!-- 🔐 LOGIN -->
<div class="box" id="loginBox">
    <h2>Admin Login</h2>
    <input id="adminUser" placeholder="Username"><br>
    <input id="adminPass" type="password" placeholder="Password"><br>
    <button onclick="adminLogin()">Login</button>
</div>

<!-- 📊 REPORT -->
<div class="box hidden" id="reportBox">
    <button class="logout" onclick="logout()">Logout</button>
    <h2>Admin Voting Report</h2>

    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <button onclick="applyFilter()">Apply Filter</button>
    <button onclick="exportExcel()">Date-wise Excel</button>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Total Tasks</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <h3 id="totalVotes"></h3>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 ADMIN CREDENTIALS */
const ADMIN_USER = "admin";
const ADMIN_PASS = "admin123";

/* 🔐 LOGIN CHECK */
if(localStorage.getItem("adminLogged")==="yes"){
    showReport();
}

window.adminLogin = function(){
    if(adminUser.value===ADMIN_USER && adminPass.value===ADMIN_PASS){
        localStorage.setItem("adminLogged","yes");
        showReport();
    }else{
        alert("Wrong admin credentials");
    }
};

function showReport(){
    loginBox.classList.add("hidden");
    reportBox.classList.remove("hidden");
    loadData();
}

window.logout = function(){
    localStorage.removeItem("adminLogged");
    location.reload();
};

/* 📊 LOAD & FILTER */
let allVotes = [];

async function loadData(){
    allVotes=[];
    const snap = await getDocs(collection(db,"votes"));
    snap.forEach(d=>allVotes.push(d.data()));
    applyFilter();
}

window.applyFilter = function(){
    let from = fromDate.value;
    let to   = toDate.value;

    let filtered = allVotes.filter(v=>{
        if(!from || !to) return true;
        return v.date >= from && v.date <= to;
    });

    buildRanking(filtered);
};

/* 🏆 USER TOTAL + RANKING */
function buildRanking(data){
    let map = {};

    data.forEach(v=>{
        let key = v.phone;
        let count = Object.values(v.tasks).filter(x=>x).length;
        if(!map[key]){
            map[key]={name:v.name, phone:v.phone, total:0};
        }
        map[key].total += count;
    });

    let arr = Object.values(map).sort((a,b)=>b.total-a.total);

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML="";

    let rank=0, lastScore=null, displayRank=0;
    let grandTotal=0;

    arr.forEach(u=>{
        grandTotal+=u.total;

        if(u.total!==lastScore){
            rank++;
            displayRank=rank;
            lastScore=u.total;
        }

        let tr=document.createElement("tr");
        if(displayRank===1) tr.className="rank1";
        else if(displayRank===2) tr.className="rank2";
        else if(displayRank===3) tr.className="rank3";

        tr.innerHTML=`
            <td>${displayRank}</td>
            <td>${u.name}</td>
            <td>${u.phone}</td>
            <td>${u.total}</td>
        `;
        tbody.appendChild(tr);
    });

    totalVotes.innerText="TOTAL TASKS : "+grandTotal;
}

/* 📤 EXCEL */
window.exportExcel = function(){
    let rows=[["Rank","Name","Phone","Total Tasks"]];
    document.querySelectorAll("#tableBody tr").forEach(tr=>{
        let cols=[...tr.children].map(td=>td.innerText);
        rows.push(cols);
    });

    let csv = rows.map(r=>r.join(",")).join("\n");
    let blob = new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="admin-report.csv";
    a.click();
};
</script>

</body>
</html>
