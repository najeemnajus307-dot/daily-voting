<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
.hidden{display:none}
.main{padding:16px;padding-bottom:80px}
.card{background:#fff;padding:12px;margin-bottom:12px;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#2563eb;color:#fff}
.btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer}
.add{background:#16a34a;color:#fff}
.del{background:#dc2626;color:#fff}
.ban{background:#facc15}
.unban{background:#22c55e;color:#fff}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;color:#fff;
  display:flex;justify-content:space-around;
  padding:8px 0;z-index:9999
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<div class="main">

<!-- DASHBOARD -->
<section id="dash">
  <div class="card">
    From <input type="date" id="d_from">
    To <input type="date" id="d_to">
    <label>
      <input type="checkbox" id="hide0"> Hide 0 (only not voted)
    </label>
    <button class="btn" onclick="loadDash()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Total</th><th>Add</th></tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK -->
<section id="task" class="hidden">
  <div class="card">
    Task <select id="t_task"></select>
    Date <input type="date" id="t_date">
    <button class="btn" onclick="loadTask()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Points</th><th>Add</th></tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
</section>

<!-- USERS -->
<section id="users" class="hidden">
  <div class="card">
    <table>
      <thead>
        <tr><th>User</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody id="userBody"></tbody>
    </table>
  </div>
</section>

<!-- TASK EDITOR -->
<section id="editor" class="hidden">
  <div class="card">
    Task <input id="newTask">
    <button class="btn add" onclick="addTask()">Add</button>
  </div>

  <div class="card">
    <ul id="taskList"></ul>
  </div>
</section>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-nav">
  <button class="active" onclick="show('dash')">Dashboard</button>
  <button onclick="show('task')">Task</button>
  <button onclick="show('users')">Users</button>
  <button onclick="show('editor')">Task Editor</button>
</div>

<script type="module">
if(prompt("Admin password")!=="5") location.href="index.html";

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, updateDoc, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}

/* DASHBOARD */
async function loadDash(){
  const users=await getDocs(collection(db,"users"));
  const votes=await getDocs(collection(db,"votes"));
  const map={}, voted={};

  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
    voted[x.phone]=true;
  });

  dashBody.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    if(hide0.checked && !voted[p]) return;
    dashBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${p}</td>
        <td>${map[p]||0}</td>
        <td>
          <input id="p_${p}" type="number" style="width:50px">
          <button class="btn add" onclick="addPoint('${p}')">+</button>
        </td>
      </tr>`;
  });
}
window.addPoint=async(p)=>{
  const v=document.getElementById("p_"+p).value;
  await addDoc(collection(db,"votes"),{
    phone:p,points:Number(v),
    date:new Date().toISOString().split("T")[0]
  });
  loadDash();
};

/* TASK */
async function loadTask(){
  const users=await getDocs(collection(db,"users"));
  taskBody.innerHTML="";
  users.forEach(u=>{
    taskBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${u.data().phone}</td>
        <td>0</td>
        <td>-</td>
      </tr>`;
  });
}

/* USERS */
async function loadUsers(){
  const users=await getDocs(collection(db,"users"));
  userBody.innerHTML="";
  users.forEach(u=>{
    const d=u.data(),active=d.active!==false;
    userBody.innerHTML+=`
      <tr>
        <td>${d.name}<br>${d.phone}</td>
        <td>${active?"Active":"Banned"}</td>
        <td>
          <button class="btn ${active?"ban":"unban"}"
            onclick="toggle('${u.id}',${active})">
            ${active?"Ban":"Unban"}
          </button>
          <button class="btn del"
            onclick="delUser('${u.id}')">Delete</button>
        </td>
      </tr>`;
  });
}
window.toggle=async(id,a)=>{
  await updateDoc(doc(db,"users",id),{active:!a});
  loadUsers();
};
window.delUser=async(id)=>{
  if(confirm("Delete user?")){
    await deleteDoc(doc(db,"users",id));
    loadUsers();
  }
};

/* TASK EDITOR */
async function loadTasks(){
  const tasks=await getDocs(collection(db,"tasks"));
  taskList.innerHTML="";
  tasks.forEach(t=>{
    taskList.innerHTML+=`
      <li>${t.data().text}
      <button onclick="delTask('${t.id}')">X</button></li>`;
  });
}
window.addTask=async()=>{
  await addDoc(collection(db,"tasks"),{text:newTask.value});
  newTask.value="";
  loadTasks();
};
window.delTask=async(id)=>{
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};

/* INIT */
loadDash(); loadUsers(); loadTasks();
</script>
</body>
</html>
