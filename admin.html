<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>
  <h2>Admin Panel</h2>

  <table border="1">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Water</th>
        <th>Warmup</th>
        <th>Steps</th>
        <th>Pushup</th>
      </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>

  <button onclick="clearAll()">Clear All</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } 
    from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
      authDomain: "daily-voting-793ee.firebaseapp.com",
      projectId: "daily-voting-793ee",
      storageBucket: "daily-voting-793ee.appspot.com",
      messagingSenderId: "1065830068376",
      appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadData() {
      const snap = await getDocs(collection(db, "votes"));
      data.innerHTML = "";
      snap.forEach(d => {
        const v = d.data();
        data.innerHTML += `
          <tr>
            <td>${v.name}</td>
            <td>${v.phone}</td>
            <td>${v.water}</td>
            <td>${v.warmup}</td>
            <td>${v.steps}</td>
            <td>${v.pushup}</td>
          </tr>`;
      });
    }

    window.clearAll = async function () {
      const snap = await getDocs(collection(db, "votes"));
      snap.forEach(d => deleteDoc(doc(db, "votes", d.id)));
      loadData();
    }

    loadData();
  </script>
</body>
</html>
