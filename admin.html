<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faith & Fitness – Admin Panel</title>

<style>
:root{
  --bg:#f1f5f9; --card:#fff; --pri:#2563eb;
  --ok:#16a34a; --bad:#dc2626; --dark:#0f172a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.wrap{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:230px;background:var(--dark);color:#fff;padding:12px;
}
.brand{
  text-align:center;font-weight:bold;margin:10px 0 18px
}
.nav a{
  display:block;padding:10px;margin:5px 0;
  color:#cbd5f5;text-decoration:none;border-radius:6px;
  cursor:pointer
}
.nav a.active,.nav a:hover{
  background:#1e293b;color:#fff
}

/* MAIN */
.main{flex:1;padding:16px}
.hidden{display:none}

.card{
  background:var(--card);
  padding:14px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.12);
  margin-bottom:12px
}

table{
  width:100%;border-collapse:collapse
}
th,td{
  border:1px solid #ddd;
  padding:6px;text-align:center;font-size:14px
}
th{background:var(--pri);color:#fff}

.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

input,select,textarea{
  padding:6px;width:100%;margin-top:6px
}
textarea{resize:vertical}

.btn{
  padding:8px 12px;
  border:none;border-radius:6px;
  cursor:pointer;margin-top:8px
}
.save{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.add{background:var(--ok);color:#fff}

@media(max-width:800px){
  .wrap{flex-direction:column}
  .sidebar{width:100%}
}
</style>
</head>

<body>
<div class="wrap">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">FAITH & FITNESS<br>ADMIN</div>
  <div class="nav">
    <a class="active" data-page="dash">Dashboard</a>
    <a data-page="notify">Notifications</a>
    <a onclick="location.href='task-editor.html'">Task Editor</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="page-dash">
  <div class="card">
    <h3>User Points Dashboard</h3>
    <table>
      <thead>
        <tr>
          <th>SL</th><th>Rank</th><th>Name</th>
          <th>Phone</th><th>Total</th><th>Add</th>
        </tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- NOTIFICATION SETTINGS -->
<section id="page-notify" class="hidden">
  <div class="card">
    <h3>🔔 Notification Settings</h3>

    <label>
      <input type="checkbox" id="notifEnabled">
      Enable Voting Reminders
    </label>

    <label>Reminder Message</label>
    <textarea id="notifMessage" rows="3"
      placeholder="You haven't voted yet. Please vote now 🙏">
    </textarea>

    <label>Reminder Gap (hours)</label>
    <select id="notifGap">
      <option value="1">Every 1 hour</option>
      <option value="2">Every 2 hours</option>
      <option value="3">Every 3 hours</option>
      <option value="4">Every 4 hours</option>
    </select>

    <button class="btn save" onclick="saveNotificationSettings()">
      Save Settings
    </button>

    <div id="saveStatus"></div>
  </div>
</section>

</main>
</div>

<script type="module">
/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, setDoc, doc, getDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* NAVIGATION */
document.querySelectorAll(".nav a[data-page]").forEach(a=>{
  a.onclick=()=>{
    document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+a.dataset.page).classList.remove("hidden");
  }
});

/* DASHBOARD */
async function loadDashboard(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  const map={};
  votes.forEach(v=>{
    const x=v.data();
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
  });

  let rows=[];
  users.forEach(u=>{
    rows.push({
      name:u.data().name,
      phone:u.data().phone,
      total:map[u.data().phone]||0
    });
  });

  rows.sort((a,b)=>b.total-a.total);

  let rank=0,prev=null,sl=0;
  dashBody.innerHTML="";
  rows.forEach(r=>{
    if(prev===null||r.total<prev) rank++;
    prev=r.total; sl++;
    dashBody.innerHTML+=`
      <tr class="${rank===1?'rank1':rank===2?'rank2':rank===3?'rank3':''}">
        <td>${sl}</td>
        <td>${rank}</td>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.total}</td>
        <td>
          <input id="p_${r.phone}" type="number" style="width:60px">
          <button class="btn add" onclick="addPoint('${r.phone}')">+</button>
        </td>
      </tr>`;
  });
}
window.addPoint=async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter valid points");
  await addDoc(collection(db,"votes"),{
    phone,points:v,date:new Date().toISOString().split("T")[0],
    source:"admin"
  });
  loadDashboard();
};

/* 🔔 NOTIFICATION SETTINGS */
async function loadNotificationSettings(){
  const ref=doc(db,"settings","notifications");
  const snap=await getDoc(ref);
  if(snap.exists()){
    const d=snap.data();
    notifEnabled.checked=d.enabled;
    notifMessage.value=d.message;
    notifGap.value=d.gap;
  }
}

window.saveNotificationSettings=async()=>{
  await setDoc(doc(db,"settings","notifications"),{
    enabled:notifEnabled.checked,
    message:notifMessage.value,
    gap:Number(notifGap.value),
    updatedAt:new Date().toISOString()
  });
  saveStatus.innerHTML="✅ Saved successfully";
};

/* INIT */
loadDashboard();
loadNotificationSettings();
</script>

</body>
</html>
