<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:15px;
}
h2{text-align:center}

.top{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}
.box{
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.15);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{
  background:#2563eb;
  color:#fff;
}

.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

input[type=number]{width:60px;padding:4px}
button{
  padding:5px 8px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.add{background:#16a34a;color:#fff}
.clear{background:#6b7280;color:#fff}
.export{background:#0284c7;color:#fff}

.note{
  font-size:12px;
  color:#b91c1c;
  margin-top:6px;
}
</style>
</head>

<body>

<h2>Admin Dashboard – Faith & Fitness</h2>

<div class="top">
  <div class="box">Total Users: <b id="totalUsers">0</b></div>
  <div class="box">Shown Users: <b id="shownUsers">0</b></div>
</div>

<div class="box">
  <b>Date Filter (voteDay)</b><br><br>
  From:
  <input type="date" id="from" onchange="load()">
  To:
  <input type="date" id="to" onchange="load()">

  <button class="clear" onclick="clearFilter()">Clear</button>
  <button class="export" onclick="exportCSV()">Export CSV</button>

  <br><br>
  <label>
    <input type="checkbox" id="hideZero" onchange="load()">
    Hide users with NO VOTE
  </label>

  <div class="note">
    ✔ Date filter ON → voted users only  
    ✔ Admin add + User vote → same logic
  </div>
</div>

<br>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
  <th>SL</th>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Points</th>
  <th>Add</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

let CURRENT_ROWS = [];

window.load = async ()=>{
  tbody.innerHTML="";
  CURRENT_ROWS=[];

  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  totalUsers.innerText = usersSnap.size;

  const isDateFilterOn = from.value !== "";

  /* 🔢 BUILD VOTE MAP (voteDay ONLY) */
  const voteMap = {};

  votesSnap.forEach(d=>{
    const v = d.data();

    if(isDateFilterOn){
      if(!v.voteDay) return; // old votes ignore
      const toDate = to.value || from.value;
      if(v.voteDay < from.value || v.voteDay > toDate) return;
    }

    if(!voteMap[v.phone]){
      voteMap[v.phone] = { points:0, count:0 };
    }
    voteMap[v.phone].points += Number(v.points||0);
    voteMap[v.phone].count  += 1;
  });

  /* 🧱 BUILD ROWS */
  if(isDateFilterOn){
    // 👉 ONLY users who voted in that date range
    for(const phone in voteMap){
      const u = usersSnap.docs.find(
        d => d.data().phone === phone
      );
      if(!u) continue;

      CURRENT_ROWS.push({
        name: u.data().name,
        phone,
        total: voteMap[phone].points,
        voted:true
      });
    }
  }else{
    // 👉 ALL users
    usersSnap.forEach(u=>{
      const p = u.data().phone;
      CURRENT_ROWS.push({
        name: u.data().name,
        phone:p,
        total: voteMap[p]?.points || 0,
        voted: voteMap[p]?.count > 0
      });
    });
  }

  /* 🚫 HIDE NO-VOTE USERS */
  if(hideZero.checked){
    CURRENT_ROWS = CURRENT_ROWS.filter(r=>r.voted);
  }

  /* ❌ EMPTY */
  if(CURRENT_ROWS.length === 0){
    tbody.innerHTML =
      `<tr><td colspan="6">No voting data found</td></tr>`;
    shownUsers.innerText = 0;
    return;
  }

  /* 🔽 SORT */
  CURRENT_ROWS.sort((a,b)=>b.total - a.total);

  let rank=0, prev=null, shown=0;

  CURRENT_ROWS.forEach((r,i)=>{
    if(prev===null || r.total < prev) rank++;
    prev = r.total;
    shown++;

    const tr=document.createElement("tr");
    tr.className =
      rank===1?"rank1":
      rank===2?"rank2":
      rank===3?"rank3":"";

    tr.innerHTML=`
      <td>${shown}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input type="number" id="p_${r.phone}">
        <button class="add" onclick="addPoint('${r.phone}')">+</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  shownUsers.innerText = shown;
};

load();

/* ➕ ADMIN ADD POINT (voteDay SAME AS USER) */
window.addPoint = async(phone)=>{
  const v = Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter valid points");

  await addDoc(collection(db,"votes"),{
    phone,
    points:v,
    voteDay: new Date().toISOString().split("T")[0],
    source:"admin",
    realDate: new Date().toISOString()
  });

  load();
};

/* 🧹 CLEAR */
window.clearFilter = ()=>{
  from.value="";
  to.value="";
  load();
};

/* 📤 EXPORT CSV */
window.exportCSV = ()=>{
  if(CURRENT_ROWS.length===0){
    alert("No data to export");
    return;
  }

  let csv="SL,Rank,Name,Phone,Points\n";
  let rank=0, prev=null;

  CURRENT_ROWS.forEach((r,i)=>{
    if(prev===null || r.total < prev) rank++;
    prev=r.total;
    csv+=`${i+1},${rank},"${r.name}",${r.phone},${r.total}\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="faith_fitness_report.csv";
  a.click();
};
</script>

</body>
</html>
