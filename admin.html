<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Reports</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(180deg,#020617,#020617);
  color:#e5e7eb;
}

/* ===== TOP BAR ===== */
.topbar{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:64px;
  background:linear-gradient(90deg,#020617,#0f172a);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:1000;
}
.logo{
  background:#fff;
  padding:4px;
  border-radius:6px;
}
.logo img{height:36px}
.logout{
  color:#ef4444;
  font-weight:600;
  cursor:pointer;
}

/* ===== CONTENT ===== */
.container{
  padding:90px 16px 90px;
  max-width:900px;
  margin:auto;
}

h1{
  margin:0 0 12px;
}

/* ===== FILTER BAR ===== */
.pills{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.pills button{
  background:#0f172a;
  border:none;
  color:#cbd5f5;
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
}
.pills button.active{
  background:#16a34a;
  color:#fff;
}

/* DATE FILTER */
.date-row{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}
.date-row input{
  background:#020617;
  border:1px solid #1e293b;
  color:#fff;
  padding:8px;
  border-radius:8px;
}

/* ===== STATS ===== */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:20px;
}
.stat{
  background:linear-gradient(180deg,#020617,#0f172a);
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  text-align:center;
}
.stat span{
  display:block;
  font-size:28px;
  color:#3b82f6;
  font-weight:700;
}

/* ===== TABLE ===== */
.card{
  background:#fff;
  color:#020617;
  border-radius:16px;
  overflow:hidden;
}
.card h3{
  margin:0;
  padding:14px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:14px;
  border-top:1px solid #e5e7eb;
  text-align:left;
}
th{
  color:#64748b;
  font-size:13px;
}
.points{
  color:#2563eb;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;
  width:100%;
  height:64px;
  background:linear-gradient(90deg,#020617,#0f172a);
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.bottom-nav div{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
}
.bottom-nav .active{
  color:#3b82f6;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo"><img src="logo.png"></div>
  <div class="logout">Logout</div>
</div>

<!-- CONTENT -->
<div class="container">
  <h1>Admin Reports</h1>

  <!-- PILL FILTER -->
  <div class="pills">
    <button class="active">Daily</button>
    <button>Weekly</button>
    <button>Monthly</button>
    <button class="active">Refresh</button>
  </div>

  <!-- DATE -->
  <div class="date-row">
    <input type="date">
    <input type="date">
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      Total Participants
      <span>8</span>
    </div>
    <div class="stat">
      Active in Range
      <span>3</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Participant Overview</h3>
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Total Points</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>najeemnajus307@gmail.com</td>
          <td>N/A</td>
          <td class="points">5</td>
        </tr>
        <tr>
          <td>najeemnajus738@gmail.com</td>
          <td>N/A</td>
          <td class="points">2</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="active">📊<br>Reports</div>
  <div>💪<br>Challenges</div>
  <div>👥<br>Users</div>
  <div>⚙️<br>Settings</div>
</div>

</body>
</html><!-- NOTIFICATION -->
<section id="page-notify" class="hidden">
  <div class="card">
    <h3>🔔 Notification Settings</h3>
    <label><input type="checkbox" id="n_enable"> Enable Reminder</label><br><br>
    <textarea id="n_message" rows="3">You haven't voted yet</textarea><br><br>
    <select id="n_gap">
      <option value="2">Every 2 Hours</option>
      <option value="4">Every 4 Hours</option>
      <option value="6">Every 6 Hours</option>
    </select><br><br>
    <button class="btn add">Save</button>
  </div>
</section>

</main>
</div>

<script type="module">
/* ADMIN PASSWORD */
if(prompt("Admin password")!=="5") location.replace("index.html");

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
getFirestore(app);

/* NAV */
document.querySelectorAll(".nav a[data-page]").forEach(a=>{
  a.onclick=()=>{
    document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
    document.getElementById("page-"+a.dataset.page).classList.remove("hidden");
  }
});

/* USER SUB BAR */
document.querySelectorAll(".user-subbar button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".user-subbar button")
      .forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    console.log("User tab:", btn.dataset.tab);
  };
});
</script>

</body>
  </html>
