<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f1f5f9;--card:#fff;--pri:#2563eb;
  --ok:#16a34a;--bad:#dc2626;--warn:#facc15
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
.hidden{display:none}
.main{padding:16px;padding-bottom:90px}
.card{
  background:#fff;padding:12px;margin-bottom:12px;
  border-radius:10px;box-shadow:0 0 8px rgba(0,0,0,.1)
}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:var(--pri);color:#fff}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.add{background:var(--ok);color:#fff}
.del{background:var(--bad);color:#fff}
.ban{background:var(--warn)}
.unban{background:#22c55e;color:#fff}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;color:#fff;
  display:flex;justify-content:space-around;
  padding:10px 0
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
</style>
</head>

<body>

<div class="main">

<!-- DASHBOARD -->
<section id="dash">
  <div class="card">
    From <input type="date" id="d_from">
    To <input type="date" id="d_to">
    <label>
      <input type="checkbox" id="hide0" onchange="loadDash()">
      Hide 0 (only not voted)
    </label>
    <button class="btn" onclick="loadDash()">View</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Total</th><th>Add</th></tr>
      </thead>
      <tbody id="dashBody"></tbody>
    </table>
  </div>
</section>

<!-- USERS -->
<section id="users" class="hidden">
  <div class="card">
    <table>
      <thead>
        <tr><th>User</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody id="userBody"></tbody>
    </table>
  </div>

  <!-- DANGER ZONE -->
  <div class="card" style="background:#fff0f0">
    <h3 style="color:#dc2626">Danger Zone</h3>
    <button class="btn ban" onclick="clearVotes()">
      Clear History Only (Keep Users)
    </button>
    <br><br>
    <button class="btn del" onclick="resetAll()">
      Reset EVERYTHING (Delete Users + History)
    </button>
  </div>
</section>

</div>

<!-- NAV -->
<div class="bottom-nav">
  <button id="btn-dash" class="active" onclick="show('dash')">Dashboard</button>
  <button id="btn-users" onclick="show('users')">Users</button>
</div>

<script type="module">
if(prompt("Admin password")!=="5") location.href="index.html";

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  addDoc, deleteDoc, updateDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* NAV */
window.show=(p)=>{
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(p).classList.remove("hidden");
  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+p).classList.add("active");
  if(p==="dash") loadDash();
  if(p==="users") loadUsers();
};

/* DASHBOARD */
window.loadDash = async ()=>{
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  const from=d_from.value,to=d_to.value||from;
  const useDate=!!from;

  const map={}, voted={};

  votes.forEach(v=>{
    const x=v.data();
    if(useDate){
      if(!x.date) return;
      if(x.date<from||x.date>to) return;
    }
    map[x.phone]=(map[x.phone]||0)+Number(x.points||0);
    voted[x.phone]=true;
  });

  dashBody.innerHTML="";
  users.forEach(u=>{
    const p=u.data().phone;
    const total=map[p]||0;
    const hasVoted=voted[p]===true;

    if(hide0.checked && total===0 && !hasVoted) return;

    dashBody.innerHTML+=`
      <tr>
        <td>${u.data().name}</td>
        <td>${p}</td>
        <td>${total}</td>
        <td>
          <input id="p_${p}" type="number" style="width:60px">
          <button class="btn add" onclick="addPoint('${p}')">+</button>
        </td>
      </tr>`;
  });
};

window.addPoint = async(phone)=>{
  const v=Number(document.getElementById("p_"+phone).value);
  if(v<=0) return;
  await addDoc(collection(db,"votes"),{
    phone,points:v,
    date:new Date().toISOString().split("T")[0]
  });
  loadDash();
};

/* USERS */
window.loadUsers = async ()=>{
  const users=await getDocs(collection(db,"users"));
  userBody.innerHTML="";
  users.forEach(u=>{
    const d=u.data();
    const active=d.active!==false;
    userBody.innerHTML+=`
      <tr>
        <td>${d.name}<br>${d.phone}</td>
        <td>${active?"Active":"Banned"}</td>
        <td>
          <button class="btn ${active?"ban":"unban"}"
            onclick="toggle('${u.id}',${active})">
            ${active?"Ban":"Unban"}
          </button>
          <button class="btn del"
            onclick="delUser('${u.id}')">Delete</button>
        </td>
      </tr>`;
  });
};

window.toggle=async(id,a)=>{
  await updateDoc(doc(db,"users",id),{active:!a});
  loadUsers();
};

window.delUser=async(id)=>{
  if(confirm("Delete user?")){
    await deleteDoc(doc(db,"users",id));
    loadUsers(); loadDash();
  }
};

/* DANGER ZONE */
window.clearVotes = async ()=>{
  if(!confirm("Clear ALL votes but keep users?")) return;
  const v=await getDocs(collection(db,"votes"));
  v.forEach(x=>deleteDoc(doc(db,"votes",x.id)));
  alert("History cleared");
  loadDash();
};

window.resetAll = async ()=>{
  if(!confirm("DELETE USERS + HISTORY?")) return;
  const v=await getDocs(collection(db,"votes"));
  const u=await getDocs(collection(db,"users"));
  v.forEach(x=>deleteDoc(doc(db,"votes",x.id)));
  u.forEach(x=>deleteDoc(doc(db,"users",x.id)));
  alert("Everything reset");
  loadDash(); loadUsers();
};

show("dash");
</script>
</body>
</html>
