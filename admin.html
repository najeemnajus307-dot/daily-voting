<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.container{
  background:#fff;
  padding:20px;
  border-radius:12px;
  max-width:1200px;
  margin:auto;
}
h2,h3{text-align:center}

.controls{
  text-align:center;
  margin-bottom:15px;
}
input,button{
  padding:6px 10px;
  margin:4px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#f3f4f6}

.rank-1{background:#ffe066;font-weight:bold}
.rank-2{background:#dbeafe}
.rank-3{background:#fde68a}

.scroll-box{
  max-height:400px;
  overflow-y:auto;
  margin-top:10px;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}

.bonus-btn{
  background:#16a34a;
  color:white;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}

.remove-btn{
  background:#b91c1c;
  color:white;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<h2>Admin Voting Report</h2>

<div class="controls">
  From <input type="date" id="from">
  To <input type="date" id="to">
  <button onclick="loadReport()">Apply Filter</button>
  <button onclick="exportExcel()">Export Excel</button>
</div>

<h3>User Summary (Ranking + Bonus)</h3>
<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Bonus</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>

<h3 style="margin-top:25px">Detailed Votes</h3>
<div class="scroll-box">
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Tasks</th>
  <th>Date</th>
  <th>Delete</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>
</div>

<p style="text-align:right;font-weight:bold" id="totalPoints"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, deleteDoc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.firebasestorage.app",
  messagingSenderId: "1065830068376",
  appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= LOAD REPORT ================= */
window.loadReport = async function(){
  const from = document.getElementById("from").value;
  const to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));

  let votes = [];
  snap.forEach(d=>{
    let v = d.data();
    if((!from || v.date>=from) && (!to || v.date<=to)){
      votes.push(v);
    }
  });

  renderDetails(votes);
  renderSummary(votes);
};

/* ================= DETAILS ================= */
function renderDetails(votes){
  let body = document.getElementById("details");
  body.innerHTML = "";

  votes.forEach(v=>{
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${Object.values(v.tasks).filter(x=>x).length}</td>
      <td>${v.date}</td>
      <td><button class="delete-btn" onclick="deleteVote('${v.phone}','${v.date}')">X</button></td>
    `;
    body.appendChild(tr);
  });
}

/* ================= SUMMARY + RANK ================= */
async function renderSummary(votes){
  let map = {};
  votes.forEach(v=>{
    let key = v.phone;
    let points = Object.values(v.tasks).filter(x=>x).length;
    if(!map[key]){
      map[key] = {name:v.name, phone:v.phone, taskPoints:0};
    }
    map[key].taskPoints += points;
  });

  let users = [];
  for(let p in map){
    let bonusSnap = await getDoc(doc(db,"bonuses",p));
    let bonus = bonusSnap.exists() ? bonusSnap.data().points : 0;
    users.push({
      ...map[p],
      bonus,
      total: map[p].taskPoints + bonus
    });
  }

  users.sort((a,b)=>b.total-a.total);

  let rank=0, prev=null, pos=0;
  users.forEach(u=>{
    pos++;
    if(prev===null || u.total<prev) rank=pos;
    prev=u.total;
    u.rank=rank;
  });

  let tbody = document.getElementById("summary");
  tbody.innerHTML="";
  let totalPoints=0;

  users.forEach(u=>{
    totalPoints += u.total;
    let tr = document.createElement("tr");
    tr.className = u.rank<=3 ? `rank-${u.rank}` : "";
    tr.innerHTML = `
      <td>${u.rank}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.total}</td>
      <td>
        <button class="bonus-btn" onclick="addBonus('${u.phone}','${u.name}')">+ Bonus</button>
        ${u.bonus>0 ? `<button class="remove-btn" onclick="removeBonus('${u.phone}')">Remove</button>`:""}
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("totalPoints").innerText =
    "TOTAL POINTS : "+totalPoints;
}

/* ================= BONUS ================= */
window.addBonus = async function(phone,name){
  let p = prompt("Bonus points for "+name);
  if(!p || isNaN(p)) return;
  await setDoc(doc(db,"bonuses",phone),{points:Number(p)});
  loadReport();
};

window.removeBonus = async function(phone){
  await deleteDoc(doc(db,"bonuses",phone));
  loadReport();
};

/* ================= DELETE VOTE ================= */
window.deleteVote = async function(phone,date){
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",phone+"_"+date));
  loadReport();
};

/* ================= EXCEL ================= */
window.exportExcel = function(){
  let table = document.querySelector("table");
  let html = table.outerHTML.replace(/ /g,"%20");
  let a = document.createElement("a");
  a.href = "data:application/vnd.ms-excel," + html;
  a.download = "voting-report.xls";
  a.click();
};

loadReport();
</script>
</body>
</html>
