<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:30px;
}
.box{
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;margin-bottom:15px;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f3f4f6;
}
.rank1{background:#fff7cc;}
.rank2{background:#e5e7eb;}
.rank3{background:#fde68a;}
.small{font-size:13px;color:#555;}
.delete{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:5px 8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Admin Voting Report</h2>

  <h3>🏆 Top Ranks (By Total Points)</h3>
  <table id="rankTable">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Total Points</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <p class="small" id="rankInfo"></p>

  <h3 style="margin-top:30px;">📋 Detailed Votes</h3>
  <table id="detailTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks Done</th>
        <th>Total Points</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const rankBody   = document.querySelector("#rankTable tbody");
const detailBody = document.querySelector("#detailTable tbody");
const rankInfo   = document.getElementById("rankInfo");

async function loadData(){

  const snap = await getDocs(collection(db,"votes"));
  let rows = [];

  snap.forEach(d=>{
    const data = d.data();
    const tasksDone = Object.values(data.tasks || {}).filter(v=>v).length;
    const totalPoints = data.totalPoints || 0;

    rows.push({
      id:d.id,
      name:data.name,
      phone:data.phone,
      date:data.date,
      tasksDone,
      totalPoints
    });
  });

  /* 🔽 DETAILED TABLE */
  detailBody.innerHTML = "";
  rows.forEach(r=>{
    detailBody.innerHTML += `
      <tr>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.tasksDone}</td>
        <td><b>${r.totalPoints}</b></td>
        <td>${r.date}</td>
        <td>
          <button class="delete" onclick="deleteVote('${r.id}')">✖</button>
        </td>
      </tr>
    `;
  });

  /* 🔝 TOP RANKS (by points) */
  rows.sort((a,b)=>b.totalPoints - a.totalPoints);

  rankBody.innerHTML = "";
  rows.slice(0,3).forEach((r,i)=>{
    rankBody.innerHTML += `
      <tr class="rank${i+1}">
        <td>🏅 ${i+1}</td>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td><b>${r.totalPoints}</b></td>
      </tr>
    `;
  });

  rankInfo.innerText =
    "Top Ranks Shown : 3 | Total Records : " + rows.length;
}

/* DELETE VOTE */
window.deleteVote = async function(id){
  if(confirm("Delete this vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

loadData();
</script>

</body>
</html>
