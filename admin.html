<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Dashboard</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2,h3{text-align:center}
.box{
  background:#fff;padding:15px;border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);margin-bottom:20px
}
.controls{text-align:center;margin-bottom:10px}
input,select,button{padding:6px;margin:3px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:white}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}
.saveBtn{background:#16a34a;color:white;border:none;padding:4px 8px}
.delBtn{background:#dc2626;color:white;border:none;padding:4px 8px}
.fixBtn{background:#7c3aed;color:white;border:none;padding:6px 10px}
.editInp{width:90%}
.small{font-size:12px;color:#555}
.count{text-align:center;font-weight:bold;margin-bottom:10px}
.summary{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{
  background:#f8fafc;padding:10px;border-radius:8px;
  min-width:160px;text-align:center
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<div class="box controls">
  <button class="fixBtn" onclick="rebuildUserTotals()">
    🔧 Rebuild User Totals (One Time)
  </button>
</div>

<div class="count" id="totalCount">Loading...</div>

<!-- SEARCH -->
<div class="box controls">
  <input type="text" id="searchBox"
         placeholder="🔍 Search name or phone"
         oninput="applySearch()"
         style="width:260px">
</div>

<!-- SUMMARY -->
<div class="box">
  <h3>Summary (Daily)</h3>
  <div class="summary" id="summaryCards"></div>
</div>

<!-- TOP 3 -->
<div class="box">
  <h3>Top 3 Ranking (Life-time Points)</h3>
  <table>
    <thead>
      <tr><th>Rank</th><th>Name</th><th>Phone</th><th>Points</th></tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<!-- REPORT -->
<div class="box">
  <h3>All Voting Report</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Phone</th>
        <th>Date</th><th>Today Points</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  updateDoc, doc,
  addDoc, query, where
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* HELPERS */
function normalizePhone(p){
  return (p||"").replace(/\D/g,"").slice(-10);
}

let allVotes=[];
let filteredVotes=[];
let userPoints={};

/* LOAD DATA */
async function loadData(){
  allVotes=[];
  userPoints={};

  // USERS = POINT SOURCE
  const uSnap=await getDocs(collection(db,"users"));
  uSnap.forEach(d=>{
    const u=d.data();
    userPoints[ normalizePhone(u.phone) ] = u.totalPoints || 0;
  });

  // VOTES = HISTORY
  const vSnap=await getDocs(collection(db,"votes"));
  vSnap.forEach(d=>{
    const v=d.data();
    allVotes.push({
      ...v,
      phoneNorm: normalizePhone(v.phone)
    });
  });

  totalCount.innerText="Total Voters : "+allVotes.length;
  filteredVotes=[...allVotes];
  renderAll(filteredVotes);
}
loadData();

/* SEARCH */
window.applySearch=()=>{
  const q=searchBox.value.toLowerCase().trim();
  filteredVotes=q===""
    ? [...allVotes]
    : allVotes.filter(v=>
        (v.name && v.name.toLowerCase().includes(q)) ||
        (v.phone && v.phone.includes(q))
      );
  renderAll(filteredVotes);
};

/* RENDER */
function renderAll(votes){
  rankBody.innerHTML="";
  reportBody.innerHTML="";
  summaryCards.innerHTML="";
  if(votes.length===0) return;
  renderSummary(votes);
  renderRank(votes);
  renderReport(votes);
}

function renderSummary(votes){
  const map={};
  votes.forEach(v=>{
    if(!map[v.date]) map[v.date]={v:0,p:0};
    map[v.date].v++;
    map[v.date].p+=v.todayPoints||0;
  });
  Object.keys(map).forEach(d=>{
    summaryCards.innerHTML+=`
      <div class="card">
        <b>${d}</b><br>
        Voters:${map[d].v}<br>
        Points:${map[d].p}
      </div>`;
  });
}

function renderRank(votes){
  const uniq={};
  votes.forEach(v=>uniq[v.phoneNorm]=v.name);
  const arr=Object.keys(uniq).map(p=>({
    phone:p,
    name:uniq[p],
    points:userPoints[p]||0
  }));
  arr.sort((a,b)=>b.points-a.points);
  let rank=0,last=null;
  arr.forEach(u=>{
    if(u.points!==last){rank++;last=u.points;}
    if(rank>3)return;
    const cls=rank===1?"rank1":rank===2?"rank2":"rank3";
    rankBody.innerHTML+=`
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.points}</td>
      </tr>`;
  });
}

function renderReport(votes){
  votes.forEach(v=>{
    reportBody.innerHTML+=`
      <tr>
        <td>${v.name}</td>
        <td>${v.phoneNorm}</td>
        <td>${v.date}</td>
        <td>${v.todayPoints||0}</td>
      </tr>`;
  });
}

/* 🔧 ONE-TIME REBUILD (ZERO FIX) */
window.rebuildUserTotals = async ()=>{
  if(!confirm("Rebuild user totals from all votes?")) return;

  const voteSnap=await getDocs(collection(db,"votes"));
  const map={};

  voteSnap.forEach(d=>{
    const v=d.data();
    const ph=normalizePhone(v.phone);
    if(!map[ph]) map[ph]=0;
    map[ph]+=v.todayPoints||0;
  });

  for(const ph in map){
    const q=query(collection(db,"users"),where("phone","==",ph));
    const us=await getDocs(q);
    if(us.empty){
      await addDoc(collection(db,"users"),{
        phone:ph,
        name:ph,
        totalPoints:map[ph],
        password:"1"
      });
    }else{
      us.forEach(async u=>{
        await updateDoc(doc(db,"users",u.id),{
          totalPoints:map[ph]
        });
      });
    }
  }
  alert("User totals rebuilt successfully ✅");
  loadData();
};
</script>

</body>
</html>
