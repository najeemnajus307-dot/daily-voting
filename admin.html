<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Management – Faith & Fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;font-family:Arial;background:#0b1220;color:#111;
}
.container{max-width:900px;margin:auto;padding:16px}
.card{
  background:#fff;border-radius:14px;padding:14px;
  margin-bottom:16px;box-shadow:0 8px 20px rgba(0,0,0,.15)
}
h2{margin:0 0 10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
th{color:#555}

.status-active{color:#16a34a;font-weight:bold}
.status-ban{color:#dc2626;font-weight:bold}

.btn{
  border:none;padding:8px 14px;border-radius:8px;
  cursor:pointer;font-weight:bold;margin-right:6px
}
.ban{background:#facc15}
.unban{background:#22c55e;color:#fff}
.del{background:#ef4444;color:#fff}
.warn{background:#f59e0b;color:#fff;width:100%;margin-top:8px}
.danger{background:#dc2626;color:#fff;width:100%;margin-top:8px}
.open{background:#2563eb;color:#fff;width:100%;margin-top:10px}
</style>
</head>

<body>
<div class="container">

<!-- ALL USERS -->
<div class="card">
  <h2>All Users</h2>
  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userBody"></tbody>
  </table>
</div>

<!-- DANGER ZONE -->
<div class="card" style="background:#fff3f3">
  <h2 style="color:#dc2626">Danger Zone</h2>
  <p style="color:#666">These actions require admin password.</p>

  <button class="btn warn" onclick="clearHistory()">
    Clear History Only (Keep Users)
  </button>

  <button class="btn danger" onclick="resetAll()">
    Reset EVERYTHING (Delete Users + History)
  </button>

  <button class="btn open" onclick="location.href='index.html'">
    Open User App
  </button>
</div>

</div>

<script type="module">
/* ===== ADMIN PASSWORD ===== */
const ADMIN_PASS = "5"; // 🔐 change if needed

/* ===== FIREBASE ===== */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  updateDoc, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* ===== LOAD USERS ===== */
async function loadUsers(){
  userBody.innerHTML="";
  const snap = await getDocs(collection(db,"users"));

  snap.forEach(u=>{
    const d = u.data();
    const active = d.active !== false;

    userBody.innerHTML += `
      <tr>
        <td>
          <b>${d.name || "User"}</b><br>
          <span style="color:#555">${d.email || d.phone || ""}</span>
        </td>
        <td class="${active?'status-active':'status-ban'}">
          ${active?'Active':'Banned'}
        </td>
        <td>
          <button class="btn ${active?'ban':'unban'}"
            onclick="toggleUser('${u.id}',${active})">
            ${active?'Ban':'Unban'}
          </button>

          <button class="btn del"
            onclick="deleteUser('${u.id}')">
            Delete
          </button>
        </td>
      </tr>`;
  });
}
window.toggleUser = async(id,active)=>{
  await updateDoc(doc(db,"users",id),{ active: !active });
  loadUsers();
};

/* ===== DELETE SINGLE USER (PASSWORD) ===== */
window.deleteUser = async(id)=>{
  const p = prompt("Enter admin password");
  if(p !== ADMIN_PASS) return alert("Wrong password");

  if(!confirm("Delete this user permanently?")) return;
  await deleteDoc(doc(db,"users",id));
  loadUsers();
};

/* ===== CLEAR HISTORY ONLY ===== */
window.clearHistory = async()=>{
  const p = prompt("Enter admin password");
  if(p !== ADMIN_PASS) return alert("Wrong password");

  if(!confirm("Clear ALL voting history?")) return;

  const votes = await getDocs(collection(db,"votes"));
  votes.forEach(v=>deleteDoc(doc(db,"votes",v.id)));

  alert("History cleared (users kept)");
};

/* ===== RESET EVERYTHING ===== */
window.resetAll = async()=>{
  const p = prompt("Enter admin password");
  if(p !== ADMIN_PASS) return alert("Wrong password");

  if(!confirm("DELETE USERS + HISTORY permanently?")) return;

  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  users.forEach(u=>deleteDoc(doc(db,"users",u.id)));
  votes.forEach(v=>deleteDoc(doc(db,"votes",v.id)));

  alert("Everything deleted");
  loadUsers();
};

loadUsers();
</script>
</body>
</html>
