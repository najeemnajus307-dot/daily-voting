<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#0f172a;
  color:#fff;
  min-height:100vh;
  padding:15px;
}
.sidebar h2{
  text-align:center;
  font-size:16px;
  margin-bottom:20px;
}
.sidebar a{
  display:block;
  padding:10px;
  color:#cbd5f5;
  text-decoration:none;
  border-radius:6px;
  margin-bottom:6px;
}
.sidebar a.active,
.sidebar a:hover{
  background:#1e293b;
  color:#fff;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{
  background:#2563eb;
  color:#fff;
}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fecaca}

.addBtn{
  background:#16a34a;
  color:#fff;
  border:none;
  padding:4px 8px;
  border-radius:4px;
  cursor:pointer;
}
input[type=number]{
  width:60px;
  padding:4px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FAITH & FITNESS<br>ADMIN</h2>
  <a class="active">Dashboard</a>
</div>

<!-- MAIN -->
<div class="main">
  <div class="card">
    <h3>All Users – Ranking</h3>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>SL</th>
            <th>Rank</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Total Points</th>
            <th>Add Points</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* ADMIN PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* LOAD DASHBOARD */
async function loadDashboard(){
  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  const voteMap = {};
  votesSnap.forEach(v=>{
    const d=v.data();
    if(!voteMap[d.phone]) voteMap[d.phone]=0;
    voteMap[d.phone]+=Number(d.points||0);
  });

  let rows=[];
  usersSnap.forEach(u=>{
    const phone=u.data().phone;
    rows.push({
      name:u.data().name,
      phone,
      total:voteMap[phone]||0
    });
  });

  rows.sort((a,b)=>b.total-a.total);

  rankBody.innerHTML="";
  let rank=0,prev=null;

  rows.forEach((r,i)=>{
    if(prev===null || r.total<prev) rank++;
    prev=r.total;

    const tr=document.createElement("tr");
    tr.className =
      rank===1?"rank1":
      rank===2?"rank2":
      rank===3?"rank3":"";

    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${rank}</td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.total}</td>
      <td>
        <input type="number" id="p_${r.phone}">
        <button class="addBtn" onclick="addPoint('${r.phone}')">+</button>
      </td>
    `;
    rankBody.appendChild(tr);
  });
}

/* ADD POINT */
window.addPoint = async(phone)=>{
  const val = Number(document.getElementById("p_"+phone).value);
  if(val<=0) return alert("Valid points enter cheyyu");

  await addDoc(collection(db,"votes"),{
    phone,
    points:val,
    date:new Date().toISOString().split("T")[0],
    source:"admin"
  });

  loadDashboard();
};

loadDashboard();
</script>

</body>
</html>
