<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{font-family:Arial;background:#f1f5f9;margin:0}
.card{background:#fff;margin:10px;padding:10px;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#2563eb;color:#fff}
button{padding:6px 10px;border:0;border-radius:6px;cursor:pointer}
.add{background:#16a34a;color:#fff}
</style>
</head>

<body>

<div class="card">
  From <input type="date" id="from">
  To <input type="date" id="to">
  <button type="button" onclick="loadDash()">VIEW</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th><th>Phone</th><th>Total</th><th>Add</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today = () => new Date().toISOString().split("T")[0];

function norm(d){
  if(!d) return "";
  if(d.includes("-")) return d;      // yyyy-mm-dd
  return ""; // ignore OLD wrong dates
}

async function loadDash(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  if(from.value && !to.value) to.value = from.value;

  const f = norm(from.value);
  const t = norm(to.value);

  const map = {};

  votes.forEach(v=>{
    const x = v.data();
    const d = norm(x.date);

    if(!d) return; // ignore old wrong dates

    if(f && (d < f || d > t)) return;

    map[x.phone] = (map[x.phone] || 0) + Number(x.points || 0);
  });

  body.innerHTML="";
  users.forEach(u=>{
    const p = u.data().phone;
    body.innerHTML += `
      <tr>
        <td>${u.data().name}</td>
        <td>${p}</td>
        <td>${map[p]||0}</td>
        <td>
          <input id="p_${p}" type="number" style="width:60px">
          <button class="add" onclick="add('${p}')">+</button>
        </td>
      </tr>`;
  });
}

window.add = async(phone)=>{
  const v = Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone,
    points:v,
    date:today()   // ✅ ALWAYS CORRECT FORMAT
  });
  loadDash();
};

loadDash();
</script>
</body>
</html>
