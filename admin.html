<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  max-width:1100px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
h2,h3{
  text-align:center;
}
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}
input,button{
  padding:6px 10px;
  font-size:14px;
}
button{
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f3f4f6;
}
.delete{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:4px 8px;
  cursor:pointer;
}

/* 🔥 Rank styles */
.rank-1{ background:#fff7cc; font-weight:bold; }
.rank-2{ background:#e5e7eb; }
.rank-3{ background:#fde68a; }

.total{
  margin-top:10px;
  font-weight:bold;
  text-align:right;
}
</style>
</head>

<body>

<div class="box">
  <h2>Admin Voting Report</h2>

  <!-- CONTROLS -->
  <div class="controls">
    <input type="date" id="from">
    <input type="date" id="to">
    <button onclick="loadData()">Filter</button>
    <button onclick="exportCSV()">Export Excel</button>
  </div>

  <!-- 🔹 TOP 3 RANK TABLE -->
  <h3>🏆 Top 3 Users (Total Votes)</h3>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Total Votes</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>

  <!-- 🔹 DETAIL TABLE -->
  <h3 style="margin-top:25px">Detailed Votes</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks Done</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="total" id="totalUsers"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("tbody");
const summaryBody = document.getElementById("summaryBody");
const totalUsersBox = document.getElementById("totalUsers");

/* 📊 LOAD DATA */
window.loadData = async function(){
  tbody.innerHTML = "";
  summaryBody.innerHTML = "";
  totalUsersBox.innerText = "";

  let from = document.getElementById("from").value;
  let to   = document.getElementById("to").value;

  let snap = await getDocs(collection(db,"votes"));

  let userMap = {}; 
  // phone → { name, phone, totalVotes }

  snap.forEach(d=>{
    let v = d.data();
    let date = v.date;

    if(from && date < from) return;
    if(to && date > to) return;

    // 🔢 TASK COUNT PER DATE
    let taskCount = Object.values(v.tasks).filter(t=>t).length;

    /* DETAIL TABLE */
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${taskCount}</td>
      <td>${date}</td>
      <td>
        <button class="delete" onclick="deleteVote('${d.id}')">❌</button>
      </td>
    `;
    tbody.appendChild(tr);

    /* USER TOTAL = TASK SUM */
    if(!userMap[v.phone]){
      userMap[v.phone] = {
        name: v.name,
        phone: v.phone,
        totalVotes: 0
      };
    }
    userMap[v.phone].totalVotes += taskCount;
  });

  /* ---- SORT & PICK TOP 3 ---- */
  let rankedUsers = Object.values(userMap)
    .sort((a,b) => b.totalVotes - a.totalVotes)
    .slice(0,3);

  rankedUsers.forEach((u,index)=>{
    let rank = index + 1;
    let tr = document.createElement("tr");
    tr.classList.add(`rank-${rank}`);

    tr.innerHTML = `
      <td>${rank === 1 ? "🥇 1" : rank === 2 ? "🥈 2" : "🥉 3"}</td>
      <td>${u.name}</td>
      <td>${u.phone}</td>
      <td>${u.totalVotes}</td>
    `;
    summaryBody.appendChild(tr);
  });

  totalUsersBox.innerText =
    "TOTAL USERS (Filtered) : " + Object.keys(userMap).length;
};

/* ❌ DELETE VOTE */
window.deleteVote = async function(id){
  if(confirm("Delete this vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadData();
  }
};

/* 📥 EXPORT EXCEL (SUMMARY) */
window.exportCSV = function(){
  let rows = [["Rank","Name","Phone","Total Votes"]];
  document.querySelectorAll("#summaryBody tr").forEach(tr=>{
    let tds = tr.querySelectorAll("td");
    rows.push([
      tds[0].innerText,
      tds[1].innerText,
      tds[2].innerText,
      tds[3].innerText
    ]);
  });

  let csv = rows.map(r=>r.join(",")).join("\n");
  let blob = new Blob([csv],{type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "top3_user_votes.csv";
  a.click();
};

/* AUTO LOAD */
loadData();
</script>

</body>
</html>
