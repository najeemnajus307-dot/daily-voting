<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task-wise Report – Faith & Fitness</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
}
.sidebar{
  width:220px;
  background:#0f172a;
  color:#fff;
  height:100vh;
  position:fixed;
  padding:20px;
}
.sidebar h3{margin-top:0}
.sidebar a{
  display:block;
  color:#cbd5f5;
  padding:10px;
  text-decoration:none;
  border-radius:6px;
  margin-bottom:6px;
}
.sidebar a.active,
.sidebar a:hover{
  background:#1e293b;
  color:#fff;
}

.main{
  margin-left:240px;
  padding:20px;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,.1);
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
  text-align:center;
}
th{
  background:#2563eb;
  color:#fff;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.view{background:#2563eb;color:#fff}
.clear{background:#6b7280;color:#fff}
.del{background:#dc2626;color:#fff}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>FAITH & FITNESS<br>ADMIN</h3>
  <a href="admin.html">Dashboard</a>
  <a class="active">Task-wise Report</a>
  <a href="user-report.html">User-wise Report</a>
  <a href="task-editor.html">Task Editor</a>
</div>

<!-- MAIN -->
<div class="main">

  <h2>Task-wise Report</h2>

  <!-- FILTERS -->
  <div class="box">
    <b>Filters</b><br><br>

    From:
    <input type="date" id="fromDate">

    To:
    <input type="date" id="toDate">

    Task:
    <select id="taskSelect"></select>

    Search:
    <input type="text" id="searchInput"
           placeholder="Name / Phone">

    <button class="view" onclick="loadReport()">View</button>
    <button class="clear" onclick="clearFilters()">Clear</button>
  </div>

  <!-- TABLE -->
  <div class="box">
    <h3>Voted Users</h3>
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Task</th>
          <th>Points</th>
          <th>Date</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 SIMPLE ADMIN CHECK */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* LOAD TASKS */
async function loadTasks(){
  const snap = await getDocs(collection(db,"tasks"));
  taskSelect.innerHTML =
    `<option value="ALL">All Tasks</option>`;
  snap.forEach(d=>{
    const t=d.data();
    taskSelect.innerHTML +=
      `<option value="${t.text}">${t.text}</option>`;
  });
}
loadTasks();

/* LOAD REPORT */
window.loadReport = async ()=>{
  tbody.innerHTML="";

  const from   = fromDate.value;
  const to     = toDate.value;
  const task   = taskSelect.value;
  const search = searchInput.value.toLowerCase();

  const votesSnap = await getDocs(collection(db,"votes"));
  const usersSnap = await getDocs(collection(db,"users"));

  const userMap = {};
  usersSnap.forEach(u=>{
    userMap[u.data().phone] = u.data().name;
  });

  votesSnap.forEach(vd=>{
    const v = vd.data();

    if(from && v.date < from) return;
    if(to && v.date > to) return;
    if(task!=="ALL" && v.task!==task) return;

    const name = (userMap[v.phone]||"").toLowerCase();
    const phone = v.phone.toString();
    if(search &&
      !name.includes(search) &&
      !phone.includes(search)) return;

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${userMap[v.phone]||"-"}</td>
      <td>${v.phone}</td>
      <td>${v.task||"-"}</td>
      <td>${v.points}</td>
      <td>${v.date||"-"}</td>
      <td>
        <button class="del"
        onclick="deleteVote('${vd.id}')">X</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  if(!tbody.innerHTML){
    tbody.innerHTML=
      `<tr><td colspan="6">No data found</td></tr>`;
  }
};

/* DELETE VOTE */
window.deleteVote = async(id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  loadReport();
};

/* CLEAR */
window.clearFilters = ()=>{
  fromDate.value="";
  toDate.value="";
  taskSelect.value="ALL";
  searchInput.value="";
  loadReport();
};

</script>

</body>
</html>
