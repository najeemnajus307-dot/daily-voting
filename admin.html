<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:1100px;
  margin:auto;
}
h2{text-align:center}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#f3f4f6}
.del{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:6px 10px;
  cursor:pointer;
  border-radius:4px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logout{
  background:#111827;
  color:#fff;
  padding:6px 10px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.total{
  text-align:right;
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
  <div class="top">
    <h2>Admin Voting Report</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Tasks</th>
        <th>Date</th>
        <th>Delete Vote</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="total" id="totalVotes">TOTAL VOTES : 0</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN DELETE PASSWORD */
const ADMIN_DELETE_PASSWORD = "admin@123";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.firebasestorage.app",
  messagingSenderId: "1065830068376",
  appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const rows = document.getElementById("rows");
const totalBox = document.getElementById("totalVotes");

/* 🚀 LOAD REPORT */
async function loadReport(){
  rows.innerHTML="";
  let total = 0;

  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    const v = d.data();
    total++;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.name}</td>
      <td>${v.phone}</td>
      <td>${countTasks(v.tasks)}</td>
      <td>${v.date}</td>
      <td>
        <button class="del" onclick="deleteVote('${d.id}')">X</button>
      </td>
    `;
    rows.appendChild(tr);
  });

  totalBox.innerText = "TOTAL VOTES : " + total;
}

/* ✅ TASK COUNT */
function countTasks(t){
  let c = 0;
  for(let k in t){
    if(t[k]) c++;
  }
  return c;
}

/* ❌ DELETE ONLY VOTE (PASSWORD PROTECTED) */
window.deleteVote = async function(id){
  let pass = prompt("Enter admin password to delete this vote");
  if(pass !== ADMIN_DELETE_PASSWORD){
    alert("❌ Wrong password");
    return;
  }

  if(!confirm("Delete this vote?")){
    return;
  }

  await deleteDoc(doc(db,"votes",id));
  alert("✅ Vote deleted");
  loadReport();
};

/* 🚪 LOGOUT */
window.logout = function(){
  window.location.href = "index.html";
};

loadReport();
</script>

</body>
</html>
