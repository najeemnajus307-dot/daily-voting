<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Faith & Fitness</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
h2{text-align:center}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2563eb;color:white}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}
input{width:70px;padding:5px}
button{padding:6px 10px;background:#16a34a;color:white;border:none;cursor:pointer}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
  <th>Add Points</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script type="module">
/* 🔐 ADMIN PASSWORD */
const ADMIN_PASS = "1";
const p = prompt("Enter admin password");
if(p !== ADMIN_PASS){
  alert("Access denied");
  location.href="index.html";
}

/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD USERS */
async function load(){
  const snap = await getDocs(collection(db,"users"));
  let users=[];
  snap.forEach(d=>users.push(d.data()));

  users.sort((a,b)=>b.totalPoints-a.totalPoints);

  let rank=0,last=null;
  tbody.innerHTML="";

  users.forEach(u=>{
    if(u.totalPoints !== last){
      rank++;
      last = u.totalPoints;
    }
    if(rank>3) return;

    const cls = rank===1?"rank1":rank===2?"rank2":"rank3";

    tbody.innerHTML+=`
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.totalPoints}</td>
        <td>
          <input type="number" id="pt_${u.phone}" placeholder="+">
          <button onclick="addPoint('${u.phone}')">Add</button>
        </td>
      </tr>`;
  });
}
load();

/* ADD POINTS */
window.addPoint = async(phone)=>{
  const val = Number(document.getElementById("pt_"+phone).value);
  if(val<=0) return alert("Enter points");

  if(prompt("Admin password") !== ADMIN_PASS){
    alert("Wrong password");
    return;
  }

  const ref = doc(db,"users",phone);
  const snap = await getDocs(collection(db,"users"));
  let user;

  snap.forEach(d=>{
    if(d.id === phone) user = d.data();
  });

  const newTotal = user.totalPoints + val;
  await updateDoc(ref,{ totalPoints:newTotal });

  alert("Points added");
  load();
};
</script>

</body>
</html>
