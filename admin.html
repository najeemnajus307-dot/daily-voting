<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Voting Result</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{background:#fff;max-width:520px;margin:auto;padding:20px;border-radius:10px}
h2{text-align:center}
ul{list-style:none;padding:0}
li{padding:6px 0;border-bottom:1px solid #ddd}
.total{font-weight:bold;margin-top:10px}
</style>
</head>
<body>

<div class="box">
<h2>Admin Voting Result</h2>
<ul id="list"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.firebasestorage.app",
  messagingSenderId: "1065830068376",
  appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let list = document.getElementById("list");
let total = 0;

const snap = await getDocs(collection(db,"votes"));
snap.forEach(d=>{
  let v = d.data();
  total += 1;

  let li = document.createElement("li");
  li.innerText = `${v.name} (${v.phone}) – ${v.date}`;
  list.appendChild(li);
});

let li = document.createElement("li");
li.className="total";
li.innerText = "TOTAL VOTES = " + total;
list.appendChild(li);
</script>

</body>
</html>
