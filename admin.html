<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
}

/* LAYOUT */
.wrapper{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:230px;
  background:#0f172a;
  color:#fff;
  padding:20px 12px;
}
.sidebar h2{
  text-align:center;
  font-size:18px;
  margin-bottom:25px;
}
.sidebar a{
  display:block;
  padding:10px 12px;
  color:#cbd5f5;
  text-decoration:none;
  border-radius:6px;
  margin-bottom:6px;
  cursor:pointer;
}
.sidebar a.active,
.sidebar a:hover{
  background:#1e293b;
  color:#fff;
}

/* MAIN */
.main{
  flex:1;
  padding:15px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  margin-bottom:15px;
}
.section{display:none}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th{background:#2563eb;color:#fff}

/* BUTTON */
button{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.red{background:#dc2626;color:#fff}
.green{background:#16a34a;color:#fff}

/* INPUT */
select,input{
  padding:6px;
  margin-right:6px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FAITH & FITNESS<br>ADMIN</h2>

  <a id="m_dashboard" class="active" onclick="showSection('dashboard')">Dashboard</a>
  <a id="m_taskwise" onclick="showSection('taskwise')">Task-wise Report</a>
  <a id="m_userwise" onclick="showSection('userwise')">User-wise Report</a>
  <a id="m_taskeditor" onclick="showSection('taskeditor')">Task Editor</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div class="card section" id="dashboard">
  <h3>Dashboard</h3>
  <p>Admin overview (users / votes summary)</p>
</div>

<!-- TASK WISE -->
<div class="card section" id="taskwise">
  <h3>Task-wise Report</h3>

  Task:
  <select id="taskSelect"></select>
  <button onclick="loadTaskReport()">View</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="taskBody"></tbody>
  </table>
</div>

<!-- USER WISE -->
<div class="card section" id="userwise">
  <h3>User-wise Report</h3>

  User:
  <select id="userSelect"></select>
  <button onclick="loadUserReport()">View</button>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Points</th>
        <th>Source</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="userBody"></tbody>
  </table>
</div>

<!-- TASK EDITOR -->
<div class="card section" id="taskeditor">
  <h3>Task Editor</h3>
  <input id="taskText" placeholder="Task text">
  <input id="taskPoints" type="number" placeholder="Points">
  <button class="green" onclick="addTask()">Add Task</button>

  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="taskList"></tbody>
  </table>
</div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* PASSWORD */
if(prompt("Admin password")!=="5"){
  location.replace("index.html");
}

/* FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* SECTION SWITCH */
window.showSection = (id)=>{
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.querySelectorAll(".sidebar a").forEach(a=>a.classList.remove("active"));
  document.getElementById(id).style.display="block";
  document.getElementById("m_"+id).classList.add("active");
};
showSection("dashboard");

/* LOAD USERS */
const users = {};
const userSnap = await getDocs(collection(db,"users"));
userSnap.forEach(d=>{
  users[d.data().phone]=d.data().name;
  userSelect.innerHTML+=
    `<option value="${d.data().phone}">${d.data().name}</option>`;
});

/* LOAD TASKS */
const tasks=[];
const taskSnap = await getDocs(collection(db,"tasks"));
taskSnap.forEach(d=>{
  tasks.push(d.data());
  taskSelect.innerHTML+=
    `<option value="${d.data().text}">${d.data().text}</option>`;
  taskList.innerHTML+=
    `<tr><td>${d.data().text}</td><td>${d.data().points}</td></tr>`;
});

/* USER REPORT */
window.loadUserReport = async()=>{
  userBody.innerHTML="";
  const phone=userSelect.value;
  const snap=await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    const v=d.data();
    if(v.phone===phone){
      userBody.innerHTML+=`
        <tr>
          <td>${v.date||"-"}</td>
          <td>${v.points}</td>
          <td>${v.source}</td>
          <td><button class="red" onclick="delVote('${d.id}')">X</button></td>
        </tr>`;
    }
  });
};

/* DELETE VOTE */
window.delVote = async(id)=>{
  if(confirm("Delete vote?")){
    await deleteDoc(doc(db,"votes",id));
    loadUserReport();
  }
};

/* TASK REPORT */
window.loadTaskReport = async()=>{
  taskBody.innerHTML="";
  const snap=await getDocs(collection(db,"votes"));
  const map={};
  snap.forEach(d=>{
    const v=d.data();
    map[v.phone]=(map[v.phone]||0)+Number(v.points||0);
  });
  for(const p in map){
    taskBody.innerHTML+=`
      <tr>
        <td>${users[p]||"-"}</td>
        <td>${p}</td>
        <td>${map[p]}</td>
      </tr>`;
  }
};

/* ADD TASK */
window.addTask = async()=>{
  if(!taskText.value||!taskPoints.value) return;
  await addDoc(collection(db,"tasks"),{
    text:taskText.value,
    points:Number(taskPoints.value)
  });
  location.reload();
};
</script>

</body>
</html>
