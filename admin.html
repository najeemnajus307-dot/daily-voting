<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Voting Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
h2{text-align:center;}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  margin-bottom:20px;
}
input,button{
  padding:8px;
  margin:5px;
}
button{cursor:pointer;}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047;}
.rank2{background:#e5e7eb;}
.rank3{background:#fcd34d;}
.delBtn{
  background:#dc2626;
  color:white;
  border:none;
  padding:4px 8px;
}
.count{
  font-weight:bold;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>Admin Voting Dashboard</h2>

<!-- 🔢 TOTAL VOTERS -->
<div class="box">
  <div class="count" id="totalCount">Total Voters: Loading...</div>
</div>

<!-- 📅 DATE FILTER -->
<div class="box">
  <h3>Date Filter</h3>
  From:
  <input type="date" id="fromDate">
  To:
  <input type="date" id="toDate">
  <button onclick="applyFilter()">Apply</button>
</div>

<!-- 🏆 TOP 3 RANKING -->
<div class="box">
  <h3>Top 3 Ranking</h3>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Points</th>
        <th>Date</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];

/* LOAD ALL VOTES */
async function loadVotes(){
  allVotes = [];
  const snap = await getDocs(collection(db,"votes"));
  snap.forEach(d=>{
    allVotes.push({ id:d.id, ...d.data() });
  });

  document.getElementById("totalCount").innerText =
    "Total Voters : " + allVotes.length;

  renderRanking(allVotes);
}

loadVotes();

/* APPLY DATE FILTER */
window.applyFilter = ()=>{
  const from = document.getElementById("fromDate").value;
  const to   = document.getElementById("toDate").value;

  let filtered = allVotes;

  if(from){
    filtered = filtered.filter(v=> v.date >= from);
  }
  if(to){
    filtered = filtered.filter(v=> v.date <= to);
  }

  renderRanking(filtered);
};

/* RENDER TOP 3 ONLY */
function renderRanking(votes){
  const tbody = document.getElementById("rankBody");
  tbody.innerHTML = "";

  if(votes.length === 0) return;

  votes.sort((a,b)=> b.totalPoints - a.totalPoints);

  let rank = 0;
  let lastPoints = null;
  let shown = 0;

  for(const v of votes){
    if(v.totalPoints !== lastPoints){
      rank++;
      lastPoints = v.totalPoints;
    }

    if(rank > 3) break;

    let cls = rank===1?"rank1":rank===2?"rank2":"rank3";

    tbody.innerHTML += `
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${v.name || "-"}</td>
        <td>${v.phone || "-"}</td>
        <td>${v.totalPoints}</td>
        <td>${v.date}</td>
        <td>
          <button class="delBtn"
            onclick="deleteVote('${v.id}')">Delete</button>
        </td>
      </tr>
    `;
    shown++;
  }
}

/* DELETE SINGLE USER VOTE */
window.deleteVote = async (id)=>{
  if(!confirm("Delete this vote?")) return;
  await deleteDoc(doc(db,"votes",id));
  alert("Vote deleted");
  loadVotes();
};
</script>

</body>
</html>
