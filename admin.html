<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
table { width:100%; border-collapse: collapse; background:#fff; }
th, td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#222; color:#fff; }
</style>
</head>
<body>

<h2>Admin Panel</h2>

<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Water</th>
  <th>Warmup</th>
  <th>Steps</th>
  <th>Pushup</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("data");

onSnapshot(collection(db, "votes"), (snapshot) => {
  tbody.innerHTML = "";
  snapshot.forEach(doc => {
    const d = doc.data();
    tbody.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td>${d.water}</td>
        <td>${d.warmup}</td>
        <td>${d.steps}</td>
        <td>${d.pushup}</td>
      </tr>`;
  });
});
</script>

</body>
</html>
