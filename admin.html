<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f1f5f9;margin:0}
.card{background:#fff;margin:10px;padding:12px;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#2563eb;color:#fff}
button{padding:6px 10px;border:0;border-radius:6px;cursor:pointer}
.add{background:#16a34a;color:#fff}
</style>
</head>

<body>

<div class="card">
  From <input type="date" id="from">
  To <input type="date" id="to">
  <button type="button" onclick="loadData()">VIEW</button>
</div>

<div class="card">
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Total</th>
  <th>Add</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<script type="module">
/* ===== FIREBASE ===== */
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const today = () => new Date().toISOString().split("T")[0];

async function loadData(){
  const usersSnap = await getDocs(collection(db,"users"));
  const votesSnap = await getDocs(collection(db,"votes"));

  if(from.value && !to.value) to.value = from.value;

  const f = from.value;
  const t = to.value;

  const total = {};

  votesSnap.forEach(v=>{
    const x = v.data();
    if(!x.date) return;
    if(f && (x.date < f || x.date > t)) return;
    total[x.phone] = (total[x.phone] || 0) + Number(x.points || 0);
  });

  body.innerHTML="";
  usersSnap.forEach(u=>{
    const d = u.data();
    body.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td>${total[d.phone] || 0}</td>
        <td>
          <input id="p_${d.phone}" type="number" style="width:60px">
          <button class="add" onclick="addPoint('${d.phone}')">+</button>
        </td>
      </tr>`;
  });
}

window.addPoint = async(phone)=>{
  const v = Number(document.getElementById("p_"+phone).value);
  if(v<=0) return alert("Enter points");
  await addDoc(collection(db,"votes"),{
    phone: phone,
    points: v,
    date: today()
  });
  loadData();
};

loadData();
</script>

</body>
</html>
