<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Voting Report</title>

<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    padding:20px;
}
.box{
    background:#fff;
    max-width:1100px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}
h2{text-align:center}

input,button{
    padding:6px 10px;
    margin:5px;
}
button{cursor:pointer}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{background:#f3f4f6}

.rank1{background:#fde68a;font-weight:bold}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}

.total{
    margin-top:15px;
    font-weight:bold;
    text-align:right;
}
</style>
</head>
<body>

<div class="box">
<h2>Admin Voting Report</h2>

<input type="date" id="fromDate">
<input type="date" id="toDate">
<button onclick="applyFilter()">Apply Filter</button>
<button onclick="exportExcel()">Date-wise Excel</button>

<table>
<thead>
<tr>
    <th>Rank</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Total Tasks</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div class="total" id="totalTasks"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVotes = [];

/* 🔄 LOAD DATA */
async function loadData(){
    allVotes = [];
    const snap = await getDocs(collection(db,"votes"));
    snap.forEach(d => allVotes.push(d.data()));
    applyFilter();
}
loadData();

/* 📅 FILTER */
window.applyFilter = function(){
    let from = fromDate.value;
    let to   = toDate.value;

    let filtered = allVotes.filter(v=>{
        if(!from || !to) return true;
        return v.date >= from && v.date <= to;
    });

    buildRanking(filtered);
};

/* 🏆 USER TOTAL + RANK */
function buildRanking(data){
    let map = {};

    data.forEach(v=>{
        let key = v.phone;
        let taskCount = Object.values(v.tasks).filter(x=>x).length;

        if(!map[key]){
            map[key] = {
                name:v.name,
                phone:v.phone,
                total:0
            };
        }
        map[key].total += taskCount;
    });

    let arr = Object.values(map).sort((a,b)=>b.total-a.total);

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML="";

    let rank=0, lastScore=null, displayRank=0;
    let grandTotal=0;

    arr.forEach(u=>{
        grandTotal += u.total;

        if(u.total !== lastScore){
            rank++;
            displayRank = rank;
            lastScore = u.total;
        }

        let tr = document.createElement("tr");
        if(displayRank===1) tr.className="rank1";
        else if(displayRank===2) tr.className="rank2";
        else if(displayRank===3) tr.className="rank3";

        tr.innerHTML = `
            <td>${displayRank}</td>
            <td>${u.name}</td>
            <td>${u.phone}</td>
            <td>${u.total}</td>
        `;
        tbody.appendChild(tr);
    });

    totalTasks.innerText = "TOTAL TASKS : " + grandTotal;
}

/* 📤 EXCEL EXPORT */
window.exportExcel = function(){
    let rows=[["Rank","Name","Phone","Total Tasks"]];

    document.querySelectorAll("#tableBody tr").forEach(tr=>{
        let cols=[...tr.children].map(td=>td.innerText);
        rows.push(cols);
    });

    let csv = rows.map(r=>r.join(",")).join("\n");
    let blob = new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="admin-report.csv";
    a.click();
};
</script>

</body>
</html>
