<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Page</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui, Arial;
  background:linear-gradient(180deg,#020617,#020617);
  color:#e5e7eb;
  padding-bottom:80px; /* bottom bar space */
}

/* ===== TOP BAR ===== */
.topbar{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:64px;
  background:linear-gradient(90deg,#020617,#0f172a);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}
.logo{
  background:#fff;
  padding:4px;
  border-radius:6px;
}
.logo img{height:36px}
.logout{
  color:#ef4444;
  font-weight:600;
}

/* ===== CONTENT ===== */
.container{
  padding:90px 16px 16px;
  max-width:900px;
  margin:auto;
}

h1{
  margin-bottom:12px;
}

/* SAMPLE CARD */
.card{
  background:#fff;
  color:#020617;
  border-radius:16px;
  padding:20px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:linear-gradient(180deg,#020617,#0f172a);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #1e293b;
}

.nav-item{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

.nav-item .icon{
  font-size:24px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#3b82f6;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>
  <div class="logout">Logout</div>
</div>

<!-- PAGE CONTENT -->
<div class="container">
  <h1>Admin Reports</h1>

  <div class="card">
    <p>Ivde ninte content varum.</p>
    <p>Data later add cheyyam 👍</p>
  </div>
</div>

<!-- BOTTOM NAV BAR -->
<div class="bottom-nav">
  <div class="nav-item active">
    <div class="icon">📊</div>
    <div class="label">Reports</div>
  </div>

  <div class="nav-item">
    <div class="icon">💪</div>
    <div class="label">Challenges</div>
  </div>

  <div class="nav-item">
    <div class="icon">👥</div>
    <div class="label">Users</div>
  </div>

  <div class="nav-item">
    <div class="icon">⚙️</div>
    <div class="label">Settings</div>
  </div>
</div>

</body>
</html>
