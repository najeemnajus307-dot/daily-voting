<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
h2{text-align:center;margin-bottom:10px}

.summary{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
.card{
  background:#fff;
  padding:12px 18px;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,.15);
}

.filters{
  background:#fff;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{
  background:#2563eb;
  color:white;
}
.rank1{background:#fde047}
.rank2{background:#e5e7eb}
.rank3{background:#fcd34d}

button{
  padding:6px 12px;
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:4px;
}
.export{background:#0ea5e9}
.note{
  font-size:12px;
  color:#555;
  margin-top:6px;
}
</style>
</head>

<body>

<h2>Admin Dashboard – Faith & Fitness</h2>

<div class="summary">
  <div class="card">
    <b>Total Users</b><br>
    <span id="userCount">0</span>
  </div>
  <div class="card">
    <b>Filtered Records</b><br>
    <span id="recordCount">0</span>
  </div>
</div>

<div class="filters">
  <b>Date Filter (Votes only)</b><br><br>
  From:
  <input type="date" id="fromDate">
  To:
  <input type="date" id="toDate">
  <button onclick="load()">Apply</button>
  <button class="export" onclick="exportExcel()">Export Excel</button>
  <div class="note">
    Note: Admin added points are NOT affected by date filter.
  </div>
</div>

<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Points</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 ADMIN PASSWORD */
if(prompt("Admin password") !== "1"){
  location.href="index.html";
}

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let reportData = [];

/* LOAD DATA */
window.load = async ()=>{
  body.innerHTML="";
  reportData=[];

  const from = fromDate.value || "0000-00-00";
  const to   = toDate.value || "9999-12-31";

  /* USERS */
  const usersSnap = await getDocs(collection(db,"users"));
  let users = {};
  usersSnap.forEach(d=>{
    const u = d.data();
    users[u.phone] = {
      name: u.name || "-",
      phone: u.phone,
      points: 0
    };
  });
  userCount.innerText = Object.keys(users).length;

  /* VOTES (DATE FILTER APPLIES) */
  const votesSnap = await getDocs(collection(db,"votes"));
  votesSnap.forEach(d=>{
    const v = d.data();
    if(v.date >= from && v.date <= to){
      if(users[v.phone]){
        users[v.phone].points += Number(v.points || 0);
      }
    }
  });

  /* BONUSES (NO DATE FILTER) */
  const bonusSnap = await getDocs(collection(db,"bonuses"));
  bonusSnap.forEach(d=>{
    const b = d.data();
    if(users[b.phone]){
      users[b.phone].points += Number(b.points || 0);
    }
  });

  /* SORT */
  const arr = Object.values(users)
    .sort((a,b)=>b.points - a.points);

  /* RANK WITH SAME-POINT TIES */
  let rank = 0;
  let lastPoints = null;

  arr.forEach(u=>{
    if(u.points !== lastPoints){
      rank++;
      lastPoints = u.points;
    }
    if(rank > 3) return;

    const cls =
      rank===1 ? "rank1" :
      rank===2 ? "rank2" :
      "rank3";

    body.innerHTML += `
      <tr class="${cls}">
        <td>${rank}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.points}</td>
      </tr>
    `;

    reportData.push({
      Rank: rank,
      Name: u.name,
      Phone: u.phone,
      Points: u.points
    });
  });

  recordCount.innerText = reportData.length;
};

/* EXPORT EXCEL (CSV) */
window.exportExcel = ()=>{
  if(reportData.length === 0){
    alert("No data to export");
    return;
  }

  let csv = "Rank,Name,Phone,Points\n";
  reportData.forEach(r=>{
    csv += `${r.Rank},${r.Name},${r.Phone},${r.Points}\n`;
  });

  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "faith_fitness_report.csv";
  a.click();
  URL.revokeObjectURL(url);
};

/* INITIAL LOAD */
load();
</script>

</body>
</html>
