<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:360px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <p id="userInfo"></p>
  <p>Date : <span id="today"></span></p>

  <p style="color:red" id="taskText">No tasks today</p>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
/* 🔐 Block direct access */
const phone = sessionStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* Prevent back button */
history.pushState(null,null,location.href);
window.onpopstate = ()=> history.go(1);

document.getElementById("userInfo").innerText =
  "Logged in as : " + phone;

document.getElementById("today").innerText =
  new Date().toISOString().split("T")[0];

/* Demo submit */
function submitVote(){
  alert("Vote submitted successfully ✅");
}

function logout(){
  sessionStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
