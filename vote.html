<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:80px}
.header{background:#fff;text-align:center;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:90px}
.container{display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:420px;width:100%;padding:20px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.15);text-align:center}

/* CALENDAR */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-weight:bold}
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  font-size:12px;
  color:#374151;
  margin-bottom:6px;
}
.weekdays div{text-align:center;font-weight:bold}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px
}
.day{
  height:38px;width:38px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  font-size:13px;
  color:#fff;
  margin:auto
}
.done{background:#16a34a}       /* green */
.pending{background:#facc15;color:#000} /* yellow */
.missed{background:#ef4444}     /* red */
.future{background:#374151}     /* dark */
.today{outline:3px solid #2563eb}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:12px;
  margin-top:12px;
  justify-content:center
}
.legend span{display:flex;align-items:center;gap:4px}
.l{width:12px;height:12px;border-radius:3px;display:inline-block}

/* NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;justify-content:space-around;
  padding:10px 0
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:13px;cursor:pointer
}
.bottom-nav span{display:block;font-size:20px}
</style>
</head>

<body>

<div class="header">
  <img src="logo..png">
</div>

<div class="container">
<div class="card">

<!-- CALENDAR -->
<div id="calendarSection">
  <h3>📅 Your Progress</h3>

  <div class="cal-head">
    <button onclick="prevMonth()">◀</button>
    <span id="calTitle"></span>
    <button onclick="nextMonth()">▶</button>
  </div>

  <!-- WEEK DAYS -->
  <div class="weekdays">
    <div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>

  <!-- CALENDAR GRID -->
  <div class="calendar" id="calendar"></div>

  <!-- LEGEND -->
  <div class="legend">
    <span><i class="l done"></i> Completed</span>
    <span><i class="l pending"></i> Today</span>
    <span><i class="l missed"></i> Missed</span>
    <span><i class="l future"></i> Future</span>
  </div>
</div>

</div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <button onclick="location.reload()"><span>🏠</span>Home</button>
  <button><span>🏆</span>Leaderboard</button>
  <button><span>📅</span>Calendar</button>
  <button onclick="window.open('https://forms.gle/27H48E8rNhN9nNz29','_blank')">
    <span>🧍‍♂️</span>Plank
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

let curMonth=new Date().getMonth();
let curYear=new Date().getFullYear();

window.prevMonth=()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--;}loadCalendar();}
window.nextMonth=()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++;}loadCalendar();}

async function loadCalendar(){
  calendar.innerHTML="";
  calTitle.innerText=new Date(curYear,curMonth)
    .toLocaleString("default",{month:"long",year:"numeric"});

  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  const voted={}; s.forEach(d=>voted[d.data().date]=1);

  const firstDay=(new Date(curYear,curMonth,1).getDay()+6)%7; // Monday start
  const days=new Date(curYear,curMonth+1,0).getDate();
  const today=new Date().toISOString().split("T")[0];

  for(let i=0;i<firstDay;i++){
    calendar.innerHTML+=`<div></div>`;
  }

  for(let i=1;i<=days;i++){
    const ds=new Date(curYear,curMonth,i).toISOString().split("T")[0];
    let cls="future";
    if(ds<today) cls=voted[ds]?"done":"missed";
    if(ds===today) cls=voted[ds]?"done":"pending";
    calendar.innerHTML+=`
      <div class="day ${cls} ${ds===today?"today":""}">${i}</div>`;
  }
}

loadCalendar();
</script>

</body>
</html>
