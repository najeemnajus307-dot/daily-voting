<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom Nav Fixed</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  height:100vh;
  color:white;
}

/* CONTENT */
.content{
  text-align:center;
  padding-top:40px;
}

/* NAV BAR */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#020617;
  display:flex;
  justify-content:space-around;
  padding:10px 0 14px;
  box-shadow:0 -4px 10px rgba(0,0,0,.4);
  position:relative; /* 🔥 VERY IMPORTANT */
}

/* INDICATOR */
.indicator{
  position:absolute;
  bottom:0;
  height:3px;
  width:0;
  background:#3b82f6;
  border-radius:3px;
  transition:.3s;
}

/* NAV ITEM */
.nav-item{
  color:#94a3b8;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  transition:.3s;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

/* ACTIVE */
.nav-item.active{
  color:#3b82f6;
  transform:translateY(-6px);
}

.nav-item.active img{
  animation:bounce .4s;
}

/* BOUNCE */
@keyframes bounce{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="content">
  <h2 id="pageTitle">Today</h2>
  <p>Click bottom icons</p>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="nav">
  <div class="indicator" id="indicator"></div>

  <div class="nav-item active" onclick="setActive(this,'Today')">
    <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png">
    Today
  </div>

  <div class="nav-item" onclick="setActive(this,'Calendar')">
    <img src="https://cdn-icons-png.flaticon.com/512/747/747310.png">
    Calendar
  </div>

  <div class="nav-item" onclick="setActive(this,'Leaderboard')">
    <img src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png">
    Leaderboard
  </div>

  <div class="nav-item" onclick="setActive(this,'History')">
    <img src="https://cdn-icons-png.flaticon.com/512/747/747968.png">
    History
  </div>

  <div class="nav-item" onclick="setActive(this,'Settings')">
    <img src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png">
    Settings
  </div>
</div>

<script>
const indicator = document.getElementById("indicator");
const items = document.querySelectorAll(".nav-item");
const nav = document.getElementById("nav");

function setActive(el,page){
  items.forEach(i=>i.classList.remove("active"));
  el.classList.add("active");

  document.getElementById("pageTitle").innerText = page;

  const rect = el.getBoundingClientRect();
  const parentRect = nav.getBoundingClientRect();

  indicator.style.width = rect.width + "px";
  indicator.style.left = (rect.left - parentRect.left) + "px";
}

// INIT
window.onload = ()=>{
  setActive(document.querySelector(".nav-item.active"),"Today");
};
</script>

</body>
</html>
