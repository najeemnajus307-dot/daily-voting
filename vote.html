<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vote</title>
<style>
body{font-family:Arial;background:#eef2f7}
.box{background:#fff;padding:20px;width:320px;margin:40px auto;border-radius:10px}
button{width:100%;padding:10px;margin-top:10px}
</style>
</head>
<body>

<div class="box">
<h3 id="uname"></h3>
<div id="tasks"></div>
<button onclick="submitVote()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db=getFirestore(app);

const phone=sessionStorage.getItem("phone");
const name=sessionStorage.getItem("name");
if(!phone) location.href="index.html";
uname.innerText="Hi "+name;

const taskSnap=await getDoc(doc(db,"settings","tasks"));
const taskList=taskSnap.exists()?taskSnap.data().list:[];

taskList.forEach(t=>{
  tasks.innerHTML+=`
    <label>
      <input type="checkbox" value="${t}"> ${t}
    </label><br>`;
});

window.submitVote=async()=>{
  const sel=[...document.querySelectorAll("input:checked")].map(i=>i.value);
  if(sel.length===0){alert("Select task");return;}

  const d=new Date().toISOString().slice(0,10);
  const ref=doc(db,"votes",phone+"_"+d);
  if((await getDoc(ref)).exists()){
    alert("Already voted today");return;
  }
  await setDoc(ref,{phone,name,tasks:sel,date:d});
  alert("Vote submitted");
};
</script>
</body>
</html>
