<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:380px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
  position:relative;
}

/* LOGO */
.logo-box{
  text-align:center;
  margin-bottom:10px;
}
.logo-box img{
  width:180px;
  max-width:100%;
}

/* HEADERS */
h2{
  text-align:center;
  margin:6px 0 2px;
}
h4{
  text-align:center;
  color:#16a34a;
  margin:0 0 10px;
}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:6px;
}

/* TASKS */
label{
  display:block;
  margin:8px 0;
}
.points{
  font-size:13px;
  color:green;
  margin-left:22px;
}

/* BUTTONS */
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
.submit-btn{
  background:#16a34a;
  color:#fff;
}
.submit-btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}
.logout-btn{
  background:#dc2626;
  color:#fff;
  margin-top:10px;
}
.logout-btn:hover{
  background:#b91c1c;
}
</style>
</head>

<body>

<div class="box">

  <!-- LOGO -->
  <div class="logo-box">
    <img src="faith-fitness.png" alt="Faith & Fitness">
  </div>

  <h2>Welcome Faith & Fitness</h2>
  <h4>Daily Tasks</h4>

  <div class="info" id="user"></div>
  <div class="info" id="date"></div>

  <!-- TASK LIST -->
  <div id="taskList"></div>

  <!-- SUBMIT -->
  <button id="submitBtn" class="submit-btn">Submit</button>

  <!-- LOGOUT -->
  <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

async function init(){

  const user  = localStorage.getItem("currentUser");
  const phone = localStorage.getItem("currentPhone");
  if(!user || !phone){
    location.replace("index.html");
    return;
  }

  const today = new Date().toISOString().split("T")[0];
  const voteRef = doc(db,"votes", phone + "_" + today);

  document.getElementById("user").innerText = "User : " + user;
  document.getElementById("date").innerText = "Date : " + today;

  const taskBox = document.getElementById("taskList");
  const submitBtn = document.getElementById("submitBtn");

  /* LOAD TASKS */
  const taskSnap = await getDoc(doc(db,"tasks","daily"));
  const tasks = taskSnap.exists() ? taskSnap.data().list : [];

  if(tasks.length === 0){
    taskBox.innerHTML = "<p>No tasks today</p>";
    submitBtn.disabled = true;
    return;
  }

  /* BUILD TASK HTML */
  taskBox.innerHTML = tasks.map((t,i)=>`
    <label>
      <input type="checkbox" id="task_${i}">
      ${t.text}
      <div class="points">${t.points} points</div>
    </label>
  `).join("");

  /* READ CHECKBOXES */
  const inputs = tasks.map((t,i)=>({
    el: document.getElementById("task_"+i),
    pts: Number(t.points)
  }));

  /* CHECK ALREADY SUBMITTED */
  const snap = await getDoc(voteRef);
  if(snap.exists()){
    const old = snap.data().tasks || {};
    inputs.forEach((o,i)=>{
      o.el.checked = !!old[i];
      o.el.disabled = true;
    });
    submitBtn.disabled = true;
    submitBtn.innerText = "Already submitted";
    return;
  }

  /* SUBMIT */
  submitBtn.onclick = async ()=>{
    let result = {};
    let total = 0;

    inputs.forEach((o,i)=>{
      result[i] = o.el.checked;
      if(o.el.checked){
        total += o.pts;
      }
    });

    await setDoc(voteRef,{
      name:user,
      phone:phone,
      date:today,
      tasks:result,
      totalPoints:total,
      submittedAt:new Date().toISOString()
    });

    alert("Vote saved ✅ Total points : " + total);

    inputs.forEach(o=>o.el.disabled=true);
    submitBtn.disabled = true;
    submitBtn.innerText = "Already submitted";
  };
}

/* LOGOUT */
window.logout = function(){
  if(confirm("Logout cheyyano?")){
    localStorage.clear();
    location.replace("index.html");
  }
};

init();
</script>

</body>
</html>
