<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  margin:0;
  padding:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOGO */
.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.logo-wrap img{
  width:70%;
  max-width:220px;
  height:auto;
}

/* CARD */
.box{
  background:#fff;
  padding:22px;
  width:92%;
  max-width:360px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

h2{
  margin:8px 0 4px;
}
h3{
  margin:0 0 8px;
  color:#16a34a;
  font-size:16px;
}

.info{
  font-size:14px;
  margin-bottom:6px;
}

/* MESSAGE */
.msg{
  margin-top:10px;
  padding:12px;
  background:#fef3c7;
  color:#92400e;
  border-radius:8px;
  font-size:14px;
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.submit{
  background:#9ca3af;
  color:#fff;
}
.logout{
  background:#dc2626;
  color:#fff;
}
.disabled{
  opacity:.7;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">

  <!-- LOGO -->
  <div class="logo-wrap">
    <img src="logo.png" alt="Faith & Fitness">
  </div>

  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName" class="info">Hello</div>
  <div id="userPoints" class="info">Total Points: 0</div>

  <div class="msg">
    You have done today’s voting ✅<br>
    Next voting is tomorrow at <b>8 PM</b>
  </div>

  <button class="submit disabled" disabled>Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
/* 🔐 SIMPLE LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");
const points = localStorage.getItem("userPoints") || 0;

if(!phone){
  location.replace("index.html");
}

document.getElementById("userName").innerText =
  "Hello, " + (name || "User");
document.getElementById("userPoints").innerText =
  "Total Points: " + points;

/* 🚪 LOGOUT */
function logout(){
  localStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
