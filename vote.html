<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 12px rgba(0,0,0,.2);
}
h2{margin-bottom:10px}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  text-align:left;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.submit{background:#16a34a;color:white}
.logout{background:#dc2626;color:white}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME<br>FAITH & FITNESS</h2>
  <div id="userInfo"></div>
  <div id="taskArea">Loading tasks...</div>
  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* LOGIN CHECK */
const phone = localStorage.getItem("currentPhone");
const name  = localStorage.getItem("currentUser");
if(!phone || !name){
  location.href="index.html";
}

userInfo.innerHTML = `
Hello <b>${name}</b><br>
Date : ${new Date().toISOString().slice(0,10)}
`;

/* LOAD TASK (daily) */
let taskPoints = 0;
const taskDoc = await getDoc(doc(db,"tasks","daily"));

if(taskDoc.exists()){
  const t = taskDoc.data();
  taskPoints = Number(t.points || 0);
  taskArea.innerHTML = `
    <div class="task">
      <input type="checkbox" id="chk">
      ${t.text} (${taskPoints} pts)
    </div>`;
}else{
  taskArea.innerHTML = "<b>No tasks today</b>";
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!document.getElementById("chk")?.checked){
    alert("Select task first");
    return;
  }

  const userRef = doc(db,"users",phone);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const oldPoints = Number(snap.data().totalPoints || 0);
  const newTotal  = oldPoints + taskPoints;

  await updateDoc(userRef,{
    totalPoints: newTotal
  });

  alert(`Vote submitted ✅\nTotal points: ${newTotal}`);
  document.querySelector(".submit").disabled=true;
};

/* LOGOUT */
window.logout=()=>{
  localStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
