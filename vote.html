<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:380px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  position:relative;
}
label{display:block;margin:6px 0;}
.points{color:green;font-size:13px;}
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
}
.logout{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  width:auto;
  padding:6px 10px;
}
</style>
</head>

<body>

<div class="box">
  <button class="logout" onclick="logout()">Logout</button>

  <h3>Daily Tasks</h3>
  <div id="taskList"></div>

  <button id="submitBtn">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function init(){

  const user  = localStorage.getItem("currentUser");
  const phone = localStorage.getItem("currentPhone");
  if(!user || !phone){
    location.replace("index.html");
    return;
  }

  const today = new Date().toISOString().split("T")[0];
  const voteRef = doc(db,"votes", phone+"_"+today);

  const taskBox = document.getElementById("taskList");
  const btn = document.getElementById("submitBtn");

  const taskSnap = await getDoc(doc(db,"tasks","daily"));
  const tasks = taskSnap.data().list || [];

  const inputs = {};

  tasks.forEach((t,i)=>{
    const id = "t"+i;
    taskBox.innerHTML += `
      <label>
        <input type="checkbox" id="${id}">
        ${t.text}
        <div class="points">${t.points} points</div>
      </label>
    `;
    inputs[i] = { el:document.getElementById(id), pts:t.points };
  });

  btn.onclick = async ()=>{
    let result = {};
    let total = 0;

    Object.keys(inputs).forEach(i=>{
      const checked = inputs[i].el.checked;
      result[i] = checked;
      if(checked) total += inputs[i].pts;
    });

    await setDoc(voteRef,{
      name:user,
      phone:phone,
      date:today,
      tasks:result,
      totalPoints:total
    });

    alert("Vote saved ✅ Total points: " + total);
    location.reload();
  };
}

window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

init();
</script>

</body>
</html>
