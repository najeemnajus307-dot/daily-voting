<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box{
  background:#fff;
  padding:24px;
  width:100%;
  max-width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}

.task{
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}

.msg{
  margin-top:12px;
  padding:12px;
  background:#fef3c7;
  color:#92400e;
  border-radius:8px;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName">Hello</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 🗓️ TODAY */
const today = new Date().toISOString().split("T")[0];

/* 👤 LOAD USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ TOTAL POINTS (USER + ADMIN) */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    total += Number(d.data().points || 0);
  });
  userPoints.innerText = "Total Points: " + total;
}

/* ❌ CHECK ALREADY VOTED */
async function alreadyVoted(){
  const snap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today),
      where("source","==","user")
    )
  );

  if(!snap.empty){
    taskBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    message.innerHTML = `
      <div class="msg">
        You have done today’s voting ✅<br>
        Next voting is tomorrow at <b>8 PM</b>
      </div>`;
    return true;
  }
  return false;
}

/* 🗳️ LOAD ACTIVE TASKS */
async function loadTasks(){
  if(await alreadyVoted()) return;

  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));

  let hasTask = false;
  taskBox.innerHTML = "";
  message.innerHTML = "";

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      hasTask = true;
      taskBox.innerHTML += `
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            <b>${t.text}</b> (Points: ${t.points})
          </label>
        </div>
      `;
    }
  });

  if(!hasTask){
    taskBox.innerHTML =
      `<div class="msg">No active tasks right now ❌</div>`;
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
  }
}

/* ✅ SUBMIT VOTE (DOUBLE PROTECTION) */
window.submitVote = async ()=>{
  const checks =
    document.querySelectorAll("#taskBox input[type=checkbox]:checked");

  if(checks.length === 0){
    alert("At least one task complete cheyyanam ✅");
    return;
  }

  /* 🔒 FINAL DB CHECK (ANTI DUPLICATE) */
  const checkSnap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today),
      where("source","==","user")
    )
  );

  if(!checkSnap.empty){
    alert("You already voted today ❌");
    alreadyVoted();
    return;
  }

  let points = 0;
  checks.forEach(c => points += Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    date: today,
    source: "user",
    createdAt: new Date().toISOString()
  });

  loadTotalPoints();
  alreadyVoted();
};

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* 🚀 INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
