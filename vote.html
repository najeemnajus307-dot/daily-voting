<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.info{
  font-size:14px;
  color:#374151;
  margin-top:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Loading...</div>
  <div class="info" id="userPoints">Total Points: 0</div>

  <div id="taskBox" class="task">Loading task...</div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK (GATE SAFE) */
const phone = sessionStorage.getItem("userPhone");
if(!phone){
  location.replace("gate.html");
}

/* 👤 LOAD USER NAME */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );

  if(snap.empty){
    userName.innerText = "Hello User";
    return;
  }

  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ LOAD TOTAL POINTS */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );

  snap.forEach(d=>{
    total += Number(d.data().points || 0);
  });

  userPoints.innerText = "Total Points: " + total;
}

/* 🗓️ LOAD ACTIVE TASK (TIME BASED) */
let activeTask = null;

async function loadTask(){
  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));
  let found = false;

  snap.forEach(d=>{
    if(found) return;

    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      found = true;
      activeTask = { ...t, id: d.id };

      taskBox.innerHTML = `
        <label>
          <input type="checkbox" id="taskCheck">
          <strong>${t.text}</strong><br>
          <small>Points: ${t.points}</small>
        </label>
      `;
    }
  });

  if(!found){
    disableVote("No active task now ❌");
    return;
  }

  /* 🔒 CHECK ALREADY VOTED FOR THIS TASK DATE */
  const voteDate = activeTask.start.split("T")[0];

  const s = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",voteDate)
    )
  );

  if(!s.empty){
    showDoneMessage();
  }
}

/* 🗳️ SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!activeTask) return;

  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("Task complete cheythu checkbox tick cheyyu ✅");
    return;
  }

  // 🔑 IMPORTANT: vote date = task start date
  const voteDate = activeTask.start.split("T")[0];

  await addDoc(collection(db,"votes"),{
    phone,
    points: activeTask.points,
    date: voteDate,
    taskId: activeTask.id,
    createdAt: new Date().toISOString()
  });

  showDoneMessage();
  loadTotalPoints();
};

/* ✅ AFTER VOTE MESSAGE */
function showDoneMessage(){
  const t = new Date();
  t.setDate(t.getDate() + 1);
  t.setHours(20,0,0,0);

  taskBox.innerHTML = `
    <strong>✅ You have done today’s voting</strong><br><br>
    Next voting starts at <b>${t.toLocaleString()}</b>
  `;
  disableButton();
}

/* 🔒 DISABLE BUTTON */
function disableButton(){
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.classList.add("disabled");
}

/* 🔒 DISABLE VOTE (NO TASK) */
function disableVote(msg){
  taskBox.innerHTML = msg;
  disableButton();
}

/* 🚪 LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  location.replace("gate.html");
};

/* 🔄 INIT */
loadUser();
loadTotalPoints();
loadTask();
</script>

</body>
</html>
