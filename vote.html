<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
h2{
  text-align:center;
  color:#16a34a;
  margin-bottom:10px;
}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.submitBtn{background:#16a34a;}
.logoutBtn{background:#dc2626;}
button:disabled{background:#9ca3af;}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:6px;
}
input[type="checkbox"]{
  accent-color:#16a34a;
}
</style>
</head>

<body>

<script>
/* LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");
if(!phone || !name){
  location.replace("index.html");
}
</script>

<div class="box">

<!-- 🔰 TOP TITLE -->
<h2>WELCOME<br>FAITH & FITNESS</h2>

<div class="info">Hello <b id="user"></b></div>
<div class="info" id="date"></div>
<div class="info">
  This Month Points : <b id="monthPts">0</b>
</div>

<div id="tasksArea">Loading tasks...</div>

<!-- ✅ SUBMIT -->
<button id="submitBtn" class="submitBtn">Submit Vote</button>

<!-- 🔴 LOGOUT BELOW SUBMIT -->
<button class="logoutBtn" onclick="logout()">Logout</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UI INIT */
document.getElementById("user").innerText = name;
const today = new Date().toISOString().split("T")[0];
document.getElementById("date").innerText = "Date : " + today;

const monthKey = new Date().toISOString().slice(0,7); // YYYY-MM

const tasksArea = document.getElementById("tasksArea");
const submitBtn = document.getElementById("submitBtn");

/* LOAD USER POINTS */
const userRef = doc(db,"users",phone);
let userSnap = await getDoc(userRef);

let monthly = {};
let totalPoints = 0;

if(userSnap.exists()){
  monthly = userSnap.data().monthlyPoints || {};
  totalPoints = userSnap.data().totalPoints || 0;
}

document.getElementById("monthPts").innerText =
  monthly[monthKey] || 0;

/* CHECK TODAY VOTE */
const voteId = phone + "_" + today;
const voteRef = doc(db,"votes",voteId);
const voted = await getDoc(voteRef);

if(voted.exists()){
  submitBtn.disabled = true;
  submitBtn.innerText = "Already Voted Today";
}

/* LOAD TASKS */
tasksArea.innerHTML="";
let tasks=[];

const snap = await getDocs(collection(db,"tasks"));
snap.forEach(d=>{
  const t = d.data();
  if(t.active){
    tasks.push({id:d.id,...t});
  }
});

if(tasks.length===0){
  tasksArea.innerHTML =
    "<p style='color:red;text-align:center'>No tasks today</p>";
}

tasks.forEach((t,i)=>{
  tasksArea.innerHTML += `
    <div class="task">
      <label>
        <input type="checkbox" id="task_${i}">
        ${t.title} ( ${t.points} pts )
      </label>
    </div>
  `;
});

/* SUBMIT VOTE */
submitBtn.onclick = async ()=>{
  if(submitBtn.disabled) return;

  let todayPoints = 0;
  const selected = {};

  tasks.forEach((t,i)=>{
    const chk = document.getElementById("task_"+i).checked;
    selected[t.id] = chk;
    if(chk) todayPoints += t.points;
  });

  /* SAVE DAILY VOTE */
  await setDoc(voteRef,{
    name,
    phone,
    date: today,
    todayPoints,
    tasks: selected,
    submittedAt: new Date().toISOString()
  });

  /* UPDATE USER POINTS */
  monthly[monthKey] = (monthly[monthKey] || 0) + todayPoints;
  totalPoints += todayPoints;

  await setDoc(userRef,{
    name,
    phone,
    totalPoints,
    monthlyPoints: monthly
  },{ merge:true });

  alert("Vote submitted successfully 👍");
  submitBtn.disabled = true;
  submitBtn.innerText = "Already Voted Today";
  document.getElementById("monthPts").innerText =
    monthly[monthKey];
};

/* LOGOUT */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};
</script>

</body>
</html>
