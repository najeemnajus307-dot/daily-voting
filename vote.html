<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
  text-align:center;
}
.task{text-align:left;margin:6px 0}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
.submit{background:#16a34a;color:white}
.logout{background:#dc2626;color:white}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME<br>FAITH & FITNESS</h2>
  <div id="userBox"></div>
  <div id="dateBox"></div>

  <div id="tasksBox">Loading tasks...</div>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc,
  updateDoc, increment
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOGIN CHECK */
const phone = sessionStorage.getItem("phone");
const name  = sessionStorage.getItem("name");
if(!phone) location.href="index.html";

/* UI */
const today = new Date().toISOString().slice(0,10);
userBox.innerHTML = `<b>Hello ${name}</b>`;
dateBox.innerHTML = `Date : ${today}`;

/* LOAD TASKS (tasks/daily/list) */
async function loadTasks(){
  const snap = await getDoc(doc(db,"tasks","daily"));
  if(!snap.exists()){
    tasksBox.innerHTML="<span style='color:red'>No tasks today</span>";
    return;
  }

  const list = snap.data().list || [];
  if(list.length===0){
    tasksBox.innerHTML="<span style='color:red'>No tasks today</span>";
    return;
  }

  tasksBox.innerHTML="";
  list.forEach((t,i)=>{
    tasksBox.innerHTML+=`
      <div class="task">
        <label>
          <input type="checkbox" value="${t.points}">
          ${t.text} (${t.points} pts)
        </label>
      </div>`;
  });
}
loadTasks();

/* SUBMIT VOTE (ADD POINTS) */
window.submitVote = async ()=>{
  const checked = document.querySelectorAll("#tasksBox input:checked");
  if(checked.length===0){
    alert("Select at least one task");
    return;
  }

  let votePoints=0;
  checked.forEach(c=>votePoints+=Number(c.value));

  /* ADD points to user */
  await updateDoc(
    doc(db,"users",phone),
    { totalPoints: increment(votePoints) }
  );

  alert("Vote submitted ✅ Points added: "+votePoints);
  location.reload();
};

/* LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
