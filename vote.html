<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Vote</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
input{width:100%;padding:8px;margin-bottom:8px;}
label{display:block;margin:8px 0;}
button{
  width:100%;
  padding:10px;
  background:green;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h3>Daily Challenge</h3>
  <p><b>Task:</b> 30 Push-ups</p>
  <p><b>Points:</b> 5</p>

  <input id="user" placeholder="Your Name">

  <label><input type="radio" name="vote" value="Completed"> Completed</label>
  <label><input type="radio" name="vote" value="Not Completed"> Not Completed</label>

  <button onclick="submitVote()">Submit</button>
</div>

<script>
function submitVote(){
  let user = document.getElementById("user").value.trim();
  let v = document.querySelector('input[name="vote"]:checked');

  if(!user || !v){
    alert("All fields fill ചെയ്യൂ");
    return;
  }

  let today = new Date().toDateString();
  let data = JSON.parse(localStorage.getItem("votes") || "[]");

  // one vote per user per day
  let exists = data.find(d => d.user === user && d.date === today);
  if(exists){
    alert("ഇന്ന് ഇതിനകം vote ചെയ്തിട്ടുണ്ട്");
    return;
  }

  let points = v.value === "Completed" ? 5 : 0;

  data.push({
    date: today,
    user: user,
    task: "30 Push-ups",
    status: v.value,
    points: points
  });

  localStorage.setItem("votes", JSON.stringify(data));
  alert("Vote saved ✅");
}
</script>

</body>
</html>
