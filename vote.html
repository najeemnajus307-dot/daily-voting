<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness - Voting</title>

<style>
body{
  font-family: Arial;
  background:#eef2f7;
  margin:0;
}

/* HEADER */
.header{
  background:#16a34a;
  color:white;
  padding:15px;
  text-align:center;
}
.header h2{margin:0;}
.header p{margin:4px 0;font-size:14px;}

/* MAIN */
.container{
  display:flex;
  justify-content:center;
  margin-top:20px;
}
.box{
  background:#fff;
  padding:20px;
  width:340px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.15);
}

.info{
  background:#f1f5f9;
  padding:10px;
  border-radius:6px;
  margin-bottom:12px;
  font-size:14px;
}

.task{
  padding:6px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  cursor:pointer;
  font-size:15px;
}
.voteBtn{background:#16a34a;color:white;}
.logoutBtn{background:#e5e7eb;}
</style>
</head>

<body>

<!-- 🔝 TOP -->
<div class="header">
  <h2>Welcome Faith & Fitness 💪</h2>
  <p id="today"></p>
</div>

<div class="container">
  <div class="box">

    <div class="info">
      <div><b>User :</b> <span id="uname"></span></div>
      <div><b>Total Points :</b> <span id="points">0</span></div>
    </div>

    <!-- ✅ TASK LIST (USER VIEW ONLY) -->
    <div id="taskList"></div>

    <button class="voteBtn" onclick="submitVote()">Submit Today Task</button>
    <button class="logoutBtn" onclick="logout()">Logout</button>

  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc,
  getDocs, collection
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* SESSION */
const phone = sessionStorage.getItem("phone");
const name  = sessionStorage.getItem("name");
if(!phone) location.href="index.html";

/* DATE */
const today = new Date();
const dateKey = today.toISOString().slice(0,10);
document.getElementById("today").innerText = today.toDateString();
document.getElementById("uname").innerText = name;

/* 🔹 LOAD TASKS FROM TASK EDITOR */
const taskBox = document.getElementById("taskList");
const taskRef = doc(db,"settings","tasks");
const taskSnap = await getDoc(taskRef);

const tasks = taskSnap.exists()
  ? taskSnap.data().list
  : [];

tasks.forEach(task=>{
  taskBox.innerHTML += `
    <div class="task">
      <label>
        <input type="checkbox" value="${task}"> ${task}
      </label>
    </div>
  `;
});

/* 🔢 TOTAL POINTS */
let pts = 0;
const allVotes = await getDocs(collection(db,"votes"));
allVotes.forEach(v=>{
  if(v.data().phone === phone) pts++;
});
document.getElementById("points").innerText = pts;

/* ✅ SUBMIT VOTE */
window.submitVote = async ()=>{
  const selected = [...document.querySelectorAll(
    'input[type="checkbox"]:checked'
  )].map(i=>i.value);

  if(selected.length === 0){
    alert("Select at least one task");
    return;
  }

  const ref = doc(db,"votes", phone+"_"+dateKey);
  if((await getDoc(ref)).exists()){
    alert("Already submitted today");
    return;
  }

  await setDoc(ref,{
    phone:phone,
    name:name,
    tasks:selected,
    date:dateKey
  });

  alert("Task submitted successfully ✅");
  location.reload();
};

/* LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
