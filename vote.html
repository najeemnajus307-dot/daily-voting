<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Voting</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
}

/* 🔰 LOGO HEADER */
.logo-bar{
  background:#fff;
  padding:15px 0;
  display:flex;
  justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.logo{
  width:220px;       /* 👈 logo size */
  max-width:100%;
  height:auto;
}

/* 📦 CARD */
.container{
  display:flex;
  justify-content:center;
  margin-top:40px;
}

.card{
  background:#fff;
  width:92%;
  max-width:360px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.15);
  text-align:center;
}

h2{
  margin:5px 0;
}
.green{color:#16a34a}

.task{
  text-align:left;
  margin:12px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  margin-top:10px;
  font-size:15px;
  cursor:pointer;
}

.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af;
  color:#fff;
}

.note{
  background:#fef3c7;
  color:#92400e;
  padding:8px;
  font-size:13px;
  border-radius:6px;
  margin:10px 0;
}

/* 📱 MOBILE */
@media(max-width:600px){
  .logo{width:180px}
}
</style>
</head>

<body>

<!-- 🔰 LOGO -->
<div class="logo-bar">
  <img src="logo.png" class="logo" alt="Faith & Fitness Logo">
</div>

<!-- 📦 VOTING CARD -->
<div class="container">
  <div class="card">

    <h2>WELCOME</h2>
    <div class="green"><b>FAITH & FITNESS</b></div>
    <p>Hello, <b id="username">User</b><br>
       Total Points: <b id="points">0</b>
    </p>

    <!-- MESSAGE -->
    <div class="note" id="msg" style="display:none"></div>

    <!-- TASKS -->
    <div id="tasks"></div>

    <button class="submit" id="submitBtn" onclick="submitVote()">Submit Vote</button>
    <button class="logout" onclick="logout()">Logout</button>

  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* 👤 USER (demo – replace with real login data) */
const user = {
  name:"Muhammed najeem",
  phone:"9999999999"
};
username.innerText = user.name;

/* 📅 TODAY */
const today = new Date().toISOString().split("T")[0];

/* 🧠 CHECK ALREADY VOTED */
let votedToday = false;
const votesSnap = await getDocs(collection(db,"votes"));
votesSnap.forEach(d=>{
  const v = d.data();
  if(v.phone === user.phone && v.date === today){
    votedToday = true;
  }
});

/* 🧾 TASKS (STATIC DEMO) */
const TASKS = [
  {title:"No challenge complete today", points:0},
  {title:"Drink water 💧", points:5},
  {title:"Sugar cut 🍬", points:5}
];

/* 🚫 IF VOTED */
if(votedToday){
  msg.style.display="block";
  msg.innerText="You have done today’s voting ✅\nNext voting is tomorrow at 8 PM";
  submitBtn.classList.add("disabled");
  submitBtn.disabled=true;
}else{
  TASKS.forEach((t,i)=>{
    tasks.innerHTML += `
      <div class="task">
        <label>
          <input type="checkbox" value="${t.points}">
          ${t.title} (Points: ${t.points})
        </label>
      </div>
    `;
  });
}

/* ➕ SUBMIT */
window.submitVote = async ()=>{
  let total = 0;
  document.querySelectorAll("input[type=checkbox]:checked")
    .forEach(c=> total += Number(c.value));

  await addDoc(collection(db,"votes"),{
    phone:user.phone,
    points:total,
    date:today,
    source:"user"
  });

  location.reload();
};

/* 🚪 LOGOUT */
window.logout = ()=>{
  location.href="index.html";
};
</script>

</body>
</html>
