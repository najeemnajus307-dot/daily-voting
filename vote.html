<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=0.85, user-scalable=yes">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.info{
  font-size:14px;
  color:#374151;
  margin-top:6px;
}
.task{
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.msg{
  margin-top:12px;
  padding:12px;
  background:#fef3c7;
  color:#92400e;
  border-radius:8px;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Hello</div>
  <div class="info" id="userPoints">Total Points: 0</div>
  <div class="info" id="voteDateInfo"></div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 Login check */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 Load user */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ Total points (user + admin from votes) */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=> total += Number(d.data().points || 0));
  userPoints.innerText = "Total Points: " + total;
}

/* 🔑 Active tasks (MULTIPLE) */
let activeTasks = [];

/* 🗳️ Check voted for THIS voting window */
async function checkVoted(){
  if(activeTasks.length === 0) return false;

  const voteDate = activeTasks[0].start.split("T")[0];

  const snap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",voteDate),
      where("source","==","user")
    )
  );

  if(!snap.empty){
    taskBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    message.innerHTML = `
      <div class="msg">
        You have done this voting ✅<br>
        Next voting starts at <b>8:00 PM</b>
      </div>`;
    return true;
  }
  return false;
}

/* 🗓️ Load ACTIVE TASKS (MULTI-TASK + 12 PM RULE) */
async function loadTasks(){
  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));

  activeTasks = [];
  taskBox.innerHTML = "";
  message.innerHTML = "";
  voteDateInfo.innerText = "";

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      activeTasks.push(t);

      const showDate = start.toLocaleDateString("en-GB");
      const endTime  = end.toLocaleTimeString("en-IN",{
        hour:"2-digit", minute:"2-digit", hour12:true
      });

      voteDateInfo.innerText =
        "You are voting for: " + showDate +
        " (Valid till " + endTime + ")";

      taskBox.innerHTML += `
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            <b>${t.text}</b> (Points: ${t.points})
          </label>
        </div>
      `;
    }
  });

  if(activeTasks.length === 0){
    taskBox.innerHTML =
      `<div class="msg">No active voting right now ❌</div>`;
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    return;
  }

  await checkVoted();
}

/* 🗳️ Submit Vote (SUM points, SAVE AS START DATE) */
window.submitVote = async ()=>{
  if(activeTasks.length === 0) return;

  const checks = document.querySelectorAll(
    "#taskBox input[type=checkbox]:checked"
  );

  if(checks.length === 0){
    alert("At least one task complete cheyyanam ✅");
    return;
  }

  let points = 0;
  checks.forEach(c=>{
    points += Number(c.dataset.points);
  });

  const voteDate = activeTasks[0].start.split("T")[0];

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    date: voteDate,       // 🔥 TASK START DATE
    source: "user",
    createdAt: new Date().toISOString()
  });

  loadTotalPoints();
  checkVoted();
};

/* 🚪 Logout */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
