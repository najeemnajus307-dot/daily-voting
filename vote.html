<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Vote</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
label{
  display:block;
  margin:8px 0;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:green;
  color:white;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="box">
<h3>Daily Vote</h3>

<label><input type="radio" name="v" value="A"> Option A</label>
<label><input type="radio" name="v" value="B"> Option B</label>
<label><input type="radio" name="v" value="C"> Option C</label>

<button onclick="vote()">Submit</button>
</div>

<script>
function vote(){
  let v = document.querySelector('input[name="v"]:checked');
  if(!v){
    alert("Option select ചെയ്യൂ");
    return;
  }
  alert("Vote success ✅ : " + v.value);
}
</script>

</body>
</html>
