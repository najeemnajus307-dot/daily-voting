<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  max-width:420px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
.task{
  border:1px solid #ddd;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  margin-top:10px;
}
input{
  margin-right:6px;
}
</style>
</head>

<body>

<div class="box">
  <h3>Daily Challenge Vote</h3>

  <input id="user" placeholder="Your Name">

  <div id="tasks"></div>

  <button onclick="submitVote()">Submit Vote</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 SAME FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const taskBox = document.getElementById("tasks");
let tasks = [];

/* LOAD TASKS FROM FIREBASE */
const snap = await getDoc(doc(db,"tasks","daily"));
if(snap.exists()){
  tasks = snap.data().list || [];
  renderTasks();
}

function renderTasks(){
  taskBox.innerHTML="";
  tasks.forEach((t,i)=>{
    taskBox.innerHTML += `
      <div class="task">
        <b>${t}</b> <br>
        <label>
          <input type="radio" name="task${i}" value="Completed"> Completed
        </label>
        <label>
          <input type="radio" name="task${i}" value="Not Completed"> Not Completed
        </label>
        <div><b>Points:</b> 5</div>
      </div>
    `;
  });
}

/* SUBMIT VOTE */
window.submitVote = async function(){
  let user = document.getElementById("user").value.trim();
  if(!user){
    alert("User name enter ചെയ്യൂ");
    return;
  }

  for(let i=0;i<tasks.length;i++){
    let v = document.querySelector(`input[name="task${i}"]:checked`);
    if(!v){
      alert("എല്ലാ task-ക്കും option select ചെയ്യൂ");
      return;
    }

    let points = v.value === "Completed" ? 5 : 0;

    await addDoc(collection(db,"votes"),{
      user:user,
      task:tasks[i],
      status:v.value,
      points:points,
      date:new Date()
    });
  }

  alert("Votes submitted ✅");
}
</script>

</body>
</html>
