<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:80px}
.header{background:#fff;text-align:center;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:110px}
.container{display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:380px;width:100%;padding:20px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.15);text-align:center}

.task{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0;text-align:left}
.msg{background:#fef3c7;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.submit{background:#16a34a;color:#fff}
.disabled{background:#9ca3af}
.logout{background:#dc2626;color:#fff}

.tp-row{display:grid;grid-template-columns:70px 1fr 60px;align-items:center;padding:8px;border-radius:6px;margin:6px 0;font-weight:bold}
.tp-1{background:#fde047}
.tp-2{background:#e5e7eb}
.tp-3{background:#fecaca}

table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #ddd;padding:6px;font-size:14px;text-align:center}
th{background:#2563eb;color:#fff}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;color:#fff}
.done{background:#16a34a}
.pending{background:#facc15;color:#000}
.missed{background:#ef4444}
.future{background:#374151}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:flex;justify-content:space-around;padding:10px 0}
.bottom-nav button{background:none;border:none;color:#cbd5f5;font-size:13px}
.bottom-nav button.active{color:#fff;font-weight:bold}
.bottom-nav span{display:block;font-size:20px}

input{width:100%;padding:8px}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png">
</div>

<div class="container">
<div class="card">

<!-- HOME -->
<div id="homeSection">
  <h3 style="color:#16a34a">FAITH & FITNESS</h3>
  <div id="todayDate"></div>
  <div id="userName"></div>
  <div id="userPoints"></div>
  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <div id="message"></div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboardSection" style="display:none">
  <h3>🏆 Leaderboard</h3>
  <table>
    <thead><tr><th>Rank</th><th>User</th><th>Points</th></tr></thead>
    <tbody id="allRanks"></tbody>
  </table>
</div>

<!-- CALENDAR -->
<div id="calendarSection" style="display:none">
  <h3>📅 Calendar</h3>
  <div class="calendar" id="calendar"></div>
</div>

<!-- PLANK -->
<div id="plankSection" style="display:none">
  <h3>🏋️ Plank Competition</h3>

  <div style="display:flex;gap:6px">
    <input type="number" id="plankH" placeholder="HH">
    <input type="number" id="plankM" placeholder="MM">
    <input type="number" id="plankS" placeholder="SS">
  </div>

  <button class="submit" onclick="submitPlankTime()">Submit Time</button>
  <div id="plankMsg"></div>
</div>

<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" id="homeBtn" onclick="showHome()"><span>🏠</span>Home</button>
  <button id="leaderBtn" onclick="showLeaderboard()"><span>🏆</span>Top</button>
  <button id="calBtn" onclick="showCalendar()"><span>📅</span>Calendar</button>
  <button id="plankBtn" onclick="showPlank()"><span>🏋️</span>Plank</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH",
  projectId:"YOUR_PROJECT_ID"
});
const db = getFirestore(app);

const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

todayDate.innerText = new Date().toDateString();
userName.innerText = "Hello, " + phone;

/* VOTE */
window.submitVote = async ()=>{
  await addDoc(collection(db,"votes"),{
    phone,
    points:10,
    date:new Date().toISOString().split("T")[0]
  });
  message.innerHTML="<div class='msg'>Vote submitted ✅</div>";
  loadPoints(); loadLeaderboard();
};

/* POINTS */
async function loadPoints(){
  const s = await getDocs(collection(db,"votes"));
  let t=0;
  s.forEach(d=>{ if(d.data().phone==phone) t+=d.data().points });
  userPoints.innerText="Your Points: "+t;
}

/* LEADERBOARD */
async function loadLeaderboard(){
  const s = await getDocs(collection(db,"votes"));
  let map={};
  s.forEach(d=>{
    map[d.data().phone]=(map[d.data().phone]||0)+d.data().points;
  });
  let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  allRanks.innerHTML="";
  arr.forEach((r,i)=>{
    allRanks.innerHTML+=`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`;
  });
}

/* PLANK TIME */
window.submitPlankTime = async ()=>{
  const h=Number(plankH.value||0);
  const m=Number(plankM.value||0);
  const s=Number(plankS.value||0);
  const total=h*3600+m*60+s;

  if(total<30) return alert("Minimum plank time 30 seconds");

  plankMsg.innerHTML="Submitting...";
  await addDoc(collection(db,"plank_videos"),{
    phone,
    duration:total,
    date:new Date().toISOString().split("T")[0]
  });
  plankMsg.innerHTML="<div class='msg'>Time submitted ✅</div>";
};

/* NAV */
function reset(){
  homeSection.style.display=
  leaderboardSection.style.display=
  calendarSection.style.display=
  plankSection.style.display="none";
  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));
}
window.showHome=()=>{reset();homeSection.style.display="block";homeBtn.classList.add("active");}
window.showLeaderboard=()=>{reset();leaderboardSection.style.display="block";leaderBtn.classList.add("active");loadLeaderboard();}
window.showCalendar=()=>{reset();calendarSection.style.display="block";calBtn.classList.add("active");}
window.showPlank=()=>{reset();plankSection.style.display="block";plankBtn.classList.add("active");}

window.logout=()=>{localStorage.clear();location.replace("index.html");}

loadPoints(); loadLeaderboard(); showHome();
</script>

</body>
</html>
