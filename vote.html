<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>Daily Voting</title>
    <style>
        body{
            font-family: Arial;
            background:#f1f5f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            background:white;
            padding:25px;
            width:360px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            position:relative;
        }
        h2{text-align:center;}
        .info{
            text-align:center;
            font-size:14px;
            margin-bottom:6px;
        }
        label{
            display:block;
            margin:6px 0;
        }
        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#16a34a;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
            border-radius:6px;
        }
        button:disabled{
            background:#9ca3af;
            cursor:not-allowed;
        }
        .logout{
            position:absolute;
            top:10px;
            right:10px;
            background:#dc2626;
            width:auto;
            padding:6px 10px;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="box">
    <button class="logout" onclick="logout()">Logout</button>

    <h2>Daily Tasks</h2>

    <div class="info" id="user"></div>
    <div class="info" id="date"></div>

    <label><input type="checkbox" id="water"> വെള്ളം കുടിച്ചു</label>
    <label><input type="checkbox" id="warmup"> Warm up & Stretching</label>
    <label><input type="checkbox" id="sugar"> Sugar cut</label>
    <label><input type="checkbox" id="steps"> 100 Steps</label>
    <label><input type="checkbox" id="pushup"> Push up + Squat</label>

    <button id="submitBtn" onclick="submitVote()">Submit Vote</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.firebasestorage.app",
  messagingSenderId: "1065830068376",
  appId: "1:1065830068376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK (login page sets these) */
let user  = localStorage.getItem("currentUser");
let phone = localStorage.getItem("currentPhone");

if(!user || !phone){
    alert("Login first");
    window.location.href = "index.html";
}

/* 📅 DATE */
let today = new Date().toISOString().split("T")[0];
let voteRef = doc(db, "votes", phone + "_" + today);

/* UI */
document.getElementById("user").innerText = "Welcome " + user;
document.getElementById("date").innerText = "Date : " + today;

let inputs = {
    water:  document.getElementById("water"),
    warmup: document.getElementById("warmup"),
    sugar:  document.getElementById("sugar"),
    steps:  document.getElementById("steps"),
    pushup: document.getElementById("pushup")
};
let btn = document.getElementById("submitBtn");

/* 🔒 CHECK ALREADY SUBMITTED (ONLINE) */
const snap = await getDoc(voteRef);
if(snap.exists()){
    loadTasks(snap.data().tasks);
    lockPage("Already submitted today");
}

/* FUNCTIONS */
function loadTasks(tasks){
    inputs.water.checked  = tasks.water;
    inputs.warmup.checked = tasks.warmup;
    inputs.sugar.checked  = tasks.sugar;
    inputs.steps.checked  = tasks.steps;
    inputs.pushup.checked = tasks.pushup;
}

function lockPage(msg){
    Object.values(inputs).forEach(i => i.disabled = true);
    btn.disabled = true;
    btn.innerText = msg;
}

/* ✅ SUBMIT VOTE (FIREBASE) */
window.submitVote = async function(){
    let taskData = {
        water:  inputs.water.checked,
        warmup: inputs.warmup.checked,
        sugar:  inputs.sugar.checked,
        steps:  inputs.steps.checked,
        pushup: inputs.pushup.checked
    };

    await setDoc(voteRef, {
        name: user,
        phone: phone,
        date: today,
        tasks: taskData,
        submittedAt: new Date().toISOString()
    });

    alert("Vote submitted successfully 👍");
    location.reload();
};

/* 🚪 LOGOUT */
window.logout = function(){
    if(confirm("Logout cheyyano?")){
        localStorage.removeItem("currentUser");
        localStorage.removeItem("currentPhone");
        window.location.href = "index.html";
    }
};
</script>

</body>
</html>
