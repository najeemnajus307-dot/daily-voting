<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:12px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.info{font-size:14px;color:#374151}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
.done{
  color:green;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Loading...</div>
  <div class="info" id="userPoints">Total Points: 0</div>

  <div id="taskBox">Loading tasks...</div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 LOAD USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ TOTAL POINTS */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=> total += Number(d.data().points||0));
  userPoints.innerText = "Total Points: " + total;
}

/* 🗳️ LOAD ACTIVE TASKS */
let activeTasks = [];
let votedTaskIds = [];

async function loadTasks(){
  taskBox.innerHTML = "";
  activeTasks = [];
  votedTaskIds = [];

  const now = Date.now();

  // already voted tasks
  const votedSnap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  votedSnap.forEach(v=> votedTaskIds.push(v.data().taskId));

  const snap = await getDocs(collection(db,"tasks"));
  let anyTask = false;

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start).getTime();
    const end   = new Date(t.end).getTime();

    if(now >= start && now <= end){
      anyTask = true;
      activeTasks.push({id:d.id,...t});

      if(votedTaskIds.includes(d.id)){
        taskBox.innerHTML += `
          <div class="task">
            <b>${t.text}</b><br>
            <small>Points: ${t.points}</small><br>
            <span class="done">Completed ✅</span>
          </div>`;
      }else{
        taskBox.innerHTML += `
          <div class="task">
            <label>
              <input type="checkbox" class="taskCheck" value="${d.id}">
              <b>${t.text}</b><br>
              <small>Points: ${t.points}</small>
            </label>
          </div>`;
      }
    }
  });

  if(!anyTask){
    taskBox.innerHTML = "No active tasks now ⏳<br>Next task starts at 8 PM";
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
  }
}

/* ✅ SUBMIT VOTES (MULTI TASK) */
window.submitVote = async ()=>{
  const checks = document.querySelectorAll(".taskCheck:checked");
  if(checks.length === 0){
    alert("Complete at least one task ✅");
    return;
  }

  for(const chk of checks){
    const task = activeTasks.find(t=>t.id===chk.value);
    if(!task) continue;

    const taskDate = task.start.split("T")[0]; // 🔥 start date

    await addDoc(collection(db,"votes"),{
      phone,
      taskId: task.id,
      taskDate,
      points: task.points,
      createdAt: new Date().toISOString()
    });
  }

  alert("Vote submitted successfully ✅");
  loadTasks();
  loadTotalPoints();
};

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
