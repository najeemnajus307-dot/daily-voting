<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Voting</title>

<style>
*{
  box-sizing:border-box;
}
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  min-height:100vh;
  margin:0;
  padding:16px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#ffffff;
  width:100%;
  max-width:420px;   /* 🔥 SAME SIZE AS LOGIN PAGE */
  padding:26px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  margin:0;
  font-size:24px;
}
h3{
  margin:6px 0 12px;
  color:#16a34a;
}

.info{
  font-size:14px;
  margin-bottom:6px;
}

.task{
  margin:12px 0;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  text-align:left;
}

.msg{
  margin-top:14px;
  padding:14px;
  background:#fef3c7;
  color:#92400e;
  border-radius:10px;
  font-size:14px;
}

button{
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:12px;
}

.submit{
  background:#16a34a;
  color:#fff;
}
.logout{
  background:#dc2626;
  color:#fff;
}
.disabled{
  background:#9ca3af;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Hello</div>
  <div class="info" id="userPoints">Total Points: 0</div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore, collection, getDocs,
  query, where, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 LOAD USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ TOTAL POINTS (USER + ADMIN) */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    total += Number(d.data().points || 0);
  });
  userPoints.innerText = "Total Points: " + total;
}

/* ✅ CHECK ALREADY VOTED TODAY */
async function checkVoted(){
  const today = new Date().toISOString().split("T")[0];

  const snap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today),
      where("source","==","user")
    )
  );

  if(!snap.empty){
    taskBox.innerHTML="";
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");

    message.innerHTML = `
      <div class="msg">
        You have done today’s voting ✅<br>
        Next voting is <b>tomorrow at 8 PM</b>
      </div>
    `;
    return true;
  }
  return false;
}

/* 🗓️ LOAD ACTIVE TASKS */
async function loadTasks(){
  if(await checkVoted()) return;

  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));

  let active=false;
  taskBox.innerHTML="";
  message.innerHTML="";

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      active=true;
      taskBox.innerHTML += `
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            <b>${t.text}</b><br>
            Points: ${t.points}
          </label>
        </div>
      `;
    }
  });

  if(!active){
    taskBox.innerHTML = `<div class="msg">No active tasks right now ❌</div>`;
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");
  }
}

/* 🗳️ SUBMIT VOTE */
window.submitVote = async ()=>{
  const checks = document.querySelectorAll(
    "#taskBox input[type=checkbox]:checked"
  );

  if(checks.length===0){
    alert("At least one task complete cheyyanam ✅");
    return;
  }

  let points=0;
  checks.forEach(c=>points+=Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    date:new Date().toISOString().split("T")[0],
    source:"user",
    createdAt:new Date().toISOString()
  });

  loadTotalPoints();
  checkVoted();
};

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
