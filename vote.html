<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
h2{text-align:center}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}
.logout{
  background:#dc2626;
  margin-bottom:10px;
}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:6px;
}
input[type="checkbox"]{
  accent-color:#16a34a;
}
</style>
</head>

<script>
/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");
if(!phone || !name){
  location.replace("index.html");
}
</script>

<div class="box">

<script>
