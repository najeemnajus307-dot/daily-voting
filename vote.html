<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3 style="color:#16a34a">FAITH & FITNESS</h3>

  <div id="userName">Hello User</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="taskBox" class="task">Loading...</div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const phone = localStorage.getItem("userPhone");
if(!phone){
  localStorage.setItem("userPhone","9999999999"); // temp test
}

let activeTask=null;

async function loadTask(){
  const today = new Date().toISOString().split("T")[0];
  const snap = await getDocs(collection(db,"tasks"));
  let found=false;

  snap.forEach(d=>{
    if(found) return;
    const t=d.data();
    if(today>=t.start && today<=t.end){
      found=true;
      activeTask={...t,id:d.id};
      taskBox.innerHTML=`
        <label>
          <input type="checkbox" id="chk">
          <b>${t.text}</b><br>
          Points: ${t.points}
        </label>
      `;
    }
  });

  if(!found){
    disable("No task for today ❌");
  }
}

async function loadPoints(){
  let total=0;
  const snap=await getDocs(
    query(collection(db,"votes"),where("phone","==",phone))
  );
  snap.forEach(d=> total+=Number(d.data().points));
  userPoints.innerText="Total Points: "+total;
}

window.submitVote = async ()=>{
  if(!activeTask) return;
  if(!chk.checked){
    alert("Checkbox tick cheyyu");
    return;
  }

  const today=new Date().toISOString().split("T")[0];
  const s=await getDocs(
    query(collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today))
  );
  if(!s.empty){
    alert("Already voted");
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone,
    points: activeTask.points,
    date: today
  });

  alert("Vote success ✅");
  disable("You have voted today ✅");
  loadPoints();
};

function disable(msg){
  taskBox.innerHTML=msg;
  submitBtn.disabled=true;
  submitBtn.classList.add("disabled");
}

window.logout=()=>{
  localStorage.removeItem("userPhone");
  location.reload();
};

loadTask();
loadPoints();
</script>

</body>
</html>
