<script type="module">
history.pushState(null, null, location.href);
window.onpopstate = () => history.go(1);

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
let user  = localStorage.getItem("currentUser");
let phone = localStorage.getItem("currentPhone");
if(!user || !phone) location.replace("index.html");

/* 📅 DATE */
let today = new Date().toISOString().split("T")[0];
let voteRef = doc(db,"votes", phone+"_"+today);

/* UI */
document.getElementById("user").innerText = "Welcome " + user;
document.getElementById("date").innerText = "Date : " + today;

const taskBox = document.getElementById("taskList");
const btn = document.getElementById("submitBtn");

let tasks = [];
let inputs = {};

/* 🔽 LOAD TASKS FROM FIRESTORE */
const taskSnap = await getDoc(doc(db,"tasks","daily"));
if(taskSnap.exists()){
  tasks = taskSnap.data().list || [];
  renderTasks();
}

function renderTasks(){
  taskBox.innerHTML="";
  tasks.forEach((t,i)=>{
    taskBox.innerHTML += `
      <label>
        <input type="checkbox" id="task${i}"> ${t}
      </label>
    `;
    inputs[i] = document.getElementById("task"+i);
  });
}

/* 🔒 CHECK ALREADY SUBMITTED */
const snap = await getDoc(voteRef);
if(snap.exists()){
  let old = snap.data().tasks;
  Object.keys(old).forEach(i=>{
    if(inputs[i]) inputs[i].checked = old[i];
  });
  lockPage("Already submitted today");
}

function lockPage(msg){
  Object.values(inputs).forEach(i=>i.disabled=true);
  btn.disabled=true;
  btn.innerText=msg;
}

/* ✅ SUBMIT */
window.submitVote = async function(){
  let taskData = {};
  Object.keys(inputs).forEach(i=>{
    taskData[i] = inputs[i].checked;
  });

  await setDoc(voteRef,{
    name:user,
    phone:phone,
    date:today,
    tasks:taskData,
    submittedAt:new Date().toISOString()
  });

  alert("Vote submitted successfully 👍");
  location.reload();
};

/* 🚪 LOGOUT */
window.logout = function(){
  localStorage.clear();
  location.replace("index.html");
};
</script>
