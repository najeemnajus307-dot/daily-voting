<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Voting</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 🔰 HEADER */
.header{
  width:100%;
  background:#ffffff;
  padding:15px 0;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.header img{
  height:70px; /* 🔥 LOGO SIZE */
}

/* 📦 VOTING BOX */
.box{
  background:#fff;
  margin-top:25px;
  padding:22px;
  width:92%;
  max-width:360px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  text-align:center;
}

h2{margin:5px 0}
h3{margin:6px 0;color:#16a34a;font-size:15px}

.task{
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
  font-size:14px;
}

.msg{
  margin-top:12px;
  padding:12px;
  background:#fef3c7;
  color:#92400e;
  border-radius:8px;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>

<body>

<!-- 🔰 LOGO -->
<div class="header">
  <img src="logo.png" alt="Faith & Fitness">
</div>

<!-- 📦 VOTING CARD -->
<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName">Hello</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const app = initializeApp({
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
});
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ TOTAL POINTS */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    total += Number(d.data().points||0);
  });
  userPoints.innerText = "Total Points: " + total;
}

/* 🕗 NEXT 8 PM LOGIC */
function nextVotingTime(lastVote){
  const d = new Date(lastVote);
  d.setHours(20,0,0,0); // 8 PM
  if(lastVote >= d.getTime()){
    d.setDate(d.getDate()+1);
  }
  return d.getTime();
}

/* 🗳️ CHECK VOTED */
async function checkVoted(){
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );

  let lastVoteTime = 0;
  snap.forEach(d=>{
    if(d.data().voteTime && d.data().voteTime > lastVoteTime){
      lastVoteTime = d.data().voteTime;
    }
  });

  if(lastVoteTime){
    const now = Date.now();
    if(now < nextVotingTime(lastVoteTime)){
      taskBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.classList.add("disabled");
      message.innerHTML = `
        <div class="msg">
          You have done today’s voting ✅<br>
          Next voting at <b>8 PM</b>
        </div>`;
      return true;
    }
  }
  return false;
}

/* 📋 LOAD TASKS */
async function loadTasks(){
  if(await checkVoted()) return;

  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));
  let any=false;

  taskBox.innerHTML="";
  message.innerHTML="";

  snap.forEach(d=>{
    const t=d.data();
    const start=new Date(t.start);
    const end=new Date(t.end);

    if(now>=start && now<=end){
      any=true;
      taskBox.innerHTML+=`
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            ${t.text} (Points: ${t.points})
          </label>
        </div>`;
    }
  });

  if(!any){
    taskBox.innerHTML=`<div class="msg">No active tasks right now ❌</div>`;
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");
  }
}

/* 🗳️ SUBMIT */
window.submitVote = async ()=>{
  const checks=document.querySelectorAll("#taskBox input:checked");
  if(checks.length===0){
    alert("At least one task select cheyyanam");
    return;
  }

  let points=0;
  checks.forEach(c=>points+=Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    voteTime: Date.now(),
    source:"user"
  });

  loadTotalPoints();
  checkVoted();
};

/* 🚪 LOGOUT */
window.logout=()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
  </html>
