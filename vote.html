<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Vote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f1f5f9;margin:0}
.card{max-width:400px;margin:30px auto;background:#fff;
padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:6px}
.submit{background:#16a34a;color:#fff}
.disabled{background:#9ca3af}
.msg{background:#fef3c7;padding:10px;border-radius:6px;margin-top:10px}
</style>
</head>

<body>
<div class="card">
<h2>FAITH & FITNESS</h2>

<div id="user"></div>
<div id="points"></div>
<div id="taskBox"></div>
<div id="msg"></div>

<button id="voteBtn" class="submit">Submit Vote</button>
</div>

<script type="module">
/* 🔥 Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, collection, addDoc,
  getDocs, query, where
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import {
  getMessaging, getToken, onMessage
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  messagingSenderId: "106550006876",
  appId: "1:106550006876:web:xxxxxxxx"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

/* 🔐 Login */
const phone = localStorage.getItem("userPhone");
if(!phone) location.href="index.html";

/* 📅 Voting Date (8PM rule) */
function voteDate(){
  const d=new Date();
  if(d.getHours()<20) d.setDate(d.getDate()-1);
  return d.toISOString().split("T")[0];
}

/* 👤 Load user */
async function loadUser(){
  const q=query(collection(db,"users"),where("phone","==",phone));
  const s=await getDocs(q);
  s.forEach(d=>user.innerText="Hello "+d.data().name);
}

/* ⭐ Points */
async function loadPoints(){
  let total=0;
  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  s.forEach(d=>total+=Number(d.data().points));
  points.innerText="Total Points: "+total;
}

/* 🗳️ Already voted? */
async function alreadyVoted(){
  const s=await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",voteDate())
  ));
  if(!s.empty){
    voteBtn.disabled=true;
    voteBtn.classList.add("disabled");
    msg.innerHTML="<div class='msg'>Today's vote completed ✅</div>";
    return true;
  }
  return false;
}

/* 📋 Tasks */
async function loadTasks(){
  if(await alreadyVoted()) return;
  const s=await getDocs(collection(db,"tasks"));
  taskBox.innerHTML="";
  s.forEach(d=>{
    taskBox.innerHTML+=`
      <label>
        <input type="checkbox" value="${d.data().points}">
        ${d.data().text} (${d.data().points} pts)
      </label><br>`;
  });
}

/* 🗳️ Submit */
voteBtn.onclick=async()=>{
  const checks=document.querySelectorAll("input:checked");
  if(!checks.length) return alert("Select task");

  let pts=0;
  checks.forEach(c=>pts+=Number(c.value));

  await addDoc(collection(db,"votes"),{
    phone,
    points:pts,
    date:voteDate(),
    source:"user",
    time:new Date().toISOString()
  });

  loadPoints();
  alreadyVoted();
};

/* 🔔 PUSH NOTIFICATION */
async function enablePush(){
  const perm=await Notification.requestPermission();
  if(perm!=="granted") return;

  const token=await getToken(messaging,{
    vapidKey:"YOUR_PUBLIC_VAPID_KEY"
  });

  await addDoc(collection(db,"tokens"),{
    phone,
    token
  });
}

onMessage(messaging,payload=>{
  alert(payload.notification.title+"\n"+payload.notification.body);
});

/* INIT */
loadUser();
loadPoints();
loadTasks();
enablePush();
</script>
</body>
</html>
