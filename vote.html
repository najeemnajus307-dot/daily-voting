<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:25px;width:360px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2)}
button{width:100%;padding:10px;background:#16a34a;color:#fff;border:none;border-radius:6px;margin-top:15px}
</style>
</head>
<body>

<div class="box">
<h3>Daily Tasks</h3>
<div id="info"></div>
<div id="tasks"></div>
<button onclick="submitVote()">Submit Vote</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

let phone = sessionStorage.getItem("phone");
let name  = sessionStorage.getItem("name");
if(!phone) location.href="index.html";

let today = new Date().toISOString().split("T")[0];
document.getElementById("info").innerText = `Welcome ${name} | ${today}`;

let taskBox = document.getElementById("tasks");
let tasksSnap = await getDocs(collection(db,"tasks"));

tasksSnap.forEach(t=>{
  taskBox.innerHTML += `
   <label>
    <input type="checkbox" data-id="${t.id}">
    ${t.data().title} (${t.data().points})
   </label><br>`;
});

window.submitVote = async ()=>{
  let checks = document.querySelectorAll("input[type=checkbox]");
  let total = 0, done={};

  checks.forEach(c=>{
    let pts = parseInt(c.parentElement.innerText.match(/\d+/)[0]);
    done[c.dataset.id] = c.checked;
    if(c.checked) total += pts;
  });

  let ref = doc(db,"votes",phone+"_"+today);
  let exist = await getDoc(ref);
  if(exist.exists()){ alert("Already voted"); return; }

  await setDoc(ref,{
    name, phone, date:today,
    tasks:done,
    totalPoints:total
  });

  alert("Vote submitted 👍");
  location.reload();
}
</script>
</body>
</html>
