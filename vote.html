<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
}
.header{
  background:#fff;
  text-align:center;
  padding:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.header img{height:80px}

.container{
  display:flex;
  justify-content:center;
  padding:20px;
}
.card{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}
.hidden{display:none}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}

.nav{
  position:fixed;
  bottom:0; left:0; right:0;
  background:#0f172a;
  display:flex;
}
.nav div{
  flex:1;
  text-align:center;
  padding:10px;
  color:#cbd5f5;
  cursor:pointer;
}
.nav .active{color:#facc15}

h3{text-align:center;margin:10px 0}
h4{margin:15px 0 8px}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo..png" alt="Faith & Fitness">
</div>

<div class="container">
<div class="card">

<!-- HOME PAGE -->
<section id="page-home">
  <h3>FAITH & FITNESS</h3>
  <div id="todayDate"></div>
  <div id="userName"></div>
  <div id="userPoints"></div>

  <div id="message" style="margin-top:10px"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</section>

<!-- WORKOUT PAGE -->
<section id="page-workout" class="hidden">
  <h3>🏋️ Workouts Videos</h3>

  <h4>Day 1 Workout</h4>
  <iframe width="100%" height="220"
    src="https://www.youtube.com/embed/UcTifA8SqL4"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <h4>Day 2 Workout</h4>
  <iframe width="100%" height="220"
    src="https://www.youtube.com/embed/Zq3ZDvf9ocg"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <h4>Day 3 Workout</h4>
  <div style="background:#f1f5f9;padding:20px;border-radius:10px;text-align:center;">
    Video coming soon 💪
  </div>
</section>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <div id="nav-home" class="active" onclick="showPage('home')">🏠 Home</div>
  <div id="nav-workout" onclick="showPage('workout')">🏋️ Workout</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, addDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

/* DATE */
todayDate.innerText = "Today: " + new Date().toDateString();

/* LOAD USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* LOAD POINTS */
async function loadPoints(){
  let total=0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=> total+=Number(d.data().points||0));
  userPoints.innerText = "Your Points: " + total;
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  submitBtn.disabled=true;
  submitBtn.classList.add("disabled");
  await addDoc(collection(db,"votes"),{
    phone, points:10,
    date:new Date().toISOString().split("T")[0],
    source:"user"
  });
  message.innerHTML="✅ Vote submitted successfully";
  loadPoints();
};

/* LOGOUT */
window.logout=()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* NAV SWITCH */
window.showPage=(p)=>{
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.querySelectorAll(".nav div").forEach(n=>n.classList.remove("active"));
  document.getElementById("page-"+p).classList.remove("hidden");
  document.getElementById("nav-"+p).classList.add("active");
};

/* INIT */
loadUser();
loadPoints();
</script>

</body>
</html>
