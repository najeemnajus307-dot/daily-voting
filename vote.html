<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Voting</title>
  <style>
    body { font-family: Arial; background:#f2f2f2; padding:20px; }
    .box { background:#fff; padding:20px; max-width:400px; margin:auto; border-radius:8px; }
    label { display:block; margin-top:10px; }
    button { margin-top:15px; padding:10px; width:100%; }
  </style>
</head>
<body>

<div class="box">
  <h2>Daily Task</h2>

  <label>Name</label>
  <input id="name">

  <label>Phone</label>
  <input id="phone">

  <label><input type="checkbox" id="water"> Water</label>
  <label><input type="checkbox" id="warmup"> Warm up</label>
  <label><input type="checkbox" id="steps"> Steps</label>
  <label><input type="checkbox" id="pushup"> Pushup</label>

  <button onclick="submitData()">Submit</button>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitData = async function () {
  const data = {
    name: name.value,
    phone: phone.value,
    water: water.checked ? 1 : 0,
    warmup: warmup.checked ? 1 : 0,
    steps: steps.checked ? 1 : 0,
    pushup: pushup.checked ? 1 : 0,
    time: Date.now()
  };

  await addDoc(collection(db, "votes"), data);
  alert("Submitted successfully ✅");
};
</script>

</body>
</html>
