<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:90px}
.header{background:#fff;text-align:center;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:110px}
.container{display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:380px;width:100%;padding:20px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.15);text-align:center}

.task{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0;text-align:left}
.msg{background:#fef3c7;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}

button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}

.timer{color:#2563eb;font-size:13px;margin-top:6px}

.tp-row{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:8px;border-radius:6px;margin:6px 0;font-weight:bold}
.tp-1{background:#fde047}
.tp-2{background:#e5e7eb}
.tp-3{background:#fecaca}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.day{height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.done{background:#16a34a}
.pending{background:#facc15;color:#000}
.missed{background:#ef4444}
.future{background:#374151}
.today{outline:3px solid #3b82f6}

iframe{width:100%;height:210px;border-radius:10px;margin:8px 0}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;display:flex;justify-content:space-around;
  padding:10px 0;z-index:999
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:12px
}
.bottom-nav button.active{color:#fff;font-weight:bold}
.bottom-nav span{font-size:20px;display:block}
</style>
</head>

<body>

<div class="header">
  <img src="logo..png">
</div>

<div class="container">
<div class="card">

<!-- HOME -->
<div id="home">
  <h3 style="color:#16a34a">FAITH & FITNESS</h3>
  <div id="todayDate"></div>
  <div id="userName"></div>
  <div id="userPoints"></div>

  <div id="taskBox"></div>
  <div id="message"></div>
  <div class="timer" id="timer"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" style="display:none">
  <h3>🏆 Leaderboard</h3>
  <div id="leaders"></div>
</div>

<!-- CALENDAR -->
<div id="calendarPage" style="display:none">
  <h3>📅 Your Progress</h3>
  <div class="calendar" id="calendar"></div>
</div>

<!-- WORKOUT -->
<div id="workout" style="display:none">
  <h3>💪 Workout Videos</h3>

  <p><b>Day 1</b></p>
  <iframe src="https://www.youtube.com/embed/UcTifA8SqL4"></iframe>

  <p><b>Day 2</b></p>
  <iframe src="https://www.youtube.com/embed/Zq3ZDvf9ocg"></iframe>

  <p><b>Day 3</b></p>
  <div class="msg">Video coming soon 💪</div>
</div>

</div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <button class="active" onclick="showPage('home',this)"><span>🏠</span>Home</button>
  <button onclick="showPage('leaderboard',this)"><span>🏆</span>Leaderboard</button>
  <button onclick="showPage('calendarPage',this)"><span>📅</span>Calendar</button>
  <button onclick="showPage('workout',this)"><span>💪</span>Workout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

todayDate.innerText="Today: "+new Date().toDateString();

function getVoteDate(){
  const d=new Date();
  if(d.getHours()<20) d.setDate(d.getDate()-1);
  return d.toISOString().split("T")[0];
}

function nextVoteText(){
  const d=new Date();d.setDate(d.getDate()+1);
  return d.toLocaleDateString("en-IN",{weekday:"long"})+" 8 PM";
}

async function checkVoted(){
  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone),where("date","==",getVoteDate())));
  if(!s.empty){
    taskBox.innerHTML="";
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");
    message.innerHTML=`<div class="msg">Already voted ✅<br>Next voting: <b>${nextVoteText()}</b></div>`;
    return true;
  }
  return false;
}

async function loadUser(){
  const s=await getDocs(query(collection(db,"users"),where("phone","==",phone)));
  s.forEach(d=>userName.innerText="Hello, "+d.data().name);
}

async function loadPoints(){
  let t=0;
  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  s.forEach(d=>t+=Number(d.data().points||0));
  userPoints.innerText="Your Points: "+t;
}

async function loadTasks(){
  if(await checkVoted()) return;
  const now=new Date();
  const s=await getDocs(collection(db,"tasks"));
  taskBox.innerHTML="";
  s.forEach(d=>{
    const t=d.data();
    if(now>=new Date(t.start)&&now<=new Date(t.end)){
      taskBox.innerHTML+=`
      <div class="task">
        <label><input type="checkbox" data-points="${t.points}">
        ${t.text} (${t.points} pts)</label>
      </div>`;
    }
  });
}

window.submitVote=async()=>{
  if(await checkVoted()) return;
  const c=document.querySelectorAll("#taskBox input:checked");
  if(!c.length) return alert("Task select cheyyanam");
  let p=0;c.forEach(x=>p+=Number(x.dataset.points));
  await addDoc(collection(db,"votes"),{phone,points:p,date:getVoteDate()});
  message.innerHTML=`<div class="msg">Vote submitted ✅<br>Next voting: <b>${nextVoteText()}</b></div>`;
  submitBtn.disabled=true;
  submitBtn.classList.add("disabled");
  taskBox.innerHTML="";
  loadPoints();
  loadLeaderboard();
  loadCalendar();
};

async function loadLeaderboard(){
  const u=await getDocs(collection(db,"users"));
  const v=await getDocs(collection(db,"votes"));
  const map={};
  v.forEach(x=>map[x.data().phone]=(map[x.data().phone]||0)+Number(x.data().points||0));
  let arr=[];
  u.forEach(x=>{if(map[x.data().phone])arr.push({name:x.data().name,pts:map[x.data().phone]});});
  arr.sort((a,b)=>b.pts-a.pts);
  leaders.innerHTML="";
  let r=1,prev=null;
  arr.forEach(x=>{
    if(prev!==null&&x.pts<prev)r++;
    leaders.innerHTML+=`
      <div class="tp-row tp-${r}">
        <div>${r}</div><div>${x.name}</div><div>${x.pts}</div>
      </div>`;
    prev=x.pts;
  });
}

async function loadCalendar(){
  calendar.innerHTML="";
  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  const voted={}; s.forEach(d=>voted[d.data().date]=1);
  const d=new Date();const y=d.getFullYear(),m=d.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().split("T")[0];
  for(let i=1;i<=days;i++){
    const ds=new Date(y,m,i).toISOString().split("T")[0];
    let cls="future";
    if(ds<today) cls=voted[ds]?"done":"missed";
    if(ds===today) cls=voted[ds]?"done":"pending";
    calendar.innerHTML+=`<div class="day ${cls}">${i}</div>`;
  }
}

window.showPage=(id,btn)=>{
  document.querySelectorAll(".card > div").forEach(d=>d.style.display="none");
  document.getElementById(id).style.display="block";
  document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(id==="leaderboard")loadLeaderboard();
  if(id==="calendarPage")loadCalendar();
};

window.logout=()=>{localStorage.clear();location.replace("index.html");};

loadUser();loadPoints();loadTasks();loadLeaderboard();loadCalendar();checkVoted();
</script>

</body>
</html>
