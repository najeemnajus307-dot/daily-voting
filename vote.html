<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:380px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
  position:relative;
}
h2{text-align:center;margin-bottom:4px;}
h4{text-align:center;color:#16a34a;margin-top:0;}
.info{text-align:center;font-size:14px;margin-bottom:6px;}
label{display:block;margin:8px 0;}
.points{font-size:13px;color:green;margin-left:22px;}
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
}
button:disabled{background:#9ca3af;}
.logout{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="box">
  <button class="logout" onclick="logout()">Logout</button>

  <h2>Welcome Faith & Fitness</h2>
  <h4>Daily Tasks</h4>

  <div class="info" id="user"></div>
  <div class="info" id="date"></div>

  <div id="taskList"></div>

  <button id="submitBtn">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

async function init(){

  const user  = localStorage.getItem("currentUser");
  const phone = localStorage.getItem("currentPhone");
  if(!user || !phone){
    location.replace("index.html");
    return;
  }

  const today = new Date().toISOString().split("T")[0];
  const voteRef = doc(db,"votes", phone + "_" + today);

  document.getElementById("user").innerText = "User : " + user;
  document.getElementById("date").innerText = "Date : " + today;

  const taskBox = document.getElementById("taskList");
  const submitBtn = document.getElementById("submitBtn");

  /* LOAD TASKS */
  const taskSnap = await getDoc(doc(db,"tasks","daily"));
  const tasks = taskSnap.exists() ? taskSnap.data().list : [];

  if(tasks.length === 0){
    taskBox.innerHTML = "<p>No tasks</p>";
    submitBtn.disabled = true;
    return;
  }

  /* 1️⃣ FIRST build HTML */
  taskBox.innerHTML = tasks.map((t,i)=>`
    <label>
      <input type="checkbox" id="task_${i}">
      ${t.text}
      <div class="points">${t.points} points</div>
    </label>
  `).join("");

  /* 2️⃣ THEN read checkbox elements */
  const inputs = tasks.map((t,i)=>({
    el: document.getElementById("task_"+i),
    pts: Number(t.points)
  }));

  /* ALREADY SUBMITTED */
  const snap = await getDoc(voteRef);
  if(snap.exists()){
    const old = snap.data().tasks || {};
    inputs.forEach((o,i)=>{
      o.el.checked = !!old[i];
      o.el.disabled = true;
    });
    submitBtn.disabled = true;
    submitBtn.innerText = "Already submitted";
    return;
  }

  /* SUBMIT */
  submitBtn.onclick = async ()=>{
    let result = {};
    let total = 0;

    inputs.forEach((o,i)=>{
      result[i] = o.el.checked;
      if(o.el.checked){
        total += o.pts;
      }
    });

    await setDoc(voteRef,{
      name:user,
      phone:phone,
      date:today,
      tasks:result,
      totalPoints:total,
      submittedAt:new Date().toISOString()
    });

    alert("Vote saved ✅ Total points : " + total);

    inputs.forEach(o=>o.el.disabled=true);
    submitBtn.disabled = true;
    submitBtn.innerText = "Already submitted";
  };
}

window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

init();
</script>

</body>
</html>
