<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voting</title>

<style>
body{
  font-family:Arial;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:10px;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
  <h3 id="user"></h3>

  <label><input type="radio" name="v" value="Water"> Water</label><br>
  <label><input type="radio" name="v" value="Warmup"> Warmup</label><br>
  <label><input type="radio" name="v" value="Workout"> Workout</label>

  <button onclick="vote()">Submit Vote</button>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db=getFirestore(app);

const phone=sessionStorage.getItem("phone");
const name=sessionStorage.getItem("name");

if(!phone) location.href="index.html";
user.innerText="Hi "+name;

window.vote=async ()=>{
  const v=document.querySelector('input[name="v"]:checked');
  if(!v){ alert("Select one"); return; }

  const today=new Date().toISOString().slice(0,10);
  const ref=doc(db,"votes",phone+"_"+today);

  if((await getDoc(ref)).exists()){
    alert("Already voted today"); return;
  }

  await setDoc(ref,{phone,name,vote:v.value,date:today});
  alert("Vote submitted");
};

window.logout=()=>{
  sessionStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
