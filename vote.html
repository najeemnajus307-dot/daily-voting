<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
h2{text-align:center}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  background:#9ca3af;
}
.logout{
  background:#dc2626;
  margin-bottom:10px;
}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:6px;
}
input[type="checkbox"]{
  accent-color:#16a34a;
}
</style>
</head>

<body>

<script>
/* 🔐 LOGIN CHECK (localStorage stable) */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");
if(!phone || !name){
  location.replace("index.html");
}
</script>

<div class="box">

<button class="logout" onclick="logout()">Logout</button>

<h2>Daily Tasks</h2>

<div class="info">Welcome <b id="user"></b></div>
<div class="info" id="date"></div>

<div id="tasksArea"></div>

<button id="submitBtn">Submit Vote</button>

</div>

<!-- 🔹 NORMAL SCRIPT (NO MODULE) -->
<script>
document.getElementById("user").innerText = name;
const today = new Date().toISOString().split("T")[0];
document.getElementById("date").innerText = "Date : " + today;

const tasksArea = document.getElementById("tasksArea");
const submitBtn = document.getElementById("submitBtn");

/* ✅ Checkbox state stored here (NO BLINK) */
let taskState = {};
let tasks = [];

/* Render tasks ONCE */
function renderTasks(){
  tasksArea.innerHTML = "";
  tasks.forEach((t,i)=>{
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `
      <label>
        <input type="checkbox" ${taskState[i] ? "checked":""}>
        ${t.title} ( ${t.points} pts )
      </label>
    `;
    const cb = div.querySelector("input");
    cb.addEventListener("change",()=>{
      taskState[i] = cb.checked;
    });
    tasksArea.appendChild(div);
  });
}

submitBtn.onclick = ()=> submitVote();
</script>

<!-- 🔹 FIREBASE MODULE (DATA ONLY) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔴 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Load tasks ONCE */
const snap = await getDocs(collection(db,"tasks"));
snap.forEach(d=>{
  const t = d.data();
  if(t.active){
    tasks.push({ id:d.id, ...t });
  }
});
renderTasks();

/* Vote check */
const voteId = phone + "_" + today;
const voteRef = doc(db,"votes",voteId);
const existing = await getDoc(voteRef);
if(existing.exists()){
  submitBtn.disabled = true;
  submitBtn.innerText = "Already submitted today";
}

/* Submit vote */
window.submitVote = async ()=>{
  if(submitBtn.disabled) return;

  let selected = {};
  let total = 0;

  tasks.forEach((t,i)=>{
    selected[t.id] = !!taskState[i];
    if(taskState[i]) total += t.points;
  });

  await setDoc(voteRef,{
    name,
    phone,
    date: today,
    tasks: selected,
    totalPoints: total,
    submittedAt: new Date().toISOString()
  });

  alert("Vote submitted 👍");
  submitBtn.disabled = true;
  submitBtn.innerText = "Already submitted today";
};
</script>

<script>
function logout(){
  localStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
