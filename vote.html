<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Voting</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
}

/* 🔝 HEADER WITH LOGO */
header{
  background:#ffffff;
  text-align:center;
  padding:18px 10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.logo{
  width:200px;        /* 👈 logo size (change if needed) */
  max-width:85%;
  height:auto;
  margin-bottom:8px;
}

header h4{
  margin:0;
  color:#16a34a;
  font-weight:bold;
  letter-spacing:1px;
}

/* 📦 MAIN BOX */
.container{
  display:flex;
  justify-content:center;
  padding:30px 10px;
}

.box{
  background:#fff;
  width:100%;
  max-width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,.2);
  text-align:center;
}

.box h2{
  margin:0;
}

.box h3{
  margin:6px 0;
  color:#16a34a;
}

.info{
  margin:6px 0;
  font-size:14px;
}

/* MESSAGE */
.msg{
  margin:12px 0;
  padding:12px;
  background:#fef3c7;
  color:#92400e;
  border-radius:8px;
  font-size:14px;
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.submit{
  background:#16a34a;
  color:#fff;
}

.submit:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

.logout{
  background:#dc2626;
  color:#fff;
}
</style>
</head>

<body>

<!-- 🔝 LOGO HEADER -->
<header>
  <img src="logo.png" class="logo">
  <h4>WELCOME</h4>
</header>

<!-- 📦 VOTING BOX -->
<div class="container">
  <div class="box">
    <h3>FAITH & FITNESS</h3>

    <div class="info" id="userName">Hello, User</div>
    <div class="info" id="userPoints">Total Points: 0</div>

    <div id="message" class="msg">
      You have done today’s voting ✅ <br>
      Next voting is tomorrow at <b>8 PM</b>
    </div>

    <button class="submit" disabled>Submit Vote</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
/* 🔐 Logout */
function logout(){
  localStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
