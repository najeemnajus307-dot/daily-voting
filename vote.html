<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Task Editor</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:10px;
}
input,button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
}
li{margin:4px 0;}
</style>
</head>

<body>
<div class="box">
<h3>Task Editor (Firebase)</h3>

<input id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add Task</button>

<ul id="list"></ul>

<button style="background:#16a34a" onclick="save()">Save Tasks</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let tasks=[];
const list=document.getElementById("list");

/* LOAD EXISTING TASKS */
const snap = await getDoc(doc(db,"tasks","daily"));
if(snap.exists()){
  tasks = snap.data().list || [];
  render();
}

function render(){
  list.innerHTML="";
  tasks.forEach((t,i)=>{
    let li=document.createElement("li");
    li.innerHTML=`${t} <button onclick="del(${i})">❌</button>`;
    list.appendChild(li);
  });
}

window.addTask=function(){
  let v=taskInput.value.trim();
  if(v){ tasks.push(v); taskInput.value=""; render(); }
}

window.del=function(i){
  tasks.splice(i,1);
  render();
}

window.save=async function(){
  await setDoc(doc(db,"tasks","daily"),{list:tasks});
  alert("Tasks saved to Firebase ✅");
}
</script>
</body>
</html>
