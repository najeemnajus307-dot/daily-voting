<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  color:white;
  cursor:pointer;
}
.submit{background:#16a34a}
.logout{background:#dc2626}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME<br>FAITH & FITNESS</h2>
  <div id="user"></div>
  <div id="date"></div>

  <button class="submit" onclick="vote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* LOGIN CHECK */
const uid = sessionStorage.getItem("uid");
const name = sessionStorage.getItem("name");
const phone = sessionStorage.getItem("phone");

if(!uid){
  location.replace("index.html");
}

/* UI */
const today = new Date().toISOString().split("T")[0];
document.getElementById("user").innerText = "Hello " + name;
document.getElementById("date").innerText = "Date : " + today;

/* FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const voteId = phone + "_" + today;
const ref = doc(db,"votes",voteId);

/* CHECK */
const snap = await getDoc(ref);
if(snap.exists()){
  document.querySelector(".submit").disabled = true;
  document.querySelector(".submit").innerText = "Already voted today";
}

window.vote = async ()=>{
  await setDoc(ref,{
    uid,
    name,
    phone,
    date: today,
    points: 5,
    createdAt: new Date().toISOString()
  });
  alert("Vote submitted ✅");
  location.reload();
};

window.logout = ()=>{
  sessionStorage.clear();
  location.replace("index.html");
};
</script>

</body>
</html>
