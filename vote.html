<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:12px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.msg{
  margin-top:12px;
  padding:12px;
  background:#ecfeff;
  color:#065f46;
  border-radius:8px;
  font-size:14px;
}
.timer{
  font-size:18px;
  font-weight:bold;
  color:#dc2626;
  margin-top:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName">Hello</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 Login check */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 Load user */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ Load total points */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=> total += Number(d.data().points||0));
  userPoints.innerText = "Total Points: " + total;
}

/* 🕒 Countdown logic */
function startCountdown(){
  // next voting = tomorrow 8:00 PM
  const now = new Date();
  const next = new Date();
  next.setDate(now.getDate() + 1);
  next.setHours(20,0,0,0); // 8:00 PM

  const timerEl = document.createElement("div");
  timerEl.className = "timer";
  message.appendChild(timerEl);

  setInterval(()=>{
    const diff = next - new Date();
    if(diff <= 0){
      location.reload(); // auto refresh when time reached
      return;
    }
    const h = String(Math.floor(diff/3600000)).padStart(2,"0");
    const m = String(Math.floor(diff%3600000/60000)).padStart(2,"0");
    const s = String(Math.floor(diff%60000/1000)).padStart(2,"0");
    timerEl.innerText = `Next voting starts in ${h}:${m}:${s}`;
  },1000);
}

/* 🗳️ Check already voted */
async function checkVoted(){
  const today = new Date().toISOString().split("T")[0];
  const snap = await getDocs(
    query(collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today)
    )
  );

  if(!snap.empty){
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    taskBox.innerHTML = "";
    message.innerHTML = `
      <div class="msg">
        You have done today’s voting ✅
      </div>`;
    startCountdown();
    return true;
  }
  return false;
}

/* 🗓️ Load tasks (multiple) */
async function loadTasks(){
  if(await checkVoted()) return;

  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));
  let any = false;

  taskBox.innerHTML = "";

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      any = true;
      taskBox.innerHTML += `
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            <b>${t.text}</b> (Points: ${t.points})
          </label>
        </div>
      `;
    }
  });

  if(!any){
    taskBox.innerHTML = `<div class="msg">No active tasks right now ❌</div>`;
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
  }
}

/* 🗳️ Submit vote */
window.submitVote = async ()=>{
  const checks = document.querySelectorAll(
    "#taskBox input[type=checkbox]:checked"
  );

  if(checks.length === 0){
    alert("At least one task complete cheyyanam ✅");
    return;
  }

  let points = 0;
  checks.forEach(c=> points += Number(c.dataset.points));

  const today = new Date().toISOString().split("T")[0];

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    date: today,
    createdAt: new Date().toISOString()
  });

  loadTotalPoints();
  checkVoted();
};

/* 🚪 Logout */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
