<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
}
.header{
  background:#fff;
  text-align:center;
  padding:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.header img{height:120px}

.container{
  display:flex;
  justify-content:center;
  padding:20px;
}
.card{
  background:#fff;
  width:100%;
  max-width:380px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  text-align:center;
}
.task{
  border:1px solid #ddd;
  padding:10px;
  border-radius:8px;
  margin:8px 0;
  text-align:left;
}
.msg{
  background:#fef3c7;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-size:15px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
.logout{background:#dc2626;color:#fff}
.timer{color:#2563eb;font-size:13px;margin-top:6px}

/* LEADERBOARD */
.rank{
  padding:6px;
  border-bottom:1px solid #eee;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.rank-1{color:#b45309;font-weight:bold}
.rank-2{color:#374151;font-weight:bold}
.rank-3{color:#7c2d12;font-weight:bold}
.icon{font-size:16px}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo..png" alt="Faith & Fitness">
</div>

<div class="container">
<div class="card">

<h2>WELCOME</h2>
<h3 style="color:#16a34a">FAITH & FITNESS</h3>

<div id="todayDate"></div>
<div id="userName"></div>
<div id="userPoints"></div>

<div id="taskBox"></div>
<div id="message"></div>
<div class="timer" id="timer"></div>

<button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
<button class="logout" onclick="logout()">Logout</button>

<hr style="margin:20px 0">
<h3>🏆 Today Top Rank</h3>
<div id="leaderboard"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, addDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

/* DATE DISPLAY */
todayDate.innerText = "Today: " + new Date().toDateString();

/* 8 PM RULE */
function getVoteDate(){
  const d = new Date();
  if(d.getHours() < 20) d.setDate(d.getDate()-1);
  return d.toISOString().split("T")[0];
}

/* TIMER */
function updateTimer(){
  const now = new Date();
  const next = new Date();
  next.setHours(20,0,0,0);
  if(now >= next) next.setDate(next.getDate()+1);
  const diff = next-now;
  const h=Math.floor(diff/3600000),
        m=Math.floor((diff%3600000)/60000),
        s=Math.floor((diff%60000)/1000);
  timer.innerText=`Next voting in ${h}h ${m}m ${s}s`;
}
setInterval(updateTimer,1000); updateTimer();

/* LOAD USER */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=> userName.innerText="Hello, "+d.data().name);
}

/* LOAD TOTAL POINTS */
async function loadPoints(){
  let total=0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=> total+=Number(d.data().points||0));
  userPoints.innerText="Total Points: "+total;
}

/* CHECK ALREADY VOTED */
async function checkVoted(){
  const snap = await getDocs(
    query(collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",getVoteDate())
    )
  );
  if(!snap.empty){
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");
    message.innerHTML=`<div class="msg">You already voted today ✅</div>`;
    return true;
  }
  return false;
}

/* LOAD TASKS */
async function loadTasks(){
  if(await checkVoted()) return;
  const now=new Date();
  const snap=await getDocs(collection(db,"tasks"));
  let active=false;
  taskBox.innerHTML="";
  snap.forEach(d=>{
    const t=d.data();
    if(now>=new Date(t.start)&&now<=new Date(t.end)){
      active=true;
      taskBox.innerHTML+=`
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            ${t.text} (${t.points} pts)
          </label>
        </div>`;
    }
  });
  if(!active){
    submitBtn.disabled=true;
    submitBtn.classList.add("disabled");
    taskBox.innerHTML=`<div class="msg">No active tasks</div>`;
  }
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  const checked=document.querySelectorAll("#taskBox input:checked");
  if(!checked.length) return alert("Task select cheyyanam");

  const already=await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",getVoteDate())
  ));
  if(!already.empty) return alert("Already voted");

  let points=0;
  checked.forEach(c=>points+=Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone, points, date:getVoteDate(), source:"user"
  });

  loadPoints();
  checkVoted();
  loadLeaderboard();
};

/* LEADERBOARD – ICONS + MAX 2 PER RANK */
async function loadLeaderboard(){
  const users = await getDocs(collection(db,"users"));
  const votes = await getDocs(collection(db,"votes"));

  const map = {};
  votes.forEach(v=>{
    const x = v.data();
    map[x.phone] = (map[x.phone] || 0) + Number(x.points || 0);
  });

  let rows = [];
  users.forEach(u=>{
    const p = u.data().phone;
    if(map[p] > 0){
      rows.push({ name:u.data().name, total:map[p] });
    }
  });

  rows.sort((a,b)=>b.total-a.total);

  leaderboard.innerHTML="";
  let rank=1, prev=null, countInRank=0;

  for(let r of rows){
    if(prev!==null && r.total<prev){
      rank++;
      countInRank=0;
    }
    if(rank>3) break;
    if(countInRank>=2){
      prev=r.total;
      continue;
    }

    const icon = rank===1?"🥇":rank===2?"🥈":"🥉";

    leaderboard.innerHTML+=`
      <div class="rank rank-${rank}">
        <span class="icon">${icon}</span>
        <span>Rank ${rank}</span>
        <span>– ${r.name}</span>
        <span>– ${r.total} pts</span>
      </div>`;

    countInRank++;
    prev=r.total;
  }

  if(!leaderboard.innerHTML){
    leaderboard.innerHTML=`<div class="msg">No ranking yet</div>`;
  }
}

/* LOGOUT */
window.logout=()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadPoints();
loadTasks();
loadLeaderboard();
</script>

</body>
</html>
