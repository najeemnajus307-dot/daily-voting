<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial;background:#0b1020;color:#fff;padding-bottom:80px}
.header{text-align:center;padding:15px}
.container{display:flex;justify-content:center}
.card{width:100%;max-width:380px;padding:20px;text-align:center}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px;font-size:15px}
.submit{background:#ec4899;color:#fff}
.logout{background:#06b6d4;color:#000}
input{width:100%;padding:8px;margin-top:6px}

.tp-row{display:grid;grid-template-columns:50px 1fr 60px;padding:8px;margin:6px 0;border-radius:6px;font-weight:bold}
.tp-1{background:#fde047;color:#000}
.tp-2{background:#e5e7eb;color:#000}
.tp-3{background:#fecaca;color:#000}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#020617;display:flex;justify-content:space-around;padding:10px}
.bottom-nav button{background:none;border:none;color:#94a3b8}
.bottom-nav button.active{color:#fff}
.bottom-nav span{display:block;font-size:20px}

.msg{background:#fef3c7;color:#000;padding:8px;border-radius:6px;margin-top:8px}
</style>
</head>

<body>

<div class="header">
  <h2 style="color:#ec4899">FAITH & FITNESS</h2>
  <div id="today"></div>
  <div id="userPoints"></div>
</div>

<div class="container">
<div class="card">

<!-- HOME -->
<div id="homeSection">
  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <div id="message"></div>
</div>

<!-- LEADERBOARD -->
<div id="leaderSection" style="display:none">
  <h3>🏆 Leaderboard</h3>
  <div id="leaderList"></div>
</div>

<!-- CALENDAR -->
<div id="calendarSection" style="display:none">
  <h3>📅 Calendar</h3>
  <div id="calendar"></div>
</div>

<!-- PLANK -->
<div id="plankSection" style="display:none">
  <h3>🏋️ Plank Competition</h3>
  <input type="number" id="plankTime" placeholder="Plank time (seconds)">
  <input type="file" id="plankVideo" accept="video/*">
  <button class="submit" onclick="uploadPlank()">Upload Video</button>
  <div id="plankMsg"></div>

  <h4 style="margin-top:15px">🏆 Top Plank</h4>
  <div id="plankTop"></div>
</div>

<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button id="homeBtn" class="active" onclick="showHome()"><span>🏠</span>Home</button>
  <button id="leaderBtn" onclick="showLeader()"><span>🏆</span>Top</button>
  <button id="calBtn" onclick="showCalendar()"><span>📅</span>Calendar</button>
  <button id="plankBtn" onclick="showPlank()"><span>🏋️</span>Plank</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_BUCKET"
});
const db = getFirestore(app);
const storage = getStorage(app);

/* USER */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

today.innerText = new Date().toDateString();

/* HOME VOTE */
window.submitVote = async ()=>{
  await addDoc(collection(db,"votes"),{
    phone,
    points:10,
    date:new Date().toISOString().split("T")[0]
  });
  message.innerHTML="<div class='msg'>Vote Submitted ✅</div>";
};

/* LEADERBOARD */
async function loadLeader(){
  const s = await getDocs(collection(db,"votes"));
  let map={};
  s.forEach(d=>{
    map[d.data().phone]=(map[d.data().phone]||0)+d.data().points;
  });
  let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  leaderList.innerHTML="";
  arr.slice(0,5).forEach((r,i)=>{
    leaderList.innerHTML+=`
      <div class="tp-row tp-${i+1}">
        <div>${i+1}</div><div>${r[0]}</div><div>${r[1]}</div>
      </div>`;
  });
}

/* PLANK */
window.uploadPlank = async ()=>{
  if(plankTime.value<30) return alert("Minimum 30 seconds");
  const file=plankVideo.files[0];
  if(!file) return alert("Video required");

  plankMsg.innerHTML="Uploading...";
  const r=ref(storage,"plank/"+phone+Date.now());
  await uploadBytes(r,file);
  const url=await getDownloadURL(r);

  await addDoc(collection(db,"plank_videos"),{
    phone,
    duration:+plankTime.value,
    videoUrl:url
  });

  plankMsg.innerHTML="<div class='msg'>Uploaded ✅</div>";
  loadPlank();
};

async function loadPlank(){
  const s=await getDocs(collection(db,"plank_videos"));
  let a=[];
  s.forEach(d=>a.push(d.data()));
  a.sort((x,y)=>y.duration-x.duration);
  plankTop.innerHTML="";
  a.slice(0,3).forEach((r,i)=>{
    plankTop.innerHTML+=`
      <div class="tp-row tp-${i+1}">
        <div>${i+1}</div><div>${r.phone}</div><div>${r.duration}s</div>
      </div>`;
  });
}

/* NAV */
function reset(){
  homeSection.style.display=leaderSection.style.display=
  calendarSection.style.display=plankSection.style.display="none";
  document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
}
window.showHome=()=>{reset();homeSection.style.display="block";homeBtn.classList.add("active");}
window.showLeader=()=>{reset();leaderSection.style.display="block";leaderBtn.classList.add("active");loadLeader();}
window.showCalendar=()=>{reset();calendarSection.style.display="block";calBtn.classList.add("active");}
window.showPlank=()=>{reset();plankSection.style.display="block";plankBtn.classList.add("active");loadPlank();}

window.logout=()=>{localStorage.clear();location.replace("index.html");}

/* DEFAULT LOAD */
showHome();
loadLeader();
loadPlank();
</script>

</body>
</html>
