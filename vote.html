<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
}
.logout{
  background:#dc2626;
}
.info{
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<script>
/* LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");
if(!phone || !name){
  location.replace("index.html");
}
</script>

<div class="box">
<button class="logout" onclick="logout()">Logout</button>

<h2>Daily Tasks</h2>

<div class="info">Welcome <b id="user"></b></div>
<div class="info" id="date"></div>

<div id="tasksArea"></div>

<button id="submitBtn">Submit Vote</button>
</div>

<script>
document.getElementById("user").innerText = name;
const today = new Date().toISOString().split("T")[0];
document.getElementById("date").innerText = "Date : " + today;

const tasksArea = document.getElementById("tasksArea");
const submitBtn = document.getElementById("submitBtn");

let tasks = [];
let state = {};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ✅ LOAD TASKS FROM tasks/daily */
const snap = await getDoc(doc(db,"tasks","daily"));
if(snap.exists()){
  tasks = snap.data().list || [];
}

/* RENDER TASKS */
tasksArea.innerHTML="";
tasks.forEach((t,i)=>{
  const div=document.createElement("div");
  div.className="task";
  div.innerHTML=`
    <label>
      <input type="checkbox">
      ${t.text} (${t.points} pts)
    </label>
  `;
  const cb = div.querySelector("input");
  cb.onchange = ()=> state[i]=cb.checked;
  tasksArea.appendChild(div);
});

/* SUBMIT */
submitBtn.onclick = async ()=>{
  let total=0;
  let selected={};

  tasks.forEach((t,i)=>{
    selected[i]=!!state[i];
    if(state[i]) total+=t.points;
  });

  await setDoc(doc(db,"votes", phone+"_"+today),{
    name, phone, date:today,
    tasks:selected,
    totalPoints:total,
    submittedAt:new Date().toISOString()
  });

  alert("Vote submitted ✅");
  submitBtn.disabled=true;
};

</script>

<script>
function logout(){
  localStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
