<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin-bottom:5px}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
}
label{
  font-size:16px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
</style>
</head>

<body>

<div class="box">
  <h2>FAITH & FITNESS</h2>
  <p id="userInfo"></p>
  <p>Date: <span id="today"></span></p>

  <div id="taskBox" class="task">
    Loading task...
  </div>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc,
  collection, query, where,
  getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.appspot.com",
  messagingSenderId: "106583008376",
  appId: "1:106583008376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

document.getElementById("userInfo").innerText =
  "Logged in: " + phone;

const today = new Date().toISOString().split("T")[0];
document.getElementById("today").innerText = today;

let todayTask = null;

/* 🔹 LOAD TODAY TASK */
async function loadTask(){
  const ref = doc(db,"tasks","daily");   // admin creates this
  const snap = await getDoc(ref);

  if(!snap.exists()){
    taskBox.innerHTML = "No task today ❌";
    return;
  }

  const data = snap.data();
  if(data.date !== today){
    taskBox.innerHTML = "No task today ❌";
    return;
  }

  todayTask = data;

  taskBox.innerHTML = `
    <label>
      <input type="checkbox" id="checkTask">
      ${data.text} <br>
      <small>Points: ${data.points}</small>
    </label>
  `;
}
loadTask();

/* 🔹 SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!todayTask){
    alert("No task today");
    return;
  }

  if(!document.getElementById("checkTask").checked){
    alert("Please complete the task");
    return;
  }

  /* already voted check */
  const q = query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",today)
  );
  const snap = await getDocs(q);
  if(!snap.empty){
    alert("Already voted today ⚠️");
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone: phone,
    points: todayTask.points,
    date: today,
    createdAt: new Date().toISOString()
  });

  alert("Vote submitted ✅");
};

/* 🔒 BLOCK BACK */
history.pushState(null,null,location.href);
window.onpopstate = ()=>history.go(1);

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.removeItem("userPhone");
  location.replace("index.html");
};
</script>

</body>
</html>
