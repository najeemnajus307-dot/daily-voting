<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:90px}
.header{background:#fff;text-align:center;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:90px}

.container{display:flex;justify-content:center;padding:20px}
.card{
  background:#fff;
  max-width:420px;width:100%;
  padding:20px;border-radius:12px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  text-align:center
}

/* NAV (Workout Categories) */
.cat-nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:10px 0;
}
.cat-nav button{
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#e5e7eb;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap
}
.cat-nav button.active{
  background:#16a34a;
  color:#fff;
}

/* TASKS */
.task{
  border:1px solid #ddd;
  padding:12px;
  border-radius:8px;
  margin:8px 0;
  text-align:left
}

.msg{
  background:#fef3c7;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  font-size:14px
}

button.submit{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-size:15px;
  background:#16a34a;
  color:#fff;
  cursor:pointer
}
button.disabled{background:#9ca3af;cursor:not-allowed}
.logout{background:#dc2626;color:#fff;margin-top:8px}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;
  display:flex;justify-content:space-around;
  padding:10px 0
}
.bottom-nav button{
  background:none;border:none;color:#cbd5f5;font-size:13px
}
.bottom-nav span{display:block;font-size:20px}
</style>
</head>

<body>

<div class="header">
  <img src="logo..png" alt="Faith & Fitness">
</div>

<div class="container">
<div class="card">

<h3 style="color:#16a34a">FAITH & FITNESS</h3>
<div id="todayDate"></div>
<div id="userName"></div>
<div id="userPoints"></div>

<!-- WORKOUT NAV -->
<div class="cat-nav" id="catNav"></div>

<!-- TASKS -->
<div id="taskBox"></div>
<div id="message"></div>

<button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button onclick="location.reload()"><span>🏠</span>Home</button>
  <button onclick="openPlank()"><span>🧍‍♂️</span>Plank</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where, addDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* AUTH */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

/* BASIC */
todayDate.innerText = "Today: " + new Date().toDateString();
let activeCategory = "";

/* LOAD USER */
async function loadUser(){
  const s = await getDocs(query(
    collection(db,"users"),
    where("phone","==",phone)
  ));
  s.forEach(d=>userName.innerText="Hello, "+d.data().name);
}

/* LOAD POINTS */
async function loadPoints(){
  let t=0;
  const s=await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone)
  ));
  s.forEach(d=>t+=Number(d.data().points||0));
  userPoints.innerText="Your Points: "+t;
}

/* LOAD CATEGORIES (NAV BUTTONS) */
async function loadCategories(){
  const s = await getDocs(collection(db,"categories"));
  catNav.innerHTML="";
  let first=true;

  s.forEach(d=>{
    const c=d.data();
    if(c.active){
      const btn=document.createElement("button");
      btn.innerText=c.name;
      btn.onclick=()=>{
        document.querySelectorAll(".cat-nav button")
          .forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory=d.id;
        loadTasks();
      };
      if(first){
        btn.classList.add("active");
        activeCategory=d.id;
        first=false;
      }
      catNav.appendChild(btn);
    }
  });

  loadTasks();
}

/* LOAD TASKS BY CATEGORY */
async function loadTasks(){
  taskBox.innerHTML="";
  message.innerHTML="";

  const s = await getDocs(query(
    collection(db,"tasks"),
    where("category","==",activeCategory)
  ));

  if(s.empty){
    taskBox.innerHTML="<div class='msg'>No tasks in this category</div>";
    return;
  }

  s.forEach(d=>{
    const t=d.data();
    taskBox.innerHTML+=`
      <div class="task">
        <label>
          <input type="checkbox" data-points="${t.points}">
          ${t.text} (${t.points} pts)
        </label>
      </div>`;
  });
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  const checked=document.querySelectorAll("#taskBox input:checked");
  if(!checked.length) return alert("Select at least one task");

  let pts=0;
  checked.forEach(c=>pts+=Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points:pts,
    category:activeCategory,
    date:new Date().toISOString().split("T")[0]
  });

  message.innerHTML="<div class='msg'>✅ Vote submitted</div>";
  loadPoints();
};

/* NAV */
window.openPlank=()=>window.open(
  "https://forms.gle/27H48E8rNhN9nNz29","_blank"
);
window.logout=()=>{localStorage.clear();location.replace("index.html");};

/* INIT */
loadUser();
loadPoints();
loadCategories();
</script>

</body>
</html>
