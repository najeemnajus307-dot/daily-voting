<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  min-height:100vh;
  align-items:flex-start;
  padding-top:40px;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px}
.submit{background:#16a34a;color:white}
.logout{background:#dc2626;color:white}
.task{color:#16a34a;font-weight:bold}
</style>
</head>

<body>
<div class="box">
  <h2>FAITH & FITNESS</h2>
  <p id="userInfo"></p>
  <p>Date: <span id="today"></span></p>
  <p id="taskText">Loading...</p>
  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const phone=sessionStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

userInfo.innerText="Logged in: "+phone;

const today=new Date().toISOString().slice(0,10);
document.getElementById("today").innerText=today;

let todayTask=null;

async function loadTask(){
  const ref=doc(db,"tasks",today);
  const snap=await getDoc(ref);
  if(!snap.exists()){taskText.innerText="No task today";return;}
  const list=snap.data().list;
  if(!list||!list.length){taskText.innerText="No task today";return;}
  todayTask=list[0];
  taskText.innerHTML=`<span class="task">${todayTask.text}</span><br>Points: ${todayTask.points}`;
}
loadTask();

window.submitVote=async()=>{
  if(!todayTask){alert("No task");return;}
  const q=query(collection(db,"votes"),where("phone","==",phone),where("date","==",today));
  const s=await getDocs(q);
  if(!s.empty){alert("Already voted");return;}

  await addDoc(collection(db,"votes"),{phone,date:today,points:todayTask.points});

  const uq=query(collection(db,"users"),where("phone","==",phone));
  const us=await getDocs(uq);
  if(!us.empty){
    await updateDoc(doc(db,"users",us.docs[0].id),{
      totalPoints:increment(todayTask.points)
    });
  }

  alert("Vote submitted");
};

window.logout=()=>{
  sessionStorage.clear();
  location.replace("index.html");
};
</script>
</body>
</html>
