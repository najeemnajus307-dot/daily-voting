<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Editor – Faith & Fitness</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:20px;
}
.box{
  max-width:400px;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.15);
  margin:auto;
}
h2{
  text-align:center;
}
.task{
  display:flex;
  align-items:center;
  margin:8px 0;
}
.task input[type="text"]{
  flex:1;
  padding:6px;
  margin-left:6px;
}
button{
  padding:8px;
  margin-top:10px;
  width:100%;
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
}
.small{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Task Editor</h2>

  <!-- TASK LIST -->
  <div id="tasks"></div>

  <button onclick="addTask()">➕ Add Task</button>
  <button class="small" onclick="saveTasks()">💾 Save Tasks</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

const box = document.getElementById("tasks");

/* LOAD TASKS */
const ref = doc(db,"settings","tasks");
const snap = await getDoc(ref);

let taskList = snap.exists()
  ? snap.data().list
  : ["Water","Warmup","Workout"];

render();

/* RENDER TASKS */
function render(){
  box.innerHTML="";
  taskList.forEach((t,i)=>{
    box.innerHTML += `
      <div class="task">
        <input type="checkbox" checked disabled>
        <input type="text" value="${t}" onchange="update(${i},this.value)">
      </div>`;
  });
}

/* UPDATE */
window.update = (i,val)=>{
  taskList[i]=val;
};

/* ADD TASK */
window.addTask = ()=>{
  taskList.push("New Task");
  render();
};

/* SAVE TO FIRESTORE */
window.saveTasks = async ()=>{
  await setDoc(ref,{ list: taskList });
  alert("Tasks saved successfully ✅");
};
</script>

</body>
</html>
