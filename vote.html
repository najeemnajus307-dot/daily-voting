<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:25px;
  width:360px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
  position:relative;
}
h2{text-align:center;}
.info{text-align:center;font-size:14px;margin-bottom:6px}
label{display:block;margin:6px 0}
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  font-size:16px;
  cursor:pointer;
  border-radius:6px;
}
.logout{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  width:auto;
  padding:6px 10px;
  font-size:14px;
}
.task-edit{
  position:absolute;
  top:10px;
  left:10px;
  font-size:14px;
  color:#2563eb;
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="box">

<!-- 🔗 TASK EDIT LINK -->
<a href="task-editor.html" target="_blank" class="task-edit">Task Edit</a>

<button class="logout" onclick="logout()">Logout</button>

<h2>Daily Tasks</h2>

<div class="info" id="user"></div>
<div class="info" id="date"></div>

<!-- 🔥 TASKS LOAD HERE -->
<div id="tasks"></div>

<button onclick="submitVote()">Submit Vote</button>
</div>

<script>
/* LOGIN CHECK */
let user = localStorage.getItem("currentUser");
let phone = localStorage.getItem("currentPhone");
if(!user || !phone){
  location.replace("index.html");
}

document.getElementById("user").innerText = "Welcome " + user;
document.getElementById("date").innerText =
  "Date : " + new Date().toISOString().split("T")[0];

/* LOAD TASKS */
let tasks = JSON.parse(localStorage.getItem("tasks_master")) || [];
let box = document.getElementById("tasks");
let state = {};

tasks.forEach((t,i)=>{
  let id = "task_"+i;
  state[id]=false;
  box.innerHTML += `
    <label>
      <input type="checkbox" id="${id}">
      ${t}
    </label>`;
});

/* SUBMIT */
function submitVote(){
  let points = 0;
  Object.keys(state).forEach(id=>{
    if(document.getElementById(id).checked) points++;
  });
  alert("Vote submitted. Points : " + points);
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  localStorage.removeItem("currentPhone");
  location.replace("index.html");
}
</script>

</body>
</html>
