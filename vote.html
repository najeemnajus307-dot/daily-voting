<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  width:380px;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}
h2{text-align:center}
.task{
  border:1px solid #ddd;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.logout{
  background:#dc2626;
  margin-bottom:10px;
}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:6px;
}
</style>
</head>

<body>

<script>
/* 🔐 LOGIN CHECK (PERMANENT FIX) */
const phone = localStorage.getItem("userPhone");
const name  = localStorage.getItem("userName");

if(!phone || !name){
  window.location.replace("index.html");
}
</script>

<div class="box">

<button class="logout" onclick="logout()">Logout</button>

<h2>Daily Tasks</h2>

<div class="info">Welcome <span id="user"></span></div>
<div class="info" id="date"></div>

<div class="task">
  <label><input type="checkbox"> Drink Water</label>
</div>
<div class="task">
  <label><input type="checkbox"> Workout</label>
</div>

<button onclick="submitVote()">Submit Vote</button>

</div>

<script>
document.getElementById("user").innerText = name;
document.getElementById("date").innerText =
  "Date : " + new Date().toISOString().split("T")[0];

function submitVote(){
  alert("Vote submitted 👍");
}

function logout(){
  localStorage.clear();
  window.location.replace("index.html");
}
</script>

</body>
</html>
