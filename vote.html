<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:350px;
  border-radius:10px;
  text-align:center;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.logout{background:#dc2626;color:white}
</style>
</head>

<body>

<script>
const phone = sessionStorage.getItem("userPhone");
if(!phone){
  location.href="index.html";
}
</script>

<div class="box">
  <h2>WELCOME<br>FAITH & FITNESS</h2>
  <p>Logged in as: <b id="u"></b></p>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
document.getElementById("u").innerText = phone;

function logout(){
  sessionStorage.clear();
  location.href="index.html";
}
</script>

</body>
</html>
