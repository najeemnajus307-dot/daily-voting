<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faith & Fitness - Daily Tasks</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:10px;
  position:relative;
}
h2{text-align:center;}
.task{margin:8px 0;}
.points{color:green;font-size:13px;}
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
}
.logout{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  width:auto;
}
</style>
</head>

<body>
<div class="box">
<button class="logout" onclick="logout()">Logout</button>

<h2>Welcome Faith & Fitness</h2>
<p id="info"></p>

<div id="tasks"></div>

<button onclick="submit()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = localStorage.getItem("currentUser");
let phone = localStorage.getItem("currentPhone");

if(!user || !phone){
  location.href="index.html";
}

let today = new Date().toISOString().split("T")[0];
document.getElementById("info").innerText =
  `User : ${user} | Date : ${today}`;

const taskRef = doc(db,"tasks","daily");
const voteRef = doc(db,"votes", phone+"_"+today);

const taskSnap = await getDoc(taskRef);
let taskList = taskSnap.data().list || [];

let wrap = document.getElementById("tasks");
wrap.innerHTML="";

taskList.forEach((t,i)=>{
  wrap.innerHTML += `
  <div class="task">
    <input type="checkbox" id="t${i}">
    ${t.name}
    <div class="points">${t.points} points</div>
  </div>`;
});

window.submit = async function(){
  let total = 0;
  let tasks = {};

  taskList.forEach((t,i)=>{
    let v = document.getElementById("t"+i).checked;
    tasks[i]=v;
    if(v) total += t.points;
  });

  await setDoc(voteRef,{
    name:user,
    phone:phone,
    date:today,
    tasks:tasks,
    totalPoints:total,
    submittedAt:new Date().toISOString()
  });

  alert("Vote saved ✅ Total points : "+total);
  location.reload();
}

window.logout = function(){
  localStorage.clear();
  location.href="index.html";
}
</script>
</body>
</html>
