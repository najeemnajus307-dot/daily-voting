<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:12px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.msg{
  margin:12px 0;
  padding:10px;
  border-radius:6px;
  background:#fef3c7;
  color:#92400e;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName">Hello</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="message"></div>

  <div id="taskBox"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
/* 🔥 Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 Login check */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 👤 Load user */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* ⭐ Load total points (votes + admin bonuses) */
async function loadTotalPoints(){
  let total = 0;

  const v = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  v.forEach(d=> total += Number(d.data().points||0));

  const b = await getDocs(
    query(collection(db,"bonuses"), where("phone","==",phone))
  );
  b.forEach(d=> total += Number(d.data().points||0));

  userPoints.innerText = "Total Points: " + total;
}

/* 🗓️ Load active tasks (MULTIPLE) */
async function loadTasks(){
  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));

  taskBox.innerHTML = "";
  let active = false;

  snap.forEach(d=>{
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      active = true;
      taskBox.innerHTML += `
        <div class="task">
          <label>
            <input type="checkbox" data-points="${t.points}">
            <b>${t.text}</b><br>
            Points: ${t.points}
          </label>
        </div>
      `;
    }
  });

  if(!active){
    disableVote("No active task right now ❌");
  }
}

/* 🗳️ Submit vote */
window.submitVote = async ()=>{
  const checked = document.querySelectorAll(
    "#taskBox input[type=checkbox]:checked"
  );

  if(checked.length === 0){
    alert("At least one task tick cheyyanam ✅");
    return;
  }

  const today = new Date().toISOString().split("T")[0];

  const s = await getDocs(
    query(collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",today)
    )
  );

  if(!s.empty){
    showMessage("You have done today’s voting ✅<br>Next voting is tomorrow at 8 PM");
    disableBtn();
    return;
  }

  let points = 0;
  checked.forEach(c=> points += Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points,
    date: today,
    createdAt: new Date().toISOString()
  });

  showMessage("Vote submitted successfully ✅<br>Next voting is tomorrow at 8 PM");
  disableBtn();
  loadTotalPoints();
};

/* 🔔 Helpers */
function showMessage(txt){
  message.innerHTML = `<div class="msg">${txt}</div>`;
}
function disableVote(txt){
  taskBox.innerHTML = `<div class="msg">${txt}</div>`;
  disableBtn();
}
function disableBtn(){
  submitBtn.disabled = true;
  submitBtn.classList.add("disabled");
}

/* 🚪 Logout */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* INIT */
loadUser();
loadTotalPoints();
loadTasks();
</script>

</body>
</html>
