<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>Daily Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:380px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
  position:relative;
}
h2{text-align:center;margin-bottom:4px;}
h4{text-align:center;color:#16a34a;margin-top:0;}
.info{text-align:center;font-size:14px;margin-bottom:6px;}
label{display:block;margin:8px 0;}
.points{font-size:13px;color:green;margin-left:22px;}
button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#16a34a;
  color:#fff;
  border:none;
  font-size:16px;
  border-radius:6px;
}
button:disabled{
  background:#9ca3af;
}
.logout{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="box">
  <button class="logout" onclick="logout()">Logout</button>

  <h2>Welcome Faith & Fitness</h2>
  <h4>Daily Tasks</h4>

  <div class="info" id="user"></div>
  <div class="info" id="date"></div>

  <div id="taskList"></div>

  <button id="submitBtn">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

async function init(){

  const user  = localStorage.getItem("currentUser");
  const phone = localStorage.getItem("currentPhone");
  if(!user || !phone){
    location.replace("index.html");
    return;
  }

  const today = new Date().toISOString().split("T")[0];
  const voteRef = doc(db,"votes", phone + "_" + today);

  document.getElementById("user").innerText = "User : " + user;
  document.getElementById("date").innerText = "Date : " + today;

  const taskBox = document.getElementById("taskList");
  const btn = document.getElementById("submitBtn");

  /* LOAD TASKS */
  const taskSnap = await getDoc(doc(db,"tasks","daily"));
  if(!taskSnap.exists()){
    taskBox.innerHTML = "<p>No tasks added</p>";
    btn.disabled = true;
    return;
  }

  const tasks = taskSnap.data().list || [];
  const inputs = {};

  taskBox.innerHTML = "";
  tasks.forEach((t,i)=>{
    const id = "task_"+i;
    taskBox.innerHTML += `
      <label>
        <input type="checkbox" id="${id}">
        ${t.text}
        <div class="points">${t.points} points</div>
      </label>
    `;
    inputs[i] = {
      el: document.getElementById(id),
      pts: Number(t.points)
    };
  });

  /* ALREADY SUBMITTED CHECK */
  const snap = await getDoc(voteRef);
  if(snap.exists()){
    const old = snap.data().tasks || {};
    Object.keys(old).forEach(i=>{
      if(inputs[i]) inputs[i].el.checked = old[i];
    });
    lockPage("Already submitted");
  }

  function lockPage(msg){
    Object.values(inputs).forEach(i=>i.el.disabled=true);
    btn.disabled = true;
    btn.innerText = msg;
  }

  /* SUBMIT */
  btn.onclick = async ()=>{
    let result = {};
    let total = 0;

    Object.keys(inputs).forEach(i=>{
      const checked = inputs[i].el.checked;
      result[i] = checked;
      if(checked){
        total += inputs[i].pts; // ✅ CORRECT TOTAL
      }
    });

    await setDoc(voteRef,{
      name:user,
      phone:phone,
      date:today,
      tasks:result,
      totalPoints:total,
      submittedAt:new Date().toISOString()
    });

    alert("Vote saved ✅ Total points : " + total);
    lockPage("Already submitted");
  };
}

/* LOGOUT */
window.logout = function(){
  localStorage.clear();
  location.replace("index.html");
};

init();
</script>

</body>
</html>
