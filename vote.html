<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:80px}
.header{background:#fff;text-align:center;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:110px}
.container{display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:380px;width:100%;padding:20px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.15)}

.task{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0}
.msg{background:#fef3c7;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}

button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:6px;font-size:15px}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}

.tp-row{display:grid;grid-template-columns:60px 1fr 70px;align-items:center;padding:8px;border-radius:6px;margin:6px 0;font-weight:bold}
.tp-1{background:#fde047}
.tp-2{background:#e5e7eb}
.tp-3{background:#fecaca}

input{width:100%;padding:8px;margin-top:6px}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:flex;justify-content:space-around;padding:10px 0}
.bottom-nav button{background:none;border:none;color:#cbd5f5;font-size:13px}
.bottom-nav button.active{color:#fff;font-weight:bold}
.bottom-nav span{display:block;font-size:20px}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png">
</div>

<div class="container">
<div class="card">

<!-- HOME -->
<div id="homeSection">
  <h3 style="color:#16a34a">FAITH & FITNESS</h3>
  <div id="todayDate"></div>
  <div id="userName"></div>
  <div id="userPoints"></div>

  <div id="taskBox"></div>
  <div id="message"></div>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- PLANK -->
<div id="plankSection" style="display:none">
  <h3>🏋️ Plank Competition</h3>

  <input type="number" id="plankTime" placeholder="Plank time (seconds)">
  <input type="file" id="plankVideo" accept="video/*">

  <button class="submit" onclick="uploadPlank()">Upload Video</button>
  <div id="plankMsg"></div>

  <hr>
  <h4>🏆 Top Plank Holders</h4>
  <div class="tp-row" style="background:#2563eb;color:#fff">
    <div>Rank</div><div>Name</div><div>Time</div>
  </div>
  <div id="plankTop"></div>
</div>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" id="homeBtn" onclick="showHome()"><span>🏠</span>Home</button>
  <button id="plankBtn" onclick="showPlank()"><span>🏋️</span>Plank</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

/* FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH_DOMAIN",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_BUCKET"
});
const db = getFirestore(app);
const storage = getStorage(app);

/* USER CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

todayDate.innerText = "Today: " + new Date().toDateString();

/* LOAD USER */
async function loadUser(){
  const s = await getDocs(query(collection(db,"users"),where("phone","==",phone)));
  s.forEach(d=>userName.innerText="Hello, "+d.data().name);
}
loadUser();

/* POINTS */
async function loadPoints(){
  let t=0;
  const s = await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  s.forEach(d=>t+=Number(d.data().points||0));
  userPoints.innerText="Your Points: "+t;
}
loadPoints();

/* VOTING */
window.submitVote = async ()=>{
  await addDoc(collection(db,"votes"),{
    phone,
    points:10,
    date:new Date().toISOString().split("T")[0]
  });
  message.innerHTML="<div class='msg'>✅ Vote submitted</div>";
  loadPoints();
};

/* PLANK UPLOAD */
window.uploadPlank = async ()=>{
  const time = Number(plankTime.value);
  const file = plankVideo.files[0];

  if(!file || !time) return alert("Time & video required");
  if(time < 30) return alert("Minimum plank time 30 seconds");

  plankMsg.innerHTML="Uploading... ⏳";

  const fileRef = ref(storage,"plank/"+phone+"_"+Date.now());
  await uploadBytes(fileRef,file);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db,"plank_videos"),{
    phone,
    name:userName.innerText.replace("Hello, ",""),
    duration:time,
    videoUrl:url,
    date:new Date().toISOString().split("T")[0]
  });

  plankMsg.innerHTML="<div class='msg'>✅ Video uploaded</div>";
  loadPlankLeaderboard();
};

/* PLANK LEADERBOARD */
async function loadPlankLeaderboard(){
  const s = await getDocs(collection(db,"plank_videos"));
  let rows=[];
  s.forEach(d=>rows.push(d.data()));
  rows.sort((a,b)=>b.duration-a.duration);

  plankTop.innerHTML="";
  rows.slice(0,5).forEach((r,i)=>{
    const icon=i==0?"🥇":i==1?"🥈":i==2?"🥉":"";
    plankTop.innerHTML+=`
      <div class="tp-row tp-${i+1}">
        <div>${icon} ${i+1}</div>
        <div>${r.name}</div>
        <div>${r.duration}s</div>
      </div>`;
  });
}

/* NAVIGATION */
window.showHome=()=>{
  homeSection.style.display="block";
  plankSection.style.display="none";
  homeBtn.classList.add("active");
  plankBtn.classList.remove("active");
};
window.showPlank=()=>{
  homeSection.style.display="none";
  plankSection.style.display="block";
  plankBtn.classList.add("active");
  homeBtn.classList.remove("active");
  loadPlankLeaderboard();
};

window.logout=()=>{
  localStorage.clear();
  location.replace("index.html");
};
</script>

</body>
  </html>
