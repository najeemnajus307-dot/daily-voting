<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  min-height:100vh;
  align-items:flex-start;
  padding-top:40px;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}

.task{color:#16a34a;font-weight:bold}

.checkline{
  margin:15px 0;
  text-align:left;
}
.checkline input{
  margin-right:6px;
}
</style>
</head>

<body>

<div class="box">
  <h2>FAITH & FITNESS</h2>

  <p id="userInfo"></p>
  <p>Date : <span id="today"></span></p>

  <!-- TASK WITH CHECKBOX -->
  <div id="taskArea">Loading task...</div>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc,
  collection, query, where, getDocs,
  addDoc, updateDoc, increment
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = sessionStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

document.getElementById("userInfo").innerText =
  "Logged in : " + phone;

const today = new Date().toISOString().slice(0,10);
document.getElementById("today").innerText = today;

let todayTask = null;

/* 🔹 LOAD TODAY TASK */
async function loadTask(){
  const ref = doc(db,"tasks",today);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    taskArea.innerText = "No task today";
    return;
  }

  const list = snap.data().list;
  if(!list || list.length === 0){
    taskArea.innerText = "No task today";
    return;
  }

  todayTask = list[0];

  taskArea.innerHTML = `
    <div class="checkline">
      <label>
        <input type="checkbox" id="taskCheck">
        <span class="task">${todayTask.text}</span>
      </label>
      <div>Points : ${todayTask.points}</div>
    </div>
  `;
}
loadTask();

/* 🔹 SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!todayTask){
    alert("No task today ❌");
    return;
  }

  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("Task complete cheythu checkbox tick cheyyu ✅");
    return;
  }

  /* check already voted */
  const q = query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",today)
  );
  const snap = await getDocs(q);
  if(!snap.empty){
    alert("Already voted today ⚠️");
    return;
  }

  /* save vote */
  await addDoc(collection(db,"votes"),{
    phone,
    points: todayTask.points,
    date: today,
    createdAt: new Date().toISOString()
  });

  /* update user points */
  const uq = query(
    collection(db,"users"),
    where("phone","==",phone)
  );
  const us = await getDocs(uq);
  if(!us.empty){
    await updateDoc(doc(db,"users",us.docs[0].id),{
      totalPoints: increment(todayTask.points)
    });
  }

  alert("Vote submitted successfully ✅");
};

/* LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  location.replace("index.html");
};
</script>

</body>
</html>
