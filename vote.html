<!DOCTYPE html>
<html>
<head>
<title>Daily Voting</title>
<style>
body{font-family:Arial;background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:20px;width:360px;border-radius:10px}
.task{border:1px solid #ddd;padding:8px;border-radius:6px;margin-bottom:8px}
button{width:100%;padding:10px;background:#16a34a;color:#fff;border:none}
</style>
</head>
<body>

<div class="box">
<h3>Daily Tasks</h3>
<div id="tasks"></div>
<button id="btn" onclick="submitVote()">Submit Vote</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxcAE2EoLEdhG1VTrxGUc981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = sessionStorage.getItem("userName");
const phone = sessionStorage.getItem("userPhone");
if(!user || !phone) location.replace("index.html");

const today = new Date().toISOString().split("T")[0];
const voteRef = doc(db,"votes",phone+"_"+today);

// Load tasks
const taskSnap = await getDoc(doc(db,"config","tasks"));
if(!taskSnap.exists()){
  tasks.innerHTML="No tasks today";
  btn.disabled=true;
}else{
  taskSnap.data().list.forEach((t,i)=>{
    tasks.innerHTML += `
      <div class="task">
        <label>
          <input type="checkbox" id="t${i}"> ${t.name}
        </label>
        <small>Points: ${t.points}</small>
      </div>`;
  });
}

// Already voted?
const voted = await getDoc(voteRef);
if(voted.exists()){
  btn.disabled=true;
  btn.innerText="Already voted today";
}

window.submitVote = async ()=>{
  let total=0, data={};
  taskSnap.data().list.forEach((t,i)=>{
    const ok=document.getElementById("t"+i).checked;
    data[t.name]=ok;
    if(ok) total+=t.points;
  });

  await setDoc(voteRef,{
    name:user,
    phone:phone,
    date:today,
    tasks:data,
    points:total
  });

  alert("Vote saved");
  location.reload();
};
</script>
</body>
</html>
