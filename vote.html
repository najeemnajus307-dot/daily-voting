<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:25px;
  width:360px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
.task{
  border:1px solid #ddd;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  text-align:left;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a}
.logout{background:#dc2626}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME<br>FAITH & FITNESS</h2>

  <div id="user"></div>
  <div id="date"></div>

  <div id="tasksArea">Loading tasks...</div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 LOGIN CHECK */
const uid = sessionStorage.getItem("uid");
const name = sessionStorage.getItem("name");
const phone = sessionStorage.getItem("phone");

if(!uid){
  location.replace("index.html");
}

/* UI */
const today = new Date().toISOString().split("T")[0];
document.getElementById("user").innerText = "Hello " + name;
document.getElementById("date").innerText = "Date : " + today;

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔁 LOAD TASKS */
const tasksArea = document.getElementById("tasksArea");
let tasks = [];

const snap = await getDocs(collection(db,"tasks"));
tasksArea.innerHTML = "";
snap.forEach(d=>{
  const t = d.data();
  if(t.active){
    tasks.push({id:d.id, ...t});
  }
});

if(tasks.length === 0){
  tasksArea.innerHTML = "<p style='color:red'>No tasks today</p>";
}

/* Render checkboxes */
tasks.forEach((t,i)=>{
  tasksArea.innerHTML += `
    <div class="task">
      <label>
        <input type="checkbox" id="t_${i}">
        ${t.title} (${t.points} pts)
      </label>
    </div>
  `;
});

/* 🔒 CHECK ALREADY VOTED */
const voteId = phone + "_" + today;
const voteRef = doc(db,"votes",voteId);
const voted = await getDoc(voteRef);
if(voted.exists()){
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").innerText = "Already voted today";
}

/* ✅ SUBMIT VOTE */
window.submitVote = async ()=>{
  let total = 0;
  let selected = {};

  tasks.forEach((t,i)=>{
    const checked = document.getElementById("t_"+i).checked;
    selected[t.id] = checked;
    if(checked) total += t.points;
  });

  await setDoc(voteRef,{
    uid,
    name,
    phone,
    date: today,
    tasks: selected,
    totalPoints: total,
    createdAt: new Date().toISOString()
  });

  alert("Vote submitted ✅ Points: " + total);
  location.reload();
};

/* LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  location.replace("index.html");
};
</script>

</body>
</html>
