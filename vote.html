<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.msg{
  background:#fef3c7;
  padding:10px;
  border-radius:6px;
  font-size:14px;
  margin-top:10px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div id="userName">Hello</div>
  <div id="userPoints">Total Points: 0</div>

  <div id="taskBox" class="task">Loading...</div>

  <div id="infoMsg"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const phone = localStorage.getItem("userPhone");
if(!phone){
  location.href="index.html";
}

/* LOAD USER */
async function loadUser(){
  const s = await getDocs(query(
    collection(db,"users"),
    where("phone","==",phone)
  ));
  s.forEach(d=>{
    userName.innerText = "Hello, " + d.data().name;
  });
}

/* TOTAL POINTS (USER + ADMIN) */
async function loadPoints(){
  let total = 0;
  const s = await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone)
  ));
  s.forEach(d=>{
    total += Number(d.data().points || 0);
  });
  userPoints.innerText = "Total Points: " + total;
}

/* LOAD ACTIVE TASK */
let activeTask=null;

async function loadTask(){
  const now = new Date().toISOString();
  const snap = await getDocs(collection(db,"tasks"));

  let found=false;
  snap.forEach(d=>{
    if(found) return;
    const t=d.data();
    if(now>=t.start && now<=t.end){
      found=true;
      activeTask={...t,id:d.id};
      taskBox.innerHTML=`
        <label>
          <input type="checkbox" id="chk">
          <b>${t.text}</b><br>
          Points: ${t.points}
        </label>`;
    }
  });

  if(!found){
    disableVote("No active task right now ❌");
  }
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!activeTask) return;

  if(!chk.checked){
    alert("Task complete cheyth checkbox tick cheyyu");
    return;
  }

  const today = new Date().toISOString().split("T")[0];

  const s = await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",today),
    where("type","==","user")
  ));

  if(!s.empty){
    showDoneMsg();
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone,
    points:activeTask.points,
    type:"user",
    date:today,
    createdAt:new Date().toISOString()
  });

  showDoneMsg();
  loadPoints();
};

/* DONE MESSAGE */
function showDoneMsg(){
  disableVote("");
  infoMsg.innerHTML=`
    <div class="msg">
      You have done today's voting ✅<br>
      Next voting is tomorrow at <b>8 PM</b>
    </div>`;
}

/* DISABLE */
function disableVote(msg){
  taskBox.innerHTML=msg;
  submitBtn.disabled=true;
  submitBtn.classList.add("disabled");
}

/* LOGOUT */
window.logout=()=>{
  localStorage.clear();
  location.reload();
};

loadUser();
loadPoints();
loadTask();
</script>

</body>
</html>
