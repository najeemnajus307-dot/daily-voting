<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:25px;
  width:360px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
  text-align:center;
}
h2{margin-bottom:6px}
.green{color:#16a34a}
.task{text-align:left;margin:6px 0}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
.submit{background:#16a34a;color:white}
.logout{background:#dc2626;color:white}
</style>
</head>

<body>

<div class="box">
  <h2 class="green">WELCOME<br>FAITH & FITNESS</h2>
  <div id="userInfo"></div>
  <div id="dateBox"></div>

  <div id="tasksBox" style="margin:12px 0">Loading tasks...</div>

  <button class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 Logged user (NO localStorage – Firebase only) */
const phone = sessionStorage.getItem("phone");
const name  = sessionStorage.getItem("name");

if(!phone){
  window.location.href="index.html";
}

document.getElementById("userInfo").innerHTML =
  `<b>Hello ${name}</b>`;
const today = new Date().toISOString().slice(0,10);
document.getElementById("dateBox").innerHTML =
  `Date : ${today}`;

/* 🔹 LOAD TASKS (FROM task-editor STRUCTURE) */
async function loadTasks(){
  const box = document.getElementById("tasksBox");
  const ref = doc(db,"tasks","daily");
  const snap = await getDoc(ref);

  if(!snap.exists()){
    box.innerHTML = "<span style='color:red'>No tasks today</span>";
    return;
  }

  const list = snap.data().list || [];
  if(list.length===0){
    box.innerHTML = "<span style='color:red'>No tasks today</span>";
    return;
  }

  box.innerHTML="";
  list.forEach((t,i)=>{
    box.innerHTML+=`
      <div class="task">
        <label>
          <input type="checkbox" value="${t.points}">
          ${t.text} (${t.points} pts)
        </label>
      </div>
    `;
  });
}
loadTasks();

/* 🟢 SUBMIT VOTE */
window.submitVote = async ()=>{
  const checks = document.querySelectorAll("#tasksBox input:checked");
  if(checks.length===0){
    alert("Select at least one task");
    return;
  }

  let points=0;
  checks.forEach(c=>points+=Number(c.value));

  await addDoc(collection(db,"votes"),{
    name,
    phone,
    points,
    date: today,
    createdAt: new Date().toISOString()
  });

  alert("Vote submitted ✅");
  window.location.reload();
};

/* 🔴 LOGOUT */
window.logout = ()=>{
  sessionStorage.clear();
  window.location.href="index.html";
};
</script>

</body>
</html>
