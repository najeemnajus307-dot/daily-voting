<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.info{
  font-size:14px;
  color:#374151;
  margin-top:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
small{color:#555}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Loading...</div>
  <div class="info" id="userPoints">Total Points: 0</div>

  <div id="taskBox" class="task">Loading task...</div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
/* 🔥 FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  alert("Please login again");
  location.replace("index.html");
}

/* 👤 LOAD USER */
async function loadUser(){
  const s = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  if(!s.empty){
    s.forEach(d=>{
      userName.innerText = "Hello, " + d.data().name;
    });
  }
}

/* ⭐ TOTAL POINTS */
async function loadTotalPoints(){
  let total = 0;
  const s = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  s.forEach(d=>{
    total += Number(d.data().points || 0);
  });
  userPoints.innerText = "Total Points: " + total;
}

/* 🗓️ LOAD ACTIVE TASK (DATE + TIME) */
let activeTask = null;

async function loadTask(){
  const now = new Date();
  const snap = await getDocs(collection(db,"tasks"));
  let found = false;

  snap.forEach(d=>{
    if(found) return;
    const t = d.data();
    const start = new Date(t.start);
    const end   = new Date(t.end);

    if(now >= start && now <= end){
      found = true;
      activeTask = { ...t, id:d.id };

      taskBox.innerHTML = `
        <label>
          <input type="checkbox" id="taskCheck">
          <b>${t.text}</b><br>
          <small>Points: ${t.points}</small>
        </label>
      `;
    }
  });

  if(!found){
    disableVote("No active task right now ❌");
  }else{
    checkAlreadyVoted();
  }
}

/* 🗳️ CHECK ALREADY VOTED */
async function checkAlreadyVoted(){
  const voteDate = activeTask.start.split("T")[0];
  const s = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",voteDate)
    )
  );

  if(!s.empty){
    showDoneMessage();
  }
}

/* 🗳️ SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!activeTask) return;

  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("Task complete cheythu checkbox tick cheyyu ✅");
    return;
  }

  const voteDate = activeTask.start.split("T")[0];

  await addDoc(collection(db,"votes"),{
    phone,
    points: activeTask.points,
    date: voteDate,
    createdAt: new Date().toISOString()
  });

  showDoneMessage();
  loadTotalPoints();
};

/* ✅ AFTER VOTE MESSAGE */
function showDoneMessage(){
  const nextTime = new Date(activeTask.end).toLocaleString("en-IN",{
    hour:"numeric",
    minute:"2-digit",
    hour12:true,
    day:"numeric",
    month:"short"
  });

  disableVote(
    `You have done today's voting ✅<br>
     <small>Next voting is on ${nextTime}</small>`
  );
}

/* 🔒 DISABLE */
function disableVote(msg){
  taskBox.innerHTML = msg;
  submitBtn.disabled = true;
  submitBtn.classList.add("disabled");
}

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.clear();
  location.replace("index.html");
};

/* 🚀 INIT */
loadUser();
loadTotalPoints();
loadTask();
</script>

</body>
</html>
