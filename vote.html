<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vote Page</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:20px;
  width:300px;
  border-radius:10px;
  text-align:center;
}
button{padding:8px;width:100%;margin-top:10px}
</style>
</head>

<body>

<script>
if(sessionStorage.getItem("logged")!=="yes"){
  location.replace("index.html");
}
</script>

<div class="box">
  <h3>Welcome</h3>
  <p id="u"></p>
  <button onclick="logout()">Logout</button>
</div>

<script>
u.innerText=sessionStorage.getItem("userName");

function logout(){
  if(confirm("Logout?")){
    sessionStorage.clear();
    location.replace("index.html");
  }
}
</script>

</body>
</html>
