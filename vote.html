<script type="module">
/* 🔥 FIREBASE IMPORTS */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  updateDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
  getMessaging,
  getToken
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-messaging.js";

/* 🔥 FIREBASE CONFIG (ninte project) */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

/* 🔐 LOGIN CHECK */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}

/* 🔔 ASK NOTIFICATION PERMISSION */
window.askPermission = async ()=>{
  const permission = await Notification.requestPermission();

  if(permission !== "granted"){
    alert("Notification permission denied ❌");
    return;
  }

  const token = await getToken(messaging,{
    vapidKey: "YOUR_VAPID_KEY_HERE"
  });

  if(!token){
    alert("Token not generated");
    return;
  }

  // check already saved?
  const q = query(
    collection(db,"fcm_tokens"),
    where("phone","==",phone)
  );
  const snap = await getDocs(q);

  if(snap.empty){
    // save new
    await addDoc(collection(db,"fcm_tokens"),{
      phone: phone,
      token: token,
      votedToday: false,
      createdAt: new Date().toISOString()
    });
  }else{
    // update token
    snap.forEach(async d=>{
      await updateDoc(doc(db,"fcm_tokens",d.id),{
        token: token
      });
    });
  }

  alert("Notifications enabled ✅");
  document.getElementById("notifyBtn").style.display="none";
};

/* 🗳️ WHEN USER VOTES – STOP FUTURE NOTIFICATIONS */
window.markVoted = async ()=>{
  const q = query(
    collection(db,"fcm_tokens"),
    where("phone","==",phone)
  );
  const snap = await getDocs(q);

  snap.forEach(async d=>{
    await updateDoc(doc(db,"fcm_tokens",d.id),{
      votedToday: true
    });
  });
};
</script>
