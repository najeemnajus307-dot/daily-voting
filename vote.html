<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness - Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:25px;
  width:320px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;margin:0;}
.info{
  text-align:center;
  font-size:14px;
  margin-bottom:12px;
}
.task{margin:6px 0;}
button{
  width:100%;
  padding:10px;
  margin-top:12px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a;color:white;}
.logout{background:#e5e7eb;}
</style>
</head>

<body>

<div class="box">
  <h2>Faith & Fitness</h2>

  <div class="info">
    Hi <b id="uname"></b><br>
    <span id="today"></span>
  </div>

  <div id="tasks"></div>

  <button class="submit" onclick="submitVote()">Submit Today Task</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* SESSION */
const phone = sessionStorage.getItem("phone");
const name  = sessionStorage.getItem("name");
if(!phone) location.href="index.html";

uname.innerText = name;
today.innerText = new Date().toDateString();

/* LOAD TASKS FROM ADMIN */
const snap = await getDoc(doc(db,"settings","tasks"));
const list = snap.exists() ? snap.data().list : [];

list.forEach(t=>{
  tasks.innerHTML += `
    <div class="task">
      <label><input type="checkbox" value="${t}"> ${t}</label>
    </div>`;
});

/* SUBMIT */
window.submitVote = async ()=>{
  const sel = [...document.querySelectorAll("input:checked")]
              .map(i=>i.value);
  if(sel.length===0){
    alert("Select at least one task");
    return;
  }

  const d = new Date().toISOString().slice(0,10);
  const ref = doc(db,"votes", phone+"_"+d);

  if((await getDoc(ref)).exists()){
    alert("Already submitted today");
    return;
  }

  await setDoc(ref,{
    phone:phone,
    name:name,
    tasks:sel,
    date:d
  });

  alert("Task submitted successfully ✅");
};

window.logout = ()=>{
  sessionStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
