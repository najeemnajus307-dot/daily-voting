<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin-bottom:5px}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
small{color:#555}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">
  <h2>FAITH & FITNESS</h2>
  <p id="userInfo"></p>
  <p>Now: <span id="nowTxt"></span></p>

  <div id="taskBox" class="task">
    Loading task...
  </div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc,
  collection, query, where,
  getDocs, addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee",
  storageBucket: "daily-voting-793ee.appspot.com",
  messagingSenderId: "106583008376",
  appId: "1:106583008376:web:9d3858939d07056a5fa0ed"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 LOGIN CHECK (PERSISTENT) */
const phone = localStorage.getItem("userPhone");
if(!phone){
  location.replace("index.html");
}
document.getElementById("userInfo").innerText = "Logged in: " + phone;

/* TIME DISPLAY */
const now = new Date();
document.getElementById("nowTxt").innerText = now.toLocaleString();

let activeTask = null;

/* 🔹 LOAD TASK WITH DATE & TIME CHECK */
async function loadTask(){
  const ref = doc(db,"tasks","daily"); // admin saves here
  const snap = await getDoc(ref);

  if(!snap.exists()){
    disableVote("No task configured ❌");
    return;
  }

  const t = snap.data();

  // Required fields: text, points, startTime, endTime
  if(!t.text || !t.points || !t.startTime || !t.endTime){
    disableVote("Task config incomplete ❌");
    return;
  }

  const start = new Date(t.startTime);
  const end   = new Date(t.endTime);

  if(now < start || now > end){
    disableVote(
      `Voting not available ❌<br>
       <small>From: ${start.toLocaleString()}<br>
       To: ${end.toLocaleString()}</small>`
    );
    return;
  }

  // OK to vote
  activeTask = t;
  document.getElementById("taskBox").innerHTML = `
    <label>
      <input type="checkbox" id="taskCheck">
      <strong>${t.text}</strong><br>
      <small>Points: ${t.points}</small>
    </label>
  `;
}
loadTask();

/* 🔹 SUBMIT VOTE */
window.submitVote = async ()=>{
  if(!activeTask){
    alert("Voting not available");
    return;
  }

  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("Task complete cheythu checkbox tick cheyyu ✅");
    return;
  }

  const today = new Date().toISOString().split("T")[0];

  // one vote per day
  const q = query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",today)
  );
  const s = await getDocs(q);
  if(!s.empty){
    alert("Already voted today ⚠️");
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone: phone,
    points: activeTask.points,
    date: today,
    createdAt: new Date().toISOString()
  });

  alert("Vote submitted successfully ✅");
  disableVote("You have voted today ✅");
};

/* HELPERS */
function disableVote(msg){
  document.getElementById("taskBox").innerHTML = msg;
  const btn = document.getElementById("submitBtn");
  btn.classList.add("disabled");
  btn.disabled = true;
}

/* 🔒 BLOCK BACK BUTTON */
history.pushState(null,null,location.href);
window.onpopstate = ()=>history.go(1);

/* 🚪 LOGOUT */
window.logout = ()=>{
  localStorage.removeItem("userPhone");
  location.replace("index.html");
};
</script>

</body>
</html>
