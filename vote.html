<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Fitness – Vote</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;padding-bottom:80px}
.header{background:#fff;text-align:center;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.header img{height:90px}

.container{display:flex;justify-content:center;padding:20px}
.card{
  background:#fff;
  max-width:420px;width:100%;
  padding:20px;border-radius:12px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  text-align:center
}

.task{
  border:1px solid #ddd;
  padding:12px;
  border-radius:8px;
  margin:8px 0;
  text-align:left
}

.msg{
  background:#fef3c7;
  padding:12px;
  border-radius:8px;
  margin:10px 0;
  font-size:14px
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  font-size:15px;
  cursor:pointer
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{background:#9ca3af;cursor:not-allowed}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  background:#0f172a;
  display:flex;justify-content:space-around;
  padding:10px 0
}
.bottom-nav button{
  background:none;border:none;
  color:#cbd5f5;font-size:13px
}
.bottom-nav span{display:block;font-size:20px}
</style>
</head>

<body>

<div class="header">
  <img src="logo..png">
</div>

<div class="container">
<div class="card">

<h3 style="color:#16a34a">FAITH & FITNESS</h3>
<div id="todayDate"></div>
<div id="userName"></div>
<div id="userPoints"></div>

<div id="taskBox"></div>
<div id="message"></div>

<button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button onclick="location.reload()"><span>🏠</span>Home</button>
  <button onclick="location.href='leaderboard.html'"><span>🏆</span>Leaderboard</button>
  <button onclick="location.href='calendar.html'"><span>📅</span>Calendar</button>
  <button onclick="openPlank()"><span>🧍‍♂️</span>Plank</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, addDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain:"daily-voting-793ee.firebaseapp.com",
  projectId:"daily-voting-793ee"
});
const db = getFirestore(app);

/* AUTH */
const phone = localStorage.getItem("userPhone");
if(!phone) location.replace("index.html");

/* INFO */
todayDate.innerText = "Today: " + new Date().toDateString();

/* =========================
   CUSTOM VOTING DAY LOGIC
   8 PM → next day 12 PM
========================= */
function getVoteDate(){
  const now = new Date();

  const today = new Date();
  today.setHours(0,0,0,0);

  const today8PM = new Date(today);
  today8PM.setHours(20,0,0,0);

  const tomorrow12PM = new Date(today);
  tomorrow12PM.setDate(today.getDate()+1);
  tomorrow12PM.setHours(12,0,0,0);

  // valid voting window
  if(now >= today8PM && now <= tomorrow12PM){
    return today.toISOString().split("T")[0];
  }

  return null; // voting closed
}

/* CHECK ALREADY VOTED */
async function checkVoted(){
  const voteDate = getVoteDate();
  if(!voteDate) return false;

  const s = await getDocs(query(
    collection(db,"votes"),
    where("phone","==",phone),
    where("date","==",voteDate)
  ));

  if(!s.empty){
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    message.innerHTML =
      "<div class='msg'>✅ Already voted for this day</div>";
    return true;
  }
  return false;
}

/* LOAD USER */
async function loadUser(){
  const s = await getDocs(query(collection(db,"users"),where("phone","==",phone)));
  s.forEach(d=>userName.innerText="Hello, "+d.data().name);
}

/* LOAD POINTS */
async function loadPoints(){
  let t=0;
  const s=await getDocs(query(collection(db,"votes"),where("phone","==",phone)));
  s.forEach(d=>t+=Number(d.data().points||0));
  userPoints.innerText="Your Points: "+t;
}

/* LOAD TASKS */
async function loadTasks(){
  const voteDate = getVoteDate();

  if(!voteDate){
    taskBox.innerHTML =
      "<div class='msg'>⏰ Voting open: <b>8:00 PM – next day 12:00 PM</b></div>";
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    return;
  }

  if(await checkVoted()) return;

  submitBtn.disabled = false;
  submitBtn.classList.remove("disabled");

  const s = await getDocs(collection(db,"tasks"));
  taskBox.innerHTML = "";

  s.forEach(d=>{
    const t=d.data();
    taskBox.innerHTML += `
      <div class="task">
        <label>
          <input type="checkbox" data-points="${t.points}">
          ${t.text} (${t.points} pts)
        </label>
      </div>`;
  });
}

/* SUBMIT VOTE */
window.submitVote = async ()=>{
  const voteDate = getVoteDate();
  if(!voteDate) return alert("Voting closed");

  if(await checkVoted()) return;

  const checked=document.querySelectorAll("#taskBox input:checked");
  if(!checked.length) return alert("Task select cheyyanam");

  let pts=0;
  checked.forEach(c=>pts+=Number(c.dataset.points));

  await addDoc(collection(db,"votes"),{
    phone,
    points:pts,
    date:voteDate,
    created:new Date()
  });

  submitBtn.disabled=true;
  submitBtn.classList.add("disabled");
  message.innerHTML="<div class='msg'>✅ Vote submitted successfully</div>";
  loadPoints();
};

/* NAV */
window.openPlank=()=>window.open(
  "https://forms.gle/27H48E8rNhN9nNz29","_blank"
);
window.logout=()=>{localStorage.clear();location.replace("index.html");};

/* INIT */
loadUser();
loadPoints();
loadTasks();
</script>

</body>
</html>
