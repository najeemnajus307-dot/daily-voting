<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, collection, query, where,
  getDocs, addDoc
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 Logged user
const user = JSON.parse(localStorage.getItem("user"));
if(!user) location.href="index.html";

const phone = user.phone;
const name  = user.name;

const taskBox = document.getElementById("tasks");
const msgBox  = document.getElementById("msg");

const now = new Date();
const todayKey = now.toISOString().slice(0,10);

// 🟢 show tomorrow message
function showDone(){
  const t = new Date();
  t.setDate(t.getDate()+1);
  t.setHours(20,0,0,0);
  msgBox.innerHTML = `
    <b>✅ You have done today's voting</b><br>
    Next voting opens at <b>${t.toLocaleString()}</b>
  `;
  taskBox.innerHTML="";
}

// 🔎 Check already voted today
const vq = query(
  collection(db,"votes"),
  where("phone","==",phone),
  where("voteDate","==",todayKey)
);
const vsnap = await getDocs(vq);
if(!vsnap.empty){
  showDone();
  throw "done";
}

// 📥 Load active tasks
const tsnap = await getDocs(collection(db,"tasks"));
let html="";
tsnap.forEach(d=>{
  const t=d.data();
  const start=new Date(t.start);
  const end=new Date(t.end);

  if(now>=start && now<=end){
    html+=`
      <label class="task">
        <input type="radio" name="task" value="${d.id}">
        <b>${t.text}</b> (${t.points} pts)
      </label>
    `;
  }
});

if(!html){
  msgBox.innerHTML="❌ No active voting now";
}else{
  taskBox.innerHTML=html;
}

// 🗳 Submit vote
window.submitVote = async ()=>{
  const sel=document.querySelector("input[name=task]:checked");
  if(!sel){ alert("Select a task"); return; }

  const taskId=sel.value;
  const taskDoc=await getDocs(query(
    collection(db,"tasks"), where("__name__","==",taskId)
  ));

  let task;
  taskDoc.forEach(d=>task=d.data());

  await addDoc(collection(db,"votes"),{
    phone,name,
    task:task.text,
    points:task.points,
    voteDate: todayKey,
    created:new Date()
  });

  alert("Vote submitted ✅");
  showDone();
};
</script>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:20px;
  width:340px;
  border-radius:10px;
}
.task{
  display:block;
  padding:6px;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#16a34a;
  color:white;
  border:none;
}
</style>
</head>

<body>
<div class="box">
<h3>WELCOME</h3>
<b>FAITH & FITNESS</b><br>
Hello, <b id="nm"></b><br><br>

<div id="msg"></div>
<div id="tasks"></div>

<button onclick="submitVote()">Submit Vote</button>
</div>

<script>
document.getElementById("nm").innerText =
JSON.parse(localStorage.getItem("user")).name;
</script>
</body>
</html>
