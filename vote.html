<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faith & Fitness – Voting</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#fff;
  padding:28px;
  width:380px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{margin:0}
h3{margin:6px 0;color:#16a34a}
.task{
  margin:15px 0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:left;
}
.info{
  font-size:14px;
  color:#374151;
  margin-top:6px;
}
#infoMsg{
  margin-top:10px;
  font-size:14px;
  color:#16a34a;
  font-weight:bold;
}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.submit{background:#16a34a;color:#fff}
.logout{background:#dc2626;color:#fff}
.disabled{
  background:#9ca3af !important;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="box">
  <h2>WELCOME</h2>
  <h3>FAITH & FITNESS</h3>

  <div class="info" id="userName">Loading...</div>
  <div class="info" id="userPoints">Total Points: 0</div>

  <div id="taskBox" class="task">Loading task...</div>
  <div id="infoMsg"></div>

  <button id="submitBtn" class="submit" onclick="submitVote()">Submit Vote</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
/* 🔥 Firebase imports */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc
} from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyDzcAE2EoLEdhG1VrxGuC981RH-5TmWE",
  authDomain: "daily-voting-793ee.firebaseapp.com",
  projectId: "daily-voting-793ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 Login check */
const phone = localStorage.getItem("userPhone");
if(!phone){
  alert("Please login again");
  location.href = "index.html";
}

/* 👤 Load user name */
async function loadUser(){
  const snap = await getDocs(
    query(collection(db,"users"), where("phone","==",phone))
  );
  if(!snap.empty){
    snap.forEach(d=>{
      document.getElementById("userName").innerText =
        "Hello, " + d.data().name;
    });
  }
}

/* ⭐ Load total points (votes + admin adds) */
async function loadTotalPoints(){
  let total = 0;
  const snap = await getDocs(
    query(collection(db,"votes"), where("phone","==",phone))
  );
  snap.forEach(d=>{
    total += Number(d.data().points || 0);
  });
  document.getElementById("userPoints").innerText =
    "Total Points: " + total;
}

/* 🗓️ Load active task by DATE+TIME */
let activeTask = null;

async function loadTask(){
  const now = new Date().getTime();
  const snap = await getDocs(collection(db,"tasks"));
  let found = false;

  snap.forEach(d=>{
    if(found) return;
    const t = d.data();
    const start = new Date(t.start).getTime();
    const end   = new Date(t.end).getTime();

    if(now >= start && now <= end){
      found = true;
      activeTask = { ...t, id: d.id };

      document.getElementById("taskBox").innerHTML = `
        <label>
          <input type="checkbox" id="taskCheck">
          <strong>${t.text}</strong><br>
          <small>Points: ${t.points}</small>
        </label>
      `;
    }
  });

  if(!found){
    document.getElementById("taskBox").innerHTML =
      "No active task right now ❌";
    disableVote();
  }else{
    checkAlreadyVoted();
  }
}

/* 🗳️ Check already voted for this task day */
async function checkAlreadyVoted(){
  const voteDate = activeTask.start.split("T")[0];

  const snap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",voteDate)
    )
  );

  if(!snap.empty){
    showDoneMessage();
    disableVote();
  }
}

/* 🗳️ Submit vote */
window.submitVote = async ()=>{
  if(!activeTask) return;

  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("Task complete cheyth checkbox tick cheyyu ✅");
    return;
  }

  const voteDate = activeTask.start.split("T")[0];

  const snap = await getDocs(
    query(
      collection(db,"votes"),
      where("phone","==",phone),
      where("date","==",voteDate)
    )
  );

  if(!snap.empty){
    showDoneMessage();
    disableVote();
    return;
  }

  await addDoc(collection(db,"votes"),{
    phone,
    points: activeTask.points,
    date: voteDate,
    createdAt: new Date().toISOString()
  });

  showDoneMessage();
  disableVote();
  loadTotalPoints();
};

/* ✅ Show done message with next time */
function showDoneMessage(){
  const start = new Date(activeTask.start);
  start.setDate(start.getDate() + 1);

  const time = start.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  document.getElementById("taskBox").innerHTML =
    "You have done today’s voting ✅";

  document.getElementById("infoMsg").innerText =
    "Now the voting is tomorrow at " + time;
}

/* 🔒 Disable vote button */
function disableVote(){
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.classList.add("disabled");
}

/* 🚪 Logout */
window.logout = ()=>{
  localStorage.clear();
  location.reload();
};

/* 🚀 Init */
loadUser();
loadTotalPoints();
loadTask();
</script>

</body>
</html>
